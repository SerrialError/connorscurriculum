<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6460"/></marker></defs><rect x="90" y="306" width="210" height="40" fill="#eef4f6" stroke="#5b6460" stroke-width="1.5"/><rect x="120" y="30" width="150" height="296" fill="#fbfaf6" stroke="#1d2321" stroke-width="1.5"/><line x1="120" y1="300" x2="270" y2="300" stroke="#5b6460" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="120" y1="60" x2="270" y2="60" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="84" y="330" text-anchor="end" font-size="13" fill="#5b6460">solvent</text><circle cx="195" cy="300" r="6" fill="#fff" stroke="#5b6460" stroke-width="1.2"/><ellipse cx="195" cy="108" rx="10" ry="8" fill="#f0c9bd" stroke="#b5452f" stroke-width="1.5"/><ellipse cx="195" cy="228" rx="10" ry="8" fill="#b9dcc3" stroke="#3f8f5a" stroke-width="1.5"/><line x1="296" y1="300" x2="296" y2="60" stroke="#1f6f8b" stroke-width="1.5" marker-end="url(#m)" marker-start="url(#m)"/><text x="304" y="184" font-size="13" fill="#1f6f8b">10.0 cm</text><line x1="102" y1="300" x2="102" y2="108" stroke="#b5452f" stroke-width="1.5" marker-end="url(#m)" marker-start="url(#m)"/><text x="96" y="160" text-anchor="end" font-size="13" fill="#b5452f">8.0 cm</text><line x1="146" y1="300" x2="146" y2="228" stroke="#3f8f5a" stroke-width="1.5" marker-end="url(#m)" marker-start="url(#m)"/><text x="152" y="268" font-size="13" fill="#3f8f5a">3.0 cm</text><text x="266" y="52" font-size="13" fill="#1f6f8b">solvent front</text><text x="304" y="304" font-size="13" fill="#5b6460">starting line</text><text x="400" y="70" font-size="15" font-weight="bold" fill="#1d2321">Paper (polar stationary phase)</text><text x="400" y="92" font-size="15" font-weight="bold" fill="#1d2321">Solvent (less polar mobile phase)</text><text x="400" y="140" font-size="14" fill="#b5452f">Red component: moved 8.0 cm</text><text x="400" y="160" font-size="13" fill="