<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="250" fill="#fff"/>
<defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/></marker></defs><text x="20" y="104" font-size="14" font-weight="bold" fill="#1d2321">O₂ in</text><line x1="64" y1="100" x2="110" y2="100" stroke="#1d2321" stroke-width="2" marker-end="url(#c)"/><rect x="112" y="80" width="200" height="40" rx="18" fill="#fff" stroke="#1d2321" stroke-width="1.5"/><path d="M150,126 q10,14 20,0 q10,14 20,0 q10,14 20,0 q10,14 20,0 q10,14 20,0" fill="none" stroke="#b5452f" stroke-width="2"/><rect x="185" y="96" width="40" height="14" rx="3" fill="#f7e1d9" stroke="#5b6460" stroke-width="1.5"/><text x="205" y="72" text-anchor="middle" font-size="13" fill="#1d2321">sample burns</text><text x="212" y="158" text-anchor="middle" font-size="13" fill="#b5452f">furnace</text><line x1="314" y1="100" x2="360" y2="100" stroke="#1d2321" stroke-width="2" marker-end="url(#c)"/><rect x="362" y="70" width="110" height="60" rx="6" fill="#eef4f6" stroke="#1f6f8b" stroke-width="1.8"/><text x="417" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6f8b">H₂O absorber</text><text x="417" y="114" text-anchor="middle" font-size="12" fill="#5b6460">traps water</text><line x1="474" y1="100" x2="520" y2="100" stroke="#1d2321" stroke-width="2" marker-end="url(#c)"/><rect x="522" y="70" width="110" height="60" rx="6" fill="#eef6f0" stroke="#3f8f5a" stroke-width="1.8"/><text x="577" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f8f5a">CO₂ absorber</text><text x="577" y="114" text-anchor="middle" font-size="12" fill="#5b6460">traps CO₂</text><line x1="634" y1="100" x2="690" y2="100" stroke="#1d2321" stroke-width="2" marker-end="url(#c)"/><text x="662" y="88" text-anchor="middle" font-size="13" fill="#5b6460">out</text><text x="417" y="156" text-anchor="middle" font-size="13" fill="#1f6f8b">gain in mass = g H₂O</text><text x="577" y="156" text-anchor="middle" font-size="13" fill="#3f8f5a">gain in mass = g CO₂</text><text x="360" y="200" text-anchor="middle" font-size="13" fill="#1d2321">All the C in the sample ends up in CO₂, and all the H ends up in H₂O.</text><text x="360" y="222" text-anchor="middle" font-size="13" fill="#5b6460">Any O in the sample can’t be measured this way (O₂ is added), so it’s found by subtraction.</text>
</svg>
