<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="200" fill="#fff"/>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/></marker></defs><rect x="20" y="70" width="140" height="60" rx="6" fill="#f6f7f6" stroke="#1d2321" stroke-width="1.8"/><text x="90" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Grams of A</text><text x="90" y="118" text-anchor="middle" font-size="12" fill="#5b6460">given</text><rect x="200" y="70" width="140" height="60" rx="6" fill="#eef4f6" stroke="#1d2321" stroke-width="1.8"/><text x="270" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Moles of A</text><rect x="380" y="70" width="140" height="60" rx="6" fill="#eef4f6" stroke="#1d2321" stroke-width="1.8"/><text x="450" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Moles of B</text><rect x="560" y="70" width="140" height="60" rx="6" fill="#f6f7f6" stroke="#1d2321" stroke-width="1.8"/><text x="630" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Grams of B</text><text x="630" y="118" text-anchor="middle" font-size="12" fill="#5b6460">asked for</text><line x1="162" y1="100" x2="196" y2="100" stroke="#1d2321" stroke-width="2" marker-end="url(#s)"/><text x="180" y="56" text-anchor="middle" font-size="13" fill="#1f6f8b">÷ molar mass of A</text><line x1="342" y1="100" x2="376" y2="100" stroke="#1d2321" stroke-width="2" marker-end="url(#s)"/><text x="360" y="56" text-anchor="middle" font-size="13" fill="#b5452f">× mole ratio B/A</text><line x1="522" y1="100" x2="556" y2="100" stroke="#1d2321" stroke-width="2" marker-end="url(#s)"/><text x="540" y="56" text-anchor="middle" font-size="13" fill="#1f6f8b">× molar mass of B</text><text x="450" y="160" text-anchor="middle" font-size="13" fill="#b5452f">The mole ratio comes from the coefficients of the balanced equation.</text><text x="360" y="186" text-anchor="middle" font-size="13" fill="#5b6460">Only moles can be compared across the equation, never grams.</text>
</svg>
