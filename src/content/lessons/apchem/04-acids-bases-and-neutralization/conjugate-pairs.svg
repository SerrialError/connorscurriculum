<svg xmlns="http://www.w3.org/2000/svg" width="700" height="266" viewBox="0 0 700 266" font-family="Helvetica, Arial, sans-serif">
<rect width="700" height="266" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5452f"/></marker></defs><text x="160" y="110" text-anchor="middle" font-size="24" font-weight="bold" fill="#1d2321">+</text><text x="520" y="110" text-anchor="middle" font-size="24" font-weight="bold" fill="#1d2321">+</text><text x="335" y="110" text-anchor="middle" font-size="26" fill="#1d2321">⇌</text><text x="90" y="112" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d2321">NH₃</text><text x="90" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6f8b">base</text><text x="90" y="164" text-anchor="middle" font-size="12" fill="#5b6460">(takes H⁺)</text><text x="230" y="112" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d2321">H₂O</text><text x="230" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5452f">acid</text><text x="230" y="164" text-anchor="middle" font-size="12" fill="#5b6460">(gives H⁺)</text><text x="440" y="112" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d2321">NH₄⁺</text><text x="440" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5452f">conjugate acid</text><text x="440" y="164" text-anchor="middle" font-size="12" fill="#5b6460">(gives H⁺)</text><text x="600" y="112" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d2321">OH⁻</text><text x="600" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6f8b">conjugate base</text><text x="600" y="164" text-anchor="middle" font-size="12" fill="#5b6460">(takes H⁺)</text><path d="M220,84 C200,62 120,62 104,80" fill="none" stroke="#9a6a12" stroke-width="2.2" marker-end="url(#a)"/><text x="162" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12">H⁺</text><path d="M90,52 L90,40 L440,40 L440,84" fill="none" stroke="#1f6f8b" stroke-width="1.8"/><path d="M90,52 L90,80" fill="none" stroke="#1f6f8b" stroke-width="1.8" stroke-dasharray="3 3"/><text x="265" y="30" text-anchor="middle" font-size="13" fill="#1f6f8b">conjugate pair: NH₃ / NH₄⁺ (differ by one H⁺)</text><path d="M230,176 L230,196 L600,196 L600,176" fill="none" stroke="#b5452f" stroke-width="1.8"/><text x="415" y="216" text-anchor="middle" font-size="13" fill="#b5452f">conjugate pair: H₂O / OH⁻ (differ by one H⁺)</text><text x="350" y="250" text-anchor="middle" font-size="13" fill="#5b6460">H₂O gives an H⁺ to NH₃, so here water acts as the acid.</text>
</svg>
