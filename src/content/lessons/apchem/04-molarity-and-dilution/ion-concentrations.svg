ill="#6b4c9a">Cl⁻</text><circle cx="220" cy="175" r="13" fill="#e3d6ef" stroke="#6b4c9a" stroke-width="1.5"/><text x="220" y="179" text-anchor="middle" font-size="9" font-weight="bold" fill="#6b4c9a">Cl⁻</text><text x="170" y="234" text-anchor="middle" font-size="13" fill="#5b6460">[Na⁺] = 0.10 M,  [Cl⁻] = 0.10 M</text><text x="530" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">0.10 M CaCl₂</text><rect x="380" y="40" width="300" height="170" rx="2" fill="#ffffff" stroke="#c9cfcc" stroke-width="1.5"/><circle cx="440" cy="85" r="14" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.5"/><text x="440" y="89" text-anchor="middle" font-size="9" font-weight="bold" fill="#1f6f8b">Ca²⁺</text><circle cx="550" cy="80" r="14" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.5"/><text x="550" y="84" text-anchor="middle" font-size="9" font-weight="bold" fill="#1f6f8b">Ca²⁺</text><circle cx="630" cy="150" r="14" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.5"/><text x="630" y="154" text-anchor="middle" font-size="9" font-weight="bold" fill="#1f6f8b">Ca²⁺</text><circle cx="490" cy="175" r="14" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.5"/><text x="490" y="179" text-anchor="middle" font-size="9" font-weight="bold" fill="#1f6f8b">Ca²⁺</text><circle cx="490" cy="70" r="13" fill="#e3d6ef" stroke="#6b4c9a" stroke-width="1.5"/><text x="490" y="74" text-anchor="middle" font-size="9" font-weight="bold" fill="#6b4c9a">Cl⁻</text><circle cx="595" cy="75" r="13" fill="#e3d6ef" stroke="#6b4c9a" stroke-width="1.5"/><text x="595" y="79" text-anchor="middle" font-size="9" font-weight="bold" fill="#6b4c9a">Cl⁻</text><circle cx="420" cy="130" r="13" fill="#e3d6ef" stroke="#6b4c9a" stroke-width="1.5"/><text x="420" y="134" text-anchor="middle" font-size="9" font-weight="bold" fill="#6b4c9a">Cl⁻</text><circle cx="520" cy="125" r="13" fill="#e3d6ef" stroke="#6b4c9a" stroke-width="1.5"/><text x="520" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill=