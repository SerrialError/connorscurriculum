<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="284" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5452f"/></marker></defs><rect x="40" y="58" width="260" height="182" rx="0" fill="#eef4f6" stroke="#eef4f6" stroke-width="0"/><path d="M40,40 L40,240 L300,240 L300,40" fill="none" stroke="#5b6460" stroke-width="2.2"/><rect x="150" y="20" width="40" height="190" rx="2" fill="#d9dcdb" stroke="#5b6460" stroke-width="1.8"/><text x="170" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b6460">Zn</text><circle cx="147" cy="120" r="5" fill="#c97b4a" stroke="#8a4b25" stroke-width="1.2"/><circle cx="193" cy="133" r="5" fill="#c97b4a" stroke="#8a4b25" stroke-width="1.2"/><circle cx="147" cy="146" r="5" fill="#c97b4a" stroke="#8a4b25" stroke-width="1.2"/><circle cx="193" cy="159" r="5" fill="#c97b4a" stroke="#8a4b25" stroke-width="1.2"/><circle cx="147" cy="172" r="5" fill="#c97b4a" stroke="#8a4b25" stroke-width="1.2"/><circle cx="193" cy="185" r="5" fill="#c97b4a" stroke="#8a4b25" stroke-width="1.2"/><circle cx="147" cy="198" r="5" fill="#c97b4a" stroke="#8a4b25" stroke-width="1.2"/><circle cx="80" cy="90" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.5"/><text x="80" y="94" text-anchor="middle" font-size="9" font-weight="bold" fill="#1f6f8b">Cu²⁺</text><circle cx="250" cy="100" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.5"/><text x="250" y="104" text-anchor="middle" font-size="9" font-weight="bold" fill="#1f6f8b">Cu²⁺</text><circle cx="90" cy="190" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.5"/><text x="90" y="194" text-anchor="middle" font-size="9" font-weight="bold" fill="#1f6f8b">Cu²⁺</text><circle cx="255" cy="200" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.5"/><text x="255" y="204" text-anchor="middle" font-size="9" font-weight="bold" fill="#1f6f8b">Cu²⁺</text><circle cx="100" cy="140" r="15" fill="#e4e6e5" stroke="#5b6460" stroke-width="1.5"/><text x="100" y="144" text-anchor="middle" font-size="9" font-weight="bold" fill="#5b6460">Zn²⁺</text><circle cx="240" cy="150" r="15" fill="#e4e6e5" stroke="#5b6460" stroke-width="1.5"/><text x="240" y="154" text-anchor="middle" font-size="9" font-weight="bold" fill="#5b6460">Zn²⁺</text><text x="170" y="268" text-anchor="middle" font-size="13" fill="#5b6460">Blue Cu²⁺ fades; copper metal coats the zinc</text><rect x="340" y="40" width="360" height="64" rx="6" fill="#f6f7f6" stroke="#1d2321" stroke-width="1.8"/><text x="520" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="#b5452f">Oxidation (loses e⁻): Zn → Zn²⁺ + 2e⁻</text><text x="520" y="88" text-anchor="middle" font-size="13" fill="#5b6460">oxidation number 0 → +2</text><rect x="340" y="120" width="360" height="64" rx="6" fill="#eef4f6" stroke="#1d2321" stroke-width="1.8"/><text x="520" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">Reduction (gains e⁻): Cu²⁺ + 2e⁻ → Cu</text><text x="520" y="168" text-anchor="middle" font-size="13" fill="#5b6460">oxidation number +2 → 0</text><text x="520" y="214" text-anchor="middle" font-size="13" fill="#5b6460">Add them: the electrons cancel</text><text x="520" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2321">Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s)</text>
</svg>
