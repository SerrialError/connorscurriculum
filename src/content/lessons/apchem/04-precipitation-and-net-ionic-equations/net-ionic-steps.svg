<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="316" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5452f"/></marker></defs><rect x="20" y="20" width="150" height="62" rx="6" fill="#f6f7f6" stroke="#1d2321" stroke-width="1.8"/><text x="95" y="57" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Molecular</text><text x="190" y="48" text-anchor="start" font-size="16" fill="#1d2321">Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq)</text><text x="190" y="70" text-anchor="start" font-size="13" fill="#5b6460">Whole formulas, as you would weigh them out</text><line x1="95" y1="84" x2="95" y2="110" stroke="#1d2321" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="112" width="150" height="62" rx="6" fill="#f6f7f6" stroke="#1d2321" stroke-width="1.8"/><text x="95" y="149" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Complete ionic</text><text x="190" y="140" font-size="16" fill="#1d2321">Pb²⁺ + <tspan fill="#b5452f" text-decoration="line-through">2NO₃⁻</tspan> + <tspan fill="#b5452f" text-decoration="line-through">2K⁺</tspan> + 2I⁻ → PbI₂(s) + <tspan fill="#b5452f" text-decoration="line-through">2K⁺</tspan> + <tspan fill="#b5452f" text-decoration="line-through">2NO₃⁻</tspan></text><text x="190" y="162" text-anchor="start" font-size="13" fill="#5b6460">Split every strong electrolyte (aq) into its ions</text><line x1="95" y1="176" x2="95" y2="202" stroke="#1d2321" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="204" width="150" height="62" rx="6" fill="#eef4f6" stroke="#1d2321" stroke-width="1.8"/><text x="95" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Net ionic</text><text x="190" y="232" text-anchor="start" font-size="16" font-weight="bold" fill="#1d2321">Pb²⁺(aq) + 2I⁻(aq) → PbI₂(s)</text><text x="190" y="254" text-anchor="start" font-size="13" fill="#5b6460">Cross out ions that appear unchanged on both sides</text><text x="360" y="300" text-anchor="middle" font-size="13" fill="#b5452f">K⁺ and NO₃⁻ are spectator ions. Solids, liquids, gases, and weak electrolytes are never split.</text>
</svg>
