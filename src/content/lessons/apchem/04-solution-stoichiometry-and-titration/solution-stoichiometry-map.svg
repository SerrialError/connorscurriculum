<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5452f"/></marker></defs><rect x="10" y="20" width="130" height="58" rx="6" fill="#f6f7f6" stroke="#1d2321" stroke-width="1.8"/><text x="75" y="47" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">M × L</text><text x="75" y="65" text-anchor="middle" font-size="12" fill="#5b6460">solution of A</text><rect x="10" y="150" width="130" height="58" rx="6" fill="#f6f7f6" stroke="#1d2321" stroke-width="1.8"/><text x="75" y="177" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">Grams of A</text><text x="75" y="195" text-anchor="middle" font-size="12" fill="#5b6460">solid A</text><rect x="215" y="85" width="130" height="58" rx="6" fill="#eef4f6" stroke="#1d2321" stroke-width="1.8"/><text x="280" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">Moles of A</text><rect x="375" y="85" width="130" height="58" rx="6" fill="#eef4f6" stroke="#1d2321" stroke-width="1.8"/><text x="440" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">Moles of B</text><rect x="580" y="20" width="130" height="58" rx="6" fill="#f6f7f6" stroke="#1d2321" stroke-width="1.8"/><text x="645" y="47" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">M or L of B</text><text x="645" y="65" text-anchor="middle" font-size="12" fill="#5b6460">solution of B</text><rect x="580" y="150" width="130" height="58" rx="6" fill="#f6f7f6" stroke="#1d2321" stroke-width="1.8"/><text x="645" y="177" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">Grams of B</text><text x="645" y="195" text-anchor="middle" font-size="12" fill="#5b6460">solid B</text><line x1="142" y1="60" x2="212" y2="100" stroke="#1d2321" stroke-width="2" marker-end="url(#a)"/><line x1="142" y1="170" x2="212" y2="130" stroke="#1d2321" stroke-width="2" marker-end="url(#a)"/><text x="160" y="46" text-anchor="start" font-size="12" fill="#1f6f8b">multiply</text><text x="160" y="196" text-anchor="start" font-size="12" fill="#1f6f8b">÷ molar mass</text><line x1="347" y1="114" x2="372" y2="114" stroke="#1d2321" stroke-width="2" marker-end="url(#a)"/><text x="360" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5452f">× mole ratio B/A</text><line x1="360" y1="146" x2="360" y2="120" stroke="#b5452f" stroke-width="1" stroke-dasharray="3 3"/><line x1="507" y1="100" x2="577" y2="60" stroke="#1d2321" stroke-width="2" marker-end="url(#a)"/><line x1="507" y1="130" x2="577" y2="170" stroke="#1d2321" stroke-width="2" marker-end="url(#a)"/><text x="560" y="46" text-anchor="end" font-size="12" fill="#1f6f8b">L = mol ÷ M</text><text x="560" y="196" text-anchor="end" font-size="12" fill="#1f6f8b">× molar mass</text><text x="360" y="240" text-anchor="middle" font-size="13" fill="#5b6460">Molarity is one more way into and out of moles. The mole ratio still comes from the balanced equation.</text>
</svg>
