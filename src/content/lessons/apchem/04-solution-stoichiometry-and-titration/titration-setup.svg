<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="384" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5452f"/></marker></defs><rect x="40" y="360" width="200" height="14" rx="2" fill="#f6f7f6" stroke="#5b6460" stroke-width="1.4"/><line x1="70" y1="360" x2="70" y2="20" stroke="#5b6460" stroke-width="5"/><line x1="70" y1="80" x2="132" y2="80" stroke="#5b6460" stroke-width="3"/><rect x="132" y="30" width="26" height="220" rx="2" fill="#ffffff" stroke="#1d2321" stroke-width="1.6"/><rect x="134" y="70" width="22" height="178" rx="0" fill="#cfe3ea" stroke="#cfe3ea" stroke-width="0"/><line x1="132" y1="50" x2="142" y2="50" stroke="#1d2321" stroke-width="1"/><line x1="132" y1="72" x2="142" y2="72" stroke="#1d2321" stroke-width="1"/><line x1="132" y1="94" x2="142" y2="94" stroke="#1d2321" stroke-width="1"/><line x1="132" y1="116" x2="142" y2="116" stroke="#1d2321" stroke-width="1"/><line x1="132" y1="138" x2="142" y2="138" stroke="#1d2321" stroke-width="1"/><line x1="132" y1="160" x2="142" y2="160" stroke="#1d2321" stroke-width="1"/><line x1="132" y1="182" x2="142" y2="182" stroke="#1d2321" stroke-width="1"/><line x1="132" y1="204" x2="142" y2="204" stroke="#1d2321" stroke-width="1"/><line x1="132" y1="226" x2="142" y2="226" stroke="#1d2321" stroke-width="1"/><path d="M132,250 L140,272 L150,272 L158,250" fill="#ffffff" stroke="#1d2321" stroke-width="1.6"/><rect x="128" y="258" width="34" height="7" rx="2" fill="#5b6460" stroke="#5b6460" stroke-width="0"/><line x1="145" y1="272" x2="145" y2="288" stroke="#1d2321" stroke-width="1.6"/><circle cx="145" cy="296" r="3.5" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.2"/><path d="M135,300 L135,318 L95,356 L195,356 L155,318 L155,300" fill="#ffffff" stroke="#1d2321" stroke-width="1.8"/><path d="M108,344 L182,344 L195,356 L95,356 Z" fill="#f6c9dc" stroke="none" stroke-width="0"/><line x1="165" y1="110" x2="250" y2="110" stroke="#5b6460" stroke-width="1.2"/><text x="256" y="106" text-anchor="start" font-size="14" font-weight="bold" fill="#1d2321">Buret: titrant</text><text x="256" y="124" text-anchor="start" font-size="13" fill="#5b6460">known concentration, e.g. 0.100 M NaOH</text><text x="256" y="142" text-anchor="start" font-size="13" fill="#5b6460">read the volume before and after</text><line x1="195" y1="335" x2="250" y2="300" stroke="#5b6460" stroke-width="1.2"/><text x="256" y="290" text-anchor="start" font-size="14" font-weight="bold" fill="#1d2321">Flask: analyte</text><text x="256" y="308" text-anchor="start" font-size="13" fill="#5b6460">measured volume, unknown concentration,</text><text x="256" y="326" text-anchor="start" font-size="13" fill="#5b6460">plus a few drops of indicator</text><rect x="256" y="186" width="440" height="66" rx="6" fill="#eef4f6" stroke="#1d2321" stroke-width="1.8"/><text x="476" y="212" text-anchor="middle" font-size="13" fill="#1d2321">Equivalence point: moles of titrant added are exactly</text><text x="476" y="232" text-anchor="middle" font-size="13" fill="#1d2321">what the balanced equation needs for the analyte.</text><text x="256" y="368" text-anchor="start" font-size="13" fill="#5b6460">End point: the indicator changes color (pink for phenolphthalein in base).</text>
</svg>
