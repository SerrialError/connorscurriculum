<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="280" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5452f"/></marker></defs><text x="180" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#b5452f">Exothermic</text><rect x="20" y="40" width="320" height="180" rx="4" fill="#f6f7f6" stroke="#c9cfcc" stroke-width="1.5"/><text x="320" y="60" text-anchor="end" font-size="12" font-style="italic" fill="#5b6460">surroundings</text><circle cx="180" cy="130" r="48" fill="#ffffff" stroke="#1d2321" stroke-width="1.8"/><text x="180" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">system</text><text x="180" y="144" text-anchor="middle" font-size="12" fill="#5b6460">the reaction</text><line x1="122" y1="130" x2="70" y2="130" stroke="#b5452f" stroke-width="3" marker-end="url(#ar)"/><line x1="238" y1="130" x2="290" y2="130" stroke="#b5452f" stroke-width="3" marker-end="url(#ar)"/><text x="180" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#b5452f">heat flows out</text><text x="180" y="244" text-anchor="middle" font-size="13" fill="#1d2321">ΔH &lt; 0,  q of system &lt; 0</text><text x="180" y="262" text-anchor="middle" font-size="13" fill="#5b6460">surroundings warm up (beaker feels hot)</text><text x="540" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f6f8b">Endothermic</text><rect x="380" y="40" width="320" height="180" rx="4" fill="#f6f7f6" stroke="#c9cfcc" stroke-width="1.5"/><text x="680" y="60" text-anchor="end" font-size="12" font-style="italic" fill="#5b6460">surroundings</text><circle cx="540" cy="130" r="48" fill="#ffffff" stroke="#1d2321" stroke-width="1.8"/><text x="540" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">system</text><text x="540" y="144" text-anchor="middle" font-size="12" fill="#5b6460">the reaction</text><line x1="430" y1="130" x2="482" y2="130" stroke="#1f6f8b" stroke-width="3" marker-end="url(#ab)"/><line x1="650" y1="130" x2="598" y2="130" stroke="#1f6f8b" stroke-width="3" marker-end="url(#ab)"/><text x="540" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6f8b">heat flows in</text><text x="540" y="244" text-anchor="middle" font-size="13" fill="#1d2321">ΔH &gt; 0,  q of system &gt; 0</text><text x="540" y="262" text-anchor="middle" font-size="13" fill="#5b6460">surroundings cool down (beaker feels cold)</text>
</svg>
