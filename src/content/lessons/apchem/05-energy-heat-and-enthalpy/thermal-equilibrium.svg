quilibrium</text><rect x="410" y="60" width="130" height="110" rx="4" fill="#f6f7f6" stroke="#5b6460" stroke-width="1.8"/><text x="475" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b6460">metal, 26 °C</text><circle cx="435" cy="85" r="6" fill="#ffffff" stroke="#5b6460" stroke-width="1.4"/><line x1="432.4914243531829" y1="91.53506298548041" x2="428.54937690818457" y2="101.80444767694964" stroke="#5b6460" stroke-width="1.5"/><circle cx="490" cy="82" r="6" fill="#ffffff" stroke="#5b6460" stroke-width="1.4"/><line x1="483.0042642108663" y1="81.75570352308249" x2="472.01096511365625" y2="81.37180905935499" stroke="#5b6460" stroke-width="1.5"/><circle cx="455" cy="120" r="6" fill="#ffffff" stroke="#5b6460" stroke-width="1.4"/><line x1="452.95339806694085" y1="113.30586670825875" x2="449.73730931499074" y2="102.78651439266537" stroke="#5b6460" stroke-width="1.5"/><circle cx="510" cy="125" r="6" fill="#ffffff" stroke="#5b6460" stroke-width="1.4"/><line x1="515.6631189606246" y1="120.88550323395269" x2="524.5623058987491" y2="114.41986545873547" stroke="#5b6460" stroke-width="1.5"/><circle cx="435" cy="150" r="6" fill="#ffffff" stroke="#5b6460" stroke-width="1.4"/><line x1="440.7340643100229" y1="154.01503505445731" x2="449.7447367972019" y2="160.32437585431882" stroke="#5b6460" stroke-width="1.5"/><circle cx="485" cy="152" r="6" fill="#ffffff" stroke="#5b6460" stroke-width="1.4"/><line x1="483.070538509281" y1="158.72883187156822" x2="480.038527595294" y2="169.30271052688974" stroke="#5b6460" stroke-width="1.5"/><rect x="550" y="60" width="130" height="110" rx="4" fill="#f6f7f6" stroke="#5b6460" stroke-width="1.8"/><text x="615" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b6460">water, 26 °C</text><circle cx="575" cy="85" r="6" fill="#ffffff" stroke="#5b6460" stroke-width="1.4"/><line x1="569.063663326905" y1="88.70943484963243" x2="559.7351342691843" y2="94.53854675619769" stroke="#5b6460" stroke-width="1.5"/><circle cx="630" cy="82" r="6" fill="#ffffff" stroke="#5b6460" stroke-width="1.4"/><line x1="624.5599782698011" y1="77.59475726265114" x2="616.0113726937745" y2="70.67223296110292" stroke="#5b6460" stroke-width="1.5"/><circle cx="595" cy="120" r="6" fill="#ffffff" stroke="#5b6460" stroke-width="1.4"/><line x1="597.3941410032796" y1="113.42215165449863" x2="601.156362579862" y2="103.08553282585365" stroke="#5b6460" stroke-width="1.5"/><circle cx="650" cy="125" r="6" fill="#ffffff" stroke="#5b6460" stroke-width="1.4"/><line x1="656.9989338660947" y1="125.12216684506099" x2="667.997258512815" y2="125.3141433158711" stroke="#5b6460" stroke-width="1.5"/><circle cx="575" cy="150" r="6" fill="#ffffff" stroke="#5b6460" stroke-width="1.4"/><line x1="577.1631189606246" y1="156.65739561406608" x2="580.5623058987491" y2="167.11901729331277" stroke="#5b6460" stroke-width="1.5"/><circle cx="625" cy="152" r="6" fill="#ffffff" stroke="#5b6460" stroke-width="1.4"/><line x1="619.4095514296689" y1="156.21270516206434" x2="610.6245608191488" y2="162.83267041673687" stroke="#5b6460" stroke-width="1.5"/><text x="360" y="204" text-anchor="middle" font-size="13" fill="#1d2321">Faster particles in the hot object collide with slower ones and transfer kinetic energy,</text><text x="360" y="224" text-anchor="middle" font-size="13" fill="#1d2321">until both have the same average kinetic energy, which means the same temperature.</text><text x="360" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">Heat lost by the metal = heat gained by the water:  q(metal) = −q(water)</text>
