<svg xmlns="http://www.w3.org/2000/svg" width="720" height="282" viewBox="0 0 720 282" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="282" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5452f"/></marker></defs><text x="170" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#b5452f">Exothermic: CH₄ burns</text><line x1="40" y1="240" x2="40" y2="44" stroke="#5b6460" stroke-width="2" marker-end="url(#a)"/><text x="24" y="140" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic" fill="#5b6460">H</text><line x1="70" y1="80" x2="180" y2="80" stroke="#1d2321" stroke-width="3"/><text x="125" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">CH₄ + 2O₂</text><line x1="210" y1="200" x2="320" y2="200" stroke="#1d2321" stroke-width="3"/><text x="265" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">CO₂ + 2H₂O(l)</text><line x1="195" y1="80" x2="195" y2="198" stroke="#b5452f" stroke-width="2.5" marker-end="url(#ar)"/><line x1="180" y1="80" x2="195" y2="80" stroke="#b5452f" stroke-width="1" stroke-dasharray="3 3"/><line x1="195" y1="200" x2="210" y2="200" stroke="#b5452f" stroke-width="1" stroke-dasharray="3 3"/><text x="202" y="145" text-anchor="start" font-size="14" font-weight="bold" fill="#b5452f">ΔH = −890 kJ</text><text x="530" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f6f8b">Endothermic: CaCO₃ decomposes</text><line x1="400" y1="240" x2="400" y2="44" stroke="#5b6460" stroke-width="2" marker-end="url(#a)"/><text x="384" y="140" text-anchor="middle" font-size="15" font-weight="bold" font-style="italic" fill="#5b6460">H</text><line x1="430" y1="200" x2="540" y2="200" stroke="#1d2321" stroke-width="3"/><text x="485" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">CaCO₃(s)</text><line x1="570" y1="90" x2="680" y2="90" stroke="#1d2321" stroke-width="3"/><text x="625" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2321">CaO(s) + CO₂(g)</text><line x1="555" y1="200" x2="555" y2="92" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#ab)"/><line x1="540" y1="200" x2="555" y2="200" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="3 3"/><line x1="555" y1="90" x2="570" y2="90" stroke="#1f6f8b" stroke-width="1" stroke-dasharray="3 3"/><text x="562" y="150" text-anchor="start" font-size="14" font-weight="bold" fill="#1f6f8b">ΔH = +178 kJ</text><text x="360" y="268" text-anchor="middle" font-size="13" fill="#5b6460">Products below reactants: energy released. Products above reactants: energy absorbed.</text>
</svg>
