<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e3eef3"/><stop offset="1" stop-color="#f3d9d2"/></linearGradient></defs><rect x="50" y="70" width="594" height="34" fill="url(#g)" stroke="#c9cfcc"/><line x1="50" y1="104" x2="50" y2="112" stroke="#5b6460"/><text x="50" y="128" text-anchor="middle" font-size="13" fill="#5b6460">0</text><line x1="140" y1="104" x2="140" y2="112" stroke="#5b6460"/><text x="140" y="128" text-anchor="middle" font-size="13" fill="#5b6460">0.5</text><line x1="230" y1="104" x2="230" y2="112" stroke="#5b6460"/><text x="230" y="128" text-anchor="middle" font-size="13" fill="#5b6460">1</text><line x1="320" y1="104" x2="320" y2="112" stroke="#5b6460"/><text x="320" y="128" text-anchor="middle" font-size="13" fill="#5b6460">1.5</text><line x1="410" y1="104" x2="410" y2="112" stroke="#5b6460"/><text x="410" y="128" text-anchor="middle" font-size="13" fill="#5b6460">2</text><line x1="500" y1="104" x2="500" y2="112" stroke="#5b6460"/><text x="500" y="128" text-anchor="middle" font-size="13" fill="#5b6460">2.5</text><line x1="590" y1="104" x2="590" y2="112" stroke="#5b6460"/><text x="590" y="128" text-anchor="middle" font-size="13" fill="#5b6460">3</text><text x="347" y="150" text-anchor="middle" font-size="14" fill="#1d2321">Electronegativity difference (ΔEN)</text><line x1="50" y1="60" x2="50" y2="70" stroke="#1d2321"/><text x="50" y="54" text-anchor="middle" font-size="14" fill="#1d2321">F–F</text><line x1="122" y1="50" x2="122" y2="70" stroke="#1d2321"/><text x="122" y="44" text-anchor="middle" font-size="14" fill="#1d2321">C–H</text><line x1="212" y1="60" x2="212" y2="70" stroke="#1d2321"/><text x="212" y="54" text-anchor="middle" font-size="14" fill="#1d2321">H–Cl</text><line x1="392" y1="50" x2="392" y2="70" stroke="#1d2321"/><text x="392" y="44" text-anchor="middle" font-size="14" fill="#1d2321">H–F</text><line x1="428" y1="60" x2="428" y2="70" stroke="#1d2321"/><text x="428" y="54" text-anchor="middle" font-size="14" fill="#1d2321">Na–Cl</text><line x1="590" y1="50" x2="590" y2="70" stroke="#1d2321"/><text x="590" y="44" text-anchor="middle" font-size="14" fill="#1d2321">Li–F</text><text x="77" y="92" font-size="13" fill="#1f6f8b">nonpolar</text><text x="239" y="92" text-anchor="middle" font-size="13" fill="#1d2321">polar covalent</text><text x="536" y="92" text-anchor="middle" font-size="13" fill="#b5452f">ionic</text><text x="360" y="185" text-anchor="middle" font-size="14" fill="#5b6460">No sharp cutoffs: sharing gets more unequal as ΔEN grows, until the electron is essentially transferred.</text>
