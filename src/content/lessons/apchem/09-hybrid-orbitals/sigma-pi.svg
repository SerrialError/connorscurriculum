<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" font-family="Helvetica, Arial, sans-serif">
<rect width="700" height="260" fill="#fff"/>
<ellipse cx="135" cy="105" rx="60" ry="38" fill="#9cc3d3" fill-opacity="0.7" stroke="#1f6f8b" stroke-width="1.5"/><ellipse cx="215" cy="105" rx="60" ry="38" fill="#9cc3d3" fill-opacity="0.7" stroke="#1f6f8b" stroke-width="1.5"/><ellipse cx="175" cy="105" rx="20" ry="30" fill="#1f6f8b" fill-opacity="0.45"/><line x1="60" y1="105" x2="290" y2="105" stroke="#5b6460" stroke-dasharray="4 3"/><circle cx="125" cy="105" r="4" fill="#1d2321"/><circle cx="225" cy="105" r="4" fill="#1d2321"/><text x="175" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2321">σ bond: head-on overlap</text><text x="175" y="200" text-anchor="middle" font-size="13" fill="#5b6460">electron density on the line between the nuclei</text><path transform="translate(480 105)" d="M0,0 C-22,-16 -22,-66 0,-70 C22,-66 22,-16 0,0 z M0,0 C-22,16 -22,66 0,70 C22,66 22,16 0,0 z" fill="#f0c9bd" fill-opacity="0.75" stroke="#b5452f" stroke-width="1.5"/><path transform="translate(540 105)" d="M0,0 C-22,-16 -22,-66 0,-70 C22,-66 22,-16 0,0 z M0,0 C-22,16 -22,66 0,70 C22,66 22,16 0,0 z" fill="#f0c9bd" fill-opacity="0.75" stroke="#b5452f" stroke-width="1.5"/><ellipse cx="510" cy="62" rx="14" ry="22" fill="#b5452f" fill-opacity="0.4"/><ellipse cx="510" cy="148" rx="14" ry="22" fill="#b5452f" fill-opacity="0.4"/><line x1="430" y1="105" x2="590" y2="105" stroke="#5b6460" stroke-dasharray="4 3"/><circle cx="480" cy="105" r="4" fill="#1d2321"/><circle cx="540" cy="105" r="4" fill="#1d2321"/><text x="510" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2321">π bond: side-by-side overlap</text><text x="510" y="220" text-anchor="middle" font-size="13" fill="#5b6460">density above and below the line, none on it</text><text x="350" y="250" text-anchor="middle" font-size="14" fill="#5b6460">A double bond is one σ + one π; a triple bond is one σ + two π.</text>
</svg>
