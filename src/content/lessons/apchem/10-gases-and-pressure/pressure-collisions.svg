cle cx="262.39" cy="111.47" r="8" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="291.75" cy="167.25" r="8" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="184.66" cy="152.39" r="8" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="180.4" cy="76.52" r="8" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="215.86" cy="190.48" r="8" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="309.02" cy="126.42" r="8" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="70.11" cy="162.92" r="8" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="70.22" cy="99.5" r="8" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="250.5" cy="229.92" r="8" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="231.85" cy="79.51" r="8" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><text x="372" y="60" text-anchor="start" font-size="14" font-weight="bold" fill="#1d2321">Each collision pushes on the wall.</text><text x="372" y="84" text-anchor="start" font-size="14" fill="#1d2321">Pressure is the total force of these</text><text x="372" y="104" text-anchor="start" font-size="14" fill="#1d2321">collisions divided by the wall’s area:</text><text x="372" y="140" text-anchor="start" font-size="18" font-weight="bold" fill="#1d2321">P = F / A</text><text x="372" y="176" text-anchor="start" font-size="14" fill="#1d2321">More collisions per second, or harder</text><text x="372" y="196" text-anchor="start" font-size="14" fill="#1d2321">collisions, means a higher pressure.</text><text x="372" y="232" text-anchor="start" font-size="14" fill="#1d2321">Units: 1 atm = 760 mm Hg = 760 torr</text><text x="372" y="252" text-anchor="start" font-size="14" fill="#1d2321">= 101.325 kPa</text>
