="13" font-weight="bold" fill="#b5452f">HCl</text><text x="657" y="80" text-anchor="middle" font-size="11" fill="#5b6460">36.5 g/mol</text><line x1="380" y1="130" x2="522.33" y2="130" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ab)"/><line x1="640" y1="130" x2="550.33" y2="130" stroke="#b5452f" stroke-width="2" marker-end="url(#ar)"/><text x="530" y="240" text-anchor="middle" font-size="13" fill="#1d2321">The lighter NH₃ travels farther before they meet,</text><text x="530" y="258" text-anchor="middle" font-size="13" fill="#1d2321">so the ring forms closer to the HCl end, 59% of the way from NH₃.</text>
