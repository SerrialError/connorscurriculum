<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="360" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5452f"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f8f5a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6460"/></marker></defs><text x="180" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Attractions (low T, moderate P)</text><path d="M320,44 L320,260" fill="none" stroke="#1d2321" stroke-width="4"/><text x="314" y="278" text-anchor="end" font-size="12" fill="#5b6460">wall</text><line x1="280" y1="150" x2="210" y2="110" stroke="#b5452f" stroke-width="1.4" stroke-dasharray="3 3"/><line x1="280" y1="150" x2="200" y2="190" stroke="#b5452f" stroke-width="1.4" stroke-dasharray="3 3"/><line x1="280" y1="150" x2="150" y2="150" stroke="#b5452f" stroke-width="1.4" stroke-dasharray="3 3"/><circle cx="210" cy="110" r="11" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="200" cy="190" r="11" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="150" cy="150" r="11" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="240" cy="230" r="11" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="90" cy="90" r="11" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="100" cy="220" r="11" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="250" cy="70" r="11" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="280" cy="150" r="11" fill="#9cc3d3" stroke="#1f6f8b" stroke-width="1.5"/><line x1="292" y1="150" x2="314" y2="150" stroke="#1f6f8b" stroke-width="2.2" marker-end="url(#ab)"/><line x1="266" y1="176" x2="230" y2="176" stroke="#b5452f" stroke-width="2" marker-end="url(#ar)"/><text x="244" y="196" text-anchor="middle" font-size="12" fill="#b5452f">pulled back</text><text x="180" y="304" text-anchor="middle" font-size="13" fill="#1d2321">Neighbors pull a molecule back just</text><text x="180" y="323" text-anchor="middle" font-size="13" fill="#1d2321">before it hits the wall, so it hits</text><text x="180" y="342" text-anchor="middle" font-size="13" fill="#1d2321">more softly. P is lower than ideal.</text><text x="540" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Particle volume (very high P)</text><rect x="420" y="44" width="240" height="216" rx="0" fill="#ffffff" stroke="#1d2321" stroke-width="3"/><circle cx="493.18" cy="110.25" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="548.41" cy="155.19" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="580.4" cy="98.42" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="586.72" cy="146.39" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="515" cy="227.12" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="587.71" cy="218.8" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="441.65" cy="199.31" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="450.41" cy="114.14" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="602.36" cy="181.33" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="549.18" cy="76.16" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="485.99" cy="201.71" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="629.4" cy="128.41" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="636.34" cy="216.88" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="488.03" cy="144.83" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="539.93" cy="114.78" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="483.21" cy="77.54" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="550.7" cy="224.26" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="517.2" cy="179.72" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="629.54" cy="83.94" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="564.66" cy="187.72" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="598.09" cy="66.74" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><circle cx="440.43" cy="152.64" r="15" fill="#cfe3ea" stroke="#1f6f8b" stroke-width="1.4"/><text x="540" y="304" text-anchor="middle" font-size="13" fill="#1d2321">Molecules fill a real share of the</text><text x="540" y="323" text-anchor="middle" font-size="13" fill="#1d2321">container, so the free space is less</text><text x="540" y="342" text-anchor="middle" font-size="13" fill="#1d2321">than V. P is higher than ideal.</text>
</svg>
