<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="410" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f8b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5452f"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f8f5a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6460"/></marker></defs><text x="360" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Gas stoichiometry: every path goes through moles</text><rect x="20" y="60" width="150" height="52" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="1.8"/><text x="95" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Grams of A</text><rect x="20" y="190" width="150" height="52" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="1.8"/><text x="95" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">P, V, T of gas A</text><rect x="285" y="125" width="150" height="52" rx="8" fill="#f6f7f6" stroke="#1d2321" stroke-width="1.8"/><text x="360" y="157" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Moles of A</text><rect x="550" y="60" width="150" height="52" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="1.8"/><text x="625" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Grams of B</text><rect x="550" y="190" width="150" height="52" rx="8" fill="#eef4f6" stroke="#1f6f8b" stroke-width="1.8"/><text x="625" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">P, V, T of gas B</text><line x1="170" y1="92" x2="285" y2="140" stroke="#1d2321" stroke-width="2" marker-end="url(#a)"/><text x="227.5" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6f8b">÷ M</text><line x1="170" y1="210" x2="285" y2="165" stroke="#1d2321" stroke-width="2" marker-end="url(#a)"/><text x="227.5" y="209.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6f8b">n = PV/RT</text><rect x="285" y="270" width="150" height="52" rx="8" fill="#f6f7f6" stroke="#1d2321" stroke-width="1.8"/><text x="360" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2321">Moles of B</text><line x1="360" y1="177" x2="360" y2="270" stroke="#1d2321" stroke-width="2" marker-end="url(#a)"/><text x="410" y="227.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6f8b">mole ratio</text><line x1="435" y1="285" x2="550" y2="100" stroke="#1d2321" stroke-width="2" marker-end="url(#a)"/><text x="522.5" y="192.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6f8b">× M</text><line x1="435" y1="300" x2="550" y2="225" stroke="#1d2321" stroke-width="2" marker-end="url(#a)"/><text x="532.5" y="288.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f6f8b">V = nRT/P</text><rect x="20" y="345" width="680" height="52" rx="8" fill="#ffffff" stroke="#3f8f5a" stroke-width="1.8"/><text x="360" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d2321">Shortcut: for gases at the same T and P, the volume ratio equals the mole ratio.</text><text x="360" y="386" text-anchor="middle" font-size="13" fill="#1d2321">2 H₂(g) + O₂(g) → 2 H₂O(g): 2 L of H₂ reacts with 1 L of O₂ to make 2 L of steam.</text>
</svg>
