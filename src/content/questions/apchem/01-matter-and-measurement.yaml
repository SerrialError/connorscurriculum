  prompt: |
    A medicine dose is 8.0 mg per kg of body mass. How many milligrams should a 132 lb patient receive? (1 kg = 2.205 lb)
  choices:
    - { id: a, text: "7.5 mg" }
    - { id: b, text: "4.8 × 10² mg" }
    - { id: c, text: "1.1 × 10³ mg" }
    - { id: d, text: "2.3 × 10³ mg" }
  answer: b
