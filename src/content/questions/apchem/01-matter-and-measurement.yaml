- id: apchem-01-sigfig-count
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.6"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    How many significant figures are in 0.004050 g?
  choices:
    - { id: a, text: "3" }
    - { id: b, text: "4" }
    - { id: c, text: "6" }
    - { id: d, text: "7" }
  answer: b
  explanation: |
    The leading zeros (0.00) don't count. The 4, the zero between 4 and 5, the 5, and the trailing zero (there's a decimal point) do: **4050**, 4 significant figures.

- id: apchem-01-sigfig-most
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.6"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which measurement has the **most** significant figures?
  choices:
    - { id: a, text: "0.000720 m" }
    - { id: b, text: "3.0 × 10⁵ s" }
    - { id: c, text: "101.0 g" }
    - { id: d, text: "4.5 × 10³ mL" }
  answer: c
  explanation: |
    101.0 has 4 (the zero between 1s counts, and so does the trailing zero after the decimal point). 0.000720 has 3, $3.0 \times 10^5$ has 2, and $4.5 \times 10^3$ has 2.

