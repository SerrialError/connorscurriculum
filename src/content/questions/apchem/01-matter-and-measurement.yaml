  sections: ["1.5", "1.7"]
  cedTopics: []
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    Acetone has a density of 0.785 g/mL. What volume of acetone, in liters, has a mass of 2.00 kg?
  choices:
    - { id: a, text: "1.57 L" }
    - { id: b, text: "2.55 L" }
    - { id: c, text: "2.00 L" }
    - { id: d, text: "2.55 × 10³ L" }
  answer: b
  explanation: |
    $2.00\ \text{kg} \times \tfrac{1000\ \text{g}}{1\ \text{kg}} \times \tfrac{1\ \text{mL}}{0.785\ \text{g}} \times \tfrac{1\ \text{L}}{1000\ \text{mL}} = 2.55\ \text{L}$.
    (A) multiplies by the density instead of dividing. (D) stops at milliliters but labels them liters. Acetone is less dense than water, so 2.00 kg must take up more than 2.00 L.

- id: apchem-01-area-convert
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.7"]
  cedTopics: []
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A sheet of gold foil has an area of 8.00 cm² and a mass of 0.0193 g. Gold's density is 19.3 g/cm³. How thick is the foil, in nanometers?
  choices:
    - { id: a, text: "1.25 nm" }
    - { id: b, text: "125 nm" }
    - { id: c, text: "1250 nm" }
    - { id: d, text: "1.25 × 10⁵ nm" }
  answer: c
  explanation: |
    Volume $= 0.0193\ \text{g} / 19.3\ \text{g/cm}^3 = 1.00 \times 10^{-3}\ \text{cm}^3$.
    Thickness $= V / A = 1.00 \times 10^{-3}\ \text{cm}^3 / 8.00\ \text{cm}^2 = 1.25 \times 10^{-4}\ \text{cm}$.
    $1.25 \times 10^{-4}\ \text{cm} \times \tfrac{10^{-2}\ \text{m}}{1\ \text{cm}} \times \tfrac{1\ \text{nm}}{10^{-9}\ \text{m}} = 1.25 \times 10^{3}\ \text{nm} = 1250\ \text{nm}$ (3 significant figures).
    (B) and (D) are off by factors of 10 and 100 from the cm → nm step.

- id: apchem-01-dosage
  type: mcq
