- id: apchem-01-precision-accuracy
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.6"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A sample's true mass is 5.00 g. A student weighs it four times and gets 5.42, 5.41, 5.43, and 5.42 g. How should these results be described?
  choices:
    - { id: a, text: "Accurate and precise" }
    - { id: b, text: "Accurate but not precise" }
    - { id: c, text: "Neither accurate nor precise" }
    - { id: d, text: "Precise but not accurate" }
  answer: d
  explanation: |
    The readings agree within 0.02 g of each other (precise) but are all about 0.42 g too high (not accurate). This pattern suggests a **systematic** error, such as a balance that wasn't zeroed.

- id: apchem-01-systematic
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.6"]
  cedTopics: []
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    A thermometer reads 2.0 °C too high at every temperature. A student measures the temperature of a sample ten times and averages the readings. Compared with a single reading, the average is
  choices:
    - { id: a, text: "more precise, and the 2.0 °C error disappears in the average" }
    - { id: b, text: "still about 2.0 °C too high, since averaging doesn't remove a systematic error" }
    - { id: c, text: "about 0.2 °C too high, since the 2.0 °C error is spread out over the ten readings" }
    - { id: d, text: "less accurate, because more readings means more chances for error" }
  answer: b
  explanation: |
    Averaging reduces **random** error, which scatters readings on both sides of the true value. A systematic error pushes every reading the same way, so the average is off by the same 2.0 °C. Calibrating the thermometer is the fix.

- id: apchem-01-multiply-sigfigs
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.6"]
  cedTopics: []
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    Report $4.512\ \text{m} \times 0.30\ \text{m}$ to the correct number of significant figures.
  choices:
    - { id: a, text: "1.3536 m²" }
    - { id: b, text: "1.354 m²" }
    - { id: c, text: "1.35 m²" }
    - { id: d, text: "1.4 m²" }
  answer: d
  explanation: |
    For multiplication the answer has as many significant figures as the factor with the fewest. 0.30 has 2 (the leading zero doesn't count), so 1.3536 rounds to **1.4** m².

- id: apchem-01-add-sigfigs
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.6"]
  cedTopics: []
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    Report $152.06\ \text{g} + 0.0345\ \text{g} + 3.1\ \text{g}$ to the correct number of significant figures.
  choices:
    - { id: a, text: "155.1945 g" }
    - { id: b, text: "155.19 g" }
    - { id: c, text: "155.2 g" }
    - { id: d, text: "155 g" }
  answer: c
  explanation: |
    For addition, keep the fewest **decimal places**. 3.1 has one decimal place, so 155.1945 rounds to **155.2** g. (B) keeps two decimal places, but 3.1 is known only to the tenths place. (D) rounds to whole grams, throwing away a digit that is known.

- id: apchem-01-mixed-sigfigs
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.6"]
  cedTopics: []
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Calculate $\dfrac{25.632 - 24.3}{0.508}$ and report it to the correct number of significant figures.
  choices:
    - { id: a, text: "2.62" }
    - { id: b, text: "2.6" }
    - { id: c, text: "3" }
    - { id: d, text: "2.622" }
  answer: b
  explanation: |
    Subtraction first: $25.632 - 24.3 = 1.332$. 24.3 is known only to the tenths place, so the difference is good to the tenths place too: 1.3, which has **2** significant figures.
    Then $1.332 / 0.508 = 2.622$. The numerator has 2 significant figures and 0.508 has 3, so the answer has 2: **2.6**. (Keep 1.332 in the calculator and round only at the end.)
    (A) uses the 3 significant figures of 0.508 and ignores what the subtraction did. (D) isn't rounded. (C) rounds too far.

- id: apchem-01-ruler
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.6"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A graduated cylinder is marked every 1 mL. The bottom of the meniscus is a little more than halfway between the 36 mL and 37 mL marks. How should the volume be recorded?
  choices:
