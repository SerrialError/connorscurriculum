      prompt: Express the density in kg/m³.
      scoring:
        - "8.9 g/cm³ × (1 kg / 1000 g) × (100 cm / 1 m)³ = 8.9 × 10³ kg/m³."
    - label: d
      points: 1
      prompt: The mass has 4 significant figures, but the density has only 2. Which measurement should be improved to get a more precise density, and why?
      scoring:
        - "The volume: its subtraction leaves only 2 significant figures, which limits the answer; a finer graduated cylinder (or a larger sample) would give a more precise volume."
  explanation: |
    **(a)** $V = 30.3 - 25.0 = 5.3$ mL. For subtraction, keep one decimal place, which leaves 2 significant figures. $1\ \text{mL} = 1\ \text{cm}^3$, so $V = 5.3\ \text{cm}^3$.

    **(b)** $d = 47.36 / 5.3 = 8.936\ldots$ which rounds to **8.9 g/cm³**: division keeps the fewest significant figures, and 5.3 has 2.

    **(c)** $8.9\ \tfrac{\text{g}}{\text{cm}^3} \times \tfrac{1\ \text{kg}}{1000\ \text{g}} \times \tfrac{10^6\ \text{cm}^3}{1\ \text{m}^3} = 8.9 \times 10^3\ \text{kg/m}^3$.

    **(d)** The mass has 4 significant figures, but the volume has only 2 because two close readings were subtracted. The density can't be more precise than the volume, so improve that measurement: use a narrower cylinder with finer markings, or a larger sample so the volume change is bigger.

- id: apchem-01-coulomb-frq
  type: frq
  subject: apchem
  chapter: 1
  sections: ["1.4"]
  cedTopics: ["1.5"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    The electrostatic potential energy of two charged particles is $E_{\text{el}} = \dfrac{\kappa Q_1 Q_2}{d}$.
  parts:
    - label: a
      points: 1
      prompt: For a pair of opposite charges, is $E_{\text{el}}$ positive or negative, and does it increase or decrease as the charges move closer together?
      scoring:
        - "Negative (Q₁Q₂ < 0), and it decreases (becomes more negative) as d decreases."
    - label: b
      points: 1
      prompt: "Ion pair I is $\\ce{Na+}$ and $\\ce{Cl-}$ with centers 0.28 nm apart. Ion pair II is $\\ce{Mg^2+}$ and $\\ce{O^2-}$ with centers 0.21 nm apart. Calculate the ratio $E_{\\text{el}}(\\text{II}) / E_{\\text{el}}(\\text{I})$."
      scoring:
        - "Ratio = [(2)(−2)/0.21] / [(1)(−1)/0.28] = 19.0 / 3.57 ≈ 5.3."
    - label: c
      points: 1
      prompt: MgO melts at about 2800 °C and NaCl at 801 °C. Use your answer to (b) to explain the difference.
      scoring:
        - "The ions in MgO attract each other about 5 times more strongly (larger charges at a smaller distance), so much more energy is needed to separate them, giving a higher melting point."
  explanation: |
    **(a)** $Q_1Q_2$ is negative, so $E_{\text{el}}$ is negative. As $d$ shrinks the magnitude grows, so the energy becomes **more negative** (decreases): opposite charges are lower in energy closer together, which is why they attract.

    **(b)** The constant cancels:

    $$
    \frac{E_{\text{II}}}{E_{\text{I}}} = \frac{(+2)(-2)/0.21}{(+1)(-1)/0.28} = \frac{-19.0}{-3.57} = 5.3
    $$

    **(c)** The attraction between $\ce{Mg^2+}$ and $\ce{O^2-}$ is about five times stronger: four times the charge product, at a shorter distance. Melting requires pulling the ions apart enough to move past each other, which takes much more energy in MgO, so it melts at a far higher temperature. Chapter 8 returns to this as lattice energy.

