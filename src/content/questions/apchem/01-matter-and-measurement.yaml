    - { id: b, text: "36.6 mL" }
    - { id: c, text: "36.60 mL" }
    - { id: d, text: "37 mL" }
  answer: b
  explanation: |
    Record all the certain digits plus one estimated digit. The marks give the ones place for sure; the tenths place is estimated: **36.6** mL. (C) claims more precision than the cylinder has. (A) and (D) drop the estimated digit.

