- id: apchem-01-separation-frq
  type: frq
  subject: apchem
  chapter: 1
  sections: ["1.2", "1.3"]
  cedTopics: ["1.4", "3.9", "4.4"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    A student is given a mixture of sand, table salt (NaCl), and a small amount of a water-soluble blue dye. The student adds water, stirs, and filters the mixture. A clear blue solution passes through the filter, and the sand stays on the filter paper.
  parts:
    - label: a
      points: 1
      prompt: Is the blue solution that passes through the filter a pure substance, a homogeneous mixture, or a heterogeneous mixture? Justify your answer.
      scoring:
        - "Homogeneous mixture (a solution): it contains more than one kind of particle (water, Na⁺ and Cl⁻ ions, dye molecules), spread uniformly."
    - label: b
      points: 1
      prompt: Explain why filtration separated the sand but not the salt or the dye.
      scoring:
        - "The sand particles are large and undissolved, so they can't pass through the filter; the dissolved ions and dye molecules are spread among the water molecules and pass through with them."
    - label: c
      points: 1
      prompt: The student heats the blue solution until all the water is gone. Is evaporating the water a physical or chemical change? Justify your answer in terms of particles.
      scoring:
        - "Physical: only the attractions between water molecules (and between water and the solutes) are overcome; the H₂O molecules stay intact, so no new substance forms."
    - label: d
      points: 2
      prompt: To check the dye's purity, the student runs paper chromatography on it with a nonpolar solvent and polar paper. The solvent front moves 10.0 cm, and two spots appear, 2.0 cm and 7.0 cm from the starting line. What does this show about the dye, and which spot comes from the more polar component? Justify.
      scoring:
        - "The dye is a mixture of (at least) two colored substances, since two spots formed."
        - "The spot that moved 2.0 cm is more polar: it is attracted more strongly to the polar paper, so it moves less with the nonpolar solvent."
  explanation: |
    **(a)** It's a solution, a homogeneous mixture of water, dissolved NaCl (as $\ce{Na+}$ and $\ce{Cl-}$ ions), and dye. It looks the same throughout, but it contains several kinds of particles, and its composition could vary.

    **(b)** Filtration separates by particle size. Sand doesn't dissolve, and its grains are too big to pass through the paper. The salt and dye are dissolved into individual ions or molecules that pass through with the water.

    **(c)** Physical. Water molecules escape into the gas phase when the attractions between them are overcome. Each $\ce{H2O}$ keeps its O–H bonds. The salt and dye are left behind unchanged.

    **(d)** A pure substance gives one spot, so two spots mean the "dye" is at least two substances. The spot at 2.0 cm traveled least: it's held most strongly by the polar paper, so it's the more polar component. The component at 7.0 cm is attracted more to the nonpolar solvent.

