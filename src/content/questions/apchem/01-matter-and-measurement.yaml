  answer: c
  explanation: |
    $5.50\ \tfrac{\text{m}}{\text{s}} \times \tfrac{1\ \text{km}}{1000\ \text{m}} \times \tfrac{3600\ \text{s}}{1\ \text{h}} = 19.8\ \text{km/h}$.
    (B) flips both factors (multiplies by 1000 and divides by 3600). (D) multiplies by 60 only, as if converting to meters per minute. (A) divides by 60.

- id: apchem-01-cubed-convert
