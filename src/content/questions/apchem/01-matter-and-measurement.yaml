- id: apchem-01-intensive
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which property is **intensive**?
  choices:
    - { id: a, text: "Mass" }
    - { id: b, text: "Volume" }
    - { id: c, text: "Boiling point" }
    - { id: d, text: "Heat released on burning" }
  answer: c
  explanation: |
    An intensive property doesn't depend on how much of the substance there is. A drop and a pot of water both boil at 100 °C at 1 atm. Mass, volume, and the total heat released all grow with the amount, so they're extensive.

- id: apchem-01-chemical-property
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which describes a **chemical** property of sodium?
  choices:
    - { id: a, text: "It is soft enough to be cut with a butter knife" }
    - { id: b, text: "It melts at 98 °C" }
    - { id: c, text: "It is a good conductor of electricity" }
    - { id: d, text: "It reacts with water to form hydrogen gas" }
  answer: d
  explanation: |
    A chemical property describes how a substance turns into other substances. Reacting with water makes $\ce{H2}$ and NaOH. Hardness, melting point, and conductivity can be observed without changing sodium into anything else, so they're physical properties.

- id: apchem-01-physical-change
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: ["4.1", "4.4"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which is a **physical** change?
  choices:
    - { id: a, text: "Dry ice turning into a gas" }
    - { id: b, text: "Milk going sour" }
    - { id: c, text: "A candle wick burning" }
    - { id: d, text: "Silver slowly tarnishing black in moist air" }
  answer: a
  explanation: |
    Sublimation of dry ice changes solid $\ce{CO2}$ into gaseous $\ce{CO2}$; the molecules stay the same. Souring, burning, and tarnishing all make new substances.

- id: apchem-01-boiling-particles
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: ["4.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    When liquid water boils, what happens at the particle level?
  choices:
    - { id: a, text: "O–H bonds break, releasing H₂ and O₂ gas in the bubbles" }
    - { id: b, text: "Attractions between H₂O molecules are overcome, but the molecules stay intact" }
    - { id: c, text: "H₂O molecules split into H⁺ and OH⁻ ions that escape as a gas" }
    - { id: d, text: "Water molecules get larger as they absorb heat, until they float away" }
  answer: b
  explanation: |
    Boiling is a physical change: molecules separate from each other, but no bonds within the molecules break. The bubbles are water vapor.
    (A) describes electrolysis, a chemical change. (C) doesn't happen on boiling. (D) is wrong because molecules don't change size when heated; they move faster.

- id: apchem-01-evidence
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: ["4.1"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which observation is the **strongest** evidence that a chemical reaction happened?
  choices:
    - { id: a, text: "A solid disappears when it is stirred into water" }
    - { id: b, text: "A liquid gives off bubbles when it is heated to 100 °C" }
    - { id: c, text: "A yellow solid forms when two clear, colorless solutions are mixed" }
    - { id: d, text: "A metal bar left in the sun gets warm to the touch after an hour" }
  answer: c
  explanation: |
    A precipitate (a new solid) forming from two solutions, with a color change, means a new substance was made.
    (A) can be just dissolving. (B) is boiling. (D) is heat transfer with no new substance.

- id: apchem-01-dissolve-nacl
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: ["4.4"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Dissolving NaCl in water is sometimes called a chemical change and sometimes a physical change. Which statement best explains why it can be argued either way?
  choices:
    - { id: a, text: "The attractions between Na⁺ and Cl⁻ in the crystal are broken, but the ions themselves are unchanged and the salt can be recovered" }
    - { id: b, text: "Sodium atoms give their electrons to water, but the chlorine atoms stay as Cl₂ molecules" }
    - { id: c, text: "It is endothermic, and endothermic processes can be either physical or chemical" }
    - { id: d, text: "The water molecules break apart into H⁺ and OH⁻, but they quickly re-form" }
  answer: a
  explanation: |
    Dissolving breaks the ionic attractions that hold the crystal together (bonds), which sounds chemical, and new attractions form between ions and water. But the ions don't change, and evaporating the water gives NaCl back, which sounds physical. The AP exam accepts either answer with this reasoning.
    (B) is wrong: NaCl already contains ions. (C) doesn't distinguish anything. (D) doesn't describe dissolving.

- id: apchem-01-sugar-dissolve
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: ["4.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Why is dissolving sugar ($\ce{C12H22O11}$) in water classified as a physical change?
  choices:
    - { id: a, text: "The sugar molecules stay intact; only attractions between molecules change" }
    - { id: b, text: "The sugar breaks into C, H, and O atoms that are spread through the water" }
    - { id: c, text: "No energy is absorbed or released when sugar dissolves" }
    - { id: d, text: "Sugar reacts with water, but the products happen to be colorless and odorless" }
  answer: a
  explanation: |
    Dissolved sugar is still $\ce{C12H22O11}$ molecules, now surrounded by water. No covalent bonds break.
    (B) would be a chemical change. (C) is false; dissolving has a small energy change. (D) describes a reaction.

- id: apchem-01-filtration
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: ["3.9"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which mixture can be separated by filtration?
  choices:
    - { id: a, text: "Sugar dissolved in water" }
    - { id: b, text: "Ethanol mixed with water" }
    - { id: c, text: "Iron filings in water" }
    - { id: d, text: "Salt dissolved in water" }
  answer: c
  explanation: |
    Filtration separates an undissolved solid from a liquid. In a solution (A, B, D), the dissolved particles are spread among the water molecules and pass through the filter with them.

- id: apchem-01-distill
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: ["3.9"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A solution of liquids X and Y is distilled. X boils at 56 °C and Y at 118 °C. Which statement is correct?
  choices:
    - { id: a, text: "Y collects first because its molecules are attracted to each other more strongly" }
    - { id: b, text: "Y collects first because a higher boiling point means it evaporates faster" }
    - { id: c, text: "X collects first because its molecules are attracted to each other more strongly" }
    - { id: d, text: "X collects first because its molecules are attracted to each other less strongly" }
  answer: d
  explanation: |
    The liquid with the lower boiling point vaporizes first. A lower boiling point means weaker attractions between its molecules, so less energy separates them.
    (C) gives the wrong reason; stronger attractions raise the boiling point. (A) and (B) have the order backward.

- id: apchem-01-rf-polarity
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: ["3.9"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A mixture is separated by paper chromatography on polar paper with a nonpolar solvent. The solvent front moves 10.0 cm. Component P moves 1.5 cm and component Q moves 8.5 cm. Which is the best explanation?
  choices:
    - { id: a, text: "P is more polar, so it is attracted more strongly to the paper" }
    - { id: b, text: "P is less polar, so it is attracted more strongly to the paper" }
    - { id: c, text: "P has a larger molar mass, so gravity holds it back" }
    - { id: d, text: "P is more polar, so it dissolves better in the solvent" }
  answer: a
  explanation: |
    P stayed near the start, held by the stationary phase. The paper is polar, so the component that's held more is the more polar one. Q is attracted more to the nonpolar solvent and travels with it.
    (B) reverses "like attracts like." (D) would make P move farther, not less. (C) isn't how chromatography separates.

- id: apchem-01-rf-solvent-switch
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: ["3.9"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Two dyes, a polar dye and a nonpolar dye, are separated on the same polar paper twice: first with a nonpolar solvent, then with water as the solvent. How do the distances they travel change when the solvent is switched to water?
  choices:
    - { id: a, text: "Both increase by the same amount, because water is a better solvent for everything" }
    - { id: b, text: "Neither changes, because the distance depends only on the paper" }
    - { id: c, text: "The polar dye travels less far and the nonpolar dye travels farther" }
    - { id: d, text: "The polar dye travels farther and the nonpolar dye travels less far" }
  answer: d
  explanation: |
    With a polar solvent, the polar dye is now attracted to the moving phase as well as the paper, so it travels farther. The nonpolar dye is attracted less to water than to the nonpolar solvent, so it moves less. The order of the spots usually flips.
    (C) is the reverse. (B) ignores the mobile phase. (A) isn't true: water dissolves polar substances, not nonpolar ones.

- id: apchem-01-separation-method
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: ["3.9"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which method would best separate the colored dyes that are dissolved together in a drop of black ink?
  choices:
    - { id: a, text: "Filtration" }
    - { id: b, text: "Decanting the liquid" }
    - { id: c, text: "Using a magnet" }
    - { id: d, text: "Chromatography" }
  answer: d
  explanation: |
    The dyes are dissolved, so filtration and decanting (pouring off a liquid above a solid) won't work, and they aren't magnetic. Chromatography separates them by how strongly each is attracted to the solvent and to the paper.

