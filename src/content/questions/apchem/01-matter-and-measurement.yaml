- id: apchem-01-o2-box
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.2"]
  cedTopics: ["1.4"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    A sealed flask contains only $\ce{O2}$ molecules. How is its contents classified?
  choices:
    - { id: a, text: "A compound, because each particle has two atoms bonded together" }
    - { id: b, text: "A heterogeneous mixture, because the molecules are spread out" }
    - { id: c, text: "A homogeneous mixture, because the gas is uniform throughout" }
    - { id: d, text: "An element, because every particle has only one kind of atom" }
  answer: d
  explanation: |
    Every particle is identical (pure substance), and each contains only oxygen atoms, so it's an element. A molecule of an element is still an element: (A) confuses "molecule" with "compound." (C) and (B) are wrong because there's only one kind of particle.

- id: apchem-01-classify-list
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.2"]
  cedTopics: ["1.4"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which list is ordered **element, compound, homogeneous mixture, heterogeneous mixture**?
  choices:
    - { id: a, text: "Brass, water, air, granite" }
    - { id: b, text: "Mercury, table salt, salt water, oil and water" }
    - { id: c, text: "Oxygen, air, sugar, sand and water" }
    - { id: d, text: "Carbon dioxide, iron, vinegar, milk" }
  answer: b
  explanation: |
    Mercury is an element, NaCl a compound, salt water a solution (homogeneous), and oil with water separates into layers (heterogeneous).
    (A) starts with brass, which is a mixture of copper and zinc. (C) lists air as a compound and sugar as a mixture; it's the reverse. (D) starts with $\ce{CO2}$, a compound, and iron, an element.

- id: apchem-01-particle-mixture
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.2"]
  cedTopics: ["1.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A particle diagram shows a box with 4 separate Ar atoms, 3 $\ce{N2}$ molecules, and 2 $\ce{NH3}$ molecules. Which statement about the sample is correct?
  choices:
    - { id: a, text: "It is a mixture of two elements and a compound" }
    - { id: b, text: "It is a mixture of three compounds" }
    - { id: c, text: "It is a single compound, since N appears twice" }
    - { id: d, text: "It is a mixture of three elements" }
  answer: a
  explanation: |
    Three different kinds of particle means a mixture. Ar and $\ce{N2}$ each contain one kind of atom (elements); $\ce{NH3}$ contains N and H (a compound).
    (D) treats $\ce{NH3}$ as an element. (B) treats Ar and $\ce{N2}$ as compounds. (C) ignores that the particles aren't all identical.

- id: apchem-01-compound-vs-mixture
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.2"]
  cedTopics: ["1.3", "1.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Samples of a white solid from three different suppliers are analyzed. All three contain only calcium, carbon, and oxygen, but their mass percents of calcium are 40.0%, 32.5%, and 37.1%. What is the best conclusion?
  choices:
    - { id: a, text: "The solid is a single compound whose composition depends on how it was made" }
    - { id: b, text: "The three samples are three different elements that look alike" }
    - { id: c, text: "The samples can't all be the same pure compound" }
    - { id: d, text: "The analysis must be wrong, since calcium can't combine with carbon" }
  answer: c
  explanation: |
    By the law of constant composition, every sample of one pure compound has the same mass percent of each element. Different percents mean the samples aren't all the same pure substance: at least some are mixtures (for example, $\ce{CaCO3}$ with an impurity), or they're different compounds.
    (A) contradicts the law. (B) is impossible, since each sample contains three elements. (D) is false: $\ce{CaCO3}$ contains Ca, C, and O.

- id: apchem-01-homogeneous
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.2"]
  cedTopics: ["1.4"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which of these is a **homogeneous** mixture?
  choices:
    - { id: a, text: "Distilled water" }
    - { id: b, text: "Concrete" }
    - { id: c, text: "Muddy river water" }
    - { id: d, text: "Filtered air" }
  answer: d
  explanation: |
    Air is a uniform mixture of $\ce{N2}$, $\ce{O2}$, Ar, and other gases, so it's a solution. Distilled water (A) is a pure compound. Concrete (B) and muddy water (C) aren't uniform, so they're heterogeneous.

- id: apchem-01-states-particles
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.2"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which state of matter has a fixed volume but takes the shape of its container?
  choices:
    - { id: a, text: "Liquid" }
    - { id: b, text: "Gas" }
    - { id: c, text: "Solid" }
    - { id: d, text: "All three" }
  answer: a
  explanation: |
    Liquid particles are close together (fixed volume) but slide past each other (no fixed shape). A gas has neither a fixed shape nor a fixed volume; a solid has both.

- id: apchem-01-compound-breakdown
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.2"]
  cedTopics: ["1.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Heating a pure orange solid produces a silvery liquid and a colorless gas, and nothing can turn either product into anything simpler. What was the orange solid?
  choices:
    - { id: a, text: "An element, since it was pure before heating" }
    - { id: b, text: "A heterogeneous mixture of a liquid and a gas" }
    - { id: c, text: "A compound of the two elements formed" }
    - { id: d, text: "A homogeneous mixture of two elements" }
  answer: c
  explanation: |
    A pure substance that breaks down chemically into two simpler substances is a compound. The products can't be broken down further, so they're elements. (This is what happens when mercury(II) oxide is heated: Hg and $\ce{O2}$.)
    (A) is wrong because an element can't be decomposed. A mixture (B, D) would be separated by physical means, and the original was described as pure.

- id: apchem-01-particle-count
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.2"]
  cedTopics: ["1.4"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    A box contains 6 $\ce{H2O}$ molecules and 2 $\ce{H2O2}$ molecules. A student says, "This is a pure substance, because it contains only hydrogen and oxygen atoms." Which response is correct?
  choices:
    - { id: a, text: "Correct, because a substance is defined by which elements it contains" }
    - { id: b, text: "Wrong, because H₂O and H₂O₂ are elements, so this is a mixture of elements" }
    - { id: c, text: "Correct, because both are compounds and a compound is a pure substance" }
    - { id: d, text: "Wrong, because the particles aren't all identical, so this is a mixture of two compounds" }
  answer: d
  explanation: |
    A pure substance has one kind of particle. $\ce{H2O}$ and $\ce{H2O2}$ are different compounds with different properties, even though they contain the same elements. Two kinds of molecule make a mixture.
    (A) and (C) use the wrong test. (B) wrongly calls the molecules elements.

