- id: apchem-01-displacement
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.5"]
  cedTopics: []
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A 35.6 g piece of metal is dropped into a graduated cylinder holding 20.0 mL of water, and the water level rises to 24.0 mL. Which metal is it most likely to be?
  choices:
    - { id: a, text: "Aluminum, 2.70 g/cm³" }
    - { id: b, text: "Zinc, 7.13 g/cm³" }
    - { id: c, text: "Nickel, 8.90 g/cm³" }
    - { id: d, text: "Lead, 11.3 g/cm³" }
  answer: c
  explanation: |
    The metal's volume is the water it displaces: $24.0 - 20.0 = 4.0$ mL = 4.0 cm³. $d = 35.6 / 4.0 = 8.9$ g/cm³, nickel.
    Using 24.0 mL as the volume gives 1.48 g/cm³, which matches nothing; using 20.0 mL gives 1.78.

