    (D) multiplies by 2.205 instead of dividing. (C) multiplies pounds by 8.0 without converting. (A) divides the mass by the dose.

- id: apchem-01-constant-composition-calc
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.2"]
  cedTopics: ["1.3"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A 4.00 g sample of pure magnesium oxide contains 2.41 g of magnesium. How many grams of magnesium are in a 15.0 g sample of pure magnesium oxide from a different source?
  choices:
    - { id: a, text: "9.04 g" }
    - { id: b, text: "2.41 g" }
    - { id: c, text: "6.22 g" }
    - { id: d, text: "13.4 g" }
  answer: a
  explanation: |
    By the law of constant composition, every pure sample has the same mass fraction of Mg: $2.41 / 4.00 = 0.6025$. So $15.0 \times 0.6025 = 9.04$ g.
    (B) assumes the mass of Mg doesn't depend on the sample size. (C) is $15.0 / 2.41$. (D) is $15.0 - (4.00 - 2.41)$, subtracting the oxygen from the first sample.

- id: apchem-01-condense-particles
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.3"]
  cedTopics: ["4.3", "4.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A "before" particle diagram shows 6 $\ce{Br2}$ molecules spread far apart. The "after" diagram shows the same 6 $\ce{Br2}$ molecules packed close together at the bottom of the container. Which process does this represent?
  choices:
    - { id: a, text: "Decomposition of bromine, a chemical change" }
    - { id: b, text: "Combination of bromine atoms into molecules, a chemical change" }
    - { id: c, text: "Boiling of bromine, a physical change" }
    - { id: d, text: "Condensation of bromine, a physical change" }
  answer: d
  explanation: |
    The molecules are the same before and after (each is still $\ce{Br2}$), so no bonds broke or formed. They went from far apart (gas) to close together (liquid): condensation. Boiling (C) is the reverse. (A) and (B) would change the particles.

- id: apchem-01-energy-released
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.4"]
  cedTopics: ["1.5"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Which process **releases** energy because the electrostatic potential energy of the system decreases?
  choices:
    - { id: a, text: "Pulling an electron away from a nucleus" }
    - { id: b, text: "A Na⁺ ion and a Cl⁻ ion moving together from far apart" }
    - { id: c, text: "Pushing two protons closer together" }
    - { id: d, text: "Separating a Mg²⁺ ion from an O²⁻ ion" }
  answer: b
  explanation: |
    Opposite charges have lower (more negative) potential energy closer together, so bringing $\ce{Na+}$ and $\ce{Cl-}$ together lowers the energy, and the difference is released.
    (A) and (D) separate opposite charges, which raises the energy (energy must be added). (C) pushes like charges together, which also raises the energy.

