    - { id: d, text: "2.26 × 10⁷ kg/m³" }
  answer: c
  explanation: |
    $22.6\ \tfrac{\text{g}}{\text{cm}^3} \times \tfrac{1\ \text{kg}}{1000\ \text{g}} \times \left(\tfrac{100\ \text{cm}}{1\ \text{m}}\right)^3 = 22.6 \times 10^{-3} \times 10^6 = 2.26 \times 10^4\ \text{kg/m}^3$.
    (B) uses 100 instead of $100^3$. (D) forgets the g → kg step. (A) only converts g → kg.

- id: apchem-01-mass-to-volume
  type: mcq
