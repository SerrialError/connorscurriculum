- id: apchem-01-ke-double
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.4"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    If the speed of a moving object doubles, its kinetic energy is multiplied by
  choices:
    - { id: a, text: "1/2" }
    - { id: b, text: "2" }
    - { id: c, text: "4" }
    - { id: d, text: "8" }
  answer: c
  explanation: |
    $E_k = \tfrac{1}{2}mv^2$. Kinetic energy depends on the square of the speed, so doubling $v$ multiplies $E_k$ by $2^2 = 4$.

- id: apchem-01-ke-calc
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.4"]
  cedTopics: []
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    What is the kinetic energy of a 60.0 g tennis ball moving at 25.0 m/s?
  choices:
    - { id: a, text: "0.750 J" }
    - { id: b, text: "18.8 J" }
    - { id: c, text: "37.5 J" }
    - { id: d, text: "1.88 × 10⁴ J" }
  answer: b
  explanation: |
    Mass must be in kilograms: 60.0 g = 0.0600 kg.
    $E_k = \tfrac{1}{2}(0.0600\ \text{kg})(25.0\ \text{m/s})^2 = 18.8\ \text{J}$.
    (D) leaves the mass in grams. (C) forgets the ½. (A) doesn't square the speed.

- id: apchem-01-coulomb-compare
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.4"]
  cedTopics: ["1.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which pair of ions has the **most negative** electrostatic potential energy? (Distances are between the centers.)
  choices:
    - { id: a, text: "+1 and −1, 0.40 nm apart" }
    - { id: b, text: "+1 and −1, 0.20 nm apart" }
    - { id: c, text: "+2 and −1, 0.30 nm apart" }
    - { id: d, text: "+2 and −2, 0.30 nm apart" }
  answer: d
  explanation: |
    $E_{\text{el}} \propto Q_1Q_2/d$. Compare $Q_1Q_2/d$: (A) $-1/0.40 = -2.5$, (B) $-1/0.20 = -5.0$, (C) $-2/0.30 = -6.7$, (D) $-4/0.30 = -13.3$. The largest charges at a short distance give the strongest attraction.

- id: apchem-01-like-charges
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.4"]
  cedTopics: ["1.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Two positively charged particles are pushed closer together. What happens to the electrostatic potential energy of the pair?
  choices:
    - { id: a, text: "It decreases, because the particles become more stable" }
    - { id: b, text: "It increases, because work must be done against the repulsion" }
    - { id: c, text: "It stays the same, because the charges don't change" }
    - { id: d, text: "It becomes negative, because the particles attract when close" }
  answer: b
  explanation: |
    For like charges $Q_1Q_2$ is positive, so $E_{\text{el}}$ is positive and grows as $d$ shrinks. Pushing them together takes energy, which is stored as potential energy.
    (A) and (D) describe opposite charges. (C) ignores the distance.

