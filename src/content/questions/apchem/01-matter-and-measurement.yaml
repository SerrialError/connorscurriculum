- id: apchem-01-prefix
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.5"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    How many micrometers are in 1 millimeter?
  choices:
    - { id: a, text: "10" }
    - { id: b, text: "100" }
    - { id: c, text: "1000" }
    - { id: d, text: "1 × 10⁶" }
  answer: c
  explanation: |
    $1\ \text{mm} = 10^{-3}$ m and $1\ \mu\text{m} = 10^{-6}$ m, so $1\ \text{mm} = 10^{-3}/10^{-6} = 10^3\ \mu\text{m}$.

- id: apchem-01-kelvin
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.5"]
  cedTopics: []
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    Liquid nitrogen boils at 77 K. What is this temperature in °C?
  choices:
    - { id: a, text: "−196 °C" }
    - { id: b, text: "−350 °C" }
    - { id: c, text: "−77 °C" }
    - { id: d, text: "350 °C" }
  answer: a
  explanation: |
    $^\circ\text{C} = \text{K} - 273.15 = 77 - 273 = -196\ ^\circ\text{C}$. (D) adds 273; (B) adds 273 and makes it negative.

- id: apchem-01-temp-change
  type: mcq
  subject: apchem
  chapter: 1
  sections: ["1.5"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    The temperature of a sample rises by 15 °C. By how much did it rise in kelvins?
  choices:
    - { id: a, text: "15 K" }
    - { id: b, text: "27 K" }
    - { id: c, text: "258 K" }
    - { id: d, text: "288 K" }
  answer: a
  explanation: |
    A kelvin and a Celsius degree are the same size; the scales differ only in where zero is. A **change** of 15 °C is a change of 15 K. (D) converts 15 °C as if it were a temperature, not a change. (B) multiplies by 1.8, as if K and °C were different-sized degrees.

