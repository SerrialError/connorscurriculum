- id: apchem-02-empirical-of
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.6"]
  cedTopics: ["1.3"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the empirical formula of butane, $\ce{C4H10}$?
  choices:
    - { id: a, text: "CH₂" }
    - { id: b, text: "C₂H₅" }
    - { id: c, text: "CH₃" }
    - { id: d, text: "C₄H₁₀" }
  answer: b
  explanation: |
    Divide both subscripts by their greatest common factor, 2: $\ce{C2H5}$. It can't be reduced further, since 2 and 5 share no factor.

- id: apchem-02-same-empirical
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.6"]
  cedTopics: ["1.3"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which two compounds have the **same empirical formula**?
  choices:
    - { id: a, text: "C₂H₄ and C₂H₆" }
    - { id: b, text: "C₂H₂ and C₆H₆" }
    - { id: c, text: "H₂O and H₂O₂" }
    - { id: d, text: "CO and CO₂" }
  answer: b
  explanation: |
    Acetylene ($\ce{C2H2}$) and benzene ($\ce{C6H6}$) both reduce to CH. The other pairs have different atom ratios: $\ce{CH2}$ vs $\ce{CH3}$, $\ce{H2O}$ vs HO, and CO vs $\ce{CO2}$.

- id: apchem-02-diatomic
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.6"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which element exists as **diatomic molecules** at room temperature?
  choices:
    - { id: a, text: "Phosphorus" }
    - { id: b, text: "Sulfur" }
    - { id: c, text: "Bromine" }
    - { id: d, text: "Sodium" }
  answer: c
  explanation: |
    The seven diatomic elements are $\ce{H2}$, $\ce{N2}$, $\ce{O2}$, $\ce{F2}$, $\ce{Cl2}$, $\ce{Br2}$, and $\ce{I2}$. Phosphorus forms $\ce{P4}$ molecules, sulfur forms $\ce{S8}$ rings, and sodium is a metal.

- id: apchem-02-molecular-only-nonmetals
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.6", "2.7"]
  cedTopics: ["1.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which compound is **molecular** rather than ionic?
  choices:
    - { id: a, text: "NH₄NO₃" }
    - { id: b, text: "CaF₂" }
    - { id: c, text: "PCl₅" }
    - { id: d, text: "Na₂CO₃" }
  answer: c
  explanation: |
    $\ce{PCl5}$ contains only nonmetals and no ions. $\ce{CaF2}$ and $\ce{Na2CO3}$ contain metal ions. $\ce{NH4NO3}$ has only nonmetals but is made of $\ce{NH4+}$ and $\ce{NO3-}$ ions, so it's ionic.

- id: apchem-02-molecular-empirical-claim
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.6", "2.7"]
  cedTopics: ["1.3"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Which statement is correct?
  choices:
    - { id: a, text: "An ionic formula such as MgCl₂ is an empirical formula, giving only the ion ratio" }
    - { id: b, text: "Every molecular formula can be reduced to a different, simpler empirical formula" }
    - { id: c, text: "Two different compounds can never have the same empirical formula" }
    - { id: d, text: "Glucose, C₆H₁₂O₆, and its empirical formula CH₂O are the same compound" }
  answer: a
  explanation: |
    An ionic solid has no molecules, so its formula is the lowest ratio of ions: always an empirical formula.
    (B) fails for $\ce{H2O}$ or $\ce{CO2}$, which are already in lowest terms. (C) is false: $\ce{C2H2}$ and $\ce{C6H6}$ share CH. (D) is false: formaldehyde, $\ce{CH2O}$, is a different compound from glucose.

