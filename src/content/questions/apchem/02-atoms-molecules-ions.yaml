- id: apchem-02-dalton-wrong
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.1", "2.3"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which part of Dalton's atomic theory was later shown to be **incorrect**?
  choices:
    - { id: a, text: "Atoms are rearranged, not created or destroyed, in chemical reactions" }
    - { id: b, text: "All atoms of a given element have the same mass" }
    - { id: c, text: "Compounds contain atoms of different elements in whole-number ratios" }
    - { id: d, text: "Each element is made of extremely small particles called atoms" }
  answer: b
  explanation: |
    Isotopes of an element have different numbers of neutrons and so different masses. The other three postulates still hold for chemical reactions.

- id: apchem-02-conservation-mass
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.1"]
  cedTopics: []
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    In a sealed container, 6.0 g of carbon reacts completely with oxygen to form 22.0 g of carbon dioxide and nothing else. What mass of oxygen reacted?
  choices:
    - { id: a, text: "6.0 g" }
    - { id: b, text: "11.0 g" }
    - { id: c, text: "16.0 g" }
    - { id: d, text: "28.0 g" }
  answer: c
  explanation: |
    Mass is conserved: $22.0 - 6.0 = 16.0$ g of $\ce{O2}$. (D) adds the masses instead of subtracting.

- id: apchem-02-definite-proportions
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.1"]
  cedTopics: ["1.3"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which observation is an example of the **law of definite proportions**?
  choices:
    - { id: a, text: "Water from a glacier and water from a lab both contain 88.8% oxygen by mass" }
    - { id: b, text: "Burning a candle in a sealed jar doesn't change the total mass of the jar" }
    - { id: c, text: "Carbon forms CO and CO₂, with twice as much oxygen per gram of carbon in CO₂" }
    - { id: d, text: "Salt water can be 2% or 20% salt, depending on how much is dissolved" }
  answer: a
  explanation: |
    The law of definite (constant) proportions says a pure compound always has the same composition by mass, whatever its source.
    (B) is conservation of mass. (C) is the law of multiple proportions. (D) describes a mixture, whose composition can vary.

- id: apchem-02-multiple-proportions
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.1"]
  cedTopics: ["1.3"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Three oxides of nitrogen contain these masses of oxygen per 1.000 g of nitrogen:

    | Oxide | I | II | III |
    |---|---|---|---|
    | g O per g N | 0.571 | 1.142 | 2.284 |

    If oxide II is NO, what are the formulas of oxides I and III?
  choices:
    - { id: a, text: "I is NO₂ and III is N₂O" }
    - { id: b, text: "I is NO₂ and III is N₂O₅" }
    - { id: c, text: "I is N₂O and III is NO₂" }
    - { id: d, text: "I is NO and III is N₂O₃" }
  answer: c
  explanation: |
    Compare each with oxide II (NO): oxide I has $0.571/1.142 = 1/2$ as much O per N, so it has half an O per N: $\ce{N2O}$. Oxide III has $2.284/1.142 = 2$ times as much: $\ce{NO2}$.
    (A) has the two reversed. (B) and (D) don't match the ratios: N₂O₅ would have 2.5 times the O per N of NO, and N₂O₃ 1.5 times.

- id: apchem-02-multiple-proportions-ratio
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.1"]
  cedTopics: ["1.3"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    Sulfur forms two oxides. In one, 1.00 g of sulfur is combined with 0.998 g of oxygen. In the other, 1.00 g of sulfur is combined with 1.497 g of oxygen. What is the ratio of the oxygen masses, and what does it show?
  choices:
    - { id: a, text: "1.5 : 1, showing the oxides could be SO₂ and SO₃" }
    - { id: b, text: "1 : 1, showing the two oxides are the same compound" }
    - { id: c, text: "2 : 1, showing the oxides could be SO and SO₂" }
    - { id: d, text: "1.5 : 1, showing atoms can combine in fractional amounts" }
  answer: a
  explanation: |
    $1.497 / 0.998 = 1.50 = 3/2$, a ratio of small whole numbers, as the law of multiple proportions predicts. $\ce{SO2}$ and $\ce{SO3}$ have 2 and 3 O per S, a 3 : 2 ratio.
    (D) misreads the ratio: 3 : 2 means whole atoms, not fractions of atoms.

