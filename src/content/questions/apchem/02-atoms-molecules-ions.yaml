- id: apchem-02-name-fe2o3
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.8"]
  cedTopics: ["1.8"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the name of $\ce{Fe2O3}$?
  choices:
    - { id: a, text: "Iron(II) oxide" }
    - { id: b, text: "Iron(III) oxide" }
    - { id: c, text: "Diiron trioxide" }
    - { id: d, text: "Iron(VI) oxide" }
  answer: b
  explanation: |
    Three $\ce{O^2-}$ give −6, so the two Fe give +6 and each is +3: iron(III) oxide. Ionic compounds don't use Greek prefixes (C). (D) uses the total charge of both iron ions instead of one.

- id: apchem-02-name-cocl
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.8"]
  cedTopics: ["1.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    What is the name of $\ce{Co(NO3)2}$?
  choices:
    - { id: a, text: "Cobalt(II) nitrate" }
    - { id: b, text: "Cobalt dinitrate" }
    - { id: c, text: "Cobalt(II) nitrite" }
    - { id: d, text: "Cobalt(I) nitrate" }
  answer: a
  explanation: |
    $\ce{NO3-}$ is nitrate (nitrite is $\ce{NO2-}$). Two nitrates are −2, so Co is +2: cobalt(II) nitrate. (B) uses a prefix, which ionic names don't. (D) uses the number of cobalt atoms.

- id: apchem-02-hypochlorite
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.8"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Chlorate is $\ce{ClO3-}$. What is the formula of the **hypochlorite** ion?
  choices:
    - { id: a, text: "ClO₄⁻" }
    - { id: b, text: "ClO₂⁻" }
    - { id: c, text: "ClO⁻" }
    - { id: d, text: "Cl⁻" }
  answer: c
  explanation: |
    -ite has one fewer O than -ate, and hypo-...-ite has two fewer: $\ce{ClO3-}$ → $\ce{ClO2-}$ (chlorite) → $\ce{ClO-}$ (hypochlorite). The charge stays −1. (A) is perchlorate and (D) is chloride.

- id: apchem-02-iodate
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.8"]
  cedTopics: []
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Bromine and iodine form oxyanions with the same pattern as chlorine. What is the formula of **potassium periodate**?
  choices:
    - { id: a, text: "KIO₄" }
    - { id: b, text: "KIO₃" }
    - { id: c, text: "K₂IO₄" }
    - { id: d, text: "KI" }
  answer: a
  explanation: |
    Perchlorate is $\ce{ClO4-}$, so periodate is $\ce{IO4-}$ (the name is per-iodate). With $\ce{K+}$: $\ce{KIO4}$. (B) is potassium iodate. (C) gives periodate a 2− charge. (D) is potassium iodide.

- id: apchem-02-hydrogen-carbonate
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.8"]
  cedTopics: ["1.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    What is the formula of magnesium hydrogen carbonate?
  choices:
    - { id: a, text: "MgHCO₃" }
    - { id: b, text: "Mg(HCO₃)₂" }
    - { id: c, text: "MgH₂CO₃" }
    - { id: d, text: "Mg₂HCO₃" }
  answer: b
  explanation: |
    Adding $\ce{H+}$ to carbonate ($\ce{CO3^2-}$) gives hydrogen carbonate, $\ce{HCO3-}$, with a 1− charge. Two are needed for $\ce{Mg^2+}$: $\ce{Mg(HCO3)2}$.

- id: apchem-02-acid-names
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.8"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which name–formula pair is **correct**?
  choices:
    - { id: a, text: "HNO₂, nitric acid" }
    - { id: b, text: "HClO₃, hydrochloric acid" }
    - { id: c, text: "H₂SO₃, sulfurous acid" }
    - { id: d, text: "HBr(aq), bromic acid" }
  answer: c
  explanation: |
    $\ce{SO3^2-}$ is sulfite, and -ite acids end in -ous: sulfurous acid.
    (A) $\ce{HNO2}$ comes from nitrite, so it's nitrous acid. (B) $\ce{HClO3}$ comes from chlorate: chloric acid. (D) Bromide (-ide) gives hydrobromic acid.

- id: apchem-02-acid-formula
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.8"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the formula of phosphoric acid?
  choices:
