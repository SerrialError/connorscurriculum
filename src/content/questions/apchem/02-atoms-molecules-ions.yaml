    - label: d
      points: 1
      prompt: Without calculating, explain why the average atomic mass is close to 52 even though there are isotopes on both sides of it.
      scoring:
        - "About 84% of the atoms are the mass-52 isotope, so the weighted average is pulled very close to its mass; the lighter and heavier isotopes are rare and partly offset each other."
  explanation: |
    **(a)** Four peaks, so four isotopes. They're the same element, so each has the same number of protons, but their masses differ because they have different numbers of neutrons.

    **(b)**

    $$
    (0.0435)(49.95) + (0.8379)(51.94) + (0.0950)(52.94) + (0.0236)(53.94) = 2.17 + 43.52 + 5.03 + 1.27 = 52.00\ \text{amu}
    $$

    That's chromium.

    **(c)** The most abundant isotope is $^{52}\text{Cr}$. Chromium's atomic number is 24, so it has $52 - 24 = 28$ neutrons.

    **(d)** A weighted average sits closest to the most abundant isotope. With 84% of the atoms at about 52 amu, the rare isotopes at 50, 53, and 54 can only shift the average slightly, and they pull in opposite directions.

- id: apchem-02-ions-names-frq
  type: frq
  subject: apchem
  chapter: 2
  sections: ["2.7", "2.8"]
  cedTopics: ["1.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Answer the following about ionic compounds.
  parts:
    - label: a
      points: 1
      prompt: Aluminum reacts with oxygen to form an ionic compound. Write the symbols and charges of both ions, and the formula of the compound.
      scoring:
        - "Al³⁺ and O²⁻; Al₂O₃ (2(+3) + 3(−2) = 0)."
    - label: b
      points: 1
      prompt: Explain, using the periodic table, why aluminum forms a 3+ ion and oxygen forms a 2− ion.
      scoring:
        - "Al (group 13) loses its 3 valence electrons and O (group 16) gains 2, so each reaches the same number of electrons as neon (10)."
    - label: c
      points: 1
      prompt: Write the formula of iron(III) sulfate and of ammonium phosphate.
      scoring:
        - "Fe₂(SO₄)₃ and (NH₄)₃PO₄ (both needed)."
    - label: d
      points: 1
      prompt: Name $\ce{CuSO3}$ and $\ce{HClO2}$.
      scoring:
        - "Copper(II) sulfite and chlorous acid (both needed)."
  explanation: |
    **(a)** $\ce{Al^3+}$ and $\ce{O^2-}$. The smallest numbers that balance the charges are 2 Al and 3 O: $\ce{Al2O3}$.

    **(b)** Main-group elements tend to lose or gain electrons until they have the same number as the nearest noble gas. Al has 13 electrons and loses 3 to have 10; O has 8 and gains 2 to have 10. Both match neon.

    **(c)** Iron(III) is $\ce{Fe^3+}$ and sulfate is $\ce{SO4^2-}$: $\ce{Fe2(SO4)3}$. Ammonium is $\ce{NH4+}$ and phosphate is $\ce{PO4^3-}$: $\ce{(NH4)3PO4}$.

    **(d)** $\ce{SO3^2-}$ is sulfite, so Cu must be +2: copper(II) sulfite. $\ce{ClO2-}$ is chlorite, and an -ite anion gives an -ous acid: chlorous acid.

- id: apchem-02-atomic-history-frq
  type: frq
  subject: apchem
  chapter: 2
  sections: ["2.1", "2.2", "2.3"]
  cedTopics: ["1.3", "1.5"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Copper forms two oxides. Oxide A is 88.82% Cu by mass and oxide B is 79.89% Cu by mass.
  parts:
    - label: a
      points: 1
      prompt: For each oxide, calculate the mass of oxygen combined with 1.000 g of copper.
      scoring:
        - "A: 11.18/88.82 = 0.1259 g O per g Cu; B: 20.11/79.89 = 0.2517 g O per g Cu."
    - label: b
      points: 1
      prompt: Show that these data agree with the law of multiple proportions.
      scoring:
        - "0.2517/0.1259 = 2.00, a ratio of small whole numbers (2 : 1)."
    - label: c
      points: 1
      prompt: Which part of Dalton's atomic theory explains the result in (b)?
      scoring:
        - "Atoms combine in whole-number ratios (and are not divided), so the compounds differ by whole O atoms per Cu atom."
    - label: d
      points: 1
      prompt: Oxide B contains $\ce{Cu^2+}$ ions. Write the formulas of oxides A and B and name them.
      scoring:
        - "A is Cu₂O, copper(I) oxide; B is CuO, copper(II) oxide."
  explanation: |
    **(a)** In 100 g of A there are 88.82 g Cu and 11.18 g O, so $11.18 / 88.82 = 0.1259$ g O per gram of Cu. For B: $20.11 / 79.89 = 0.2517$ g O per gram of Cu.

    **(b)** $0.2517 / 0.1259 = 2.00$. With the copper mass fixed, the oxygen masses are in a 2 : 1 ratio, small whole numbers.

    **(c)** Dalton's postulate that compounds form from whole atoms in whole-number ratios. B has twice as many O atoms per Cu atom as A.

    **(d)** If B has $\ce{Cu^2+}$ and $\ce{O^2-}$, it's CuO, copper(II) oxide. A has half as much O per Cu: $\ce{Cu2O}$, which contains $\ce{Cu+}$, so it's copper(I) oxide. (Check: $2(63.55) / 143.10 = 88.82\%$ Cu.)
