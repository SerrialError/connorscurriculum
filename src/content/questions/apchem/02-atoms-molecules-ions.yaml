    - { id: b, text: "HPO₄" }
    - { id: c, text: "H₃P" }
    - { id: d, text: "H₃PO₄" }
  answer: d
  explanation: |
    -ic acids come from -ate anions. Phosphate is $\ce{PO4^3-}$, so three H are needed: $\ce{H3PO4}$. (A) is phosphorous acid, from phosphite.

- id: apchem-02-binary-molecular
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.8"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the name of $\ce{N2O5}$?
  choices:
    - { id: a, text: "Nitrogen oxide" }
    - { id: b, text: "Nitrogen(V) oxide" }
    - { id: c, text: "Dinitrogen pentoxide" }
    - { id: d, text: "Dinitride pentoxide" }
  answer: c
  explanation: |
    Two nonmetals: use Greek prefixes. Di- for 2 N, penta- for 5 O, with the a dropped before "oxide." (B) uses the ionic system. (D) gives the first element an -ide ending.

- id: apchem-02-molecular-formula-from-name
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.8"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the formula of sulfur hexafluoride?
  choices:
    - { id: a, text: "S₆F" }
    - { id: b, text: "SF₆" }
    - { id: c, text: "SF₂" }
    - { id: d, text: "S₂F₆" }
  answer: b
  explanation: |
    Hexa- means 6, on fluorine. No prefix on sulfur means one: $\ce{SF6}$.

- id: apchem-02-naming-error
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.8"]
  cedTopics: ["1.8"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Which name is **incorrect** for the formula given?
  choices:
    - { id: a, text: "CuCl, copper(I) chloride" }
    - { id: b, text: "(NH₄)₂Cr₂O₇, ammonium dichromate" }
    - { id: c, text: "P₄O₁₀, tetraphosphorus decoxide" }
    - { id: d, text: "MgCl₂, magnesium dichloride" }
  answer: d
  explanation: |
    $\ce{MgCl2}$ is ionic (a metal and a nonmetal), so it gets no prefixes, and magnesium has only one charge, so no Roman numeral: magnesium chloride.
    The others are right: Cu is +1 in CuCl; dichromate is $\ce{Cr2O7^2-}$ ("di" here is part of the ion's name); $\ce{P4O10}$ is molecular and takes prefixes.

- id: apchem-02-hydrate-name
