- id: apchem-02-ion-charge-group
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.7"]
  cedTopics: ["1.8"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What ion does selenium (group 16) most commonly form?
  choices:
    - { id: a, text: "Se²⁻" }
    - { id: b, text: "Se⁶⁺" }
    - { id: c, text: "Se²⁺" }
    - { id: d, text: "Se⁻" }
  answer: a
  explanation: |
    Group 16 nonmetals gain 2 electrons to reach the electron count of the next noble gas (Kr for Se), forming 2− ions like $\ce{O^2-}$ and $\ce{S^2-}$.

- id: apchem-02-formula-ca-n
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.7"]
  cedTopics: ["1.8"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the formula of the ionic compound formed by calcium and nitrogen?
  choices:
    - { id: a, text: "CaN" }
    - { id: b, text: "Ca₂N₃" }
    - { id: c, text: "CaN₂" }
    - { id: d, text: "Ca₃N₂" }
  answer: d
  explanation: |
    The ions are $\ce{Ca^2+}$ and $\ce{N^3-}$. Three calcium ions (+6) balance two nitride ions (−6): $\ce{Ca3N2}$. (B) swaps the subscripts.

- id: apchem-02-formula-al-sulfate
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.7"]
  cedTopics: ["1.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which formula is **written correctly**?
  choices:
    - { id: a, text: "Al₂SO₄₃" }
    - { id: b, text: "Al₃(SO₄)₂" }
    - { id: c, text: "Al₂(SO₄)₃" }
    - { id: d, text: "AlSO₄" }
  answer: c
  explanation: |
    $\ce{Al^3+}$ and $\ce{SO4^2-}$: $2(+3) = +6$ and $3(-2) = -6$. The sulfate needs parentheses because it takes a subscript. (A) has the right numbers but no parentheses, which would mean 43 oxygen atoms. (B) has unbalanced charge. (D) has a net +1 charge.

- id: apchem-02-same-pattern
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.7"]
  cedTopics: ["1.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Strontium forms $\ce{SrCl2}$ with chlorine. Which formula is most likely correct for the compound of barium and bromine?
  choices:
    - { id: a, text: "BaBr" }
    - { id: b, text: "BaBr₂" }
    - { id: c, text: "Ba₂Br" }
    - { id: d, text: "BaBr₃" }
  answer: b
  explanation: |
    Ba is in the same group as Sr (group 2, 2+ ions), and Br is in the same group as Cl (group 17, 1− ions). Elements in the same group form compounds with the same formula pattern: $\ce{MX2}$.

- id: apchem-02-isoelectronic-set
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.7"]
  cedTopics: ["1.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which set contains species that all have the **same number of electrons**?
  choices:
    - { id: a, text: "Na⁺, K⁺, Rb⁺" }
    - { id: b, text: "Cl⁻, Ar, K⁺" }
    - { id: c, text: "F⁻, Cl⁻, Br⁻" }
    - { id: d, text: "O²⁻, S²⁻, Ne" }
  answer: b
  explanation: |
    $\ce{Cl-}$ ($17 + 1$), Ar (18), and $\ce{K+}$ ($19 - 1$) all have 18 electrons. The ions in (A) and (C) are in the same group, so they have different numbers of electrons. In (D), $\ce{S^2-}$ has 18 while the others have 10.

- id: apchem-02-polyatomic-charge
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.7", "2.8"]
  cedTopics: ["1.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    The formula of sodium arsenate is $\ce{Na3AsO4}$. What is the formula of calcium arsenate?
  choices:
    - { id: a, text: "CaAsO₄" }
    - { id: b, text: "Ca₂(AsO₄)₃" }
    - { id: c, text: "Ca₃AsO₄" }
    - { id: d, text: "Ca₃(AsO₄)₂" }
  answer: d
  explanation: |
    Three $\ce{Na+}$ balance one arsenate, so arsenate is $\ce{AsO4^3-}$. With $\ce{Ca^2+}$: $3(+2) = +6$ and $2(-3) = -6$, so $\ce{Ca3(AsO4)2}$, the same pattern as calcium phosphate.

- id: apchem-02-atoms-in-formula
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.7"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    How many oxygen atoms are in one formula unit of $\ce{Ca3(PO4)2}$?
  choices:
    - { id: a, text: "4" }
    - { id: b, text: "6" }
    - { id: c, text: "8" }
    - { id: d, text: "12" }
  answer: c
  explanation: |
    Each phosphate has 4 O, and the subscript 2 outside the parentheses gives 2 phosphates: $4 \times 2 = 8$. (D) multiplies by the 3 on calcium instead.

- id: apchem-02-ionic-solid-units
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.7"]
  cedTopics: ["1.8"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    A student describes solid potassium sulfide as "a collection of $\ce{K2S}$ molecules." Which correction is best?
  choices:
    - { id: a, text: "It is a collection of K₂S molecules, but they are held together by ionic bonds" }
    - { id: b, text: "It is a mixture of K atoms and S atoms in a 2 : 1 ratio" }
    - { id: c, text: "It is a collection of KS molecules, and the 2 is only the charge" }
    - { id: d, text: "It is a lattice of K⁺ and S²⁻ ions, and K₂S gives their 2 : 1 ratio" }
  answer: d
  explanation: |
    Ionic compounds aren't made of discrete molecules. Each $\ce{K+}$ is surrounded by $\ce{S^2-}$ ions and vice versa in a continuous lattice, and the formula unit $\ce{K2S}$ gives the ratio that makes it neutral.
    (A) keeps the idea of molecules. (B) says atoms instead of ions and calls it a mixture. (C) confuses a subscript with a charge.

