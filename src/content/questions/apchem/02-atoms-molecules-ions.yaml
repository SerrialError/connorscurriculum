- id: apchem-02-cathode-ray
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.2"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Cathode rays bend toward a positively charged plate, and they are the same no matter what metal the cathode is made of. What do these observations show?
  choices:
    - { id: a, text: "Atoms have a small, dense nucleus at the center that holds most of their mass" }
    - { id: b, text: "Cathode rays are a form of light with no mass or charge" }
    - { id: c, text: "Different metals give off different kinds of electrons when they are heated" }
    - { id: d, text: "All atoms contain the same kind of negatively charged particle" }
  answer: d
  explanation: |
    Bending toward the positive plate shows the rays are negative. Getting the same particles from every metal shows they're part of all atoms: electrons.
    (A) came from the gold-foil experiment. (B) is ruled out by the bending. (C) contradicts the second observation.

- id: apchem-02-millikan
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.2"]
  cedTopics: []
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    In an oil-drop experiment, a student measures these charges on four drops (in units of $10^{-19}$ C): 4.8, 8.0, 3.2, 11.2. Which is the most likely charge on one electron, based only on these data?
  choices:
    - { id: a, text: "0.80 × 10⁻¹⁹ C" }
    - { id: b, text: "1.6 × 10⁻¹⁹ C" }
    - { id: c, text: "3.2 × 10⁻¹⁹ C" }
    - { id: d, text: "6.8 × 10⁻¹⁹ C" }
  answer: b
  explanation: |
    Every drop's charge should be a whole-number multiple of the electron's charge. 1.6 divides all four: 3, 5, 2, and 7 electrons. 3.2 (C) doesn't divide 4.8 or 11.2 evenly. 0.80 (A) also divides them, but it's not the **largest** common factor, and no drop shows an odd multiple of 0.80, so there's no evidence for it. (D) is the average.

- id: apchem-02-gold-foil
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.2"]
  cedTopics: ["1.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In the gold-foil experiment, most alpha particles passed straight through the foil. What did this show?
  choices:
    - { id: a, text: "Gold atoms have no electrons" }
    - { id: b, text: "Alpha particles have no charge" }
    - { id: c, text: "An atom is mostly empty space" }
    - { id: d, text: "Gold atoms are positively charged" }
  answer: c
  explanation: |
    If the alpha particles met nothing that could deflect them, most of each atom's volume must be nearly empty. The few large deflections showed the mass and positive charge are concentrated in a tiny nucleus.

- id: apchem-02-gold-foil-deflect
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.2"]
  cedTopics: ["1.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Why did a very small fraction of alpha particles bounce almost straight back from the gold foil?
  choices:
    - { id: a, text: "They hit electrons, which are much heavier than alpha particles" }
    - { id: b, text: "They came close to a tiny region holding most of the atom's mass and all its positive charge" }
    - { id: c, text: "They were attracted by the negative charge that is spread evenly through each gold atom's whole volume" }
    - { id: d, text: "They struck the spaces between atoms and lost their energy there" }
  answer: b
  explanation: |
    An alpha particle (+2, fairly heavy) can only be turned back by something both massive and strongly positive. Since this happened rarely, that region must be tiny: the nucleus.
    (A) is wrong; electrons are about 7000 times lighter than an alpha particle. (C) would attract, not repel, and an even spread of charge can't cause large deflections. (D) doesn't describe anything real.

- id: apchem-02-radiation-types
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.2"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Radiation from a radioactive sample passes between two charged plates. One beam bends slightly toward the negative plate, one bends sharply toward the positive plate, and one goes straight through. Which list matches the beams in that order?
  choices:
    - { id: a, text: "beta, alpha, gamma" }
    - { id: b, text: "gamma, beta, alpha" }
    - { id: c, text: "alpha, gamma, beta" }
    - { id: d, text: "alpha, beta, gamma" }
  answer: d
  explanation: |
    Alpha particles are positive (+2), so they bend toward the negative plate, only slightly because they're heavy. Beta particles are electrons (−1), so they bend sharply toward the positive plate because they're so light. Gamma rays have no charge and go straight.

