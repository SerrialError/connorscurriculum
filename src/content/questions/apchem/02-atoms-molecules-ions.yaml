- id: apchem-02-defines-element
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.3"]
  cedTopics: ["1.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What determines which element an atom is?
  choices:
    - { id: a, text: "The number of neutrons" }
    - { id: b, text: "The number of protons" }
    - { id: c, text: "The mass number" }
    - { id: d, text: "The number of electrons" }
  answer: b
  explanation: |
    The atomic number (protons) defines the element. Neutrons vary between isotopes, and electrons vary between an atom and its ions.

- id: apchem-02-count-cobalt
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.3"]
  cedTopics: ["1.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    How many protons, neutrons, and electrons are in ${}^{59}\text{Co}^{3+}$?
  choices:
    - { id: a, text: "27 p, 32 n, 30 e" }
    - { id: b, text: "27 p, 59 n, 24 e" }
    - { id: c, text: "32 p, 27 n, 29 e" }
    - { id: d, text: "27 p, 32 n, 24 e" }
  answer: d
  explanation: |
    Co is element 27, so 27 protons. Neutrons $= 59 - 27 = 32$. A 3+ charge means 3 fewer electrons than protons: 24.
    (A) adds 3 electrons instead of removing them. (B) uses the mass number as the neutron count.

- id: apchem-02-identify-species
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.3"]
  cedTopics: ["1.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A species has 16 protons, 18 neutrons, and 18 electrons. What is it?
  choices:
    - { id: a, text: "³⁴S²⁻" }
    - { id: b, text: "³⁴Ar" }
    - { id: c, text: "³⁴S²⁺" }
    - { id: d, text: "³⁶Ar²⁻" }
  answer: a
  explanation: |
    16 protons makes it sulfur. Mass number $= 16 + 18 = 34$. Two more electrons than protons gives a 2− charge.
    (B) and (D) pick the element from the electron count (18, argon), but protons decide the element.

- id: apchem-02-isotopes-differ
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.3"]
  cedTopics: ["1.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    $^{35}\text{Cl}$ and $^{37}\text{Cl}$ differ in their number of
  choices:
    - { id: a, text: "protons" }
    - { id: b, text: "electrons" }
    - { id: c, text: "neutrons" }
    - { id: d, text: "valence electrons" }
  answer: c
  explanation: |
    Isotopes have the same number of protons (17 for Cl) and, as neutral atoms, the same electrons. $^{35}\text{Cl}$ has 18 neutrons and $^{37}\text{Cl}$ has 20.

- id: apchem-02-not-isotopes
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.3"]
  cedTopics: ["1.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which pair are isotopes of each other?
  choices:
    - { id: a, text: "⁴⁰Ar and ⁴⁰Ca" }
    - { id: b, text: "¹⁴C and ¹⁴N" }
    - { id: c, text: "O₂ and O₃" }
    - { id: d, text: "²³⁵U and ²³⁸U" }
  answer: d
  explanation: |
    Isotopes are the same element with different mass numbers. Both uranium atoms have 92 protons, with 143 and 146 neutrons.
    (A) and (B) share a mass number but are different elements. (C) are two molecular forms of oxygen (allotropes), not isotopes.

- id: apchem-02-same-electrons
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.3", "2.7"]
  cedTopics: ["1.5", "1.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which species has the **same number of electrons** as an argon atom?
  choices:
    - { id: a, text: "Na⁺" }
    - { id: b, text: "Ca²⁺" }
    - { id: c, text: "Br⁻" }
    - { id: d, text: "Mg²⁺" }
  answer: b
  explanation: |
    Argon has 18 electrons. $\ce{Ca^2+}$ has $20 - 2 = 18$. $\ce{Na+}$ and $\ce{Mg^2+}$ have 10 (like Ne), and $\ce{Br-}$ has 36 (like Kr).

- id: apchem-02-mass-of-electron
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.3"]
  cedTopics: ["1.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Nearly all of an atom's mass is in its nucleus. Why?
  choices:
    - { id: a, text: "Protons and neutrons are each about 1800 times as massive as an electron" }
    - { id: b, text: "The nucleus takes up most of the atom's volume" }
    - { id: c, text: "Electrons have no mass, only charge" }
    - { id: d, text: "Protons and neutrons carry more charge than electrons, and charge adds mass" }
  answer: a
  explanation: |
    A proton or neutron is about 1 amu; an electron is about 1/1836 amu. The nucleus is tiny in volume (B is backward). Electrons do have mass (C), just very little. (D) is false: a proton has the same size of charge as an electron, and a neutron has none.

- id: apchem-02-atom-size-scale
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.3"]
  cedTopics: ["1.5"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A typical atom has a diameter of about 2 Å and its nucleus about $2 \times 10^{-4}$ Å. If the nucleus were enlarged to the size of a 1 cm marble, about how large would the atom be?
  choices:
    - { id: a, text: "1 m across" }
    - { id: b, text: "10 cm across" }
    - { id: c, text: "100 m across" }
    - { id: d, text: "10 km across" }
  answer: c
  explanation: |
    The atom is $2 / (2 \times 10^{-4}) = 10^4$ times wider than the nucleus. Scaling a 1 cm nucleus by $10^4$ gives $10^4$ cm = 100 m, about the size of a football field.

