- id: apchem-02-amu-def
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.4"]
  cedTopics: ["1.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    The atomic mass unit is defined as
  choices:
    - { id: a, text: "the mass of one hydrogen atom" }
    - { id: b, text: "1/12 the mass of one carbon-12 atom" }
    - { id: c, text: "the mass of one proton" }
    - { id: d, text: "1/16 the mass of one oxygen atom, the standard used before carbon" }
  answer: b
  explanation: |
    The scale is set by $^{12}\text{C}$, which is exactly 12 amu. A hydrogen atom is 1.008 amu and a proton is 1.0073 amu, close to 1 but not exactly.

- id: apchem-02-gallium-avg
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.4"]
  cedTopics: ["1.2"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    Gallium has two natural isotopes: $^{69}\text{Ga}$ (68.926 amu, 60.11%) and $^{71}\text{Ga}$ (70.925 amu, 39.89%). What is gallium's atomic weight?
  choices:
    - { id: a, text: "69.72 amu" }
    - { id: b, text: "69.93 amu" }
    - { id: c, text: "70.13 amu" }
    - { id: d, text: "70.00 amu" }
  answer: a
  explanation: |
    $(0.6011)(68.926) + (0.3989)(70.925) = 41.43 + 28.29 = 69.72$ amu.
    (B) is the plain average of the two masses, ignoring abundance. (C) swaps the percentages. The answer must be closer to 69 than 71, since $^{69}\text{Ga}$ is more common.

- id: apchem-02-silicon-avg
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.4"]
  cedTopics: ["1.2"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    Silicon's isotopes are $^{28}\text{Si}$ (27.977 amu, 92.23%), $^{29}\text{Si}$ (28.976 amu, 4.68%), and $^{30}\text{Si}$ (29.974 amu, 3.09%). What is its atomic weight?
  choices:
    - { id: a, text: "28.98 amu" }
    - { id: b, text: "28.00 amu" }
    - { id: c, text: "28.09 amu" }
    - { id: d, text: "28.31 amu" }
  answer: c
  explanation: |
    $(0.9223)(27.977) + (0.0468)(28.976) + (0.0309)(29.974) = 25.803 + 1.356 + 0.926 = 28.09$ amu (the last two terms are good to the thousandths place, but the percents have only 3 significant figures, so report 28.09).
    (A) is the plain average of the three masses. The answer must be just above 27.977, since almost all Si is $^{28}\text{Si}$.

- id: apchem-02-boron-estimate
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.4"]
  cedTopics: ["1.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Boron has two isotopes, $^{10}\text{B}$ and $^{11}\text{B}$, and an atomic weight of 10.81 amu. Which statement is correct?
  choices:
    - { id: a, text: "The two isotopes are about equally common" }
    - { id: b, text: "Most boron atoms have a mass of 10.81 amu" }
    - { id: c, text: "¹⁰B is more abundant than ¹¹B" }
    - { id: d, text: "¹¹B is more abundant than ¹⁰B" }
  answer: d
  explanation: |
    The average (10.81) is much closer to 11 than to 10, so $^{11}\text{B}$ must make up most of the sample (about 80%). No individual atom has the average mass (B).

- id: apchem-02-silver-abundance
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.4"]
  cedTopics: ["1.2"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Silver has two isotopes, $^{107}\text{Ag}$ (106.905 amu) and $^{109}\text{Ag}$ (108.905 amu). Its atomic weight is 107.87 amu. What percent of silver atoms are $^{107}\text{Ag}$?
  choices:
    - { id: a, text: "48.3%" }
    - { id: b, text: "51.8%" }
    - { id: c, text: "50.0%" }
    - { id: d, text: "99.1%" }
  answer: b
  explanation: |
    Let $x$ = fraction of $^{107}\text{Ag}$: $106.905x + 108.905(1 - x) = 107.87$, so $108.905 - 2.000x = 107.87$ and $x = 1.035 / 2.000 = 0.5175$, about **51.8%**.
    (A) is the percent of $^{109}\text{Ag}$. (C) would give an average of exactly 107.905. 107.87 is a little below the midpoint, so $^{107}\text{Ag}$ is slightly more common.

- id: apchem-02-spectrum-identify
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.4"]
  cedTopics: ["1.2"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    The mass spectrum of an element shows two peaks: one at 19.99 amu with relative height 100, and one at 21.99 amu with relative height 10.2. Which element is it?
  choices:
    - { id: a, text: "Fluorine (19.00)" }
    - { id: b, text: "Calcium (40.08)" }
    - { id: c, text: "Sodium (22.99)" }
    - { id: d, text: "Neon (20.18)" }
  answer: d
  explanation: |
    Convert heights to fractions: total $= 110.2$, so $100/110.2 = 0.907$ and $10.2/110.2 = 0.093$.
    Average $= (0.907)(19.99) + (0.093)(21.99) = 18.13 + 2.05 = 20.18$ amu: neon.
    Using the heights as if they were percents of 100 gives $19.99 + 0.102(21.99) = 22.2$, close to sodium (C).

- id: apchem-02-spectrum-reading
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.4"]
  cedTopics: ["1.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In the mass spectrum of a pure element, what does the **number of peaks** tell you?
  choices:
    - { id: a, text: "The number of protons in the nucleus" }
    - { id: b, text: "The number of naturally occurring isotopes" }
    - { id: c, text: "The number of electrons in the atom" }
    - { id: d, text: "The number of neutrons in the most common isotope" }
  answer: b
  explanation: |
    Each isotope has a different mass, so each gives its own peak. The peak's position is the isotope's mass, and its height is the isotope's relative abundance.

- id: apchem-02-spectrum-heaviest
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.4"]
  cedTopics: ["1.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Element X has peaks in its mass spectrum at 63 amu (69%) and 65 amu (31%). A student says, "The average atomic mass of X is 64 amu, because that's halfway between the peaks." What's wrong with this?
  choices:
    - { id: a, text: "Nothing; the average atomic mass is always the midpoint of the peaks" }
    - { id: b, text: "The average should be weighted by abundance, so it is closer to 63 amu" }
    - { id: c, text: "The average should be weighted by abundance, so it is closer to 65 amu" }
    - { id: d, text: "The average atomic mass must be a whole number, so it is 63 amu" }
  answer: b
  explanation: |
    $(0.69)(63) + (0.31)(65) = 63.6$ amu, closer to 63 because that isotope is more common. (This is copper, 63.55.) Average atomic masses are rarely whole numbers (D).

- id: apchem-02-mass-spec-ions
  type: mcq
  subject: apchem
  chapter: 2
  sections: ["2.4"]
  cedTopics: ["1.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    In a mass spectrometer, ions of the same charge pass through a magnetic field. Which ions are deflected the **most**?
  choices:
    - { id: a, text: "The lightest ions" }
    - { id: b, text: "The heaviest ions" }
    - { id: c, text: "The most abundant ions" }
    - { id: d, text: "All ions are deflected equally" }
  answer: a
  explanation: |
    For ions with the same charge and speed, lighter ones are easier to turn, so they bend more. That's how the instrument sorts ions by mass. Abundance (C) sets how many hit the detector, not where.

