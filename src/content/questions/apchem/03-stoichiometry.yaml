- id: apchem-03-percent-n
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.3"]
  cedTopics: ["1.3"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    What is the mass percent of nitrogen in ammonium nitrate, $\ce{NH4NO3}$?
  choices:
    - { id: a, text: "17.50%" }
    - { id: b, text: "22.22%" }
    - { id: c, text: "45.19%" }
    - { id: d, text: "35.00%" }
  answer: d
  explanation: |
    $\ce{NH4NO3}$ has **two** N atoms. Formula weight $= 2(14.01) + 4(1.008) + 3(16.00) = 80.05$. %N $= 28.02 / 80.05 \times 100\% = 35.00\%$.
    (A) counts only one N. (B) is 2 N out of 9 atoms, a count rather than a mass. (C) divides by the mass of the nitrate ion (62.00) instead of the whole compound.

- id: apchem-03-percent-water-hydrate
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.3"]
  cedTopics: ["1.3"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    What percent of the mass of copper(II) sulfate pentahydrate, $\ce{CuSO4.5H2O}$, is water?
  choices:
    - { id: a, text: "7.22%" }
    - { id: b, text: "36.08%" }
    - { id: c, text: "56.44%" }
    - { id: d, text: "10.14%" }
  answer: b
  explanation: |
    $\ce{CuSO4}$: $63.55 + 32.06 + 64.00 = 159.61$. Five waters: $5(18.02) = 90.08$. Total 249.69.
    %water $= 90.08 / 249.69 \times 100\% = 36.08\%$. (A) uses just one water. (C) divides by the mass of $\ce{CuSO4}$ alone.

- id: apchem-03-highest-percent-o
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.3"]
  cedTopics: ["1.3"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which compound has the **highest** mass percent of oxygen?
  choices:
    - { id: a, text: "CO" }
    - { id: b, text: "CO₂" }
    - { id: c, text: "H₂O" }
    - { id: d, text: "H₂O₂" }
  answer: d
  explanation: |
    $\ce{H2O2}$: $32.00/34.02 = 94.1\%$. $\ce{H2O}$: $16.00/18.02 = 88.8\%$. $\ce{CO2}$: $32.00/44.01 = 72.7\%$. CO: $16.00/28.01 = 57.1\%$.
    Hydrogen is so light that the O–H compounds are mostly oxygen by mass, and $\ce{H2O2}$ has the most O per H.

- id: apchem-03-same-percent
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.3", "3.5"]
  cedTopics: ["1.3"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Formaldehyde ($\ce{CH2O}$), acetic acid ($\ce{C2H4O2}$), and glucose ($\ce{C6H12O6}$) are analyzed. Which statement about their compositions is correct?
  choices:
    - { id: a, text: "All three have the same mass percent of each element" }
    - { id: b, text: "Glucose has the highest mass percent of carbon, since it has the most C atoms" }
    - { id: c, text: "Formaldehyde has the highest mass percent of carbon, since it is the smallest" }
    - { id: d, text: "They have the same percents only if equal masses are analyzed" }
  answer: a
  explanation: |
    All three have the empirical formula $\ce{CH2O}$, so the same ratio of atoms and the same mass percents (40.0% C, 6.7% H, 53.3% O). Percent composition can't tell them apart; you also need the molar mass.
    Mass percent doesn't depend on sample size (D).

- id: apchem-03-percent-mass-from-percent
  type: mcq
  subject: apchem
