- id: apchem-03-empirical-ch2
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.3"]
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    A hydrocarbon is 85.6% C and 14.4% H by mass. What is its empirical formula?
  choices:
    - { id: a, text: "CH" }
    - { id: b, text: "C₆H" }
    - { id: c, text: "CH₄" }
    - { id: d, text: "CH₂" }
  answer: d
  explanation: |
    In 100 g: C $85.6 / 12.01 = 7.13$ mol; H $14.4 / 1.008 = 14.3$ mol. Dividing by 7.13 gives 1 : 2.00, so $\ce{CH2}$.
    (B) compares masses (85.6 : 14.4 ≈ 6 : 1) instead of moles.

- id: apchem-03-empirical-so3
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.3"]
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    An oxide of sulfur is 40.0% S by mass. What is its empirical formula?
  choices:
    - { id: a, text: "SO" }
    - { id: b, text: "SO₂" }
    - { id: c, text: "SO₃" }
    - { id: d, text: "S₂O₃" }
  answer: c
  explanation: |
    In 100 g: S $40.0 / 32.06 = 1.25$ mol; O $60.0 / 16.00 = 3.75$ mol. Ratio 1 : 3.00, so $\ce{SO3}$.

- id: apchem-03-empirical-cr2o3
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.3"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A chromium oxide is 68.42% Cr by mass. What is its empirical formula?
  choices:
    - { id: a, text: "CrO" }
    - { id: b, text: "Cr₂O₃" }
    - { id: c, text: "CrO₂" }
    - { id: d, text: "CrO₃" }
  answer: b
  explanation: |
    In 100 g: Cr $68.42 / 52.00 = 1.316$ mol; O $31.58 / 16.00 = 1.974$ mol. Ratio $1.974 / 1.316 = 1.50$, so Cr : O = 1 : 1.5 = 2 : 3. Don't round 1.5 to 1 or 2 (A, C).

- id: apchem-03-molecular-c4h10
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.3"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A compound has the empirical formula $\ce{C2H5}$ and a molar mass of 58.12 g/mol. What is its molecular formula?
  choices:
    - { id: a, text: "C₂H₅" }
    - { id: b, text: "C₃H₇" }
    - { id: c, text: "C₄H₁₀" }
    - { id: d, text: "C₆H₁₅" }
  answer: c
  explanation: |
    Empirical formula mass $= 2(12.01) + 5(1.008) = 29.06$. $58.12 / 29.06 = 2$, so the molecular formula is $(\ce{C2H5})_2 = \ce{C4H10}$ (butane).

- id: apchem-03-molecular-benzene
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.3"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A compound is 92.3% C and 7.7% H by mass, and its molar mass is about 78 g/mol. What is its molecular formula?
  choices:
    - { id: a, text: "C₆H₆" }
    - { id: b, text: "CH" }
    - { id: c, text: "C₂H₂" }
    - { id: d, text: "C₆H₁₂" }
  answer: a
  explanation: |
    In 100 g: C $92.3 / 12.01 = 7.69$ mol; H $7.7 / 1.008 = 7.6$ mol. Ratio 1 : 1, so the empirical formula is CH (13.02 g/mol). $78 / 13.02 = 6$, so $\ce{C6H6}$ (benzene). (B) and (C) have the right ratio but the wrong molar mass.

- id: apchem-03-combustion-hydrocarbon
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.3"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A hydrocarbon burns completely to give 3.30 g of $\ce{CO2}$ and 1.35 g of $\ce{H2O}$. What is its empirical formula?
  choices:
    - { id: a, text: "CH" }
    - { id: b, text: "CH₄" }
    - { id: c, text: "CH₃" }
    - { id: d, text: "CH₂" }
  answer: d
  explanation: |
    mol C = mol $\ce{CO2}$ $= 3.30 / 44.01 = 0.0750$.
    mol H = 2 × mol $\ce{H2O}$ $= 2(1.35 / 18.02) = 2(0.0749) = 0.150$.
    Ratio 0.0750 : 0.150 = 1 : 2, so $\ce{CH2}$. Forgetting to double the water gives CH (A).

- id: apchem-03-combustion-cho
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.3"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A 1.000 g sample of a compound containing only C, H, and O burns completely to give 1.466 g of $\ce{CO2}$ and 0.600 g of $\ce{H2O}$. What is its empirical formula?
  choices:
    - { id: a, text: "CH₂" }
    - { id: b, text: "CH₂O" }
    - { id: c, text: "CHO" }
    - { id: d, text: "C₂H₄O" }
  answer: b
  explanation: |
    C: $1.466 / 44.01 = 0.03331$ mol, which is $0.4001$ g.
    H: $2(0.600 / 18.02) = 0.06659$ mol, which is $0.06712$ g.
    O by subtraction: $1.000 - 0.4001 - 0.0671 = 0.5328$ g, or $0.5328 / 16.00 = 0.03330$ mol.
    Ratio C : H : O $= 1 : 2 : 1$, so $\ce{CH2O}$. (A) ignores the oxygen; (C) forgets to double the moles of water.

- id: apchem-03-hydrate-bacl2
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.3"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A 5.00 g sample of $\ce{BaCl2.xH2O}$ is heated until all the water is driven off, leaving 4.26 g of $\ce{BaCl2}$. What is $x$?
  choices:
    - { id: a, text: "1" }
    - { id: b, text: "4" }
    - { id: c, text: "6" }
    - { id: d, text: "2" }
  answer: d
  explanation: |
    Water lost $= 5.00 - 4.26 = 0.74$ g, or $0.74 / 18.02 = 0.041$ mol.
    $\ce{BaCl2}$: $4.26 / 208.23 = 0.0205$ mol.
    Ratio $0.041 / 0.0205 = 2.0$, so $\ce{BaCl2.2H2O}$.

- id: apchem-03-hydrate-error
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.3"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    In a hydrate experiment, a student stops heating before all the water has been driven off. How does this affect the calculated value of $x$ in $\ce{MgSO4.xH2O}$?
  choices:
    - { id: a, text: "Too high, because the remaining solid is heavier than it should be" }
    - { id: b, text: "Too low, because the mass of water lost is smaller than the true value" }
    - { id: c, text: "Too high, because the moles of MgSO₄ calculated are too small" }
    - { id: d, text: "No effect, because x only depends on the formula of the hydrate" }
  answer: b
  explanation: |
    Less water is lost, so the measured water mass and moles are too small. The leftover solid is heavier, so the calculated moles of $\ce{MgSO4}$ are too **large**. Both errors make the water : $\ce{MgSO4}$ ratio, $x$, too low.

- id: apchem-03-mixture-percent
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.4"]
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    A 10.00 g mixture of sand and salt is stirred into water and filtered. After drying, the sand on the filter paper has a mass of 3.62 g. What is the mass percent of salt in the mixture?
  choices:
    - { id: a, text: "36.2%" }
    - { id: b, text: "63.8%" }
    - { id: c, text: "56.7%" }
    - { id: d, text: "176%" }
  answer: b
  explanation: |
    Salt $= 10.00 - 3.62 = 6.38$ g, and $6.38 / 10.00 \times 100\% = 63.8\%$. (A) is the sand. (C) is sand ÷ salt and (D) is salt ÷ sand. Mass percent always divides by the **total** mass.

- id: apchem-03-impurity-direction
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A sample of KCl (47.55% Cl) is contaminated with a small amount of NaCl (60.66% Cl). How does the measured mass percent of chlorine compare with that of pure KCl?
  choices:
    - { id: a, text: "It is higher, because NaCl has a higher mass percent of Cl than KCl" }
    - { id: b, text: "It is lower, because the sample contains less KCl" }
    - { id: c, text: "It is the same, because both compounds contain one Cl per formula" }
    - { id: d, text: "It is lower, because sodium atoms are lighter than potassium atoms" }
  answer: a
  explanation: |
    The mixture's percent lies between the two pure values. Mixing in NaCl, which is richer in Cl by mass, pulls the result above 47.55%.
    (C) confuses atom ratios with mass percents. (D) has the right fact (Na is lighter) but the wrong conclusion: a lighter cation makes Cl a **larger** share of the mass.

- id: apchem-03-impurity-identify
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.4"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    A sample labeled "pure $\ce{CaCO3}$" (40.04% Ca) is found to be 42.5% Ca by mass. Which single impurity could explain this result?
  choices:
    - { id: a, text: "MgCO₃" }
    - { id: b, text: "CaSO₄" }
    - { id: c, text: "CaO" }
    - { id: d, text: "SiO₂ (sand)" }
  answer: c
  explanation: |
    The measured percent is **higher** than pure $\ce{CaCO3}$, so the impurity must have a higher percent of Ca. CaO is $40.08/56.08 = 71.5\%$ Ca.
    $\ce{MgCO3}$ and $\ce{SiO2}$ have no Ca, and $\ce{CaSO4}$ is only 29.4% Ca, so each would lower the result.

- id: apchem-03-mixture-calc
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.5"]
  cedTopics: ["1.4"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A mixture contains only NaCl (60.66% Cl) and $\ce{NaNO3}$ (no Cl). Elemental analysis shows the mixture is 30.0% Cl by mass. What is the mass percent of NaCl in the mixture?
  choices:
    - { id: a, text: "30.0%" }
    - { id: b, text: "18.2%" }
    - { id: c, text: "60.7%" }
    - { id: d, text: "49.5%" }
  answer: d
  explanation: |
    All the Cl comes from NaCl. In 100 g of mixture there are 30.0 g Cl, which requires $30.0 / 0.6066 = 49.5$ g NaCl. So the mixture is 49.5% NaCl.
    (B) multiplies $30.0 \times 0.6066$. (A) assumes the Cl percent equals the NaCl percent.

