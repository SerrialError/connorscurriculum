- id: apchem-03-mass-one-molecule
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.4"]
  cedTopics: ["1.1"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    What is the mass of a single water molecule, in grams?
  choices:
    - { id: a, text: "18.02 g" }
    - { id: b, text: "1.085 × 10²⁵ g" }
    - { id: c, text: "2.992 × 10⁻²³ g" }
    - { id: d, text: "1.661 × 10⁻²⁴ g" }
  answer: c
  explanation: |
    One mole has a mass of 18.02 g and contains $6.022 \times 10^{23}$ molecules: $18.02 / (6.022 \times 10^{23}) = 2.992 \times 10^{-23}$ g.
    (A) is the mass of a mole. (B) multiplies instead of dividing. (D) is the mass of 1 amu.

- id: apchem-03-equal-mass-molecules
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.4"]
  cedTopics: ["1.1"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which 10.0 g sample contains the **most molecules**?
  choices:
    - { id: a, text: "H₂" }
    - { id: b, text: "N₂" }
    - { id: c, text: "O₂" }
    - { id: d, text: "CO₂" }
  answer: a
  explanation: |
    For equal masses, the substance with the smallest molar mass has the most moles, and so the most molecules. $\ce{H2}$ (2.016 g/mol) has about 5 mol in 10.0 g; $\ce{CO2}$ has only 0.23 mol.

- id: apchem-03-equal-mass-atoms
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.4"]
  cedTopics: ["1.1"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Which 1.00 g sample contains the **most atoms**?
  choices:
    - { id: a, text: "He" }
    - { id: b, text: "Ne" }
    - { id: c, text: "H₂O" }
    - { id: d, text: "CH₄" }
  answer: d
  explanation: |
    Moles of atoms = (mass ÷ molar mass) × atoms per formula:

    - He: $1.00 / 4.00 \times 1 = 0.250$
    - Ne: $1.00 / 20.18 \times 1 = 0.0496$
    - $\ce{H2O}$: $1.00 / 18.02 \times 3 = 0.166$
    - $\ce{CH4}$: $1.00 / 16.04 \times 5 = 0.312$

    $\ce{CH4}$ has the most atoms. He has the most **particles**, but each methane molecule brings five atoms.

- id: apchem-03-ions-in-alcl3
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.4"]
  cedTopics: ["1.1"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    How many moles of chloride ions are in 0.40 mol of aluminum chloride, $\ce{AlCl3}$?
  choices:
    - { id: a, text: "0.13 mol" }
    - { id: b, text: "0.40 mol" }
    - { id: c, text: "1.2 mol" }
    - { id: d, text: "1.6 mol" }
  answer: c
  explanation: |
    Each formula unit contains 3 $\ce{Cl-}$ ions, so $0.40 \times 3 = 1.2$ mol $\ce{Cl-}$. (D) counts all 4 ions (Al³⁺ too). (A) divides by 3.

- id: apchem-03-amu-to-grams
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.4"]
  cedTopics: ["1.1"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    The average mass of one ethanol molecule is 46.07 amu. What is the mass of one **mole** of ethanol?
  choices:
    - { id: a, text: "46.07 g" }
    - { id: b, text: "7.650 × 10⁻²³ g" }
    - { id: c, text: "2.774 × 10²⁵ g" }
    - { id: d, text: "46.07 amu" }
  answer: a
  explanation: |
    The mass of one particle in amu has the same number as the mass of one mole in grams. That's why Avogadro's number has the value it does.
    (B) is the mass of one molecule in grams. (D) is the mass of one molecule, not a mole.

