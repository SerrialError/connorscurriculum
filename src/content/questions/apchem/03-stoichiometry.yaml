- id: apchem-03-balance-iron-oxide
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.1"]
  cedTopics: ["4.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    When $\ce{Fe + O2 -> Fe2O3}$ is balanced with the smallest whole-number coefficients, what is the **sum** of the coefficients?
  choices:
    - { id: a, text: "4" }
    - { id: b, text: "6" }
    - { id: c, text: "9" }
    - { id: d, text: "12" }
  answer: c
  explanation: |
    $\ce{4Fe + 3O2 -> 2Fe2O3}$: Fe 4 = 4, O 6 = 6. The sum is $4 + 3 + 2 = 9$.

- id: apchem-03-balance-butane
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.1"]
  cedTopics: ["4.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    When the combustion of butane, $\ce{C4H10 + O2 -> CO2 + H2O}$, is balanced with the smallest whole-number coefficients, what is the coefficient of $\ce{O2}$?
  choices:
    - { id: a, text: "13" }
    - { id: b, text: "6.5" }
    - { id: c, text: "9" }
    - { id: d, text: "26" }
  answer: a
  explanation: |
    For one $\ce{C4H10}$: 4 $\ce{CO2}$ and 5 $\ce{H2O}$, which need $8 + 5 = 13$ O atoms, or 6.5 $\ce{O2}$. Doubling everything to clear the fraction: $\ce{2C4H10 + 13O2 -> 8CO2 + 10H2O}$.
    (B) isn't a whole number. (D) doubles twice.

- id: apchem-03-balance-al-hcl
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.1"]
  cedTopics: ["4.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Balance $\ce{Al(s) + HCl(aq) -> AlCl3(aq) + H2(g)}$ with the smallest whole numbers. What is the coefficient of $\ce{H2}$?
  choices:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "6" }
    - { id: d, text: "3" }
  answer: d
  explanation: |
    $\ce{AlCl3}$ needs 3 Cl, and $\ce{H2}$ needs H in pairs. Two $\ce{AlCl3}$ use 6 HCl, which releases 6 H, or 3 $\ce{H2}$: $\ce{2Al + 6HCl -> 2AlCl3 + 3H2}$.

- id: apchem-03-balance-nh3-o2
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.1"]
  cedTopics: ["4.2"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Balance $\ce{NH3(g) + O2(g) -> NO(g) + H2O(g)}$ with the smallest whole numbers. What is the coefficient of $\ce{O2}$?
  choices:
    - { id: a, text: "3" }
    - { id: b, text: "5" }
    - { id: c, text: "7" }
    - { id: d, text: "4" }
  answer: b
  explanation: |
    Start with 2 $\ce{NH3}$ (6 H, so 3 $\ce{H2O}$) and 2 NO. O on the right: $2 + 3 = 5$, so $\tfrac{5}{2}\ \ce{O2}$. Double: $\ce{4NH3 + 5O2 -> 4NO + 6H2O}$. Check: N 4 = 4, H 12 = 12, O 10 = 10.

- id: apchem-03-subscript-change
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.1"]
  cedTopics: ["4.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    A student "balances" $\ce{H2 + O2 -> H2O}$ by writing $\ce{H2 + O2 -> H2O2}$. Why is this wrong?
  choices:
    - { id: a, text: "Hydrogen peroxide can't exist as a stable compound at room temperature" }
    - { id: b, text: "Changing a subscript changes the product into a different substance" }
    - { id: c, text: "Equations must have more product molecules than reactant molecules" }
    - { id: d, text: "Oxygen must always appear as single O atoms in an equation" }
  answer: b
  explanation: |
    The equation is balanced, but it now describes making hydrogen peroxide, not water. Balance by changing coefficients only: $\ce{2H2 + O2 -> 2H2O}$.

- id: apchem-03-conserved
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.1"]
  cedTopics: ["4.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    For the balanced reaction $\ce{N2(g) + 3H2(g) -> 2NH3(g)}$, which quantity is the **same** before and after the reaction?
  choices:
    - { id: a, text: "The total number of molecules in the container" }
    - { id: b, text: "The total number of moles of gas" }
    - { id: c, text: "The number of atoms of each element" }
    - { id: d, text: "The number of N–N bonds" }
  answer: c
  explanation: |
    Atoms (and so mass) are conserved. Molecules aren't: 4 molecules (1 + 3) become 2, so (A) and (B) change. The N≡N bond breaks, so (D) changes too.

- id: apchem-03-aq-meaning
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.1"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In a chemical equation, what does **(aq)** after a formula mean?
  choices:
    - { id: a, text: "The substance is a liquid" }
    - { id: b, text: "The substance is an acid" }
    - { id: c, text: "The substance is a gas dissolved in air" }
    - { id: d, text: "The substance is dissolved in water" }
  answer: d
  explanation: |
    "Aqueous" means dissolved in water. A pure liquid is (l). Plenty of aqueous substances aren't acids, like NaCl(aq).

- id: apchem-03-particle-equation
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.1"]
  cedTopics: ["4.3"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A "before" diagram shows 4 $\ce{A2}$ molecules and 4 $\ce{B2}$ molecules. The "after" diagram shows 8 AB molecules and nothing else. Which balanced equation matches?
  choices:
    - { id: a, text: '$\ce{A2 + B2 -> 2AB}$' }
    - { id: b, text: '$\ce{4A2 + 4B2 -> 8AB}$' }
    - { id: c, text: '$\ce{A + B -> AB}$' }
    - { id: d, text: '$\ce{2A2 + B2 -> 2A2B}$' }
  answer: a
  explanation: |
    The ratio 4 : 4 : 8 reduces to 1 : 1 : 2. (B) is balanced but not in lowest terms. (C) uses single atoms, which aren't in the diagram. (D) makes a product that isn't there.

