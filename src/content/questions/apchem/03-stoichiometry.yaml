  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    For $\ce{N2(g) + 3H2(g) -> 2NH3(g)}$, how many moles of $\ce{NH3}$ can form from 4.5 mol of $\ce{H2}$ (with plenty of $\ce{N2}$)?
  choices:
    - { id: a, text: "1.5 mol" }
    - { id: b, text: "6.8 mol" }
    - { id: c, text: "3.0 mol" }
    - { id: d, text: "9.0 mol" }
  answer: c
  explanation: |
    $4.5\ \text{mol H}_2 \times \dfrac{2\ \text{mol NH}_3}{3\ \text{mol H}_2} = 3.0$ mol. (B) flips the ratio. (D) uses 2 : 1.

- id: apchem-03-mass-co2-methane
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.6"]
  cedTopics: ["4.5"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    What mass of $\ce{CO2}$ forms when 25.0 g of methane burns completely? $\ce{CH4 + 2O2 -> CO2 + 2H2O}$
  choices:
    - { id: a, text: "25.0 g" }
    - { id: b, text: "68.6 g" }
    - { id: c, text: "137 g" }
    - { id: d, text: "9.11 g" }
  answer: b
  explanation: |
    $25.0 / 16.04 = 1.559$ mol $\ce{CH4}$ → 1.559 mol $\ce{CO2}$ (1 : 1) → $1.559 \times 44.01 = 68.6$ g.
    (A) assumes mass is the same for each substance. (C) uses the 2 from the $\ce{O2}$ coefficient. (D) uses the two molar masses upside down ($25.0 \times 16.04 / 44.01$).

- id: apchem-03-o2-for-al
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.6"]
  cedTopics: ["4.5"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    What mass of $\ce{O2}$ reacts completely with 10.0 g of aluminum? $\ce{4Al(s) + 3O2(g) -> 2Al2O3(s)}$
  choices:
    - { id: a, text: "8.90 g" }
    - { id: b, text: "11.9 g" }
    - { id: c, text: "15.8 g" }
    - { id: d, text: "4.45 g" }
  answer: a
  explanation: |
    $10.0 / 26.98 = 0.3706$ mol Al. $0.3706 \times \tfrac{3}{4} = 0.2780$ mol $\ce{O2}$. $0.2780 \times 32.00 = 8.90$ g.
    (C) uses 4/3 instead of 3/4. (B) uses a 1 : 1 ratio. (D) uses 16.00 g/mol for $\ce{O2}$ (oxygen atoms instead of molecules).

- id: apchem-03-kclo3-o2
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.6"]
  cedTopics: ["4.5"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    What mass of $\ce{O2}$ is produced when 12.25 g of potassium chlorate decomposes completely? $\ce{2KClO3(s) -> 2KCl(s) + 3O2(g)}$
  choices:
    - { id: a, text: "3.20 g" }
    - { id: b, text: "7.45 g" }
    - { id: c, text: "4.80 g" }
    - { id: d, text: "9.60 g" }
  answer: c
  explanation: |
    $\mathcal{M}(\ce{KClO3}) = 39.10 + 35.45 + 48.00 = 122.55$ g/mol, so $12.25 / 122.55 = 0.1000$ mol.
    $0.1000 \times \tfrac{3}{2} = 0.1500$ mol $\ce{O2}$, or $0.1500 \times 32.00 = 4.80$ g.
    (B) is the mass of KCl formed. (A) uses a 1 : 1 ratio. Check with mass conservation: $12.25 - 7.45 = 4.80$ g.

- id: apchem-03-mole-ratio-meaning
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.6"]
  cedTopics: ["4.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which statement about $\ce{2H2(g) + O2(g) -> 2H2O(g)}$ is correct?
  choices:
    - { id: a, text: "2 g of H₂ reacts with 1 g of O₂ to make 2 g of H₂O" }
    - { id: b, text: "2 mol of H₂ reacts with 1 mol of O₂ to make 2 mol of H₂O" }
    - { id: c, text: "2 L of H₂O forms from every 3 L of gas, so mass is lost" }
    - { id: d, text: "The total number of moles stays the same during the reaction" }
  answer: b
  explanation: |
    Coefficients give mole (or molecule) ratios, not mass ratios (A). Moles of gas go from 3 to 2, so (D) is wrong, but mass is still conserved (C is wrong): 4.03 g of $\ce{H2}$ and 32.00 g of $\ce{O2}$ make 36.03 g of $\ce{H2O}$.

- id: apchem-03-iron-from-oxide
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.6"]
  cedTopics: ["4.5"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    What mass of iron can be made from 50.0 g of $\ce{Fe2O3}$? $\ce{Fe2O3(s) + 3CO(g) -> 2Fe(s) + 3CO2(g)}$
  choices:
    - { id: a, text: "17.5 g" }
    - { id: b, text: "25.0 g" }
    - { id: c, text: "35.0 g" }
    - { id: d, text: "70.0 g" }
  answer: c
  explanation: |
    $50.0 / 159.70 = 0.3131$ mol $\ce{Fe2O3}$, which gives $2 \times 0.3131 = 0.6262$ mol Fe, or $0.6262 \times 55.85 = 35.0$ g. (A) forgets the factor of 2. (D) is more than the oxide's mass, which can't be right.

- id: apchem-03-reactant-needed
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.6"]
  cedTopics: ["4.5"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Ammonia is made by $\ce{N2(g) + 3H2(g) -> 2NH3(g)}$. What mass of $\ce{H2}$ is needed to make 1.00 kg of $\ce{NH3}$?
  choices:
