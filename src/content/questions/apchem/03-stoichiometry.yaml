- id: apchem-03-combustion-frq
  type: frq
  subject: apchem
  chapter: 3
  sections: ["3.1", "3.5"]
  cedTopics: ["1.3", "4.2"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A 0.3000 g sample of a liquid containing only carbon, hydrogen, and oxygen is burned completely in excess oxygen. The products are 0.5994 g of $\ce{CO2}$ and 0.2454 g of $\ce{H2O}$.
  parts:
    - label: a
      points: 1
      prompt: Calculate the mass of carbon in the sample.
      scoring:
        - "0.5994 g CO₂ ÷ 44.01 g/mol = 0.01362 mol C; × 12.01 g/mol = 0.1636 g C."
    - label: b
      points: 1
      prompt: Calculate the mass of hydrogen in the sample.
      scoring:
        - "0.2454 g H₂O ÷ 18.02 g/mol = 0.01362 mol H₂O; × 2 = 0.02724 mol H; × 1.008 = 0.02746 g H."
    - label: c
      points: 1
      prompt: Calculate the mass of oxygen in the sample, and explain why it can't be found from the masses of the products directly.
      scoring:
        - "0.3000 − 0.1636 − 0.0275 = 0.1089 g O; the O in the products also came from the O₂ added, so the sample's O must be found by subtraction."
    - label: d
      points: 1
      prompt: Determine the empirical formula of the compound.
      scoring:
        - "Moles C : H : O = 0.01362 : 0.02724 : 0.006806 = 2 : 4 : 1, so C₂H₄O."
    - label: e
      points: 1
      prompt: The molar mass of the compound is 88.1 g/mol. Determine its molecular formula.
      scoring:
        - "Empirical formula mass = 44.05 g/mol; 88.1 / 44.05 = 2, so C₄H₈O₂."
    - label: f
      points: 1
      prompt: Write the balanced equation for the complete combustion of the compound.
      scoring:
        - "C₄H₈O₂ + 5 O₂ → 4 CO₂ + 4 H₂O."
  explanation: |
    **(a)** Every C atom ends up in $\ce{CO2}$: $0.5994 / 44.01 = 0.01362$ mol C, and $0.01362 \times 12.01 = 0.1636$ g C.

    **(b)** Every H ends up in $\ce{H2O}$, two per molecule: $0.2454 / 18.02 = 0.01362$ mol $\ce{H2O}$, so $0.02724$ mol H, and $0.02724 \times 1.008 = 0.02746$ g H.

    **(c)** $0.3000 - 0.1636 - 0.0275 = 0.1089$ g O. Some of the oxygen in $\ce{CO2}$ and $\ce{H2O}$ came from the $\ce{O2}$ the sample burned in, so the products' oxygen doesn't tell you how much was in the sample.

    **(d)** $0.1089 / 16.00 = 0.006806$ mol O. Dividing by 0.006806: C 2.00, H 4.00, O 1.00. Empirical formula $\ce{C2H4O}$.

    **(e)** $\ce{C2H4O}$ has a formula mass of $2(12.01) + 4(1.008) + 16.00 = 44.05$. $88.1 / 44.05 = 2.00$, so the molecular formula is $\ce{C4H8O2}$.

    **(f)** 4 $\ce{CO2}$ and 4 $\ce{H2O}$ need $8 + 4 = 12$ O atoms. The compound supplies 2, so $\ce{O2}$ supplies 10, which is 5 $\ce{O2}$:

    $$
    \ce{C4H8O2 + 5O2 -> 4CO2 + 4H2O}
    $$

- id: apchem-03-limiting-frq
  type: frq
  subject: apchem
  chapter: 3
  sections: ["3.6", "3.7"]
  cedTopics: ["4.5"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Nitrogen monoxide is made industrially by the reaction

    $$
    \ce{4NH3(g) + 5O2(g) -> 4NO(g) + 6H2O(g)}
    $$

    A reactor is loaded with 34.0 g of $\ce{NH3}$ and 64.0 g of $\ce{O2}$.
  parts:
    - label: a
      points: 1
      prompt: Calculate the number of moles of each reactant.
      scoring:
        - "NH₃: 34.0 / 17.03 = 2.00 mol; O₂: 64.0 / 32.00 = 2.00 mol."
    - label: b
      points: 1
      prompt: Identify the limiting reactant. Justify your answer with a calculation.
      scoring:
        - "O₂ is limiting: 2.00 mol NH₃ would need 2.00 × 5/4 = 2.50 mol O₂, but only 2.00 mol is present (or: O₂ gives 1.60 mol NO vs. 2.00 mol from NH₃)."
    - label: c
      points: 1
      prompt: Calculate the theoretical yield of NO in grams.
      scoring:
        - "2.00 mol O₂ × 4/5 = 1.60 mol NO × 30.01 g/mol = 48.0 g NO."
    - label: d
      points: 1
      prompt: Calculate the mass of the excess reactant that remains.
      scoring:
        - "NH₃ used = 2.00 × 4/5 = 1.60 mol; left = 2.00 − 1.60 = 0.40 mol × 17.03 = 6.8 g NH₃."
    - label: e
      points: 1
      prompt: The reactor actually produces 40.0 g of NO. Calculate the percent yield.
      scoring:
        - "40.0 / 48.0 × 100% = 83.3%."
  explanation: |
    **(a)** $\ce{NH3}$: $34.0 / 17.03 = 2.00$ mol. $\ce{O2}$: $64.0 / 32.00 = 2.00$ mol.

    **(b)** The reactants are present in equal moles, but the equation needs 5 $\ce{O2}$ for every 4 $\ce{NH3}$. All 2.00 mol of $\ce{NH3}$ would need $2.00 \times \tfrac{5}{4} = 2.50$ mol of $\ce{O2}$, and only 2.00 mol is there. **$\ce{O2}$ is limiting.**

    **(c)** $2.00\ \text{mol O}_2 \times \tfrac{4\ \text{mol NO}}{5\ \text{mol O}_2} = 1.60$ mol NO, and $1.60 \times 30.01 = 48.0$ g.

    **(d)** $\ce{NH3}$ used $= 2.00\ \text{mol O}_2 \times \tfrac{4}{5} = 1.60$ mol. Left over: $2.00 - 1.60 = 0.40$ mol, or $0.40 \times 17.03 = 6.8$ g.

    **(e)** $40.0 / 48.0 \times 100\% = 83.3\%$.

- id: apchem-03-mixture-frq
  type: frq
  subject: apchem
  chapter: 3
  sections: ["3.4", "3.5", "3.6"]
  cedTopics: ["1.1", "1.4", "4.5"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A 2.000 g sample of a mixture of NaCl and $\ce{NaNO3}$ is dissolved in water. Excess silver nitrate is added, which precipitates all the chloride as AgCl:

    $$
    \ce{NaCl(aq) + AgNO3(aq) -> AgCl(s) + NaNO3(aq)}
    $$

    The dried AgCl has a mass of 2.870 g.
  parts:
    - label: a
      points: 1
      prompt: Calculate the number of moles of AgCl formed.
      scoring:
        - "AgCl = 107.87 + 35.45 = 143.32 g/mol; 2.870 / 143.32 = 0.02003 mol."
    - label: b
      points: 1
      prompt: Calculate the mass of NaCl in the original sample.
      scoring:
        - "1 : 1 ratio, so 0.02003 mol NaCl × 58.44 g/mol = 1.170 g NaCl."
    - label: c
      points: 1
      prompt: Calculate the mass percent of NaCl in the mixture.
      scoring:
        - "1.170 / 2.000 × 100% = 58.51%."
    - label: d
      points: 1
      prompt: If the AgCl were weighed before it was completely dry, would the calculated mass percent of NaCl be too high, too low, or unchanged? Explain.
      scoring:
        - "Too high: the water adds mass, so the moles of AgCl, and so the mass of NaCl calculated from them, are too large."
  explanation: |
    **(a)** $\mathcal{M}(\ce{AgCl}) = 107.87 + 35.45 = 143.32$ g/mol. $2.870 / 143.32 = 0.02003$ mol AgCl.

    **(b)** Each NaCl gives one AgCl, so there were 0.02003 mol NaCl: $0.02003 \times 58.44 = 1.170$ g.

    **(c)** $1.170 / 2.000 \times 100\% = 58.51\%$ NaCl. (The rest, 41.49%, is $\ce{NaNO3}$.)

    **(d)** Too high. Leftover water makes the precipitate look heavier, so the calculated moles of AgCl are too large. That gives too much NaCl, and since the 2.000 g sample mass didn't change, the percent comes out too high.
