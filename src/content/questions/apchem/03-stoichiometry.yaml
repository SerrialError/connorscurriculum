- id: apchem-03-classify-decomp
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.2"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What type of reaction is $\ce{2KClO3(s) -> 2KCl(s) + 3O2(g)}$?
  choices:
    - { id: a, text: "Combination" }
    - { id: b, text: "Combustion" }
    - { id: c, text: "Decomposition" }
    - { id: d, text: "Precipitation" }
  answer: c
  explanation: |
    One reactant breaks into two products: decomposition. It produces $\ce{O2}$ but doesn't use it, so it isn't combustion.

- id: apchem-03-combination-product
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.2"]
  cedTopics: ["1.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Lithium metal combines with nitrogen gas. What is the product?
  choices:
