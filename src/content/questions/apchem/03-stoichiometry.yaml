  answer: b
  explanation: |
    A metal and a nonmetal combine into an ionic compound: $\ce{Li+}$ and $\ce{N^3-}$ give $\ce{Li3N}$. Balanced: $\ce{6Li + N2 -> 2Li3N}$.

- id: apchem-03-carbonate-decomp
  type: mcq
