# Practice questions for Chapter 3 (Chemical Reactions and Reaction Stoichiometry). Original; not
# taken from the textbook or College Board materials. Moles are AP topic 1.1, formulas from composition
# 1.3, mixtures 1.4, balanced equations 4.2, particle diagrams 4.3, stoichiometry 4.5, and combustion as
# a redox reaction 4.7. Atomic weights are those on the AP periodic table.
# calculation: true marks questions that need a numeric calculation.

