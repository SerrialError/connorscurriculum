- id: apchem-03-combustion-products
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.2"]
  cedTopics: ["4.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What are the products of the **complete** combustion of isopropyl alcohol, $\ce{C3H7OH}$?
  choices:
    - { id: a, text: "C (soot) and H₂O" }
    - { id: b, text: "CO and H₂" }
    - { id: c, text: "CO₂ and H₂O" }
    - { id: d, text: "CO₂ and H₂" }
  answer: c
  explanation: |
    When a compound of C, H, and O burns completely in oxygen, all the carbon becomes $\ce{CO2}$ and all the hydrogen becomes $\ce{H2O}$. Soot (A) and CO (B) come from incomplete combustion.

- id: apchem-03-combustion-coefficient
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.1", "3.2"]
  cedTopics: ["4.2", "4.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    In the balanced equation for the complete combustion of butanol, $\ce{C4H9OH(l)}$, with the smallest whole-number coefficients, what is the coefficient of $\ce{O2}$?
  choices:
    - { id: a, text: "4" }
    - { id: b, text: "5" }
    - { id: c, text: "13" }
    - { id: d, text: "6" }
  answer: d
  explanation: |
    $\ce{C4H9OH}$ has 4 C and 10 H, so 4 $\ce{CO2}$ and 5 $\ce{H2O}$: $8 + 5 = 13$ O on the right. The butanol supplies 1 O, so $\ce{O2}$ supplies 12, which is 6 $\ce{O2}$:
    $\ce{C4H9OH + 6O2 -> 4CO2 + 5H2O}$.
    (C) forgets the O already in the fuel and counts O atoms instead of $\ce{O2}$ molecules.

- id: apchem-03-combustion-redox
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.2"]
  cedTopics: ["4.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which statement about the combustion of methane, $\ce{CH4 + 2O2 -> CO2 + 2H2O}$, is correct?
  choices:
    - { id: a, text: "It is an oxidation–reduction reaction: carbon loses electrons and oxygen gains them" }
    - { id: b, text: "It is an acid–base reaction, since water is one of the products that form" }
    - { id: c, text: "It is a precipitation reaction, since a new compound forms" }
    - { id: d, text: "It is a decomposition reaction, since methane breaks apart" }
  answer: a
  explanation: |
    Combustion is a type of redox reaction. Carbon goes from −4 in $\ce{CH4}$ to +4 in $\ce{CO2}$ (it loses electrons), and oxygen goes from 0 in $\ce{O2}$ to −2 (it gains them). Oxidation numbers come in Chapter 4.
    (D) is wrong because a decomposition has one reactant, and this has two.

- id: apchem-03-incomplete-combustion
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.2"]
  cedTopics: ["4.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A furnace burning natural gas ($\ce{CH4}$) is starved of air. Which product becomes more likely?
  choices:
    - { id: a, text: "Ozone, O₃" }
    - { id: b, text: "Hydrogen peroxide, H₂O₂" }
    - { id: c, text: "Methanol, CH₃OH" }
    - { id: d, text: "Carbon monoxide, CO" }
  answer: d
  explanation: |
    With too little oxygen, carbon can't be fully oxidized to $\ce{CO2}$, so combustion is incomplete and gives CO (and soot), which is why furnaces need ventilation and CO detectors.

- id: apchem-03-classify-combination
  type: mcq
  subject: apchem
  chapter: 3
