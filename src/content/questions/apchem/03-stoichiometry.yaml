- id: apchem-03-fw-calcium-phosphate
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.3"]
  cedTopics: ["1.1"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    What is the formula weight of calcium phosphate, $\ce{Ca3(PO4)2}$?
  choices:
    - { id: a, text: "135.05 amu" }
    - { id: b, text: "215.21 amu" }
    - { id: c, text: "310.18 amu" }
    - { id: d, text: "246.18 amu" }
  answer: c
  explanation: |
    3 Ca, 2 P, 8 O: $3(40.08) + 2(30.97) + 8(16.00) = 120.24 + 61.94 + 128.00 = 310.18$ amu.
    (A) is one Ca, one P, and four O. (D) counts only 4 O, applying the subscript 2 to P alone. (B) is $\ce{Ca3PO4}$.

- id: apchem-03-mw-sucrose
  type: mcq
