- id: apchem-03-limiting-particles
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.7"]
  cedTopics: ["4.3", "4.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    For the reaction $\ce{X2 + 3Y2 -> 2XY3}$, a container holds 3 $\ce{X2}$ molecules and 6 $\ce{Y2}$ molecules. After the reaction goes as far as it can, what does the container hold?
  choices:
    - { id: a, text: "6 XY₃ molecules and nothing else" }
    - { id: b, text: "2 XY₃ and 1 X₂" }
    - { id: c, text: "6 XY₃ and 3 Y₂" }
    - { id: d, text: "4 XY₃ and 1 X₂" }
  answer: d
  explanation: |
    6 $\ce{Y2}$ react with $6/3 = 2$ $\ce{X2}$, making 4 $\ce{XY3}$. $\ce{Y2}$ runs out (it's limiting) and 1 $\ce{X2}$ is left over. Check atoms: before, 6 X and 12 Y; after, 4 + 2 = 6 X and 12 Y.
    (A) and (C) assume all of the $\ce{X2}$ reacts, which would need 9 $\ce{Y2}$.

- id: apchem-03-limiting-moles
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.7"]
  cedTopics: ["4.5"]
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    4.0 mol of $\ce{H2}$ and 3.0 mol of $\ce{O2}$ react by $\ce{2H2 + O2 -> 2H2O}$. What is left over when the reaction is complete?
  choices:
    - { id: a, text: "1.0 mol of O₂" }
    - { id: b, text: "2.0 mol of H₂" }
    - { id: c, text: "1.0 mol of H₂" }
    - { id: d, text: "Nothing; both react completely" }
  answer: a
  explanation: |
    4.0 mol $\ce{H2}$ needs 2.0 mol $\ce{O2}$. There are 3.0 mol, so $\ce{H2}$ is limiting and $3.0 - 2.0 = 1.0$ mol $\ce{O2}$ is left. 4.0 mol of $\ce{H2O}$ forms.

- id: apchem-03-limiting-grams-water
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.7"]
  cedTopics: ["4.5"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    10.0 g of $\ce{H2}$ and 64.0 g of $\ce{O2}$ react to form water: $\ce{2H2 + O2 -> 2H2O}$. What mass of water forms?
  choices:
    - { id: a, text: "36.0 g" }
    - { id: b, text: "74.0 g" }
    - { id: c, text: "89.4 g" }
    - { id: d, text: "72.1 g" }
  answer: d
  explanation: |
    $\ce{H2}$: $10.0 / 2.016 = 4.96$ mol, which could make 4.96 mol $\ce{H2O}$. $\ce{O2}$: $64.0 / 32.00 = 2.00$ mol, which could make 4.00 mol $\ce{H2O}$. $\ce{O2}$ makes less, so it's limiting: $4.00 \times 18.02 = 72.1$ g.
    (C) uses $\ce{H2}$ as limiting. (B) adds the reactant masses, but some $\ce{H2}$ is left over.

- id: apchem-03-excess-left
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.7"]
  cedTopics: ["4.5"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    28.0 g of $\ce{N2}$ and 9.00 g of $\ce{H2}$ react by $\ce{N2 + 3H2 -> 2NH3}$. What mass of the excess reactant remains?
  choices:
    - { id: a, text: "6.04 g of H₂" }
    - { id: b, text: "2.96 g of H₂" }
    - { id: c, text: "19.0 g of N₂" }
    - { id: d, text: "1.47 g of H₂" }
  answer: b
  explanation: |
    $\ce{N2}$: $28.0 / 28.02 = 0.999$ mol, which needs $3(0.999) = 2.998$ mol $\ce{H2}$. $\ce{H2}$: $9.00 / 2.016 = 4.464$ mol available, so $\ce{N2}$ is limiting.
    $\ce{H2}$ left $= 4.464 - 2.998 = 1.466$ mol, or $1.466 \times 2.016 = 2.96$ g.
    (A) is the mass of $\ce{H2}$ used. (D) is the moles left, labeled as grams. Check: $28.0 + 9.00 = 37.0$ g; $\ce{NH3}$ formed is $1.998 \times 17.03 = 34.0$ g, and $34.0 + 2.96 = 37.0$ g.

- id: apchem-03-equal-masses-limiting
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.7"]
  cedTopics: ["4.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Equal masses (10.0 g each) of zinc and sulfur are heated together: $\ce{Zn + S -> ZnS}$. Which is the limiting reactant?
  choices:
    - { id: a, text: "Sulfur, because sulfur atoms are smaller" }
    - { id: b, text: "Neither, because equal masses were used" }
    - { id: c, text: "Zinc, because 10.0 g of Zn is fewer moles" }
    - { id: d, text: "Sulfur, because 10.0 g of S is fewer moles" }
  answer: c
  explanation: |
    The ratio is 1 : 1 in moles. Zn: $10.0 / 65.38 = 0.153$ mol. S: $10.0 / 32.06 = 0.312$ mol. Zinc runs out first. Equal masses aren't equal moles (B).

- id: apchem-03-add-excess
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.7"]
  cedTopics: ["4.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    In a reaction, $\ce{HCl}$ is the limiting reactant and Mg is in excess: $\ce{Mg + 2HCl -> MgCl2 + H2}$. If the mass of Mg used is doubled and the HCl is unchanged, the mass of $\ce{H2}$ produced will
  choices:
    - { id: a, text: "double, because twice as much Mg reacts" }
    - { id: b, text: "stay the same, because the HCl still runs out at the same point" }
    - { id: c, text: "be cut in half, because the ratio of the two reactants is now further from 1 : 2" }
    - { id: d, text: "increase, but by less than double" }
  answer: b
  explanation: |
    The product is set by the limiting reactant. HCl still runs out after the same amount reacts, so the same $\ce{H2}$ forms; there's just more Mg left over.

- id: apchem-03-percent-yield
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.7"]
  cedTopics: ["4.5"]
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    A reaction has a theoretical yield of 18.4 g, and the student collects 15.0 g of product. What is the percent yield?
  choices:
    - { id: a, text: "3.4%" }
    - { id: b, text: "122.7%" }
    - { id: c, text: "18.5%" }
    - { id: d, text: "81.5%" }
  answer: d
  explanation: |
    $15.0 / 18.4 \times 100\% = 81.5\%$. (B) divides upside down. (C) is the percent **lost**.

- id: apchem-03-yield-over-100
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.7"]
  cedTopics: ["4.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A student calculates a percent yield of 108% for a solid product. Which is the most likely cause?
  choices:
    - { id: a, text: "The product was still wet with solvent when it was weighed" }
    - { id: b, text: "Some of the product was spilled during filtration" }
    - { id: c, text: "A side reaction used up part of the limiting reactant to make a different product" }
    - { id: d, text: "The reaction stopped before all the reactant was used" }
  answer: a
  explanation: |
    A yield above 100% means the product weighed more than possible, usually because water or solvent (or an impurity) was weighed with it. (B), (C), and (D) all make the yield lower, not higher.

- id: apchem-03-thermite-yield
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.7"]
  cedTopics: ["4.5"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    5.40 g of Al reacts with 20.0 g of $\ce{Fe2O3}$: $\ce{2Al + Fe2O3 -> Al2O3 + 2Fe}$. The reaction produces 9.80 g of Fe. What is the percent yield?
  choices:
    - { id: a, text: "70.1%" }
    - { id: b, text: "87.7%" }
    - { id: c, text: "49.0%" }
    - { id: d, text: "181%" }
  answer: b
  explanation: |
    Al: $5.40 / 26.98 = 0.2001$ mol, which could make 0.2001 mol Fe. $\ce{Fe2O3}$: $20.0 / 159.70 = 0.1252$ mol, which could make 0.2505 mol Fe. Al is limiting.
    Theoretical yield $= 0.2001 \times 55.85 = 11.18$ g Fe. Percent yield $= 9.80 / 11.18 = 87.7\%$.
    (A) uses $\ce{Fe2O3}$ as limiting (13.99 g). (C) divides by the 20.0 g of oxide, and (D) by the 5.40 g of Al.

- id: apchem-03-theoretical-yield-meaning
  type: mcq
  subject: apchem
  chapter: 3
  sections: ["3.7"]
  cedTopics: ["4.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    The **theoretical yield** of a reaction is
  choices:
    - { id: a, text: "the mass of product actually collected in the lab" }
    - { id: b, text: "the amount of product calculated from the limiting reactant" }
    - { id: c, text: "the total mass of all the reactants used" }
    - { id: d, text: "the amount of product calculated from the excess reactant instead" }
  answer: b
  explanation: |
    It's the maximum possible product, set by the reactant that runs out first. (A) is the actual yield. (D) would overestimate the product.

