  answer: c
  explanation: |
    $\ce{Ba^2+}$ starts at 0.00600 mol, and 0.00300 mol reacts with all the sulfate, leaving 0.00300 mol. The total volume is 50.0 mL, so $[\ce{Ba^2+}] = 0.00300 / 0.0500 = 0.0600\ M$.
    (A) divides by 20.0 mL, the original volume of the barium solution. (B) ignores the reaction: $0.00600 / 0.0500 = 0.120\ M$.

- id: apchem-04-equivalence-point
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.6"]
  cedTopics: ["4.6"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In a titration, what is the **equivalence point**?
  choices:
    - { id: a, text: "The point where the indicator first changes color in the flask" }
    - { id: b, text: "The point where equal volumes of titrant and analyte have been mixed" }
    - { id: c, text: "The point where the titrant added exactly reacts with all of the analyte" }
    - { id: d, text: "The point where the concentrations of titrant and analyte are equal" }
  answer: c
  explanation: |
    At the equivalence point, the moles of titrant added are exactly what the balanced equation needs for the analyte. (A) is the **end point**, which a good indicator puts close to the equivalence point. The volumes (B) and concentrations (D) don't have to be equal.

- id: apchem-04-buret-water-error
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.6"]
  cedTopics: ["4.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A student rinses the buret with distilled water but not with the NaOH titrant, then titrates an acid of unknown concentration. How does this affect the calculated concentration of the acid?
  choices:
    - { id: a, text: "Too high, because the diluted NaOH requires a larger volume to be added" }
    - { id: b, text: "Too low, because the diluted NaOH contains fewer moles of hydroxide" }
    - { id: c, text: "Unchanged, because water takes no part in the neutralization reaction" }
    - { id: d, text: "Too low, because a smaller volume of NaOH reaches the end point" }
  answer: a
  explanation: |
    Leftover water dilutes the titrant, so more mL are needed to deliver the moles the acid requires. The calculation still uses the labeled concentration, so it overstates the moles of NaOH, and of acid, giving a concentration that is too high.

- id: apchem-04-water-in-flask
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.6"]
  cedTopics: ["4.6"]
  difficulty: 2
  authors: ["Claude"]
  group: water-in-titration-flask
  prompt: |
    Before titrating 25.00 mL of an acid, a student adds 20 mL of distilled water to the flask to make the color change easier to see. How does this affect the calculated concentration of the original acid?
  choices:
    - { id: a, text: "Too low, because the acid in the flask has been diluted by the water" }
    - { id: b, text: "Too high, because more titrant is needed to reach the end point" }
    - { id: c, text: "Too low, because less titrant is needed to reach the end point" }
    - { id: d, text: "Unchanged, because the moles of acid in the flask are the same" }
  answer: d
  explanation: |
    The titration measures moles of acid, and adding water doesn't change the moles in the flask. The same volume of titrant is needed, and the calculation still divides by the original 25.00 mL, so the result is unchanged.

- id: apchem-04-molar-mass-diprotic
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.6"]
  cedTopics: ["4.6"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    0.300 g of a solid **diprotic** acid, $\ce{H2A}$, needs 25.0 mL of 0.200 M NaOH to react completely. What is the molar mass of the acid?
  choices:
    - { id: a, text: "60.0 g/mol" }
    - { id: b, text: "0.120 g/mol" }
    - { id: c, text: "30.0 g/mol" }
    - { id: d, text: "120. g/mol" }
  answer: d
  explanation: |
    Moles NaOH $= 0.0250 \times 0.200 = 0.00500$ mol. A diprotic acid uses 2 NaOH per molecule ($\ce{H2A + 2NaOH -> Na2A + 2H2O}$), so moles of acid $= 0.00250$. $0.300 / 0.00250 = 120.$ g/mol.
    (A) treats the acid as monoprotic. (C) multiplies the moles by 2 instead of dividing. (B) leaves the volume in milliliters.

- id: apchem-04-indicator-choice
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.6"]
  cedTopics: ["4.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Why does a student titrating an acid with NaOH add an indicator to the flask?
  choices:
    - { id: a, text: "It speeds up the reaction between the acid and the hydroxide ions" }
    - { id: b, text: "Its color change signals that the equivalence point has been reached" }
    - { id: c, text: "It neutralizes any acid that the NaOH titrant fails to react with" }
    - { id: d, text: "It keeps the analyte from being diluted by the added titrant" }
  answer: b
  explanation: |
    The neutralization itself has no visible sign. An indicator changes color at the end point, which is chosen to fall very close to the equivalence point. It isn't a catalyst (A) and is present in amounts far too small to react with the analyte (C).

- id: apchem-04-ion-ranking-pbi2
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.6"]
  cedTopics: ["4.3", "4.5"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    20.0 mL of 0.100 M $\ce{Pb(NO3)2}$ is mixed with 30.0 mL of 0.100 M KI, and $\ce{PbI2}$ precipitates:

    $$
    \ce{Pb^2+(aq) + 2I-(aq) -> PbI2(s)}
    $$

    Which ranks the ions left in solution from highest to lowest concentration?
  choices:
    - { id: a, text: "$\\ce{NO3-} > \\ce{K+} > \\ce{Pb^2+} > \\ce{I-}$" }
    - { id: b, text: "$\\ce{NO3-} > \\ce{K+} > \\ce{I-} > \\ce{Pb^2+}$" }
    - { id: c, text: "$\\ce{K+} > \\ce{NO3-} > \\ce{Pb^2+} > \\ce{I-}$" }
    - { id: d, text: "$\\ce{NO3-} > \\ce{K+} = \\ce{I-} > \\ce{Pb^2+}$" }
  answer: a
  explanation: |
    $\ce{Pb^2+}$: $0.0200 \times 0.100 = 0.00200$ mol. $\ce{I-}$: $0.0300 \times 0.100 = 0.00300$ mol. Using all the $\ce{Pb^2+}$ would take 0.00400 mol $\ce{I-}$, so **$\ce{I-}$ is limiting**. It reacts with 0.00150 mol $\ce{Pb^2+}$, leaving 0.00050 mol. In 0.0500 L: $[\ce{NO3-}] = 0.00400 / 0.0500 = 0.0800\ M$, $[\ce{K+}] = 0.0600\ M$, $[\ce{Pb^2+}] = 0.0100\ M$, and $[\ce{I-}] \approx 0$. Charge check: $0.0600 + 2(0.0100) = 0.0800$.
    (B) uses a 1 : 1 ratio, which makes $\ce{Pb^2+}$ limiting. (C) counts one nitrate per $\ce{Pb(NO3)2}$. (D) ignores the precipitation.

