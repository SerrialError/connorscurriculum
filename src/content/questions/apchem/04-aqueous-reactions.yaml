# Practice questions for Chapter 4 (Reactions in Aqueous Solution). Original; not taken from the
# textbook or College Board materials. Molarity is AP topic 3.7, net ionic equations 4.2, particle
# diagrams of reactions 4.3, physical and chemical changes 4.4, stoichiometry 4.5, titration 4.6,
# reaction types 4.7, Brønsted–Lowry acids and bases 4.8, and half-reactions 4.9. Atomic weights are
# those on the AP periodic table. Solubility beyond "Na+, K+, NH4+, and NO3- compounds are soluble" is
# given in the prompt, as on the AP exam.
# calculation: true marks questions that need a numeric calculation.

