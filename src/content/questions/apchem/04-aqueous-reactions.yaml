    10.0 g of NaOH is dissolved in enough water to make 500.0 mL of solution. What is the molarity?
  choices:
    - { id: a, text: "0.250 M" }
    - { id: b, text: "0.0200 M" }
    - { id: c, text: "2.00 M" }
    - { id: d, text: "0.500 M" }
  answer: d
  explanation: |
    $\mathcal{M}(\ce{NaOH}) = 22.99 + 16.00 + 1.008 = 40.00$ g/mol, so $10.0 / 40.00 = 0.250$ mol. $0.250\ \text{mol} / 0.5000\ \text{L} = 0.500\ M$.
    (A) is the moles, not the molarity. (B) divides grams by milliliters.

