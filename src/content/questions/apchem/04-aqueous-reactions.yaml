  choices:
    - { id: a, text: "Al is oxidized, because its oxidation number rises from 0 to +3" }
    - { id: b, text: "Al is reduced, because its oxidation number rises from 0 to +3" }
    - { id: c, text: "Cl is oxidized, because its oxidation number falls from 0 to −1" }
    - { id: d, text: "Nothing is oxidized, because both reactants are elements" }
  answer: a
  explanation: |
    Al goes from 0 to +3: it loses electrons, so it's oxidized. Cl goes from 0 to −1: it gains electrons, so it's reduced.
