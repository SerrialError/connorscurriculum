    - { id: d, text: "Both solutions have the same total concentration of ions, 0.40 M" }
  answer: b
  explanation: |
    NaCl: $[\ce{Na+}] = 0.20\ M$. $\ce{Na2SO4}$: $[\ce{Na+}] = 2 \times 0.10 = 0.20\ M$. The totals differ: 0.40 M of ions for NaCl and 0.30 M for $\ce{Na2SO4}$, so (D) is false.

