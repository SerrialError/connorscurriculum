  choices:
    - { id: a, text: "Carbon, from +2 to +4" }
    - { id: b, text: "Oxygen, from −2 to 0" }
    - { id: c, text: "Iron, from +3 to 0" }
    - { id: d, text: "Iron, from +2 to 0" }
  answer: c
  explanation: |
    In $\ce{Fe2O3}$, $2x + 3(-2) = 0$ gives Fe = +3. Iron ends as the element (0), so its oxidation number falls: it's reduced. Carbon goes from +2 in CO to +4 in $\ce{CO2}$, so carbon is **oxidized** (A). Oxygen stays −2.

