    20.0 mL of 0.300 M $\ce{BaCl2}$ is mixed with 30.0 mL of 0.100 M $\ce{Na2SO4}$, and $\ce{BaSO4}$ precipitates. What is the concentration of $\ce{Ba^2+}$ left in the solution?
  choices:
    - { id: a, text: "0.150 M" }
    - { id: b, text: "0.120 M" }
    - { id: c, text: "0.0600 M" }
