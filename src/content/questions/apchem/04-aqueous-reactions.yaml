    - { id: b, text: "$\\ce{K2S}$" }
    - { id: c, text: "$\\ce{KHSO4}$" }
    - { id: d, text: "$\\ce{K2SO4}$" }
  answer: d
  explanation: |
    $\ce{H2SO4 + 2KOH -> K2SO4 + 2H2O}$. The salt is the base's cation ($\ce{K+}$) with the acid's anion ($\ce{SO4^2-}$), so two $\ce{K+}$ per sulfate.
