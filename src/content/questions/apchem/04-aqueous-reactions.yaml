- id: apchem-04-net-ionic-strong-strong
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.3"]
  cedTopics: ["4.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the net ionic equation for the reaction of hydrochloric acid with potassium hydroxide solution?
  choices:
    - { id: a, text: "$\\ce{HCl(aq) + OH-(aq) -> Cl-(aq) + H2O(l)}$" }
    - { id: b, text: "$\\ce{K+(aq) + Cl-(aq) -> KCl(aq)}$" }
    - { id: c, text: "$\\ce{HCl(aq) + KOH(aq) -> KCl(aq) + H2O(l)}$" }
    - { id: d, text: "$\\ce{H+(aq) + OH-(aq) -> H2O(l)}$" }
  answer: d
  explanation: |
    HCl and KOH are a strong acid and a strong base, so both are split into ions. $\ce{K+}$ and $\ce{Cl-}$ are spectators, leaving $\ce{H+ + OH- -> H2O}$.
    (A) leaves the strong acid unsplit. (B) shows only spectators. (C) is the molecular equation.

- id: apchem-04-net-ionic-acetic-naoh
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.3"]
  cedTopics: ["4.2"]
  difficulty: 2
