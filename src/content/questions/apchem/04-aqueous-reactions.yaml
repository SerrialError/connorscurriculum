  explanation: |
    From KCl: $0.1000 \times 0.300 = 0.0300$ mol $\ce{K+}$. From $\ce{K2SO4}$: $0.2000 \times 0.150 = 0.0300$ mol of salt, which gives $2 \times 0.0300 = 0.0600$ mol $\ce{K+}$. Total: 0.0900 mol in 0.3000 L, so $[\ce{K+}] = 0.300\ M$.
    (B) averages the two salt concentrations, and (C) adds them. (A) is just the concentration of $\ce{K2SO4}$. Work in moles of $\ce{K+}$.

