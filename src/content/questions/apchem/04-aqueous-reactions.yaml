- id: apchem-04-bronsted-base-water
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.3"]
  cedTopics: ["4.8"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In the reaction $\ce{HNO2(aq) + H2O(l) <=> H3O+(aq) + NO2^-(aq)}$, which species acts as a Brønsted–Lowry **base**?
  choices:
    - { id: a, text: "$\\ce{HNO2}$" }
    - { id: b, text: "$\\ce{H3O+}$" }
    - { id: c, text: "$\\ce{H2O}$" }
    - { id: d, text: "$\\ce{NO2-}$" }
  answer: c
  explanation: |
    A base accepts $\ce{H+}$. Water gains an H to become $\ce{H3O+}$, so water is the base in the forward reaction. $\ce{HNO2}$ is the acid. $\ce{NO2-}$ (D) is the conjugate base of $\ce{HNO2}$, and $\ce{H3O+}$ (B) is the conjugate acid of water.

- id: apchem-04-conjugate-base-hso4
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.3"]
  cedTopics: ["4.8"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the conjugate base of the hydrogen sulfate ion, $\ce{HSO4-}$?
  choices:
    - { id: a, text: "$\\ce{SO4^2-}$" }
    - { id: b, text: "$\\ce{H2SO4}$" }
    - { id: c, text: "$\\ce{SO3^2-}$" }
    - { id: d, text: "$\\ce{H2SO4-}$" }
  answer: a
  explanation: |
    A conjugate base has one fewer $\ce{H+}$: remove one H and lower the charge by one, giving $\ce{SO4^2-}$.
    (B) is the conjugate **acid** (one more $\ce{H+}$). (C) loses an O, not an H.

