  prompt: |
    A 20.00 mL sample of $\ce{Ba(OH)2}$ solution is titrated with 0.1500 M HCl. The end point is reached after 24.60 mL of acid is added. What is the concentration of the $\ce{Ba(OH)2}$?
  choices:
    - { id: a, text: "0.1845 M" }
    - { id: b, text: "0.09225 M" }
