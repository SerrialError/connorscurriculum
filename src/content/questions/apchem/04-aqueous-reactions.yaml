  answer: b
  explanation: |
    $\ce{Ba(OH)2 + 2HCl -> BaCl2 + 2H2O}$. Moles HCl $= 0.02460 \times 0.1500 = 0.003690$ mol, so $\ce{Ba(OH)2} = 0.003690 / 2 = 0.001845$ mol. $0.001845 / 0.02000 = 0.09225\ M$.
    (A) ignores the 2 : 1 ratio. (C) inverts the volume ratio.

