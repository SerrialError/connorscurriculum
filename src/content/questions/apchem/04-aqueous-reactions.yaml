    - { id: b, text: "$\\ce{NH3(aq) + HNO3(aq) -> NH4NO3(s)}$" }
    - { id: c, text: "$\\ce{NH4+(aq) + OH-(aq) -> NH3(aq) + H2O(l)}$" }
    - { id: d, text: "$\\ce{H+(aq) + OH-(aq) -> H2O(l)}$" }
  answer: a
  explanation: |
    Nitric acid is strong, so it is written as $\ce{H+}$ and $\ce{NO3-}$; nitrate is the spectator. Ammonia is a weak base and stays as a molecule. It accepts the $\ce{H+}$ to form ammonium.
    (D) would need $\ce{OH-}$, which ammonia doesn't supply as a reactant. (B) shows ammonium nitrate as a solid, but it is soluble.

- id: apchem-04-carbonate-acid-net-ionic
