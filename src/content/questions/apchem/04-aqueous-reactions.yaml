  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which pair is a conjugate acid–base pair in the reaction below?

    $$
    \ce{NH4+(aq) + CO3^2-(aq) <=> NH3(aq) + HCO3^-(aq)}
    $$
  choices:
    - { id: a, text: "$\\ce{NH4+}$ and $\\ce{CO3^2-}$" }
    - { id: b, text: "$\\ce{CO3^2-}$ and $\\ce{NH3}$" }
    - { id: c, text: "$\\ce{HCO3-}$ and $\\ce{NH4+}$" }
    - { id: d, text: "$\\ce{NH4+}$ and $\\ce{NH3}$" }
  answer: d
  explanation: |
    The members of a conjugate pair differ by exactly one $\ce{H+}$. $\ce{NH4+}$ loses an H to become $\ce{NH3}$. (The other pair is $\ce{CO3^2-}$ and $\ce{HCO3-}$.)
    (A) and (B) are the two reactants or a base with a base. (C) pairs the two acids.

- id: apchem-04-amphiprotic
