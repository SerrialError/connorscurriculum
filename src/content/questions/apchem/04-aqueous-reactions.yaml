- id: apchem-04-always-soluble
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.2"]
  cedTopics: ["4.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which of these compounds can you be **sure** is soluble in water, without being told?
  choices:
    - { id: a, text: "$\\ce{(NH4)2CO3}$, ammonium carbonate" }
    - { id: b, text: "$\\ce{BaSO4}$, barium sulfate" }
    - { id: c, text: "$\\ce{PbI2}$, lead(II) iodide" }
    - { id: d, text: "$\\ce{CaCO3}$, calcium carbonate" }
  answer: a
  explanation: |
    Every compound containing $\ce{Na+}$, $\ce{K+}$, $\ce{NH4+}$, or $\ce{NO3-}$ is soluble. Ammonium carbonate contains $\ce{NH4+}$.
    The others contain none of these ions. (In fact all three are insoluble.)

- id: apchem-04-identify-precipitate
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.2"]
  cedTopics: ["4.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    A white precipitate forms when solutions of lead(II) nitrate and sodium chloride are mixed. What is the precipitate?
  choices:
    - { id: a, text: "$\\ce{NaNO3}$" }
    - { id: b, text: "$\\ce{Pb(NO3)2}$" }
    - { id: c, text: "$\\ce{NaCl}$" }
    - { id: d, text: "$\\ce{PbCl2}$" }
  answer: d
  explanation: |
    The ions trade partners: $\ce{Pb^2+}$ with $\ce{Cl-}$, and $\ce{Na+}$ with $\ce{NO3-}$. $\ce{NaNO3}$ contains $\ce{Na+}$ and $\ce{NO3-}$, so it is soluble. The precipitate must be $\ce{PbCl2}$.
    (B) and (C) are the starting compounds, which were dissolved.

- id: apchem-04-spectators-agcl
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.2"]
  cedTopics: ["4.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Solutions of silver nitrate and potassium chloride are mixed, and AgCl precipitates. Which ions are the spectator ions?
  choices:
    - { id: a, text: "$\\ce{K+}$ and $\\ce{NO3-}$" }
    - { id: b, text: "$\\ce{Ag+}$ and $\\ce{Cl-}$" }
    - { id: c, text: "$\\ce{Ag+}$ and $\\ce{NO3-}$" }
    - { id: d, text: "$\\ce{K+}$ and $\\ce{Cl-}$" }
  answer: a
  explanation: |
    $\ce{Ag+}$ and $\ce{Cl-}$ combine into the solid, so they take part in the reaction. $\ce{K+}$ and $\ce{NO3-}$ are dissolved before and after: spectators. The net ionic equation is $\ce{Ag+(aq) + Cl-(aq) -> AgCl(s)}$.

- id: apchem-04-net-ionic-copper-hydroxide
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.2"]
  cedTopics: ["4.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    What is the net ionic equation for $\ce{CuSO4(aq) + 2NaOH(aq) -> Cu(OH)2(s) + Na2SO4(aq)}$?
  choices:
    - { id: a, text: "$\\ce{CuSO4(aq) + 2OH-(aq) -> Cu(OH)2(s) + SO4^2-(aq)}$" }
    - { id: b, text: "$\\ce{Cu^2+(aq) + 2OH-(aq) -> Cu(OH)2(s)}$" }
    - { id: c, text: "$\\ce{2Na+(aq) + SO4^2-(aq) -> Na2SO4(aq)}$" }
    - { id: d, text: "$\\ce{Cu^2+(aq) + OH-(aq) -> CuOH(s)}$" }
  answer: b
  explanation: |
    Split the soluble compounds: $\ce{Cu^2+ + SO4^2- + 2Na+ + 2OH- -> Cu(OH)2(s) + 2Na+ + SO4^2-}$. Cancel $\ce{2Na+}$ and $\ce{SO4^2-}$.
    (A) leaves $\ce{CuSO4}$ unsplit. (C) shows only spectators. (D) has the wrong formula for the precipitate.

- id: apchem-04-iron-hydroxide-coefficient
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.2"]
  cedTopics: ["4.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Solutions of iron(III) chloride and sodium hydroxide are mixed, and iron(III) hydroxide precipitates. In the balanced **net ionic** equation, what is the coefficient of $\ce{OH-}$?
  choices:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "6" }
    - { id: d, text: "3" }
  answer: d
  explanation: |
    $\ce{Fe^3+}$ needs three $\ce{OH-}$ to make neutral $\ce{Fe(OH)3}$: $\ce{Fe^3+(aq) + 3OH-(aq) -> Fe(OH)3(s)}$. Charge: $+3 - 3 = 0$ on each side.

- id: apchem-04-no-precipitate-pair
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.2"]
  cedTopics: ["4.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Assume that every compound **not** containing $\ce{Na+}$, $\ce{K+}$, $\ce{NH4+}$, or $\ce{NO3-}$ is insoluble. Mixing which pair of solutions produces **no** precipitate?
  choices:
    - { id: a, text: "$\\ce{AgNO3}$ and $\\ce{KI}$" }
    - { id: b, text: "$\\ce{BaCl2}$ and $\\ce{K2SO4}$" }
    - { id: c, text: "$\\ce{NH4Cl}$ and $\\ce{NaNO3}$" }
    - { id: d, text: "$\\ce{Pb(NO3)2}$ and $\\ce{Na2S}$" }
  answer: c
  explanation: |
    The possible new products for (C) are $\ce{NH4NO3}$ and NaCl, which both contain an always-soluble ion. Nothing precipitates.
    The others make AgI (A), $\ce{BaSO4}$ (B), and PbS (D), none of which contains an always-soluble ion.

- id: apchem-04-particle-barium-left
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.2"]
  cedTopics: ["4.3"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A particle diagram of a $\ce{BaCl2}$ solution shows 5 $\ce{Ba^2+}$ and 10 $\ce{Cl-}$ ions. It is mixed with a $\ce{Na2SO4}$ solution showing 3 $\ce{SO4^2-}$ and 6 $\ce{Na+}$ ions. $\ce{BaSO4}$ is insoluble. After the reaction, how many $\ce{Ba^2+}$ ions are still dissolved?
  choices:
    - { id: a, text: "0" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "5" }
  answer: b
  explanation: |
    $\ce{Ba^2+}$ and $\ce{SO4^2-}$ combine 1 : 1. The 3 sulfate ions use 3 of the 5 barium ions, forming 3 $\ce{BaSO4}$ units, so 2 $\ce{Ba^2+}$ remain in solution. Sulfate is the limiting reactant. The 10 $\ce{Cl-}$ and 6 $\ce{Na+}$ are unchanged.

- id: apchem-04-balanced-silver-phosphate
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.2"]
  cedTopics: ["4.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Silver phosphate is insoluble. Which is the correct net ionic equation for its precipitation?
  choices:
    - { id: a, text: "$\\ce{Ag+(aq) + PO4^3-(aq) -> AgPO4(s)}$" }
    - { id: b, text: "$\\ce{Ag^3+(aq) + PO4^3-(aq) -> AgPO4(s)}$" }
    - { id: c, text: "$\\ce{3Ag+(aq) + 3PO4^3-(aq) -> Ag3PO4(s)}$" }
    - { id: d, text: "$\\ce{3Ag+(aq) + PO4^3-(aq) -> Ag3PO4(s)}$" }
  answer: d
  explanation: |
    Silver forms $\ce{Ag+}$, so three are needed for each $\ce{PO4^3-}$: $\ce{Ag3PO4}$. Charge: $3(+1) - 3 = 0$, matching the neutral solid.
    (A) has the wrong formula and an unbalanced charge. (B) uses an ion silver doesn't form. (C) doesn't balance the phosphate.

- id: apchem-04-complete-ionic-count
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.2"]
  cedTopics: ["4.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    In the complete ionic equation for $\ce{Na2CO3(aq) + CaCl2(aq) -> CaCO3(s) + 2NaCl(aq)}$, how many ions are written on the **reactant** side?
  choices:
    - { id: a, text: "4" }
    - { id: b, text: "6" }
    - { id: c, text: "5" }
    - { id: d, text: "8" }
  answer: b
  explanation: |
    $\ce{2Na+ + CO3^2- + Ca^2+ + 2Cl-}$: $2 + 1 + 1 + 2 = 6$ ions.
    (A) counts each compound as two ions. (D) would come from also splitting the carbonate ion.

- id: apchem-04-what-to-split
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.2"]
  cedTopics: ["4.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which substance should be written as separate **ions** in a complete ionic equation?
  choices:
    - { id: a, text: "$\\ce{AgCl(s)}$" }
    - { id: b, text: "$\\ce{H2O(l)}$" }
    - { id: c, text: "$\\ce{KNO3(aq)}$" }
    - { id: d, text: "$\\ce{HF(aq)}$" }
  answer: c
  explanation: |
    Only strong electrolytes in solution are split. $\ce{KNO3(aq)}$ is a soluble ionic compound.
    Solids (A) and liquids (B) are written whole, and HF (D) is a weak acid, which stays as molecules.

- id: apchem-04-identify-unknown-cation
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.2"]
  cedTopics: ["4.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A solution contains one of these cations: $\ce{Ag+}$, $\ce{Ba^2+}$, or $\ce{Na+}$. Adding NaCl solution gives no precipitate. Adding $\ce{Na2SO4}$ solution gives a white precipitate.

    Solubility information: AgCl is insoluble, $\ce{BaCl2}$ is soluble, $\ce{BaSO4}$ is insoluble, and $\ce{Ag2SO4}$ is soluble at these concentrations.

    Which cation is present?
  choices:
    - { id: a, text: "$\\ce{Ag+}$, since its sulfate was the precipitate" }
    - { id: b, text: "$\\ce{Na+}$, since sodium compounds don't precipitate" }
    - { id: c, text: "$\\ce{Ba^2+}$, since only its sulfate is insoluble" }
    - { id: d, text: "There isn't enough information to decide" }
  answer: c
  explanation: |
    No precipitate with $\ce{Cl-}$ rules out $\ce{Ag+}$ (AgCl would have formed). A precipitate with $\ce{SO4^2-}$ rules out $\ce{Na+}$, whose compounds are all soluble. $\ce{Ba^2+}$ fits both tests: $\ce{BaCl2}$ dissolves and $\ce{BaSO4}$ precipitates.

- id: apchem-04-particle-pbi2-after
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.2"]
  cedTopics: ["4.3"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    A solution containing 6 $\ce{Pb^2+}$ ions (and nitrate ions) is mixed with a solution containing 6 $\ce{I-}$ ions (and potassium ions). $\ce{PbI2}$ is insoluble. Apart from the spectator ions, what should a particle diagram of the mixture show after the reaction?
  choices:
    - { id: a, text: "6 $\\ce{PbI2}$ units in the solid, and no lead or iodide ions left dissolved" }
    - { id: b, text: "3 $\\ce{PbI2}$ units in the solid, and 3 $\\ce{I-}$ ions still dissolved" }
    - { id: c, text: "6 $\\ce{PbI}$ units in the solid, and no lead or iodide ions left dissolved" }
    - { id: d, text: "3 $\\ce{PbI2}$ units in the solid, and 3 $\\ce{Pb^2+}$ ions still dissolved" }
  answer: d
  explanation: |
    Each $\ce{PbI2}$ uses one $\ce{Pb^2+}$ and **two** $\ce{I-}$. Six iodide ions make only 3 $\ce{PbI2}$ units, using 3 of the lead ions. Iodide is limiting, and 3 $\ce{Pb^2+}$ are left over.
    (A) ignores the 1 : 2 ratio. (B) has the leftover ion backward. (C) has the wrong formula.

