    - { id: b, text: "$\\ce{HC2H3O2(aq) + OH-(aq) -> C2H3O2^-(aq) + H2O(l)}$" }
    - { id: c, text: "$\\ce{HC2H3O2(aq) + Na+(aq) -> NaC2H3O2(s) + H+(aq)}$" }
    - { id: d, text: "$\\ce{C2H3O2^-(aq) + Na+(aq) -> NaC2H3O2(aq)}$" }
  answer: b
  explanation: |
    Acetic acid is weak, so it stays as a molecule; NaOH is split, and $\ce{Na+}$ is the spectator. The hydroxide takes the acid's $\ce{H+}$.
    (A) is right only for a **strong** acid. (C) and (D) give $\ce{Na+}$ a role it doesn't have; sodium acetate is soluble.

- id: apchem-04-net-ionic-ammonia-nitric
