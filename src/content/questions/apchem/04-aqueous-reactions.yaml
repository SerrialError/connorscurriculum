    20.0 mL of 0.300 M $\ce{BaCl2}$ is mixed with 30.0 mL of 0.100 M $\ce{Na2SO4}$. What mass of $\ce{BaSO4}$ (233.39 g/mol) forms?
  choices:
    - { id: a, text: "0.700 g" }
    - { id: b, text: "1.40 g" }
    - { id: c, text: "1.17 g" }
    - { id: d, text: "0.467 g" }
  answer: a
  explanation: |
    $\ce{Ba^2+}$: $0.0200 \times 0.300 = 0.00600$ mol. $\ce{SO4^2-}$: $0.0300 \times 0.100 = 0.00300$ mol. They react 1 : 1, so sulfate is limiting and 0.00300 mol $\ce{BaSO4}$ forms: $0.00300 \times 233.39 = 0.700$ g.
    (B) uses the barium, which is in excess.

- id: apchem-04-leftover-barium
  type: mcq
