- id: apchem-04-weak-electrolyte
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.1"]
  cedTopics: ["4.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which substance is a **weak** electrolyte when dissolved in water?
  choices:
    - { id: a, text: "$\\ce{KBr}$, potassium bromide" }
    - { id: b, text: "$\\ce{HC2H3O2}$, acetic acid" }
    - { id: c, text: "$\\ce{C6H12O6}$, glucose" }
    - { id: d, text: "$\\ce{HNO3}$, nitric acid" }
  answer: b
  explanation: |
    Acetic acid is a weak acid: only a small fraction of its molecules ionize, so its solution conducts weakly.
    (A) is a soluble ionic compound and (D) a strong acid, so both are strong electrolytes. (C) is a molecular compound that dissolves as neutral molecules: a nonelectrolyte.

- id: apchem-04-count-ions-ammonium-phosphate
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.1"]
  cedTopics: ["3.7"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    0.20 mol of ammonium phosphate, $\ce{(NH4)3PO4}$, is dissolved in water. How many moles of **ions** are in the solution?
  choices:
    - { id: a, text: "0.40 mol" }
    - { id: b, text: "0.60 mol" }
    - { id: c, text: "0.80 mol" }
    - { id: d, text: "1.6 mol" }
  answer: c
  explanation: |
    $\ce{(NH4)3PO4 -> 3NH4+ + PO4^3-}$: 4 ions per formula unit, so $0.20 \times 4 = 0.80$ mol.
    (B) counts only the ammonium ions. (A) treats the compound as giving 2 ions. (D) breaks the polyatomic ions apart; $\ce{NH4+}$ and $\ce{PO4^3-}$ stay whole.

- id: apchem-04-best-conductor
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.1"]
  cedTopics: ["4.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Equal volumes of four 0.10 M solutions are tested with a conductivity meter. Which conducts electricity **best**?
  choices:
    - { id: a, text: "$\\ce{AlCl3}$" }
    - { id: b, text: "$\\ce{CaCl2}$" }
    - { id: c, text: "$\\ce{NaCl}$" }
    - { id: d, text: "$\\ce{HF}$" }
  answer: a
  explanation: |
    Conductivity depends on the concentration of ions. $\ce{AlCl3}$ gives 4 ions per formula unit (0.40 M of ions), $\ce{CaCl2}$ gives 3 (0.30 M), and NaCl 2 (0.20 M). HF is a weak acid and forms very few ions.

- id: apchem-04-methanol-nonelectrolyte
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.1"]
  cedTopics: ["4.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Methanol, $\ce{CH3OH}$, dissolves completely in water, but the solution does not conduct electricity. Which statement best explains this?
  choices:
    - { id: a, text: "Methanol releases its OH group as $\\ce{OH-}$ ions, but they are too large to move" }
    - { id: b, text: "Methanol only conducts electricity when it is a liquid, not when it is dissolved" }
    - { id: c, text: "Methanol molecules ionize completely but the ions pair up again immediately" }
    - { id: d, text: "Methanol dissolves as neutral molecules, so the solution contains no free ions" }
  answer: d
  explanation: |
    A solution conducts only if it contains mobile ions. Methanol is a molecular compound that dissolves as whole, neutral molecules, so it is a nonelectrolyte.
    (A) is wrong: the OH in an alcohol is covalently bonded and isn't released as hydroxide. (B) and (C) describe things that don't happen.

- id: apchem-04-hydration-orientation
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.1"]
  cedTopics: ["3.7"]
  difficulty: 2
  authors: ["Claude"]
  group: hydration-picture
  prompt: |
    Which description of the water molecules around a dissolved $\ce{K+}$ ion is correct?
  choices:
    - { id: a, text: "The H atoms point toward $\\ce{K+}$, because H carries a partial negative charge" }
    - { id: b, text: "The O atoms point toward $\\ce{K+}$, because O carries a partial negative charge" }
    - { id: c, text: "The water molecules bond covalently to $\\ce{K+}$ and form a new compound" }
    - { id: d, text: "The water molecules have no preferred orientation around a positive ion" }
  answer: b
  explanation: |
    Oxygen is more electronegative than hydrogen, so the O end of water is partially negative and is attracted to the cation. Around an anion, the partially positive H ends point inward instead.
    These are ion–dipole attractions, not covalent bonds, so (C) is wrong.

- id: apchem-04-hydration-anion
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.1"]
  cedTopics: ["3.7"]
  difficulty: 2
  authors: ["Claude"]
  group: hydration-picture
  prompt: |
    A particle diagram of $\ce{KCl(aq)}$ shows a $\ce{Cl-}$ ion surrounded by six water molecules. Which feature would make the diagram **incorrect**?
  choices:
    - { id: a, text: "The water molecules sit close to the $\\ce{Cl-}$ ion instead of far away" }
    - { id: b, text: "The $\\ce{K+}$ ions are drawn separate from the $\\ce{Cl-}$ ions" }
    - { id: c, text: "The O atoms of the water molecules are drawn pointing at the $\\ce{Cl-}$ ion" }
    - { id: d, text: "The diagram includes the same number of $\\ce{K+}$ and $\\ce{Cl-}$ ions" }
  answer: c
  explanation: |
    $\ce{Cl-}$ attracts the partially **positive** H ends of water, so the H atoms should point toward it. O pointing at an anion would be a repulsion.
    (A), (B), and (D) are all correct features: the ions are hydrated, dissociated, and present in a 1 : 1 ratio.

- id: apchem-04-dissolving-chemical-argument
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.1"]
  cedTopics: ["4.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which statement is the best evidence for classifying the dissolving of NaCl in water as a **chemical** process?
  choices:
    - { id: a, text: "Solid NaCl is recovered unchanged when the water is evaporated" }
    - { id: b, text: "The temperature of the water changes only slightly as NaCl dissolves" }
    - { id: c, text: "Ionic bonds in the crystal break, and ion–dipole attractions to water form" }
    - { id: d, text: "No gas, precipitate, or color change appears when the NaCl dissolves" }
  answer: c
  explanation: |
    AP topic 4.4 accepts dissolving a salt as either physical or chemical, depending on the argument. The chemical argument is that bonds (here, ionic bonds) are broken and new interactions form.
    (A) and (D) support calling it physical. (B) says nothing about bonds.

- id: apchem-04-strength-vs-concentration
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.1"]
  cedTopics: ["4.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A 1.0 M solution of acetic acid, $\ce{HC2H3O2}$, conducts electricity less well than a 0.10 M solution of HCl. Which statement explains this?
  choices:
    - { id: a, text: "Only a small fraction of the acetic acid ionizes, so it forms fewer ions" }
    - { id: b, text: "Acetic acid molecules are larger, so its ions move more slowly in water" }
    - { id: c, text: "The HCl solution contains more dissolved solute than the acetic acid solution" }
    - { id: d, text: "Acetic acid is a molecular compound, and HCl is an ionic compound" }
  answer: a
  explanation: |
    HCl ionizes completely, giving 0.10 M $\ce{H+}$ and 0.10 M $\ce{Cl-}$. Acetic acid is weak: even at 1.0 M, only a few percent of the molecules ionize, so the total concentration of ions is lower.
    (C) is false: 1.0 M is more solute than 0.10 M. (D) is false: both are molecular acids.

- id: apchem-04-weak-electrolyte-picture
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.1"]
  cedTopics: ["4.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    A particle diagram of a solution shows mostly neutral solute molecules and a few ions. Which solute is this diagram most likely showing?
  choices:
    - { id: a, text: "$\\ce{NaF}$" }
    - { id: b, text: "$\\ce{HCl}$" }
    - { id: c, text: "$\\ce{CH3OH}$" }
    - { id: d, text: "$\\ce{HF}$" }
  answer: d
  explanation: |
    Mostly molecules plus a few ions is a weak electrolyte. HF is a weak acid.
    NaF (A) and HCl (B) are strong electrolytes and would show only ions. $\ce{CH3OH}$ (C) is a nonelectrolyte and would show no ions.

- id: apchem-04-dissociation-k2so4
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.1"]
  cedTopics: ["4.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which equation correctly shows potassium sulfate dissolving in water?
  choices:
    - { id: a, text: "$\\ce{K2SO4(s) -> K2^2+(aq) + SO4^2-(aq)}$" }
    - { id: b, text: "$\\ce{K2SO4(s) -> 2K+(aq) + SO4^2-(aq)}$" }
    - { id: c, text: "$\\ce{K2SO4(s) -> 2K+(aq) + S^2-(aq) + 2O2(g)}$" }
    - { id: d, text: "$\\ce{K2SO4(s) -> 2K+(aq) + S^6+(aq) + 4O^2-(aq)}$" }
  answer: b
  explanation: |
    The compound separates into two $\ce{K+}$ ions and one sulfate ion. Polyatomic ions such as $\ce{SO4^2-}$ stay in one piece, so (C) and (D) are wrong, and potassium doesn't form a $\ce{K2^2+}$ ion (A).

