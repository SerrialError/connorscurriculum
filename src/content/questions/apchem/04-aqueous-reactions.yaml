- id: apchem-04-classify-sulfide-acid
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.3"]
  cedTopics: ["4.7"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    How should the reaction $\ce{Na2S(aq) + 2HCl(aq) -> 2NaCl(aq) + H2S(g)}$ be classified?
  choices:
    - { id: a, text: "Redox, because a gas is produced from two solutions" }
    - { id: b, text: "Precipitation, because a new substance leaves the solution" }
    - { id: c, text: "Acid–base, because $\\ce{H+}$ is transferred from HCl to $\\ce{S^2-}$" }
    - { id: d, text: "Redox, because sulfur changes from an ion into a molecule" }
  answer: c
  explanation: |
    The net ionic equation is $\ce{S^2-(aq) + 2H+(aq) -> H2S(g)}$: sulfide accepts protons. No oxidation number changes (S stays −2, H stays +1), so it isn't redox, whatever the products look like. A precipitation reaction forms an insoluble **solid**, not a gas.

