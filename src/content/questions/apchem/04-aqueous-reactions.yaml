- id: apchem-04-vinegar-titration-frq
  type: frq
  subject: apchem
  chapter: 4
  sections: ["4.3", "4.6"]
  cedTopics: ["4.2", "4.6"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  group: water-in-titration-flask
  prompt: |
    A student standardizes a NaOH solution, then uses it to find the concentration of acetic acid, $\ce{HC2H3O2}$, in vinegar.

    **Standardizing.** 0.5105 g of potassium hydrogen phthalate, $\ce{KHC8H4O4}$ (KHP, 204.22 g/mol, a monoprotic acid), is dissolved in water and titrated with the NaOH. The end point is reached after 24.85 mL.

    **Vinegar.** A 5.00 mL sample of vinegar is titrated with the same NaOH. The end point is reached after 41.40 mL.
  parts:
    - label: a
      points: 1
      prompt: Write the net ionic equation for the reaction of acetic acid with sodium hydroxide.
      scoring:
        - "$\\ce{HC2H3O2(aq) + OH-(aq) -> C2H3O2^-(aq) + H2O(l)}$, with acetic acid written as a molecule."
    - label: b
      points: 1
      prompt: Calculate the molarity of the NaOH solution.
      scoring:
        - "0.5105 / 204.22 = 0.002500 mol KHP = mol NaOH; 0.002500 / 0.02485 L = 0.1006 M."
    - label: c
      points: 1
      prompt: Calculate the molarity of acetic acid in the vinegar.
      scoring:
        - "0.1006 × 0.04140 = 0.004165 mol; 0.004165 / 0.00500 L = 0.833 M."
    - label: d
      points: 1
      prompt: The student overshoots the end point in the vinegar titration, so the solution turns dark pink. Will the calculated molarity of acetic acid be too high, too low, or unchanged? Explain.
      scoring:
        - "Too high: the recorded volume of NaOH is larger than needed, so the calculated moles of acetic acid are too large."
    - label: e
      points: 1
      prompt: Before titrating, the student adds 25 mL of distilled water to the vinegar in the flask. Will the calculated molarity of acetic acid be too high, too low, or unchanged? Explain.
      scoring:
        - "Unchanged: the moles of acetic acid in the flask don't change, so the same volume of NaOH is needed, and the calculation still uses the 5.00 mL sample volume."
  explanation: |
    **(a)** Acetic acid is weak, so it stays whole; $\ce{Na+}$ is a spectator.

    **(b)** $0.5105 / 204.22 = 0.002500$ mol KHP. KHP is monoprotic, so it reacts 1 : 1 with NaOH: 0.002500 mol NaOH in 0.02485 L, which is $0.1006\ M$.

    **(c)** $0.1006 \times 0.04140 = 0.004165$ mol NaOH, which equals the moles of acetic acid (1 : 1). $0.004165 / 0.00500 = 0.833\ M$.

    **(d)** Too high. More NaOH volume is recorded than the acid actually needed.

    **(e)** Unchanged. A titration counts moles of analyte. Water changes the concentration in the flask but not the moles of acid.

- id: apchem-04-zinc-silver-frq
  type: frq
  subject: apchem
  chapter: 4
  sections: ["4.4"]
  cedTopics: ["4.7", "4.9"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A piece of zinc metal is placed in a solution of silver nitrate. Over time, gray-white silver crystals grow on the zinc, and the zinc slowly dissolves.
  parts:
    - label: a
      points: 1
      prompt: Is this an acid–base, precipitation, or oxidation–reduction reaction? Justify your answer.
      scoring:
        - "Oxidation–reduction: zinc's oxidation number changes from 0 to +2 and silver's from +1 to 0 (electrons are transferred)."
    - label: b
      points: 1
      prompt: Write the oxidation half-reaction and the reduction half-reaction.
      scoring:
        - "Oxidation: $\\ce{Zn -> Zn^2+ + 2e-}$. Reduction: $\\ce{Ag+ + e- -> Ag}$. Both needed for the point."
    - label: c
      points: 1
      prompt: Write the balanced net ionic equation for the overall reaction.
      scoring:
        - "$\\ce{Zn(s) + 2Ag+(aq) -> Zn^2+(aq) + 2Ag(s)}$, balanced for charge."
    - label: d
      points: 1
      prompt: Calculate the mass of silver produced when 1.00 g of zinc reacts completely with excess silver nitrate.
      scoring:
        - "1.00 / 65.38 = 0.01530 mol Zn; × 2 = 0.03059 mol Ag; × 107.87 = 3.30 g."
    - label: e
      points: 1
      prompt: A student places a silver wire in a solution of zinc nitrate. Predict whether a reaction occurs, and justify your answer using the observations above.
      scoring:
        - "No reaction: zinc is oxidized by $\\ce{Ag+}$, so zinc gives up electrons more easily than silver; silver metal therefore can't reduce $\\ce{Zn^2+}$ (the reverse reaction)."
  explanation: |
    **(a)** Zn goes from 0 to +2 and Ag from +1 to 0, so electrons move from zinc to silver ions. The nitrate ions are spectators.

    **(b)** $\ce{Zn(s) -> Zn^2+(aq) + 2e-}$ and $\ce{Ag+(aq) + e- -> Ag(s)}$.

    **(c)** Multiply the silver half-reaction by 2 so 2 electrons cancel: $\ce{Zn(s) + 2Ag+(aq) -> Zn^2+(aq) + 2Ag(s)}$. Charge: +2 on each side.

    **(d)** $1.00 / 65.38 = 0.01530$ mol Zn. Two Ag form per Zn: $0.03059$ mol Ag, and $0.03059 \times 107.87 = 3.30$ g.

    **(e)** No reaction. The observations show zinc is more easily oxidized than silver. The reverse reaction, Ag reducing $\ce{Zn^2+}$, would need silver to give up electrons more easily than zinc.
