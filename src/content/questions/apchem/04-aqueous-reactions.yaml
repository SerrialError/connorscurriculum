    Which species can act as **either** a Brønsted–Lowry acid or a Brønsted–Lowry base?
  choices:
    - { id: a, text: "$\\ce{HCO3-}$" }
    - { id: b, text: "$\\ce{ClO4-}$" }
    - { id: c, text: "$\\ce{NH4+}$" }
    - { id: d, text: "$\\ce{Cl-}$" }
  answer: a
  explanation: |
    $\ce{HCO3-}$ can give up its H (becoming $\ce{CO3^2-}$) or accept one (becoming $\ce{H2CO3}$), so it is amphiprotic.
    $\ce{NH4+}$ (C) can only donate. $\ce{ClO4-}$ and $\ce{Cl-}$ have no H to donate.

