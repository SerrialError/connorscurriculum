  sections: ["4.6"]
  cedTopics: ["4.5", "4.6"]
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    What volume of 0.100 M NaOH is needed to neutralize 20.0 mL of 0.250 M HCl?
  choices:
    - { id: a, text: "8.00 mL" }
    - { id: b, text: "25.0 mL" }
    - { id: c, text: "50.0 mL" }
    - { id: d, text: "100. mL" }
  answer: c
  explanation: |
    Moles HCl $= 0.0200 \times 0.250 = 0.00500$ mol. The ratio is 1 : 1, so 0.00500 mol NaOH is needed: $0.00500 / 0.100 = 0.0500$ L $= 50.0$ mL.
    (A) puts the concentrations upside down.

- id: apchem-04-neutralize-sulfuric-volume
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.6"]
  cedTopics: ["4.5", "4.6"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    What volume of 0.200 M NaOH is needed to completely neutralize 30.0 mL of 0.120 M $\ce{H2SO4}$?
  choices:
    - { id: a, text: "18.0 mL" }
    - { id: b, text: "72.0 mL" }
    - { id: c, text: "50.0 mL" }
    - { id: d, text: "36.0 mL" }
  answer: d
  explanation: |
    $\ce{H2SO4 + 2NaOH -> Na2SO4 + 2H2O}$. Moles $\ce{H2SO4} = 0.0300 \times 0.120 = 0.00360$ mol, so NaOH $= 2 \times 0.00360 = 0.00720$ mol. $0.00720 / 0.200 = 0.0360$ L $= 36.0$ mL.
    (A) ignores the 1 : 2 ratio, as $M_1V_1 = M_2V_2$ would.

- id: apchem-04-titration-barium-hydroxide
