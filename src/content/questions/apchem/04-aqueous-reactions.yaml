    (A) leaves out the 5 : 1 ratio. (B) divides by 5 instead of multiplying. (D) divides by the total volume after mixing, 75.0 mL.

- id: apchem-04-back-titration-antacid
  type: mcq
  subject: apchem
  chapter: 4
  sections: ["4.6"]
  cedTopics: ["4.6"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    $\ce{Mg(OH)2}$ doesn't dissolve, so it can't be titrated directly. Instead, an antacid tablet is dissolved in 50.0 mL of 0.200 M HCl, which is more acid than it needs. The **leftover** HCl is then titrated with 12.0 mL of 0.100 M NaOH. What mass of $\ce{Mg(OH)2}$ (58.33 g/mol) was in the tablet?

    $$
    \ce{Mg(OH)2(s) + 2HCl(aq) -> MgCl2(aq) + 2H2O(l)}
    $$
  choices:
    - { id: a, text: "0.513 g" }
    - { id: b, text: "0.257 g" }
    - { id: c, text: "0.292 g" }
    - { id: d, text: "0.0350 g" }
  answer: b
  explanation: |
    HCl added: $0.0500 \times 0.200 = 0.0100$ mol. HCl left over (equal to the NaOH): $0.0120 \times 0.100 = 0.00120$ mol. HCl that reacted with the tablet: $0.0100 - 0.00120 = 0.00880$ mol. $\ce{Mg(OH)2}$: $0.00880 / 2 = 0.00440$ mol, and $0.00440 \times 58.33 = 0.257$ g.
    (A) skips the 1 : 2 ratio. (C) doesn't subtract the leftover acid. (D) uses only the leftover acid.

