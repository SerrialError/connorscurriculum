    - { id: b, text: "$\\ce{CO3^2-(aq) + H+(aq) -> H2O(l) + CO2(g)}$" }
    - { id: c, text: "$\\ce{CO3^2-(aq) + 2H+(aq) -> H2O(l) + CO2(g)}$" }
