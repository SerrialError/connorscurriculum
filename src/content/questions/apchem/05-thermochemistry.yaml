- id: apchem-05-freezing-diagram
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.4"]
  cedTopics: ["6.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which describes a correct enthalpy diagram for water freezing, $\ce{H2O(l) -> H2O(s)}$?
  choices:
    - { id: a, text: "$\\ce{H2O(s)}$ above $\\ce{H2O(l)}$, with an upward arrow, because freezing absorbs heat" }
    - { id: b, text: "$\\ce{H2O(s)}$ and $\\ce{H2O(l)}$ at the same level, because no bonds are broken" }
    - { id: c, text: "$\\ce{H2O(s)}$ above $\\ce{H2O(l)}$, with a downward arrow, because freezing releases heat" }
    - { id: d, text: "$\\ce{H2O(s)}$ below $\\ce{H2O(l)}$, with a downward arrow, because freezing releases heat" }
  answer: d
  explanation: |
    Freezing forms more attractions between molecules, which releases energy, so the solid is lower in enthalpy. The arrow from liquid to solid points down: ΔH < 0.
    A physical change still has an enthalpy change (B), from attractions between molecules. (C) contradicts itself: a product above the reactant can't be reached by a downward arrow.

