- id: apchem-05-bond-enthalpy-hf
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.8"]
  cedTopics: ["6.7"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    Estimate ΔH for $\ce{H2(g) + F2(g) -> 2HF(g)}$. Bond enthalpies: H–H 436 kJ/mol, F–F 155 kJ/mol, H–F 567 kJ/mol.
  choices:
    - { id: a, text: "+543 kJ" }
    - { id: b, text: "+24 kJ" }
    - { id: c, text: "−543 kJ" }
    - { id: d, text: "−976 kJ" }
  answer: c
  explanation: |
    Broken: $436 + 155 = 591$ kJ. Formed: $2(567) = 1134$ kJ. $\Delta H \approx 591 - 1134 = -543$ kJ.
    (B) counts only one H–F bond. (A) is formed minus broken.

- id: apchem-05-bond-enthalpy-hydrogenation
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.8"]
  cedTopics: ["6.7"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  group: ethylene-hydrogenation
  prompt: |
    Estimate ΔH for $\ce{H2C=CH2(g) + H2(g) -> H3C-CH3(g)}$ using bond enthalpies (kJ/mol): C=C 614, C–C 348, C–H 413, H–H 436.
  choices:
    - { id: a, text: "+124 kJ" }
    - { id: b, text: "−124 kJ" }
    - { id: c, text: "−538 kJ" }
    - { id: d, text: "+702 kJ" }
  answer: b
  explanation: |
    Only the bonds that change need counting. Broken: one C=C and one H–H, $614 + 436 = 1050$ kJ. Formed: one C–C and two new C–H, $348 + 2(413) = 1174$ kJ. $\Delta H \approx 1050 - 1174 = -124$ kJ.
    (Counting every bond in both molecules gives the same answer, because the four original C–H bonds cancel.) (D) forgets the two new C–H bonds. (A) is formed minus broken.

- id: apchem-05-bond-estimate-why-differs
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.8"]
  cedTopics: ["6.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    ΔH for $\ce{CH4(g) + 2O2(g) -> CO2(g) + 2H2O(g)}$ is −798 kJ estimated from bond enthalpies, but −802 kJ calculated from enthalpies of formation. What best explains the difference?
  choices:
    - { id: a, text: "Bond enthalpies are averages over many compounds, so they give only an estimate" }
    - { id: b, text: "Enthalpies of formation leave out the energy of the bonds in the reactants" }
    - { id: c, text: "Bond enthalpies apply only to liquids, but this reaction is in the gas phase" }
    - { id: d, text: "Enthalpies of formation are estimates, while bond enthalpies are exact values" }
  answer: a
  explanation: |
    A table lists one average C–H value, but the real strength of a C–H bond varies a little from molecule to molecule. Enthalpies of formation come from measurements on the actual compounds, so they are more accurate (the opposite of D). Bond enthalpies are for gases, so (C) is backward.

- id: apchem-05-stronger-bonds-formed
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.8"]
  cedTopics: ["6.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In a reaction, the bonds formed in the products are stronger overall than the bonds broken in the reactants. What is true about the reaction?
  choices:
    - { id: a, text: "It is endothermic, because forming strong bonds requires more energy than breaking weak ones" }
    - { id: b, text: "It is exothermic, because breaking the weaker bonds in the reactants releases energy" }
    - { id: c, text: "It is endothermic, because strong bonds are harder to form and absorb energy as they form" }
    - { id: d, text: "It is exothermic, because forming the bonds releases more energy than breaking costs" }
  answer: d
  explanation: |
    $\Delta H \approx \Sigma(\text{broken}) - \Sigma(\text{formed})$. If the bonds formed are stronger, more energy is released than absorbed, so ΔH is negative. Breaking bonds always costs energy (B), and forming them always releases it (A, C).

