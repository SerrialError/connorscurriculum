- id: apchem-05-heat-lost-equals-gained
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.5"]
  cedTopics: ["6.3"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    A hot iron bar is dropped into cool water in a perfectly insulated container. Once the bar and water reach the same temperature, which statement is true?
  choices:
    - { id: a, text: "The heat lost by the iron equals the heat gained by the water" }
    - { id: b, text: "The temperature change of the iron equals that of the water" }
    - { id: c, text: "The iron lost less heat than the water gained, because iron is denser" }
    - { id: d, text: "The water lost heat to the iron until both reached the same temperature" }
  answer: a
  explanation: |
    Energy is conserved, so $q_\text{iron} = -q_\text{water}$. The temperature **changes** usually differ (B), because the two have different masses and specific heats. Heat flows from the hotter iron to the water, not the reverse (D).

