  authors: ["Claude"]
  prompt: |
    100.0 g of water at 80.0 °C is mixed with 50.0 g of water at 20.0 °C in an insulated cup. What is the final temperature?
  choices:
    - { id: a, text: "50.0 °C" }
    - { id: b, text: "40.0 °C" }
    - { id: c, text: "53.3 °C" }
    - { id: d, text: "60.0 °C" }
  answer: d
  explanation: |
    $100.0(4.18)(T_f - 80.0) + 50.0(4.18)(T_f - 20.0) = 0$. The 4.18 cancels: $100T_f - 8000 + 50T_f - 1000 = 0$, so $150T_f = 9000$ and $T_f = 60.0$ °C.
    (A) is the simple average, which only works for equal masses. The final temperature is closer to the starting temperature of the larger sample.

- id: apchem-05-copper-in-water
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.5"]
  cedTopics: ["6.3", "6.4"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A 75.0 g copper block ($c = 0.385$ J/(g·°C)) at 98.0 °C is placed in 150.0 g of water ($c = 4.18$ J/(g·°C)) at 21.0 °C. Assuming no heat is lost, what is the final temperature?
  choices:
    - { id: a, text: "59.5 °C" }
    - { id: b, text: "24.4 °C" }
    - { id: c, text: "27.7 °C" }
    - { id: d, text: "21.3 °C" }
  answer: b
  explanation: |
    $(75.0)(0.385)(T_f - 98.0) + (150.0)(4.18)(T_f - 21.0) = 0$

    $28.875\,T_f - 2829.8 + 627.0\,T_f - 13{,}167 = 0$, so $655.9\,T_f = 15{,}996.8$ and $T_f = 24.4$ °C.

    The water's heat capacity (627 J/°C) is much larger than the copper's (28.9 J/°C), so the final temperature is close to the water's starting temperature. (A) is the average of the two starting temperatures.

- id: apchem-05-identify-metal
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.5"]
  cedTopics: ["6.4"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A 40.0 g sample of an unknown metal at 100.0 °C is placed in 60.0 g of water at 20.0 °C. The final temperature is 24.6 °C. Which metal is it? The specific heat of water is 4.18 J/(g·°C).

    | Metal | c (J/(g·°C)) |
    |---|---|
    | Aluminum | 0.897 |
    | Iron | 0.449 |
    | Copper | 0.385 |
    | Gold | 0.129 |
  choices:
    - { id: a, text: "Aluminum" }
    - { id: b, text: "Iron" }
    - { id: c, text: "Gold" }
    - { id: d, text: "Copper" }
  answer: d
  explanation: |
    Heat gained by the water: $(60.0)(4.18)(24.6 - 20.0) = 1154$ J. The metal lost the same amount while cooling $100.0 - 24.6 = 75.4$ °C:

    $c = 1154 / (40.0 \times 75.4) = 0.383$ J/(g·°C), closest to copper.

    Using the water's ΔT for the metal too gives a value about 16 times too large, which matches nothing in the table.

