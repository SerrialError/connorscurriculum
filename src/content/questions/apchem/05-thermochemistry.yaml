    $\ce{N2(g) + 3H2(g) -> 2NH3(g)}$ has $\Delta H = -92.4$ kJ. What is ΔH for $\ce{2NH3(g) -> N2(g) + 3H2(g)}$?
  choices:
    - { id: a, text: "−92.4 kJ" }
