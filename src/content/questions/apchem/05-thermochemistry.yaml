- id: apchem-05-heat-burning-hydrogen
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.4"]
  cedTopics: ["6.6"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    $\ce{2H2(g) + O2(g) -> 2H2O(l)}$, $\Delta H = -571.6$ kJ. How much heat is released when 5.00 g of $\ce{H2}$ burns in excess oxygen?
  choices:
    - { id: a, text: "286 kJ" }
    - { id: b, text: "1420 kJ" }
    - { id: c, text: "709 kJ" }
    - { id: d, text: "354 kJ" }
  answer: c
  explanation: |
    $5.00 / 2.016 = 2.480$ mol $\ce{H2}$. The equation releases 571.6 kJ per 2 mol $\ce{H2}$: $2.480 \times \tfrac{571.6}{2} = 709$ kJ.
    (B) uses 571.6 kJ per mole of $\ce{H2}$ instead of per 2 mol. (D) divides by 2 twice.

- id: apchem-05-heat-forming-no
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.4"]
  cedTopics: ["6.6"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    $\ce{N2(g) + O2(g) -> 2NO(g)}$, $\Delta H = +180.8$ kJ. How much heat is absorbed when 15.0 g of NO forms?
  choices:
    - { id: a, text: "90.4 kJ" }
    - { id: b, text: "45.2 kJ" }
    - { id: c, text: "22.6 kJ" }
    - { id: d, text: "180.8 kJ" }
  answer: b
  explanation: |
    $\mathcal{M}(\ce{NO}) = 14.01 + 16.00 = 30.01$ g/mol, so $15.0 / 30.01 = 0.4998$ mol NO. 180.8 kJ goes with 2 mol NO: $0.4998 \times \tfrac{180.8}{2} = 45.2$ kJ.
    (A) gives the heat for 1 mol of NO. (D) uses 180.8 kJ per mole of NO.

- id: apchem-05-mass-propane-for-heat
