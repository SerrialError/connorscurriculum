- id: apchem-05-naoh-dissolving-frq
  type: frq
  subject: apchem
  chapter: 5
  sections: ["5.2", "5.5"]
  cedTopics: ["6.1", "6.4", "6.6"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A student dissolves 2.00 g of solid NaOH in 100.0 g of water in a foam-cup calorimeter with a lid. The temperature of the water rises from 21.0 °C to 26.2 °C. Assume the solution has a specific heat of 4.18 J/(g·°C) and that no heat is absorbed by the cup.
  parts:
    - label: a
      points: 1
      prompt: Is the dissolving of NaOH exothermic or endothermic? Justify your answer using the data.
      scoring:
        - "Exothermic: the temperature of the solution (the surroundings) rose, so the dissolving process released heat."
    - label: b
      points: 1
      prompt: Calculate the heat absorbed by the solution, in joules.
      scoring:
        - "q = (102.0 g)(4.18 J/(g·°C))(5.2 °C) = 2200 J (2.2 × 10³ J). Using 100.0 g (2170 J) also earns the point."
    - label: c
      points: 1
      prompt: Calculate the number of moles of NaOH dissolved.
      scoring:
        - "2.00 g / 40.00 g/mol = 0.0500 mol."
    - label: d
      points: 1
      prompt: Calculate ΔH for dissolving NaOH, in kJ/mol. Include the sign.
      scoring:
        - "ΔH = −2.2 kJ / 0.0500 mol = −44 kJ/mol, consistent with (b), with a negative sign."
    - label: e
      points: 1
      prompt: Dissolving NaOH breaks the attractions between Na⁺ and OH⁻ ions in the solid and forms attractions between the ions and water molecules. Explain, in terms of these attractions, why the process releases energy.
      scoring:
        - "Breaking the ion–ion attractions absorbs energy and forming ion–dipole attractions releases energy; more energy is released by forming the ion–water attractions than is absorbed in separating the ions."
    - label: f
      points: 1
      prompt: Another student forgets the lid. Would that student's calculated value of ΔH be more negative, less negative, or the same? Explain.
      scoring:
        - "Less negative (smaller magnitude): heat escapes, so the measured temperature rise and the calculated q are too small."
  explanation: |
    **(a)** The water warmed, so heat left the dissolving process and entered the water. Exothermic.

    **(b)** Mass of solution $= 100.0 + 2.00 = 102.0$ g, and $\Delta T = 26.2 - 21.0 = 5.2$ °C. $q = (102.0)(4.18)(5.2) = 2217$ J, or $2.2 \times 10^3$ J to two significant figures.

    **(c)** $\mathcal{M}(\ce{NaOH}) = 22.99 + 16.00 + 1.008 = 40.00$ g/mol. $2.00 / 40.00 = 0.0500$ mol.

    **(d)** $q_\text{rxn} = -2.2$ kJ. $\Delta H = -2.2 / 0.0500 = -44$ kJ/mol.

    **(e)** Separating the ions costs energy; surrounding each ion with oriented water molecules releases energy. The overall process released energy, so the ion–water attractions formed release more than the ion–ion attractions broken cost.

    **(f)** Less negative. Some of the released heat warms the air instead of the solution.

- id: apchem-05-methanol-combustion-frq
  type: frq
  subject: apchem
  chapter: 5
  sections: ["5.4", "5.7"]
  cedTopics: ["6.2", "6.6", "6.8"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Methanol, $\ce{CH3OH(l)}$, is used as a racing fuel. It burns according to:

    $$
    \ce{2CH3OH(l) + 3O2(g) -> 2CO2(g) + 4H2O(l)}
    $$

    | Substance | ΔH°f (kJ/mol) |
    |---|---|
    | $\ce{CH3OH(l)}$ | −238.6 |
    | $\ce{CO2(g)}$ | −393.5 |
    | $\ce{H2O(l)}$ | −285.8 |
    | $\ce{H2O(g)}$ | −241.8 |
  parts:
    - label: a
      points: 1
      prompt: Write the balanced equation for the formation reaction of $\ce{CH3OH(l)}$ from its elements in their standard states.
      scoring:
        - "$\\ce{C(s) + 2H2(g) + 1/2O2(g) -> CH3OH(l)}$, with 1 mol of product and standard states."
    - label: b
      points: 1
      prompt: Calculate ΔH° for the combustion reaction as written above.
      scoring:
        - "Products: 2(−393.5) + 4(−285.8) = −1930.2; reactants: 2(−238.6) = −477.2; ΔH° = −1930.2 − (−477.2) = −1453.0 kJ."
    - label: c
      points: 1
      prompt: Calculate the heat released when 8.00 g of methanol burns.
      scoring:
        - "8.00 / 32.04 = 0.2497 mol; × 1453.0 / 2 = 181 kJ released."
    - label: d
      points: 1
      prompt: Sketch or describe an enthalpy diagram for the combustion reaction, labeling the reactants, the products, and ΔH.
      scoring:
        - "Reactants (2CH₃OH + 3O₂) drawn higher than products (2CO₂ + 4H₂O), with a downward arrow labeled ΔH = −1453 kJ."
    - label: e
      points: 1
      prompt: If the water formed were $\ce{H2O(g)}$ instead of $\ce{H2O(l)}$, would ΔH° be more negative, less negative, or the same? Justify your answer.
      scoring:
        - "Less negative: H₂O(g) is higher in enthalpy than H₂O(l) (ΔH°f −241.8 vs −285.8), so less heat is released; the heat of condensing the water isn't released."
  explanation: |
    **(a)** One mole of methanol from C(s), $\ce{H2(g)}$, and $\ce{O2(g)}$: $\ce{C(s) + 2H2(g) + 1/2O2(g) -> CH3OH(l)}$.

    **(b)** Products: $2(-393.5) + 4(-285.8) = -787.0 - 1143.2 = -1930.2$ kJ. Reactants: $2(-238.6) + 3(0) = -477.2$ kJ. $\Delta H^\circ = -1930.2 + 477.2 = -1453.0$ kJ.

    **(c)** $\mathcal{M}(\ce{CH3OH}) = 12.01 + 4(1.008) + 16.00 = 32.04$ g/mol. $8.00 / 32.04 = 0.2497$ mol. The equation releases 1453.0 kJ per 2 mol: $0.2497 \times 726.5 = 181$ kJ.

    **(d)** Exothermic, so the products sit below the reactants and the arrow points down.

    **(e)** Less negative. With $\ce{H2O(g)}$, the products are $4 \times 44.0 = 176.0$ kJ higher, so $\Delta H^\circ = -1277.0$ kJ.

- id: apchem-05-ethane-hess-frq
  type: frq
  subject: apchem
  chapter: 5
  sections: ["5.4", "5.6"]
  cedTopics: ["6.6", "6.9"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  group: ethane-combustion-heat
  prompt: |
    The standard enthalpy of formation of ethane, $\ce{C2H6(g)}$, can't be measured directly, because carbon and hydrogen don't react cleanly to form ethane. It can be found from these reactions:

    | | Equation | ΔH (kJ) |
    |---|---|---|
    | (1) | $\ce{C(s) + O2(g) -> CO2(g)}$ | −393.5 |
    | (2) | $\ce{H2(g) + 1/2O2(g) -> H2O(l)}$ | −285.8 |
    | (3) | $\ce{C2H6(g) + 7/2O2(g) -> 2CO2(g) + 3H2O(l)}$ | −1560 |
  parts:
    - label: a
      points: 1
      prompt: Write the target equation, the formation reaction of ethane.
      scoring:
        - "$\\ce{2C(s) + 3H2(g) -> C2H6(g)}$."
    - label: b
      points: 1
      prompt: State how each of equations (1), (2), and (3) must be changed to add up to the target equation.
      scoring:
        - "(1) × 2; (2) × 3; (3) reversed. All three needed for the point."
    - label: c
      points: 1
      prompt: Calculate ΔH°f of ethane.
      scoring:
        - "2(−393.5) + 3(−285.8) + 1560 = −787.0 − 857.4 + 1560 = −84 kJ/mol."
    - label: d
      points: 1
      prompt: Explain why adding the ΔH values of the adjusted equations gives ΔH for the target reaction.
      scoring:
        - "The adjusted equations add up to the target reaction, and energy is conserved: the enthalpy change depends only on the starting substances and the final substances, so the total for the steps equals the enthalpy change of the overall reaction."
    - label: e
      points: 1
      prompt: Using equation (3), calculate the heat released when 1.00 mol of $\ce{O2}$ reacts with excess ethane.
      scoring:
        - "1560 kJ per 3.5 mol O₂: 1560 / 3.5 = 446 kJ released."
  explanation: |
    **(a)** One mole of ethane from its elements: $\ce{2C(s) + 3H2(g) -> C2H6(g)}$.

    **(b)** Double (1) to get 2C, triple (2) to get $\ce{3H2}$, and reverse (3) to put $\ce{C2H6}$ on the product side. Then $\ce{2CO2}$ and $\ce{3H2O}$ cancel, and $\ce{O2}$ cancels ($2 + \tfrac{3}{2} = \tfrac{7}{2}$).

    **(c)** $2(-393.5) + 3(-285.8) + (+1560) = -84$ kJ/mol. (Equation (3) is given to the nearest kJ, so the answer is good to about ±1 kJ.)

    **(d)** Hess's law. The steps add up to the target, and because energy is conserved, the enthalpy change for going from the same reactants to the same products is the same whatever the route.

    **(e)** 1560 kJ is released for every 7/2 = 3.5 mol of $\ce{O2}$: $1560 / 3.5 = 446$ kJ.
