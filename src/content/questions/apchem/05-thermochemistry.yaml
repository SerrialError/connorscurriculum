  prompt: |
    50.0 mL of 0.100 M $\ce{AgNO3}$ and 50.0 mL of 0.100 M NaCl, both at 22.00 °C, are mixed in a calorimeter, and AgCl precipitates. The temperature rises to 22.78 °C. Assume the mixture has a mass of 100.0 g and a specific heat of 4.18 J/(g·°C). What is ΔH for $\ce{Ag+(aq) + Cl-(aq) -> AgCl(s)}$?
  choices:
