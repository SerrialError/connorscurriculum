# Practice questions for Chapter 5 (Thermochemistry). Original; not taken from the textbook or College
# Board materials. Endothermic and exothermic processes are AP topic 6.1, energy diagrams 6.2, heat
# transfer and thermal equilibrium 6.3, heat capacity and calorimetry 6.4, enthalpy of reaction 6.6,
# bond enthalpies 6.7, enthalpies of formation 6.8, and Hess's law 6.9. Internal energy, work, and state
# functions are class only (the CED excludes them), so those questions have cedTopics: [].
# The specific heat of water, 4.18 J/(g·°C), isn't on the equation sheet, so prompts give it.
# calculation: true marks questions that need a numeric calculation.

# ---------------------------------------------------------------------------
# 5.1–5.3 Energy, the first law, and enthalpy
# ---------------------------------------------------------------------------

- id: apchem-05-exothermic-signs
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.2"]
  cedTopics: ["6.1"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which statement describes every **exothermic** process?
  choices:
    - { id: a, text: "Heat flows from the surroundings into the system, so q is positive" }
    - { id: b, text: "Heat flows from the system to the surroundings, so q is negative" }
    - { id: c, text: "Heat flows from the system to the surroundings, so q is positive" }
    - { id: d, text: "No heat flows, but the temperature of the system rises" }
  answer: b
  explanation: |
    Exothermic means the system releases heat. Signs are from the system's point of view, so energy leaving the system makes q (and ΔH) negative. (A) describes an endothermic process, and (C) has the right direction but the wrong sign.

- id: apchem-05-cold-pack
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.2"]
  cedTopics: ["6.1"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    When ammonium chloride dissolves in water, the beaker becomes cold. Which statement is correct?
  choices:
    - { id: a, text: "The dissolving is exothermic, because the beaker loses heat to the room" }
    - { id: b, text: "The dissolving is exothermic, because cold is released into the water" }
    - { id: c, text: "The dissolving is exothermic, because heat flows from the room into the beaker" }
    - { id: d, text: "The dissolving is endothermic, because heat flows from the water into the process" }
  answer: d
  explanation: |
    The water (part of the surroundings) gets colder, so energy left it and went into the dissolving process. The process absorbs heat: endothermic, ΔH > 0.
    Heat from the room (C) warms the beaker back up later; it isn't what the dissolving does, and the beaker losing heat (A) would make it warmer, not colder. "Cold" (B) isn't a form of energy.

- id: apchem-05-thermal-equilibrium-particles
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.1"]
  cedTopics: ["6.3"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A hot copper block is placed in cool water in an insulated container. Which statement best explains, at the particle level, why the two eventually reach the same temperature?
  choices:
    - { id: a, text: "Copper atoms gradually move into the water until both parts of the container hold equal numbers of particles" }
    - { id: b, text: "Collisions transfer kinetic energy from faster to slower particles until the average kinetic energies are equal" }
    - { id: c, text: "Cold flows from the water into the copper block until the copper has absorbed as much cold as the water holds" }
    - { id: d, text: "The total kinetic energy of all the copper atoms becomes equal to the total kinetic energy of all the water molecules" }
  answer: b
  explanation: |
    Temperature measures average kinetic energy. The copper particles move faster on average; in collisions they pass energy to the slower water molecules until the averages, and so the temperatures, are equal.
    (D) is a common slip: the **totals** need not be equal, because the copper and the water have different numbers of particles.

- id: apchem-05-heat-vs-temperature
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.1"]
  cedTopics: ["6.3"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Sample X is 100 g of water at 50 °C. Sample Y is 200 g of water at 50 °C. Which statement is true?
  choices:
    - { id: a, text: "The water molecules in Y have a greater average kinetic energy than those in X" }
    - { id: b, text: "Heat flows from Y to X when they touch, because Y contains more thermal energy" }
    - { id: c, text: "The molecules have the same average kinetic energy, but Y has more total thermal energy" }
    - { id: d, text: "X and Y contain the same total thermal energy, because they have the same temperature" }
  answer: c
  explanation: |
    Same temperature means the same average kinetic energy per molecule. Y has twice as many molecules, so its total thermal energy is larger.
    No heat flows between objects at the same temperature (B), whatever their sizes.

- id: apchem-05-endothermic-bond-breaking
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.1"]
  cedTopics: ["6.1"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which process is **endothermic**?
  choices:
    - { id: a, text: "$\\ce{2Cl(g) -> Cl2(g)}$" }
    - { id: b, text: "$\\ce{H2O(g) -> H2O(l)}$" }
    - { id: c, text: "$\\ce{Na+(g) + Cl-(g) -> NaCl(s)}$" }
    - { id: d, text: "$\\ce{Cl2(g) -> 2Cl(g)}$" }
  answer: d
  explanation: |
    Breaking a bond always takes energy. The other three bring attracted particles together (forming a bond, condensing, and forming an ionic lattice), which releases energy.

- id: apchem-05-dissolving-exothermic-reason
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.2"]
  cedTopics: ["6.1"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    When solid $\ce{CaCl2}$ dissolves in water, the temperature of the solution rises. Which statement explains this?
  choices:
    - { id: a, text: "Breaking the ionic attractions in the solid releases more energy than forming the ion–water attractions absorbs" }
    - { id: b, text: "Forming ion–water attractions releases more energy than separating the ions and the water molecules requires" }
    - { id: c, text: "No attractions are broken when an ionic solid dissolves, so the process can only release energy" }
    - { id: d, text: "The ions gain kinetic energy as they leave the crystal, which requires heat to flow in from outside" }
  answer: b
  explanation: |
    Dissolving breaks attractions (ion–ion in the solid and some between water molecules), which costs energy, and forms ion–dipole attractions, which releases energy. The temperature rose, so the energy released was larger: exothermic.
    (A) has the energy directions backward: breaking attractions never releases energy.

- id: apchem-05-system-surroundings
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.2"]
  cedTopics: ["6.1"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    A reaction between two dissolved substances is carried out in a coffee-cup calorimeter. Which is part of the **system**?
  choices:
    - { id: a, text: "The water the reactants are dissolved in" }
    - { id: b, text: "The foam cups and the lid" }
    - { id: c, text: "The reacting ions or molecules" }
    - { id: d, text: "The thermometer and the stirrer" }
  answer: c
  explanation: |
    The system is the reaction itself. The water, cups, and thermometer are the surroundings; the water's temperature change is how the heat of the system is measured.

- id: apchem-05-first-law-calc
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.2"]
  cedTopics: []
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A gas absorbs 120 J of heat and does 45 J of work as it expands. What is ΔE for the gas? (Use $\Delta E = q + w$.)
  choices:
    - { id: a, text: "+75 J" }
    - { id: b, text: "+165 J" }
    - { id: c, text: "−75 J" }
    - { id: d, text: "−165 J" }
  answer: a
  explanation: |
    Heat absorbed: $q = +120$ J. Work done **by** the system: $w = -45$ J. $\Delta E = 120 + (-45) = +75$ J.
    (B) treats the work as done on the gas.

- id: apchem-05-work-sign
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.2"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A gas in a cylinder is compressed by a piston while no heat flows in or out. Which describes the work and the internal energy of the gas?
  choices:
    - { id: a, text: "w is negative, and the internal energy of the gas decreases" }
    - { id: b, text: "w is negative, and the internal energy of the gas increases" }
    - { id: c, text: "w is positive, and the internal energy of the gas decreases" }
    - { id: d, text: "w is positive, and the internal energy of the gas increases" }
  answer: d
  explanation: |
    Work done **on** the system is positive. With $q = 0$, $\Delta E = w > 0$, so the internal energy rises (and the gas warms up).

- id: apchem-05-state-function
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.2"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which quantity is a **state function**, depending only on the starting and ending states of a system?
  choices:
    - { id: a, text: "The heat q transferred during the change" }
    - { id: b, text: "The work w done during the change" }
    - { id: c, text: "The enthalpy change ΔH of the change" }
    - { id: d, text: "The time taken to make the change" }
  answer: c
  explanation: |
    Enthalpy (like internal energy) is a state function: ΔH depends only on the start and end. Heat and work separately depend on the path taken, even though their sum doesn't. This is why Hess's law works.

- id: apchem-05-delta-h-meaning
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.3"]
  cedTopics: ["6.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    What does the enthalpy change, ΔH, of a reaction carried out in an open beaker represent?
  choices:
    - { id: a, text: "The heat absorbed or released by the reaction at constant pressure" }
    - { id: b, text: "The total energy contained in the bonds of the products" }
    - { id: c, text: "The minimum energy the reactants need to start reacting" }
    - { id: d, text: "The change in temperature of the surroundings during the reaction" }
  answer: a
  explanation: |
    At constant pressure, $\Delta H = q_P$: the heat gained (positive) or released (negative) by the reaction. (C) is the activation energy (Chapter 14). (D) is a temperature, not an energy; it's used to **measure** ΔH.

- id: apchem-05-temperature-rise-why
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.3"]
  cedTopics: ["6.6"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    An exothermic reaction in solution makes the solution warmer. Which statement best explains the temperature rise?
  choices:
    - { id: a, text: "The products have more potential energy than the reactants, and the extra comes from the water" }
    - { id: b, text: "The reactants absorb heat from the solution, which causes the product molecules to move faster" }
    - { id: c, text: "The products have less potential energy than the reactants, and the difference becomes kinetic energy of particles" }
    - { id: d, text: "Bonds in the reactants release energy as they break, which then raises the temperature of the water" }
  answer: c
  explanation: |
    Stronger bonds form than were broken, so the products have lower chemical potential energy. That energy appears as faster particle motion (higher kinetic energy), which collisions pass on to the water, raising its temperature.
    (D) is wrong: breaking bonds absorbs energy. (A) and (B) describe an endothermic reaction.

