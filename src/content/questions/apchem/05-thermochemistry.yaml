    (B) is the reciprocal. (C) divides q by m only.

- id: apchem-05-mix-water-final-temp
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.5"]
  cedTopics: ["6.3", "6.4"]
  difficulty: 2
