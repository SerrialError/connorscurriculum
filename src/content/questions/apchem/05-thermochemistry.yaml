- id: apchem-05-diagram-endothermic
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.4"]
  cedTopics: ["6.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    On an enthalpy diagram for a reaction, the products are drawn **higher** than the reactants. What does this show?
  choices:
    - { id: a, text: "The reaction is exothermic, and ΔH is negative" }
    - { id: b, text: "The reaction is exothermic, and ΔH is positive" }
    - { id: c, text: "The reaction is endothermic, and ΔH is negative" }
    - { id: d, text: "The reaction is endothermic, and ΔH is positive" }
  answer: d
  explanation: |
    Products higher in enthalpy than reactants means the system gained energy: $\Delta H = H_\text{products} - H_\text{reactants} > 0$, endothermic.

- id: apchem-05-liquid-vs-gas-water
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.4"]
  cedTopics: ["6.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Methane burns to form either $\ce{H2O(l)}$ or $\ce{H2O(g)}$. Which reaction releases more heat per mole of methane, and why?
  choices:
    - { id: a, text: "Forming $\\ce{H2O(g)}$, because gas molecules carry more kinetic energy away" }
    - { id: b, text: "Forming $\\ce{H2O(l)}$, because water vapor releases heat when it condenses" }
    - { id: c, text: "Forming $\\ce{H2O(g)}$, because breaking attractions between water molecules releases heat" }
    - { id: d, text: "Both the same, because the same bonds are broken and formed in each reaction" }
  answer: b
  explanation: |
    Liquid water is lower in enthalpy than water vapor. Making liquid water is like making vapor and then condensing it, and condensing releases heat, so ΔH is more negative.
    (C) has the energy backward: separating molecules absorbs energy. (D) ignores the attractions between molecules, which differ between the states.

- id: apchem-05-limiting-heat
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.4"]
  cedTopics: ["6.6"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    $\ce{CH4(g) + 2O2(g) -> CO2(g) + 2H2O(l)}$, $\Delta H = -890$ kJ. A mixture of 8.00 g of $\ce{CH4}$ and 16.0 g of $\ce{O2}$ reacts until one reactant is used up. How much heat is released?
  choices:
    - { id: a, text: "444 kJ" }
    - { id: b, text: "890 kJ" }
    - { id: c, text: "223 kJ" }
    - { id: d, text: "111 kJ" }
  answer: c
  explanation: |
    $\ce{CH4}$: $8.00 / 16.04 = 0.499$ mol. $\ce{O2}$: $16.0 / 32.00 = 0.500$ mol, but 0.499 mol $\ce{CH4}$ would need 0.998 mol $\ce{O2}$, so **$\ce{O2}$ is limiting**.
    890 kJ is released per 2 mol $\ce{O2}$: $0.500 \times \tfrac{890}{2} = 223$ kJ.
    (A) is the heat if all the methane burned, which there isn't enough oxygen for.

