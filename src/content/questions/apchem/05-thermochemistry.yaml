- id: apchem-05-why-hess-works
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.6"]
  cedTopics: ["6.9"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Why can the enthalpy change of an overall reaction be found by adding the enthalpy changes of a series of steps?
  choices:
    - { id: a, text: "Each step in the series must release heat, so the amounts can simply be added" }
    - { id: b, text: "The steps always happen at the same rate, so their enthalpy changes are equal" }
    - { id: c, text: "Energy is conserved, and ΔH depends only on the starting and ending substances" }
    - { id: d, text: "The intermediate substances store the energy, so they must be added back in" }
  answer: c
  explanation: |
    Energy is neither created nor destroyed, so going from the same reactants to the same products by any route involves the same total enthalpy change. The steps can be endothermic or exothermic (A), and rates have nothing to do with it (B).

