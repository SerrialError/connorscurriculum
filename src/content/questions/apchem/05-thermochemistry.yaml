- id: apchem-05-positive-formation-meaning
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.7"]
  cedTopics: ["6.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Acetylene, $\ce{C2H2(g)}$, has ΔH°f = +226.7 kJ/mol. What does the positive sign mean?
  choices:
    - { id: a, text: "Acetylene can't be made from carbon and hydrogen under any conditions" }
    - { id: b, text: "Acetylene has more enthalpy than the carbon and hydrogen it is made from" }
    - { id: c, text: "Burning acetylene absorbs heat instead of releasing it to the surroundings" }
    - { id: d, text: "Acetylene has less enthalpy than the carbon and hydrogen it is made from" }
  answer: b
  explanation: |
    ΔH°f is the enthalpy of the compound minus that of its elements. Positive means the compound is higher, so forming it from the elements absorbs heat. Its combustion is still strongly exothermic (C is false), because $\ce{CO2}$ and $\ce{H2O}$ are far lower in enthalpy.

