    How much heat is needed to warm 150. g of water from 20.0 °C to 45.0 °C? The specific heat of water is 4.18 J/(g·°C).
  choices:
    - { id: a, text: "15.7 kJ" }
    - { id: b, text: "28.2 kJ" }
    - { id: c, text: "0.897 kJ" }
    - { id: d, text: "40.8 kJ" }
  answer: a
  explanation: |
    $q = mc\Delta T = (150.)(4.18)(25.0) = 15{,}700$ J $= 15.7$ kJ.
    (B) uses the final temperature, 45.0 °C, as ΔT. (D) uses 65.0 °C, the sum of the temperatures.

- id: apchem-05-which-warms-more
  type: mcq
  subject: apchem
  chapter: 5
  sections: ["5.5"]
  cedTopics: ["6.4"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Equal masses of aluminum ($c = 0.897$ J/(g·°C)) and copper ($c = 0.385$ J/(g·°C)), both at 20 °C, each absorb 500 J of heat. Which statement is correct?
  choices:
    - { id: a, text: "The aluminum ends at the higher temperature, because its specific heat is larger" }
    - { id: b, text: "Both end at the same temperature, because they absorbed the same amount of heat" }
    - { id: c, text: "The copper ends at the higher temperature, because its specific heat is smaller" }
    - { id: d, text: "The copper ends at the lower temperature, because copper conducts heat better" }
  answer: c
  explanation: |
    $\Delta T = q / (mc)$. With the same q and m, the smaller c gives the larger ΔT. Copper needs less energy per degree, so the same 500 J warms it more (about 2.3 times as much).

- id: apchem-05-find-specific-heat
  type: mcq
