    - { id: b, text: "6" }
    - { id: c, text: "7" }
    - { id: d, text: "14" }
  answer: c
  explanation: |
    Orbitals per subshell $= 2l + 1 = 2(3) + 1 = 7$. This is an f subshell, with $m_l = -3, -2, -1, 0, +1, +2, +3$. 14 is the most electrons it holds.

- id: apchem-06-last-electron-quantum-numbers
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.5", "6.8"]
  cedTopics: []
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Fluorine is $1s^2\,2s^2\,2p^5$. Using the convention that each orbital fills with its up arrow ($m_s = +\tfrac{1}{2}$) first, in order $m_l = -1, 0, +1$,
    which set $(n, l, m_l, m_s)$ describes the **last** electron added?
  choices:
    - { id: a, text: '$(2, 1, 0, +\tfrac{1}{2})$' }
    - { id: b, text: '$(2, 1, 0, -\tfrac{1}{2})$' }
    - { id: c, text: '$(2, 1, +1, -\tfrac{1}{2})$' }
    - { id: d, text: '$(2, 2, 0, -\tfrac{1}{2})$' }
  answer: b
  explanation: |
    The five 2p electrons go in as ↑ ($-1$), ↑ ($0$), ↑ ($+1$), then ↓ ($-1$), ↓ ($0$). The diagram is ↑↓ ↑↓ ↑.
    The 5th electron is the **down** arrow in $m_l = 0$: $(2, 1, 0, -\tfrac{1}{2})$.
    (a) is the 2nd electron. (d) is impossible because $l$ can't equal $n$.

- id: apchem-06-period-5-d-block
