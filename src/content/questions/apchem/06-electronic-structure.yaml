- id: apchem-06-rydberg-wavelength-form
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.3"]
  cedTopics: []
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Use $\dfrac{1}{\lambda} = R_H\left(\dfrac{1}{n_1^2} - \dfrac{1}{n_2^2}\right)$ with $R_H = 1.096776 \times 10^{7}\ \text{m}^{-1}$
    to find the wavelength of light emitted when an electron in hydrogen falls from $n = 5$ to $n = 2$.
  choices:
    - { id: a, text: "410 nm" }
    - { id: b, text: "434 nm" }
    - { id: c, text: "656 nm" }
    - { id: d, text: '$2.30 \times 10^{6}$ nm' }
  answer: b
  explanation: |
    Put the lower level first so the answer is positive:

    $$\frac{1}{\lambda} = (1.096776 \times 10^{7}\ \text{m}^{-1})\left(\frac{1}{2^2} - \frac{1}{5^2}\right) = (1.096776 \times 10^{7})(0.2100) = 2.303 \times 10^{6}\ \text{m}^{-1}$$

    $$\lambda = \frac{1}{2.303 \times 10^{6}\ \text{m}^{-1}} = 4.34 \times 10^{-7}\ \text{m} = 434\ \text{nm}$$

    (D) is $1/\lambda$, not $\lambda$. 656 nm is the 3 → 2 line, and 410 nm is 6 → 2.
    You get the same answer from $\Delta E = -2.18 \times 10^{-18}\ \text{J}(1/2^2 - 1/5^2)$ followed by $\lambda = hc/|\Delta E|$.

- id: apchem-06-threshold-frequency
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.2"]
  cedTopics: ["3.12"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A metal needs at least $6.40 \times 10^{-19}$ J to remove one electron from its surface.
    What is the **minimum frequency** of light that can eject electrons from it?
  choices:
    - { id: a, text: '$9.66 \times 10^{14}\ \text{s}^{-1}$' }
    - { id: b, text: '$1.04 \times 10^{-15}\ \text{s}^{-1}$' }
    - { id: c, text: '$3.10 \times 10^{-7}\ \text{s}^{-1}$' }
    - { id: d, text: '$4.24 \times 10^{-52}\ \text{s}^{-1}$' }
  answer: a
  explanation: |
    One photon must carry at least the minimum energy, so set $E = h\nu$:

    $$\nu = \frac{E}{h} = \frac{6.40 \times 10^{-19}\ \text{J}}{6.626 \times 10^{-34}\ \text{J·s}} = 9.66 \times 10^{14}\ \text{s}^{-1}$$

    (B) is $h/E$ (flipped). (C) is the matching **wavelength** in meters, $hc/E$, with the wrong unit. (D) multiplies instead of dividing.

- id: apchem-06-planck-quanta
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.2"]
  cedTopics: ["3.12"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which statement matches Planck's idea of a **quantum**?
  choices:
    - { id: a, text: "Atoms can absorb or give off any amount of energy, as long as the amount is small enough" }
    - { id: b, text: "Electrons move only in fixed circular orbits around the nucleus" }
    - { id: c, text: "Light always travels more slowly in a vacuum than it does in air" }
    - { id: d, text: "Atoms absorb or emit energy only in whole-number multiples of a smallest amount, hν" }
  answer: d
  explanation: |
    A quantum is a fixed, smallest packet of energy. Matter can only gain or lose energy in whole numbers of these packets ($h\nu$, $2h\nu$, $3h\nu$, …), never in between.
    (B) is Bohr's model, not Planck's quantum idea.

- id: apchem-06-monochromatic
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.1"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which light source is the best example of **monochromatic** radiation?
  choices:
    - { id: a, text: "Sunlight" }
    - { id: b, text: "A white light bulb" }
    - { id: c, text: "A glowing hot stovetop" }
    - { id: d, text: "A red laser pointer" }
  answer: d
  explanation: |
    Monochromatic radiation has a single wavelength, and a laser gives off essentially one wavelength.
    Sunlight, a white bulb, and a hot object all give off many wavelengths, so they are **polychromatic**.

- id: apchem-06-emission-process
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.3"]
  cedTopics: ["3.12"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In a gas discharge tube, what has to happen for an atom to give off a line in its emission spectrum?
  choices:
    - { id: a, text: "An electron that was excited falls back to a lower energy level" }
    - { id: b, text: "An electron moves from a lower energy level to a higher one" }
    - { id: c, text: "The nucleus absorbs a photon and moves to a higher state" }
    - { id: d, text: "The atom loses a proton, which carries the energy away" }
  answer: a
  explanation: |
    Energy added to the gas first excites electrons to higher levels. A line is **emitted** when an excited electron drops back down, releasing a photon whose energy equals the gap between the levels.
    (B) is absorption, which takes energy in. The nucleus and its protons don't take part, so (C) and (D) are wrong.

- id: apchem-06-bohr-limitation
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.3"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which statement is a **limitation** of the Bohr model, not one of the ideas it got right?
  choices:
    - { id: a, text: "Electrons exist only in certain energy levels" }
    - { id: b, text: "Energy is absorbed or emitted in fixed amounts when an electron changes levels" }
    - { id: c, text: "The ground state is the lowest-energy, most stable state" }
    - { id: d, text: "It only works for hydrogen and other one-electron species" }
  answer: d
  explanation: |
    Bohr's model can't predict the spectra of atoms with two or more electrons, and it pictures electrons in fixed circular orbits, which they don't really follow.
    (A), (B), and (C) are all still true in the modern model. They're what Bohr got **right**.

- id: apchem-06-joule-units
