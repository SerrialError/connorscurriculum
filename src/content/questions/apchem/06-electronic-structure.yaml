- id: apchem-06-orbitals-per-subshell
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.5"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    How many orbitals are in a subshell with $l = 3$?
  choices:
