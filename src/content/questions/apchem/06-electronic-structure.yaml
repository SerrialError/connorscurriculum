  sections: ["6.1"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which light source is the best example of **monochromatic** radiation?
  choices:
    - { id: a, text: "Sunlight" }
    - { id: b, text: "A white light bulb" }
    - { id: c, text: "A red laser pointer" }
    - { id: d, text: "A glowing hot stovetop" }
  answer: c
  explanation: |
    Monochromatic radiation has a single wavelength, and a laser gives off essentially one wavelength.
    Sunlight, a white bulb, and a hot object all give off many wavelengths, so they are **polychromatic**.

- id: apchem-06-emission-process
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.3"]
  cedTopics: ["3.12"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In a gas discharge tube, what has to happen for an atom to give off a line in its emission spectrum?
  choices:
    - { id: a, text: "An electron moves from a lower energy level to a higher one" }
    - { id: b, text: "An electron that was excited falls back to a lower energy level" }
    - { id: c, text: "The nucleus absorbs a photon" }
    - { id: d, text: "The atom loses a proton" }
  answer: b
  explanation: |
    Energy added to the gas first excites electrons to higher levels. A line is **emitted** when an excited electron drops back down, releasing a photon whose energy equals the gap between the levels.
    (a) is absorption, which takes energy in.

- id: apchem-06-bohr-limitation
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.3"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which statement is a **limitation** of the Bohr model, not one of the ideas it got right?
  choices:
    - { id: a, text: "Electrons exist only in certain energy levels" }
    - { id: b, text: "Energy is absorbed or emitted in fixed amounts when an electron changes levels" }
    - { id: c, text: "It only works for hydrogen and other one-electron species" }
    - { id: d, text: "The ground state is the lowest-energy, most stable state" }
  answer: c
  explanation: |
    Bohr's model can't predict the spectra of atoms with two or more electrons, and it pictures electrons in fixed circular orbits, which they don't really follow.
    (a), (b), and (d) are all still true in the modern model. They're what Bohr got **right**.

- id: apchem-06-joule-units
