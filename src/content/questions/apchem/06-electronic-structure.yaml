- id: apchem-06-rydberg-wavelength-form
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.3"]
  cedTopics: []
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Use $\dfrac{1}{\lambda} = R_H\left(\dfrac{1}{n_1^2} - \dfrac{1}{n_2^2}\right)$ with $R_H = 1.096776 \times 10^{7}\ \text{m}^{-1}$
    to find the wavelength of light emitted when an electron in hydrogen falls from $n = 5$ to $n = 2$.
  choices:
    - { id: a, text: "410 nm" }
    - { id: b, text: "434 nm" }
    - { id: c, text: "656 nm" }
    - { id: d, text: '$2.30 \times 10^{6}$ nm' }
  answer: b
  explanation: |
    Put the lower level first so the answer is positive:

    $$\frac{1}{\lambda} = (1.096776 \times 10^{7}\ \text{m}^{-1})\left(\frac{1}{2^2} - \frac{1}{5^2}\right) = (1.096776 \times 10^{7})(0.2100) = 2.303 \times 10^{6}\ \text{m}^{-1}$$

    $$\lambda = \frac{1}{2.303 \times 10^{6}\ \text{m}^{-1}} = 4.34 \times 10^{-7}\ \text{m} = 434\ \text{nm}$$

    (d) is $1/\lambda$, not $\lambda$. 656 nm is the 3 → 2 line, and 410 nm is 6 → 2.
    You get the same answer from $\Delta E = -2.18 \times 10^{-18}\ \text{J}(1/2^2 - 1/5^2)$ followed by $\lambda = hc/|\Delta E|$.

- id: apchem-06-threshold-frequency
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.2"]
  cedTopics: ["3.12"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A metal needs at least $6.40 \times 10^{-19}$ J to remove one electron from its surface.
    What is the **minimum frequency** of light that can eject electrons from it?
  choices:
    - { id: a, text: '$9.66 \times 10^{14}\ \text{s}^{-1}$' }
    - { id: b, text: '$1.04 \times 10^{-15}\ \text{s}^{-1}$' }
    - { id: c, text: '$3.10 \times 10^{-7}\ \text{s}^{-1}$' }
    - { id: d, text: '$4.24 \times 10^{-52}\ \text{s}^{-1}$' }
  answer: a
  explanation: |
    One photon must carry at least the minimum energy, so set $E = h\nu$:

    $$\nu = \frac{E}{h} = \frac{6.40 \times 10^{-19}\ \text{J}}{6.626 \times 10^{-34}\ \text{J·s}} = 9.66 \times 10^{14}\ \text{s}^{-1}$$

    (b) is $h/E$ (flipped). (c) is the matching **wavelength** in meters, $hc/E$, with the wrong unit. (d) multiplies instead of dividing.

- id: apchem-06-planck-quanta
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.2"]
  cedTopics: ["3.12"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which statement matches Planck's idea of a **quantum**?
  choices:
    - { id: a, text: "Atoms can absorb or emit any amount of energy, as long as it's small" }
    - { id: b, text: "Atoms absorb or emit energy only in whole-number multiples of a smallest amount, hν" }
    - { id: c, text: "Light always travels slower in a vacuum than in air" }
    - { id: d, text: "Electrons move in circular orbits around the nucleus" }
  answer: b
  explanation: |
    A quantum is a fixed, smallest packet of energy. Matter can only gain or lose energy in whole numbers of these packets ($h\nu$, $2h\nu$, $3h\nu$, …), never in between.
    (d) is Bohr's model, not Planck's quantum idea.

- id: apchem-06-monochromatic
  type: mcq
  subject: apchem
