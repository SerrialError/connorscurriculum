- id: apchem-06-light-speed-same
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.1"]
  cedTopics: ["3.12"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In a vacuum, how does the speed of X-rays compare with the speed of radio waves?
  choices:
    - { id: a, text: "X-rays are faster, because each X-ray photon carries more energy" }
    - { id: b, text: "Radio waves are faster, because their wavelengths are much longer" }
    - { id: c, text: "They travel at the same speed, $c$" }
    - { id: d, text: "It depends on how bright each source is" }
  answer: c
  explanation: |
    Every kind of electromagnetic radiation travels through a vacuum at the same speed, $c = 2.998 \times 10^{8}$ m/s. X-rays and radio waves differ in wavelength and frequency, and $c = \lambda\nu$ says that when one goes up the other goes down, with the product staying the same.
    A photon's energy depends on its frequency, not on its speed, so (A) is wrong. Brightness (D) is the number of photons, which doesn't change the speed either.

- id: apchem-06-photoelectric-raise-frequency
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.2"]
  cedTopics: ["3.12"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Light above the threshold frequency shines on a metal and ejects electrons. The frequency is then raised, while the number of photons hitting the metal each second stays the same. What happens?
  choices:
    - { id: a, text: "The same number of electrons leave, each with more kinetic energy" }
    - { id: b, text: "More electrons leave, but each has the same kinetic energy as before" }
    - { id: c, text: "No electrons leave, because the light is now above the threshold" }
    - { id: d, text: "The electrons leave more slowly, because each photon now has a shorter wavelength" }
  answer: a
  explanation: |
    Each photon ejects at most one electron, so the same number of photons per second ejects the same number of electrons. A higher frequency means each photon has more energy ($E = h\nu$), and the energy left over after freeing the electron becomes its kinetic energy: $KE = E_{\text{photon}} - E_{\text{minimum}}$.
    (B) is what happens when the light gets brighter (more photons) at the same frequency. (C) has the threshold backward. (D) is backward too: a shorter wavelength means more energy per photon, so faster electrons.

- id: apchem-06-dim-violet-bright-red
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.2"]
  cedTopics: ["3.12"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A dim violet light and a very bright red light shine on the same metal. Only the violet light ejects electrons. What does this show?
  choices:
    - { id: a, text: "Red light carries no energy, so it can never affect a metal" }
    - { id: b, text: "Whether an electron leaves depends on each photon's energy, not on how many photons arrive" }
    - { id: c, text: "A bright light gives off fewer photons each second than a dim light does" }
    - { id: d, text: "The metal reflects every violet photon and absorbs every red one instead" }
  answer: b
  explanation: |
    One photon frees one electron, so a single photon has to carry at least the minimum energy. Violet light has a higher frequency than red, so each violet photon has more energy ($E = h\nu$). Brightness only changes how many photons arrive, and no number of low-energy red photons adds up to free an electron.
    (A) is false: red photons have energy, just not enough each. (C) is backward, and (D) would mean violet light couldn't eject anything.

- id: apchem-06-light-as-particle-evidence
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.2"]
  cedTopics: ["3.12"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which observation is evidence that light behaves as a stream of particles (photons)?
  choices:
    - { id: a, text: "Light spreads out after it passes through a very narrow slit" }
    - { id: b, text: "Two beams of light overlap to make a pattern of bright and dark bands" }
    - { id: c, text: "Light ejects electrons from a metal only above a certain frequency" }
    - { id: d, text: "A glass prism bends each color of white light by a different amount" }
  answer: c
  explanation: |
    The photoelectric effect is explained only if light arrives in packets whose energy depends on frequency ($E = h\nu$). That is the particle picture.
    Spreading through a slit (diffraction, A), bright and dark bands (interference, B), and a prism separating colors (D) are all wave behavior.

- id: apchem-06-negative-energy-levels
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.3"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    In the Bohr model, every energy level of the hydrogen atom has a negative value. Why?
  choices:
    - { id: a, text: "The electron has a negative charge, so its energy is negative too" }
    - { id: b, text: "The bound electron has less energy than a free one, which is set to zero" }
    - { id: c, text: "The electron loses a little energy every time it goes around the nucleus" }
    - { id: d, text: "The electron moves around the nucleus in the opposite direction from a proton" }
  answer: b
  explanation: |
    Zero energy is defined as the electron completely removed ($n = \infty$). An electron held by the nucleus has less energy than that, so every bound level is below zero, and energy has to be added to pull it free.
    (A) mixes up charge and energy. (C) contradicts Bohr's idea that an electron in an allowed orbit doesn't give off energy. (D) isn't part of the model.

- id: apchem-06-absorption-emission-lines-match
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.3"]
  cedTopics: ["3.12"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    White light passed through cool hydrogen gas shows dark lines at exactly the wavelengths where glowing hydrogen gives off bright lines. Why do the two spectra match?
  choices:
    - { id: a, text: "Absorbing and emitting use the same gaps between energy levels, in opposite directions" }
    - { id: b, text: "Hydrogen gas reflects those wavelengths back toward the light source" }
    - { id: c, text: "Every element absorbs light at the same few wavelengths" }
    - { id: d, text: "The dark lines are where the gas gives off too much light for the detector to show" }
  answer: a
  explanation: |
    An electron can absorb a photon only if the photon's energy equals the gap between two allowed levels, and it emits a photon of the same energy when it drops back across that gap. The same set of gaps means the same set of wavelengths, whether the light is taken in (dark lines) or given off (bright lines).
    (C) is false: each element's lines are different, which is why spectra identify elements.

- id: apchem-06-electron-diffraction
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.4"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    A beam of electrons passed through a thin crystal makes a diffraction pattern, the same kind of pattern light makes. What does this show?
  choices:
    - { id: a, text: "Electrons are a form of light" }
    - { id: b, text: "Electrons have no mass while they are moving" }
    - { id: c, text: "Moving electrons have wave properties" }
    - { id: d, text: "The crystal gives off light when electrons hit it" }
  answer: c
  explanation: |
    Diffraction is wave behavior. Electrons diffracting confirmed de Broglie's idea that moving matter has a wavelength ($\lambda = h/mv$). It matters for electrons because their mass is so small.
    Electrons still have mass and charge (B), and they are not light (A); they are particles that also act like waves.

- id: apchem-06-pauli-consequence
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.8"]
  cedTopics: ["1.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which statement follows directly from the Pauli exclusion principle?
  choices:
    - { id: a, text: "Electrons fill the lowest-energy orbitals before higher ones" }
    - { id: b, text: "An orbital holds at most two electrons, and they have opposite spins" }
    - { id: c, text: "Electrons go one per orbital, all with the same spin, before any pair up" }
    - { id: d, text: "An electron's exact position and momentum can't both be known at once" }
  answer: b
  explanation: |
    Pauli says no two electrons in an atom have the same four quantum numbers. Two electrons in one orbital already share $n$, $l$, and $m_l$, so they must differ in $m_s$: one $+\tfrac{1}{2}$ and one $-\tfrac{1}{2}$. A third electron would have to repeat one of those, so an orbital holds at most two.
    (A) is the aufbau principle, (C) is Hund's rule, and (D) is the uncertainty principle.

- id: apchem-06-node-at-nucleus
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.6"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    For which orbital is the probability of finding the electron **at the nucleus** zero?
  choices:
    - { id: a, text: "1s" }
    - { id: b, text: "2s" }
    - { id: c, text: "3s" }
    - { id: d, text: "2p" }
  answer: d
  explanation: |
    A p orbital has two lobes on opposite sides of the nucleus with a node between them, right at the nucleus. Every s orbital has some electron density at the nucleus; the nodes of 2s and 3s are spheres around it, not at its center.
    This is also why s electrons penetrate the inner electrons better than p electrons in the same shell.

- id: apchem-06-shape-from-l
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.6"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    An electron is in an orbital with $l = 1$. What shape is the orbital?
  choices:
    - { id: a, text: "A sphere centered on the nucleus" }
    - { id: b, text: "Two lobes on opposite sides of the nucleus" }
    - { id: c, text: "Four lobes in a cloverleaf pattern" }
    - { id: d, text: "A flat ring that circles the nucleus at one distance" }
  answer: b
  explanation: |
    $l = 1$ is a p orbital: two lobes with the nucleus between them, like a dumbbell. $l = 0$ is an s orbital (a sphere, A), and $l = 2$ is a d orbital (mostly four lobes, C).
    Orbitals aren't flat paths (D); that's closer to Bohr's orbits.

- id: apchem-06-ml-meaning
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.5"]
  cedTopics: []
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What does the magnetic quantum number, $m_l$, describe?
  choices:
    - { id: a, text: "The size of the orbital and its energy level" }
    - { id: b, text: "The shape of the orbital" }
    - { id: c, text: "Which way the orbital points in space" }
    - { id: d, text: "The direction of the electron's spin" }
  answer: c
  explanation: |
    $m_l$ tells the orientation of an orbital. For $l = 1$ it can be $-1$, $0$, or $+1$, which are the three p orbitals pointing along different axes.
    Size and energy come from $n$ (A), shape from $l$ (B), and spin from $m_s$ (D).

- id: apchem-06-ms-same-orbital
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.5", "6.8"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Two electrons are in the same orbital, so they have the same $n$, $l$, and $m_l$. What must be true of their spin quantum numbers, $m_s$?
  choices:
    - { id: a, text: 'Both are $+\tfrac{1}{2}$' }
    - { id: b, text: 'One is $+\tfrac{1}{2}$ and the other is $-\tfrac{1}{2}$' }
    - { id: c, text: "Both are 0, because the spins cancel" }
    - { id: d, text: "They can be any two values, as long as both are whole numbers" }
  answer: b
  explanation: |
    $m_s$ can only be $+\tfrac{1}{2}$ or $-\tfrac{1}{2}$. By the Pauli principle the two electrons can't have all four quantum numbers the same, and the first three already match, so their spins must be opposite.
    (A) breaks the Pauli principle, and (C) and (D) give values $m_s$ can't have.

- id: apchem-06-paramagnetic-atom
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.8"]
  cedTopics: ["1.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    An atom with unpaired electrons is **paramagnetic** (pulled into a magnetic field). Which ground-state atom is paramagnetic?
  choices:
    - { id: a, text: "He" }
    - { id: b, text: "Be" }
    - { id: c, text: "O" }
    - { id: d, text: "Ne" }
  answer: c
  explanation: |
    O is $1s^2\,2s^2\,2p^4$, and its 2p orbitals are ↑↓ ↑ ↑, so it has **2 unpaired** electrons.
    He ($1s^2$), Be ($1s^2\,2s^2$), and Ne ($1s^2\,2s^2\,2p^6$) have only filled subshells, so every electron is paired and they are diamagnetic.

- id: apchem-06-sulfide-config
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.9"]
  cedTopics: ["1.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the electron configuration of the sulfide ion, $\ce{S^2-}$?
  choices:
    - { id: a, text: '$[\ce{Ne}]\,3s^2\,3p^4$' }
    - { id: b, text: '$[\ce{Ne}]\,3s^2\,3p^2$' }
    - { id: c, text: '$[\ce{Ar}]\,4s^2$' }
    - { id: d, text: '$[\ce{Ne}]\,3s^2\,3p^6$' }
  answer: d
  explanation: |
    S has 16 electrons, $[\ce{Ne}]\,3s^2\,3p^4$. The 2− charge means two more electrons, 18 in all, and they fill the 3p subshell: $[\ce{Ne}]\,3s^2\,3p^6$, the same as argon.
    (A) is the neutral atom, (B) removes two electrons instead of adding them, and (C) has 20 electrons.

- id: apchem-06-hund-carbon-diagram
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.8"]
  cedTopics: ["1.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Carbon is $1s^2\,2s^2\,2p^2$. Which diagram of its three 2p orbitals is correct for the ground state?
  choices:
    - { id: a, text: '↑↓ \_\_ \_\_' }
    - { id: b, text: '↑ ↓ \_\_' }
    - { id: c, text: '↑ ↑ \_\_' }
    - { id: d, text: '↑↑ \_\_ \_\_' }
  answer: c
  explanation: |
    Hund's rule: in equal-energy orbitals, put one electron in each, **with the same spin**, before pairing. So carbon's two 2p electrons go in separate orbitals, both up.
    (A) pairs them too early. (B) has them in separate orbitals but with opposite spins, which is higher in energy. (D) puts two electrons with the same spin in one orbital, which the Pauli principle forbids.

- id: apchem-06-valence-count-p-block
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.9"]
  cedTopics: ["1.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    How many valence electrons does an atom with the configuration $[\ce{Ar}]\,4s^2\,3d^{10}\,4p^3$ have?
  choices:
    - { id: a, text: "3" }
    - { id: b, text: "5" }
    - { id: c, text: "13" }
    - { id: d, text: "15" }
  answer: b
  explanation: |
    Valence electrons are the ones in the outermost shell, here $n = 4$: $4s^2\,4p^3$, which is 5. The filled $3d^{10}$ subshell is in a lower shell and doesn't count. The element is arsenic, in group 15, and main-group elements have as many valence electrons as the last digit of their group number.
    (A) counts only the 4p electrons, (C) adds the 3d electrons, and (D) is the group number.

- id: apchem-06-cobalt-ion-electrons-lost
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.9"]
  cedTopics: ["1.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Cobalt is $[\ce{Ar}]\,4s^2\,3d^7$. When it forms $\ce{Co^2+}$, which electrons does it lose?
  choices:
    - { id: a, text: "Two of its 3d electrons" }
    - { id: b, text: "One 4s electron and one 3d electron" }
    - { id: c, text: "Both 4s electrons" }
    - { id: d, text: "The last two electrons added, which are in the 3d subshell" }
  answer: c
  explanation: |
    Transition metals lose their **4s** electrons first, even though 4s filled before 3d. Once the 3d orbitals hold electrons, the 4s electrons are the outermost ($n = 4$) and the easiest to remove. So $\ce{Co^2+}$ is $[\ce{Ar}]\,3d^7$.
    (A) and (D) follow the filling order backward, which is the common mistake.

- id: apchem-06-degenerate-in-carbon
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.7"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    In a carbon atom, which orbitals are **degenerate** (have exactly the same energy)?
  choices:
    - { id: a, text: "The 2s orbital and the three 2p orbitals" }
    - { id: b, text: "The 1s orbital and the 2s orbital" }
    - { id: c, text: "The three 2p orbitals" }
    - { id: d, text: "The three 2p orbitals and the 3s orbital" }
  answer: c
  explanation: |
    Orbitals in the same subshell have the same energy, so the three 2p orbitals are degenerate. In an atom with more than one electron, 2s is lower than 2p because a 2s electron penetrates closer to the nucleus, so (A) is only true for one-electron species like H. (B) and (D) mix different shells.

- id: apchem-06-quantum-numbers-4d
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.5"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which set of quantum numbers $(n, l, m_l, m_s)$ could describe an electron in a **4d** orbital?
  choices:
    - { id: a, text: '$(4, 3, -1, +\tfrac{1}{2})$' }
    - { id: b, text: '$(4, 1, 0, -\tfrac{1}{2})$' }
    - { id: c, text: '$(3, 2, 0, +\tfrac{1}{2})$' }
    - { id: d, text: '$(4, 2, -1, +\tfrac{1}{2})$' }
  answer: d
  explanation: |
    4d means $n = 4$ and $l = 2$ (d). With $l = 2$, $m_l$ can be $-2$ to $+2$, so $-1$ is allowed, and $m_s = +\tfrac{1}{2}$ is fine.
    (A) has $l = 3$, a 4f electron. (B) has $l = 1$, a 4p electron. (C) is a 3d electron.

- id: apchem-06-chromium-exception-reason
  type: mcq
  subject: apchem
  chapter: 6
  sections: ["6.8"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Chromium's ground-state configuration is $[\ce{Ar}]\,4s^1\,3d^5$, not the predicted $[\ce{Ar}]\,4s^2\,3d^4$. What is the usual explanation?
  choices:
    - { id: a, text: "A half-filled 3d subshell, one electron in each d orbital, is extra stable" }
    - { id: b, text: "The 4s orbital is always higher in energy than every 3d orbital" }
    - { id: c, text: "The Pauli principle forbids two electrons from sharing the 4s orbital" }
    - { id: d, text: "Hund's rule says every orbital in an atom must hold exactly one electron" }
  answer: a
  explanation: |
    Moving one 4s electron into 3d gives five 3d electrons, one in each orbital with parallel spins. A half-filled (or completely filled) d subshell is extra stable, so the atom ends up lower in energy this way. Copper does the same to reach $3d^{10}$.
    (B) is false because 4s fills first in K and Ca. (C) is false: an orbital can hold two electrons with opposite spins. (D) misstates Hund's rule, which is about equal-energy orbitals in one subshell.
