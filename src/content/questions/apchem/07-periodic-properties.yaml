- id: apchem-07-slater-oxygen
  type: mcq
  subject: apchem
  chapter: 7
  sections: ["7.2"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Use Slater's rules to find $Z_{\text{eff}}$ for a 2p electron in oxygen ($Z = 8$).
  choices:
    - { id: a, text: "3.45" }
    - { id: b, text: "4.20" }
    - { id: c, text: "4.55" }
    - { id: d, text: "6.00" }
  answer: c
  explanation: |
    O is $1s^2\ (2s^2\,2p^4)$. For one 2p electron:

    - the **other** 5 electrons in $n = 2$: $5 \times 0.35 = 1.75$
    - the 2 electrons in $n - 1$ (1s): $2 \times 0.85 = 1.70$

    $S = 3.45$, so $Z_{\text{eff}} = 8 - 3.45 = 4.55$.
    (a) is $S$. (b) counts all 6 electrons in $n = 2$, including the one you're looking at. (d) is the quick core-only estimate.

- id: apchem-07-core-electron-zeff
  type: mcq
  subject: apchem
  chapter: 7
  sections: ["7.2"]
  cedTopics: ["1.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which electron in a sodium atom feels the **largest** effective nuclear charge?
  choices:
    - { id: a, text: "A 1s electron" }
    - { id: b, text: "A 2s electron" }
    - { id: c, text: "A 2p electron" }
    - { id: d, text: "The 3s electron" }
  answer: a
  explanation: |
    Zeff is the nuclear charge minus the shielding from electrons between that electron and the nucleus. A 1s electron has almost nothing between it and the 11 protons, so it feels nearly the full charge.
    The 3s valence electron is shielded by all 10 core electrons and feels the **smallest** Zeff. That's also why core electrons take far more energy to remove.

- id: apchem-07-why-second-ie-larger
  type: mcq
  subject: apchem
  chapter: 7
  sections: ["7.4"]
  cedTopics: ["1.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    For magnesium, the second ionization energy is larger than the first. Which is the best explanation?
  choices:
    - { id: a, text: "There is more electron–electron repulsion in $\\ce{Mg+}$ than in Mg" }
    - { id: b, text: "In $\\ce{Mg+}$, the same 12 protons pull on fewer electrons, so the remaining electrons are held more tightly" }
    - { id: c, text: "The second electron is removed from the n = 2 shell" }
    - { id: d, text: "$\\ce{Mg+}$ has more protons than Mg" }
  answer: b
  explanation: |
    Removing one electron leaves $\ce{Mg+}$ with 12 protons and 11 electrons. With **less** electron–electron repulsion and a positive charge, the ion holds its remaining electrons more tightly, so the next one takes more energy.
    (a) is backward. (c) is false because Mg's second electron is still a 3s electron; the big jump comes at the **third** IE. (d) is false because ionization never changes the number of protons.

- id: apchem-07-ie-down-group
  type: mcq
  subject: apchem
  chapter: 7
  sections: ["7.4"]
  cedTopics: ["1.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which list puts Li, Na, and K in order of **decreasing** first ionization energy?
  choices:
    - { id: a, text: "Li > Na > K" }
    - { id: b, text: "K > Na > Li" }
    - { id: c, text: "Na > Li > K" }
    - { id: d, text: "They are all equal because all are in group 1" }
  answer: a
  explanation: |
    Going down group 1, each atom adds a shell, so the valence electron is farther from the nucleus and held less tightly. The smaller the atom, the harder it is to remove an electron: Li > Na > K.

- id: apchem-07-most-negative-ea
  type: mcq
  subject: apchem
  chapter: 7
  sections: ["7.5"]
  cedTopics: ["1.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which atom releases the **most** energy when it gains an electron (has the most negative electron affinity)?
  choices:
    - { id: a, text: "Na" }
    - { id: b, text: "Mg" }
    - { id: c, text: "Cl" }
    - { id: d, text: "Ar" }
  answer: c
  explanation: |
    Cl has a high Zeff, and one more electron fills its 3p subshell, so it attracts an added electron strongly and releases a lot of energy.
    Mg (filled 3s) and Ar (filled shell) would have to put the electron in a higher-energy subshell, so their EAs are near zero or positive. Na releases only a little energy.

- id: apchem-07-metals-form-cations
  type: mcq
  subject: apchem
  chapter: 7
  sections: ["7.6"]
  cedTopics: ["1.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Why do metals tend to form cations?
  choices:
    - { id: a, text: "They have high ionization energies" }
    - { id: b, text: "They have low ionization energies, so their valence electrons are easy to remove" }
    - { id: c, text: "They have very negative electron affinities" }
    - { id: d, text: "They have more protons than nonmetals" }
  answer: b
  explanation: |
    Metals sit on the left and bottom of the table, where Zeff is low and atoms are large. Their few valence electrons are loosely held (low IE), so they lose them and become positive ions.

- id: apchem-07-valence-selenium
  type: mcq
  subject: apchem
  chapter: 7
  sections: []
  cedTopics: ["1.8"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    How many valence electrons does a selenium (Se) atom have, and what ion does it usually form?
  choices:
    - { id: a, text: '6 valence electrons, $\ce{Se^2-}$' }
    - { id: b, text: '16 valence electrons, $\ce{Se^2-}$' }
    - { id: c, text: '6 valence electrons, $\ce{Se^6+}$' }
    - { id: d, text: '4 valence electrons, $\ce{Se^4-}$' }
  answer: a
  explanation: |
    Se is in group 16: $[\ce{Ar}]\,4s^2\,3d^{10}\,4p^4$. Its valence electrons are the $n = 4$ ones, $4s^2\,4p^4$, which makes 6 (the filled 3d doesn't count).
    Gaining 2 electrons reaches the krypton configuration, so it forms $\ce{Se^2-}$. 16 is the group number, not the electron count.

- id: apchem-07-isoelectronic-zeff
  type: mcq
  subject: apchem
  chapter: 7
  sections: ["7.2", "7.3"]
  cedTopics: []
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    $\ce{Na+}$ and $\ce{F-}$ both have the configuration $1s^2\,2s^2\,2p^6$. Using Slater's rules, what is $Z_{\text{eff}}$ on a 2p electron in each, and which ion is smaller?
  choices:
    - { id: a, text: '$\ce{Na+}$: 6.85, $\ce{F-}$: 4.85; $\ce{Na+}$ is smaller' }
    - { id: b, text: '$\ce{Na+}$: 4.85, $\ce{F-}$: 6.85; $\ce{F-}$ is smaller' }
    - { id: c, text: 'Both 5.85; they are the same size' }
    - { id: d, text: '$\ce{Na+}$: 6.85, $\ce{F-}$: 4.85; $\ce{F-}$ is smaller' }
  answer: a
  explanation: |
    Both ions have the same shielding for a 2p electron: $S = 7(0.35) + 2(0.85) = 4.15$.

    - $\ce{Na+}$: $Z_{\text{eff}} = 11 - 4.15 = 6.85$
    - $\ce{F-}$: $Z_{\text{eff}} = 9 - 4.15 = 4.85$

    Same electrons, but more protons in $\ce{Na+}$, so its electrons are pulled in tighter and it is the smaller ion.

