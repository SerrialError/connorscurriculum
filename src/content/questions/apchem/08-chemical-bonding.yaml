    - { id: c, text: "34" }
    - { id: d, text: "32" }
  answer: d
  explanation: |
    S has 6 and each O has 6: $6 + 4(6) = 30$. The 2− charge adds 2 more electrons: **32**. (A) forgets the charge, and (C) adds it twice.

- id: apchem-08-valence-ammonium
