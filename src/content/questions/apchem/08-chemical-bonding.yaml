  cedTopics: ["2.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Phosgene, $\ce{COCl2}$, has C as the central atom. How many **lone pairs** are in its best Lewis structure (counting all atoms)?
  choices:
    - { id: a, text: "6" }
    - { id: b, text: "9" }
    - { id: c, text: "10" }
    - { id: d, text: "8" }
  answer: d
  explanation: |
    $4 + 6 + 2(7) = 24$ electrons. The structure with all formal charges zero has a C=O double bond and two C–Cl single bonds: 4 bonds, 8 electrons. The other 16 electrons are 8 lone pairs: 2 on O and 3 on each Cl. (B) would come from making every bond single, which leaves C with only 6 electrons.

- id: apchem-08-which-triple
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.5"]
  cedTopics: ["2.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which molecule has a **triple bond** in its Lewis structure?
  choices:
    - { id: a, text: '$\ce{C2H4}$' }
    - { id: b, text: '$\ce{CO2}$' }
    - { id: c, text: '$\ce{HCN}$' }
    - { id: d, text: '$\ce{H2CO}$' }
  answer: c
  explanation: |
    HCN has 10 valence electrons. H–C≡N, with one lone pair on N, gives C and N octets. $\ce{C2H4}$ has a C=C double bond, $\ce{CO2}$ two C=O double bonds, and $\ce{H2CO}$ one C=O double bond.

- id: apchem-08-fc-vs-oxidation
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.5"]
  cedTopics: ["2.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    In $\ce{CO2}$ (O=C=O), carbon has a formal charge of 0 but an oxidation number of +4. Why are they different?
  choices:
    - { id: a, text: "Formal charge splits shared electrons equally; oxidation number gives them all to the more electronegative atom" }
    - { id: b, text: "Formal charge counts only lone pairs, while oxidation number counts only the electrons in bonds" }
    - { id: c, text: "Formal charge is the real charge on the atom, while oxidation number is only a bookkeeping value used in redox" }
    - { id: d, text: "Oxidation numbers apply only to ions, so carbon's value in a neutral molecule must be wrong" }
  answer: a
  explanation: |
    Formal charge assumes perfectly equal sharing, and oxidation number assumes complete transfer to the more electronegative atom. Giving all eight of carbon's bonding electrons to the oxygens leaves C with none of its own: +4. Neither number is the real charge (C), which is somewhere in between. (B) misstates both formulas, and (D) is false; neutral molecules have oxidation numbers too.

# --- 8.6 Resonance ---

- id: apchem-08-which-resonance
