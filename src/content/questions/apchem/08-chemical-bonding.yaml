    - { id: b, text: "2" }
    - { id: c, text: "4" }
    - { id: d, text: "6" }
  answer: d
  explanation: |
    A triple bond is **three shared pairs**, which is six electrons. (A) counts pairs instead of electrons, (B) is a single bond, and (C) is a double bond.

# --- 8.4 Bond polarity and electronegativity ---

- id: apchem-08-most-polar-bond
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.4"]
  cedTopics: ["2.1"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which bond is the **most polar**? (Electronegativities: H 2.1, C 2.5, N 3.0, O 3.5, Cl 3.0)
  choices:
    - { id: a, text: "C–O" }
    - { id: b, text: "N–H" }
    - { id: c, text: "C–Cl" }
    - { id: d, text: "O–H" }
  answer: d
  explanation: |
    Polarity grows with the electronegativity difference. ΔEN: O–H 1.4, C–O 1.0, N–H 0.9, C–Cl 0.5. O–H has the largest difference.

- id: apchem-08-nonpolar-bond
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.4"]
  cedTopics: ["2.1"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which bond is best described as **nonpolar** covalent? (Electronegativities: H 2.1, C 2.5, O 3.5, S 2.5, Na 0.9, Cl 3.0)
  choices:
    - { id: a, text: "C–S" }
    - { id: b, text: "C–O" }
    - { id: c, text: "H–Cl" }
    - { id: d, text: "Na–Cl" }
  answer: a
  explanation: |
    C and S both have an electronegativity of 2.5, so ΔEN = 0 and the electrons are shared equally. C–O (1.0) and H–Cl (0.9) are polar covalent. Na–Cl (2.1) is ionic.

- id: apchem-08-partial-charge-pcl
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.4"]
  cedTopics: ["2.1"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In a P–Cl bond, which atom carries the partial negative charge (δ−), and why?
  choices:
    - { id: a, text: "P, because it has more electrons in total than Cl does" }
    - { id: b, text: "P, because it has fewer valence electrons, so it attracts more" }
    - { id: c, text: "Cl, because it is more electronegative than P" }
    - { id: d, text: "Neither atom, because P and Cl are both nonmetals and share equally" }
  answer: c
  explanation: |
    Cl (3.0) is more electronegative than P (2.1), so the shared electrons spend more time near Cl, making it δ− and P δ+. Two nonmetals (D) can still have a polar bond; equal sharing needs equal electronegativities. (A) is false: P (15 electrons) has fewer than Cl (17). (B) is backward: having fewer valence electrons doesn't make an atom pull harder on shared electrons; a higher effective nuclear charge does, and Cl's is higher.

- id: apchem-08-en-order
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.4"]
  cedTopics: ["1.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which list is in order of **increasing** electronegativity?
  choices:
    - { id: a, text: "F < O < N < C" }
    - { id: b, text: "K < Na < S < O" }
    - { id: c, text: "Cl < Br < I < F" }
    - { id: d, text: "O < S < Se < Te" }
  answer: b
  explanation: |
    Electronegativity increases up a group and to the right across a period. K (0.8) < Na (0.9) < S (2.5) < O (3.5). (A) and (D) are in decreasing order. (C) has the halogens backward (I < Br < Cl < F).

- id: apchem-08-en-vs-ea
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.4"]
  cedTopics: ["1.7", "2.1"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    How is **electronegativity** different from **electron affinity**?
  choices:
    - { id: a, text: "Electronegativity is an energy change measured in kJ/mol, while electron affinity is a unitless scale" }
    - { id: b, text: "Electronegativity increases down a group, while electron affinity gets more negative going up a group" }
    - { id: c, text: "Electronegativity applies only to metals, while electron affinity applies only to nonmetals that gain electrons" }
    - { id: d, text: "Electronegativity is a pull on shared electrons in a bond; electron affinity is the energy change when a gaseous atom gains an electron" }
  answer: d
  explanation: |
    Electron affinity is a measured energy (kJ/mol) for $\ce{X(g) + e- -> X-(g)}$. Electronegativity is a unitless scale for how strongly an atom in a **bond** attracts the shared electrons. (A) swaps them. (B) is wrong: electronegativity decreases down a group. (C) is wrong: both properties apply to every element.

- id: apchem-08-largest-hx-dipole
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.4"]
  cedTopics: ["2.1"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    The bonds in HF, HCl, HBr, and HI get longer from HF to HI. Which molecule has the **largest** dipole moment?
  choices:
    - { id: a, text: "HF, because the electronegativity difference is largest" }
    - { id: b, text: "HI, because its bond is the longest" }
    - { id: c, text: "HCl, because Cl has the most negative electron affinity" }
    - { id: d, text: "All four are equal, because each has one polar bond" }
  answer: a
  explanation: |
    $\mu = Qr$. A longer bond raises $\mu$, but the partial charges matter much more here: ΔEN falls from 1.9 (HF) to 0.4 (HI), so HF's partial charges are far larger. (C) mixes up electron affinity with electronegativity.

- id: apchem-08-dipole-factors
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.4"]
  cedTopics: ["2.1"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A bond's dipole moment is $\mu = Qr$. Which pair of changes would **both** make a bond's dipole moment larger?
  choices:
    - { id: a, text: "Larger ΔEN; shorter bond" }
    - { id: b, text: "Larger ΔEN; longer bond" }
    - { id: c, text: "Smaller ΔEN; longer bond" }
    - { id: d, text: "Smaller ΔEN; shorter bond" }
  answer: b
  explanation: |
    A larger ΔEN pulls the shared electrons further toward one atom, so the partial charges $Q$ get bigger. A longer bond increases the distance $r$ between those charges. Both raise $\mu$. (A) has the bond length going the wrong way, and (C) and (D) shrink the partial charges.

- id: apchem-08-molecular-metal-compound
  type: mcq
