- id: apchem-08-nitrate-frq
  type: frq
  subject: apchem
  chapter: 8
  sections: ["8.5", "8.6"]
  cedTopics: ["2.5", "2.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Answer the following about the nitrate ion, $\ce{NO3-}$, in which N is the central atom.
  parts:
    - label: a
      points: 1
      prompt: How many valence electrons are in the Lewis structure of $\ce{NO3-}$?
      scoring:
        - "24 ($5 + 3 \\times 6 + 1$)."
    - label: b
      points: 1
      prompt: Draw one complete Lewis structure for $\ce{NO3-}$, and state how many resonance structures it has.
      scoring:
        - "One N=O and two N–O bonds, 2 lone pairs on the double-bonded O, 3 on each single-bonded O, none on N, in brackets with a − charge; three resonance structures."
    - label: c
      points: 1
      prompt: Give the formal charge on each atom in your structure from part (b), and show that they add up correctly.
      scoring:
        - "N +1, double-bonded O 0, each single-bonded O −1; the sum is −1, the charge of the ion."
    - label: d
      points: 1
      prompt: Experiments show that all three N–O bonds in nitrate are the same length. Explain why, and compare that length with the lengths of a typical N–O single bond and N=O double bond.
      scoring:
        - "The real ion is a resonance hybrid: each bond is double in one of three structures, giving a bond order of 4/3 for all three, which is between 1 and 2, so the length is between single and double."
  explanation: |
    **(a)** N has 5 valence electrons, each O has 6, and the negative charge adds 1: $5 + 18 + 1 = 24$.

    **(b)** Three N–O bonds (6 electrons), then octets on the O atoms (18), uses all 24. N has only 6 electrons, so one O lone pair becomes a second N–O bond: one N=O and two N–O. The double bond can be on any of the three O atoms, so there are three resonance structures.

    **(c)** N: $5 - 0 - 4 = +1$. Double-bonded O: $6 - 4 - 2 = 0$. Each single-bonded O: $6 - 6 - 1 = -1$. Sum: $+1 + 0 - 1 - 1 = -1$.

    **(d)** No single structure is correct. The real ion is the average of the three, so all three bonds are identical with a bond order of $(2 + 1 + 1)/3 = 4/3$. A bond order between 1 and 2 gives a length between the single and double bond lengths.

- id: apchem-08-ionic-frq
  type: frq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: ["2.2", "2.3"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Lithium chloride is an ionic solid. Use this data (kJ/mol) for parts (b) and (c).

    | $\ce{Li(s) -> Li(g)}$ | $\ce{1/2Cl2(g) -> Cl(g)}$ | First IE of Li | Electron affinity of Cl | $\Delta H^\circ_f$ of LiCl(s) |
    |---|---|---|---|---|
    | +159 | +122 | +520 | −349 | −409 |
  parts:
    - label: a
      points: 1
      prompt: Write the equation for the process whose enthalpy change is the lattice energy of LiCl. Include states.
      scoring:
        - "$\\ce{LiCl(s) -> Li+(g) + Cl-(g)}$."
    - label: b
      points: 1
      prompt: Use the data to calculate the lattice energy of LiCl.
      scoring:
        - "$159 + 122 + 520 + (-349) - (-409) = +861$ kJ/mol."
    - label: c
      points: 1
      prompt: Making $\ce{Li+(g)}$ and $\ce{Cl-(g)}$ from Li(g) and Cl(g) is endothermic. Use the data to show this, and explain why LiCl(s) still forms from its elements with a negative $\Delta H^\circ_f$.
      scoring:
        - "$520 + (-349) = +171$ kJ/mol is endothermic; the lattice energy released when the gaseous ions form the solid (861 kJ/mol) is much larger, so the overall process is exothermic."
    - label: d
      points: 1
      prompt: Would you expect the lattice energy of MgS to be larger or smaller than that of LiCl? Justify your answer with Coulomb's law.
      scoring:
        - "Larger: $\\ce{Mg^2+}$ and $\\ce{S^2-}$ have twice the charges, so $Q_1Q_2$ is four times as large; that outweighs the larger size of $\\ce{S^2-}$."
  explanation: |
    **(a)** Lattice energy separates one mole of the solid into gaseous ions: $\ce{LiCl(s) -> Li+(g) + Cl-(g)}$.

    **(b)** $\Delta H^\circ_f = \Delta H_{\text{sub}} + \Delta H(\ce{Cl(g)}) + \text{IE} + \text{EA} - \Delta H_{\text{lattice}}$, so $\Delta H_{\text{lattice}} = 159 + 122 + 520 - 349 + 409 = +861$ kJ/mol.

    **(c)** Removing Li's electron costs 520 kJ/mol and adding it to Cl releases 349, for a net +171 kJ/mol. The ions then come together into the lattice and release 861 kJ/mol, which more than makes up for it.

    **(d)** By Coulomb's law, attraction is proportional to $Q_1Q_2/d$. MgS has +2 and −2 ions, so $Q_1Q_2$ is four times that of LiCl. $\ce{S^2-}$ is larger than $\ce{Cl-}$, which increases $d$ a little, but the charge effect is much bigger. MgS has the larger lattice energy.

