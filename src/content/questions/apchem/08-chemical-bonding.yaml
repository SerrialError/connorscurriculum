  choices:
    - { id: a, text: "HF, because the electronegativity difference is largest" }
    - { id: b, text: "HI, because its bond is the longest" }
    - { id: c, text: "HCl, because Cl has the most negative electron affinity" }
    - { id: d, text: "All four are equal, because each has one polar bond" }
  answer: a
  explanation: |
    $\mu = Qr$. A longer bond raises $\mu$, but the partial charges matter much more here: ΔEN falls from 1.9 (HF) to 0.4 (HI), so HF's partial charges are far larger. The measured values drop from about 1.8 D for HF to about 0.4 D for HI. (C) mixes up electron affinity with electronegativity.

- id: apchem-08-dipole-hbr
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.4"]
  cedTopics: []
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    HBr has a bond length of 1.41 Å and a dipole moment of 0.82 D. About what fraction of an electron's charge is the partial charge on each atom?

    ($1\ \text{D} = 3.34 \times 10^{-30}$ C·m; electron charge $= 1.60 \times 10^{-19}$ C)
  choices:
    - { id: a, text: "0.82" }
    - { id: b, text: "0.58" }
    - { id: c, text: "0.12" }
    - { id: d, text: "0.17" }
  answer: c
  explanation: |
    If the charges were a full $\pm 1.60 \times 10^{-19}$ C:

    $$
    \mu = (1.60 \times 10^{-19}\ \text{C})(1.41 \times 10^{-10}\ \text{m}) = 2.26 \times 10^{-29}\ \text{C·m} = 6.75\ \text{D}
    $$

    The real value is 0.82 D, so the partial charges are $0.82 / 6.75 = 0.12$ of an electron's charge. (A) is the dipole moment itself. (B) is $0.82/1.41$, dividing by the bond length without converting to a full-charge dipole. (D) divides by 4.79 D, the value for charges 1.00 Å apart, without using HBr's 1.41 Å bond length.

- id: apchem-08-molecular-metal-compound
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.4"]
  cedTopics: ["2.1"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which compound is most likely a **molecular** substance that is a liquid at room temperature, even though it contains a metal?
  choices:
    - { id: a, text: '$\ce{CaCl2}$' }
    - { id: b, text: '$\ce{TiCl4}$' }
    - { id: c, text: '$\ce{NaCl}$' }
    - { id: d, text: '$\ce{MgO}$' }
  answer: b
  explanation: |
    A metal in a **high oxidation state** (+4 or more) pulls hard on the electrons of its neighbors, so its compounds behave like molecules rather than ionic solids. Ti is +4 in $\ce{TiCl4}$, which boils at 136 °C. The other three have metals in the +1 or +2 state and are high-melting ionic solids.

# --- 8.5 Drawing Lewis structures ---

- id: apchem-08-valence-sulfate
