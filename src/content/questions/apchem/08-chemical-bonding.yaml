  prompt: |
    In the best Lewis structure of nitric acid, $\ce{HNO3}$, N is bonded to three O atoms, and the H is on one of them. N has one N=O double bond and two N–O single bonds. What are the formal charges on N and on the O that has no H and only a single bond?
  choices:
