# --- 8.1 Lewis symbols and the octet rule ---

- id: apchem-08-lewis-symbol-p
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.1"]
  cedTopics: ["1.8"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In the Lewis symbol for phosphorus, how many dots are **unpaired**?
  choices:
    - { id: a, text: "1" }
    - { id: b, text: "3" }
    - { id: c, text: "5" }
    - { id: d, text: "2" }
  answer: b
  explanation: |
    P is in group 15, so it has 5 valence electrons. One dot goes on each of the four sides first, and the fifth pairs with one of them: one pair and **three** single dots. Those three unpaired electrons are why P (like N) usually makes three bonds, as in $\ce{PCl3}$. (C) is the total number of dots, not the unpaired ones.

- id: apchem-08-octet-two-bonds
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.1", "8.3"]
  cedTopics: ["2.1"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In most of its compounds with nonmetals, which atom forms **two** covalent bonds and keeps two lone pairs?
  choices:
    - { id: a, text: "N" }
    - { id: b, text: "C" }
    - { id: c, text: "O" }
    - { id: d, text: "F" }
  answer: c
  explanation: |
    O has 6 valence electrons (two pairs and two single dots). Sharing its two unpaired electrons in two bonds gives it an octet: 2 bonds and 2 lone pairs, as in $\ce{H2O}$. N usually makes 3 bonds with 1 lone pair, C makes 4 bonds, and F makes 1 bond with 3 lone pairs.

- id: apchem-08-ionic-pair
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.1", "8.2"]
  cedTopics: ["2.1"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which pair of elements is most likely to form an **ionic** compound?
  choices:
    - { id: a, text: "Carbon and oxygen" }
    - { id: b, text: "Copper and zinc" }
    - { id: c, text: "Nitrogen and hydrogen" }
    - { id: d, text: "Potassium and bromine" }
  answer: d
  explanation: |
    Ionic bonds form between a metal with a low ionization energy and a nonmetal with a large electronegativity: K (group 1) and Br (group 17). (A) and (C) are two nonmetals, which share electrons in covalent bonds. (B) is two metals, which form a metallic solid (brass is an alloy of the two).

- id: apchem-08-metallic-bond
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.1"]
  cedTopics: ["2.1"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which description fits the bonding in a piece of solid copper?
  choices:
    - { id: a, text: "Copper atoms are held together by valence electrons that move freely through the whole metal" }
    - { id: b, text: "Each copper atom shares one pair of electrons with exactly one neighboring atom" }
    - { id: c, text: "Some copper atoms become Cu⁺ ions and others become Cu⁻ ions, which attract each other" }
    - { id: d, text: "Copper atoms are held together only by weak attractions between neighboring molecules" }
  answer: a
  explanation: |
    In **metallic bonding**, the valence electrons aren't tied to one atom or one bond; they move through the whole solid and hold the metal atoms together. That's why metals conduct electricity. (B) describes a diatomic covalent molecule. (C) is not how metals behave: a metal doesn't form anions. (D) describes intermolecular forces, which are not bonds.

# --- 8.2 Ionic bonding ---

- id: apchem-08-lattice-energy-equation
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: ["2.2", "2.3"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which equation's enthalpy change is the **lattice energy** of calcium fluoride?
  choices:
    - { id: a, text: '$\ce{Ca(s) + F2(g) -> CaF2(s)}$' }
    - { id: b, text: '$\ce{CaF2(s) -> Ca(g) + F2(g)}$' }
    - { id: c, text: '$\ce{CaF2(s) -> Ca^2+(g) + 2F-(g)}$' }
    - { id: d, text: '$\ce{CaF2(s) -> Ca^2+(aq) + 2F-(aq)}$' }
  answer: c
  explanation: |
    Lattice energy is the energy needed to completely separate one mole of the ionic solid into its **gaseous ions**. (A) is the formation reaction ($\Delta H^\circ_f$). (B) makes neutral atoms and a molecule, not ions. (D) is dissolving the solid in water, which gives aqueous ions surrounded by water molecules.

- id: apchem-08-lattice-largest
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: ["2.2", "2.3"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which compound has the **largest** lattice energy?
  choices:
    - { id: a, text: '$\ce{NaCl}$' }
    - { id: b, text: '$\ce{MgS}$' }
    - { id: c, text: '$\ce{CaO}$' }
    - { id: d, text: '$\ce{MgO}$' }
  answer: d
  explanation: |
    By Coulomb's law, lattice energy grows with the ion charges and shrinks with the distance between ions. MgO, CaO, and MgS all have +2 and −2 ions, so all beat NaCl (+1/−1). Among those three, MgO has the smallest cation ($\ce{Mg^2+}$ < $\ce{Ca^2+}$) and the smallest anion ($\ce{O^2-}$ < $\ce{S^2-}$), so its ions are closest together.

- id: apchem-08-lattice-smallest
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: ["2.2", "2.3"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which compound has the **smallest** lattice energy?
  choices:
    - { id: a, text: '$\ce{KI}$' }
    - { id: b, text: '$\ce{NaF}$' }
    - { id: c, text: '$\ce{LiCl}$' }
    - { id: d, text: '$\ce{KF}$' }
  answer: a
  explanation: |
    All four have +1 and −1 ions, so size decides. The largest ions sit farthest apart and attract least. $\ce{K+}$ is the largest cation here and $\ce{I-}$ the largest anion, so KI has the smallest lattice energy. KF has the same cation but the much smaller $\ce{F-}$.

- id: apchem-08-lattice-lif-kf
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: ["2.2", "2.3"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    The lattice energy of LiF is larger than that of KF. Which statement best explains this?
  choices:
    - { id: a, text: "Li⁺ has a larger charge than K⁺, so it attracts F⁻ more strongly" }
    - { id: b, text: "Li⁺ is smaller than K⁺, so the ions in LiF are closer together and attract more strongly" }
    - { id: c, text: "K has a lower ionization energy than Li, so the ions in KF form more easily and attract less" }
    - { id: d, text: "Li⁺ is larger than K⁺, so it has more room to surround itself with F⁻ ions" }
  answer: b
  explanation: |
    Both compounds have +1 and −1 ions, so by Coulomb's law ($E \propto Q_1Q_2/d$) the difference must come from $d$. $\ce{Li+}$ (period 2) is much smaller than $\ce{K+}$ (period 4), so the distance between ion centers is smaller in LiF. (A) is false: both cations are +1. (D) has the sizes backward. (C) mixes up two different energies: ionization energy is about making the ion, while lattice energy is about how strongly the finished ions attract each other in the solid.

- id: apchem-08-coulomb-double-charge
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: ["2.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Two ions attract each other with a potential energy given by $E = \kappa Q_1 Q_2 / d$. If the charge on **both** ions is doubled and the distance between them stays the same, the size of $E$
  choices:
    - { id: a, text: "stays the same" }
    - { id: b, text: "doubles" }
    - { id: c, text: "is cut in half" }
    - { id: d, text: "becomes four times as large" }
  answer: d
  explanation: |
    $E$ is proportional to the **product** $Q_1Q_2$. Doubling each charge multiplies the product by $2 \times 2 = 4$. This is why +2/−2 compounds like MgO have lattice energies roughly five times those of +1/−1 compounds like NaCl: the charge product gives a factor of 4, and MgO's smaller ions add the rest.

- id: apchem-08-why-nacl-forms
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: ["2.2", "2.3"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Removing an electron from a sodium atom takes 496 kJ/mol, while adding an electron to a chlorine atom releases only 349 kJ/mol. Why is the formation of solid NaCl from Na and $\ce{Cl2}$ still strongly exothermic?
  choices:
    - { id: a, text: "Sodium reaches an octet when it loses its electron, and the octet lowers its energy by more than 496 kJ/mol" }
    - { id: b, text: "Breaking the Cl–Cl bond releases energy, which makes up the difference between the two values" }
    - { id: c, text: "A large amount of energy is released when the gaseous ions are attracted together into the solid lattice" }
    - { id: d, text: "The electron affinity of chlorine is larger than the ionization energy of sodium when both are in the solid" }
  answer: c
  explanation: |
    Making separated $\ce{Na+}$ and $\ce{Cl-}$ ions from the atoms is uphill by about 147 kJ/mol. The payoff is the **lattice energy**: 788 kJ/mol is released when the gaseous ions come together into the crystal. (A) is the common misconception; reaching an octet doesn't make losing an electron release energy. (B) is backward: breaking a bond always absorbs energy. (D) is wrong because ionization energy and electron affinity are measured for isolated gaseous atoms, and 349 kJ/mol is less than 496 kJ/mol either way.

- id: apchem-08-ionic-solid-properties
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: ["2.3"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which property is typical of an ionic solid such as KBr?
  choices:
    - { id: a, text: "It conducts electricity as a solid because its ions carry charge" }
    - { id: b, text: "It conducts electricity when melted, but not as a solid" }
    - { id: c, text: "It bends without breaking when struck, because its layers can slide" }
    - { id: d, text: "It melts at a low temperature because the attractions between its ions are weak" }
  answer: b
  explanation: |
    The ions in an ionic solid are locked in the lattice, so they can't move and carry current. When the solid melts (or dissolves in water), the ions can move and the liquid conducts. (A) ignores that the ions are fixed. (C) describes metals; ionic solids are brittle, because shifting a layer lines up like charges. (D) is backward: the strong attractions give ionic solids high melting points.

- id: apchem-08-fe3-config
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: ["1.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    What is the electron configuration of $\ce{Fe^3+}$? (Fe is $[\ce{Ar}]\,3d^6 4s^2$.)
  choices:
    - { id: a, text: '$[\ce{Ar}]\,3d^3 4s^2$' }
    - { id: b, text: '$[\ce{Ar}]\,3d^6$' }
    - { id: c, text: '$[\ce{Ar}]\,3d^4 4s^1$' }
    - { id: d, text: '$[\ce{Ar}]\,3d^5$' }
  answer: d
  explanation: |
    A transition metal loses its **4s** electrons first, then 3d. $\ce{Fe^3+}$ loses both 4s electrons and one 3d electron: $[\ce{Ar}]\,3d^5$. (A) removes all three from 3d. (B) is $\ce{Fe^2+}$. (C) removes electrons from both subshells without following the rule.

- id: apchem-08-not-noble-gas
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: ["1.5", "1.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which ion does **not** have a noble-gas electron configuration?
  choices:
    - { id: a, text: '$\ce{Zn^2+}$' }
    - { id: b, text: '$\ce{Sc^3+}$' }
    - { id: c, text: '$\ce{S^2-}$' }
    - { id: d, text: '$\ce{Al^3+}$' }
  answer: a
  explanation: |
    Zn is $[\ce{Ar}]\,3d^{10}4s^2$; losing the two 4s electrons leaves $[\ce{Ar}]\,3d^{10}$, which is not a noble-gas configuration. $\ce{Sc^3+}$ loses $4s^2 3d^1$ to become $[\ce{Ar}]$. $\ce{S^2-}$ gains two electrons to become $[\ce{Ar}]$. $\ce{Al^3+}$ becomes $[\ce{Ne}]$.

- id: apchem-08-why-not-na2plus
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: ["1.7", "1.8"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Sodium forms $\ce{Na+}$ in its compounds but never $\ce{Na^2+}$. Why?
  choices:
    - { id: a, text: "Na⁺ is isoelectronic with Ne, and an ion with a noble-gas electron count cannot lose electrons" }
    - { id: b, text: "Na²⁺ would have a noble-gas configuration that is less stable than the one Na⁺ already has" }
    - { id: c, text: "The second electron would come from the n = 2 core, which costs far too much energy" }
    - { id: d, text: "Na²⁺ would be larger than Na⁺, so it could not fit into a crystal lattice" }
  answer: c
  explanation: |
    $\ce{Na+}$ is $[\ce{Ne}]$. A second electron would have to come from the 2p subshell, which is much closer to the nucleus and far less shielded; Na's second ionization energy is about ten times its first. The extra lattice energy from a +2 ion can't pay for that. (B) is backward: $\ce{Na+}$ already has the noble-gas configuration, and $\ce{Na^2+}$ would not have one. (D) has the size backward. (A) overstates it: the electron can be removed, it just costs far more energy than forming the compound can pay back.

- id: apchem-08-born-haber-calc
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: []
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Use these values (kJ/mol) to find the lattice energy of NaBr.

    | $\ce{Na(s) -> Na(g)}$ | $\ce{1/2Br2(l) -> Br(g)}$ | First IE of Na | Electron affinity of Br | $\Delta H^\circ_f$ of NaBr(s) |
    |---|---|---|---|---|
    | +108 | +112 | +496 | −325 | −361 |
  choices:
    - { id: a, text: "+30 kJ/mol" }
    - { id: b, text: "+644 kJ/mol" }
    - { id: c, text: "+752 kJ/mol" }
    - { id: d, text: "+1402 kJ/mol" }
  answer: c
  explanation: |
    By Hess's law, $\Delta H^\circ_f = \Delta H_{\text{sub}} + \Delta H(\ce{Br(g)}) + \text{IE} + \text{EA} - \Delta H_{\text{lattice}}$, so

    $$
    \Delta H_{\text{lattice}} = 108 + 112 + 496 + (-325) - (-361) = +752\ \text{kJ/mol}
    $$

    (A) adds $\Delta H^\circ_f$ instead of subtracting it. (D) uses +325 for the electron affinity. (B) leaves out the sublimation of Na.

- id: apchem-08-born-haber-sign
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.2"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    In the Born–Haber cycle for KCl, which step **releases** energy?
  choices:
    - { id: a, text: '$\ce{K(s) -> K(g)}$' }
    - { id: b, text: '$\ce{Cl(g) + e- -> Cl-(g)}$' }
    - { id: c, text: '$\ce{1/2Cl2(g) -> Cl(g)}$' }
    - { id: d, text: '$\ce{K(g) -> K+(g) + e-}$' }
  answer: b
  explanation: |
    Adding an electron to a gaseous Cl atom releases energy; chlorine's electron affinity is −349 kJ/mol. Sublimation (A), breaking the Cl–Cl bond (C), and ionization (D) all absorb energy. The other energy-releasing step in the cycle is the last one, the gaseous ions coming together into the solid.

# --- 8.3 Covalent bonding ---

- id: apchem-08-lone-pairs-h2s
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.3"]
  cedTopics: ["2.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    How many lone pairs are on the sulfur atom in the Lewis structure of $\ce{H2S}$?
  choices:
    - { id: a, text: "0" }
    - { id: b, text: "1" }
    - { id: c, text: "2" }
    - { id: d, text: "3" }
  answer: c
  explanation: |
    $\ce{H2S}$ has $2(1) + 6 = 8$ valence electrons. Two S–H bonds use 4, and the other 4 sit on S as **two lone pairs**, the same as O in $\ce{H2O}$ (S is in the same group).

- id: apchem-08-shortest-nn
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.3", "8.8"]
  cedTopics: ["2.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    In which molecule is the nitrogen–nitrogen bond the **shortest**?
  choices:
    - { id: a, text: '$\ce{N2}$' }
    - { id: b, text: '$\ce{N2H2}$' }
    - { id: c, text: '$\ce{N2H4}$' }
  answer: a
  explanation: |
    Draw the Lewis structures: $\ce{N2H4}$ (H₂N–NH₂) has an N–N single bond, $\ce{N2H2}$ (HN=NH) a double bond, and $\ce{N2}$ a triple bond. More shared pairs pull the nuclei closer, so N≡N is the shortest (about 1.10 Å vs. 1.24 Å and 1.47 Å).

- id: apchem-08-covalent-what-holds
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.3"]
  cedTopics: ["2.1", "2.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What holds the two atoms together in a covalent bond?
  choices:
    - { id: a, text: "The attraction between a positive ion and a negative ion formed by electron transfer" }
    - { id: b, text: "The attraction of both nuclei for the pair of electrons shared between them" }
    - { id: c, text: "The repulsion between the two nuclei, which is balanced by the electrons' repulsion" }
    - { id: d, text: "The attraction between the δ+ end of one molecule and the δ− end of another" }
  answer: b
  explanation: |
    In a covalent bond the shared electrons sit between the nuclei, and **both** positive nuclei attract them. (A) describes an ionic bond. (D) describes an intermolecular attraction between separate molecules, not a bond within one. (C) names only repulsions, which can't hold anything together.

- id: apchem-08-triple-bond-electrons
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.3"]
  cedTopics: ["2.5"]
  difficulty: 1
