    Using an electronegativity difference of more than 2 as the rough line between polar covalent and ionic, which bond is best described as **ionic**? (Electronegativities: Li 1.0, P 2.1, C 2.5, O 3.5, Cl 3.0, F 4.0)
  choices:
    - { id: a, text: "C–Cl" }
    - { id: b, text: "C–O" }
    - { id: c, text: "Li–F" }
