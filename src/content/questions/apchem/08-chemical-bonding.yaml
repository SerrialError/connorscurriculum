  choices:
    - { id: a, text: "174 kJ/mol" }
    - { id: b, text: "348 kJ/mol" }
    - { id: c, text: "696 kJ/mol" }
    - { id: d, text: "614 kJ/mol" }
  answer: d
  explanation: |
    A double bond is stronger than a single bond but **less than twice** as strong, because the second shared pair doesn't overlap as well as the first. The table value is 614 kJ/mol, less than $2 \times 348 = 696$.

