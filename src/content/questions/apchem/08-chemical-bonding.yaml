    - { id: c, text: "−3" }
    - { id: d, text: "−5" }
  answer: c
  explanation: |
    Formal charges always add up to the overall charge of the species. For $\ce{PO4^3-}$ that's −3, whichever structure you draw. For a neutral molecule the sum is 0.

- id: apchem-08-lone-pairs-phosgene
  type: mcq
  subject: apchem
  chapter: 8
