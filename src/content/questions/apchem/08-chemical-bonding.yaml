- id: apchem-08-why-exothermic
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.8"]
  cedTopics: ["6.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Burning methane is exothermic. In terms of bonds, why?
  choices:
    - { id: a, text: "Breaking the bonds in CH₄ and O₂ releases energy, and forming the new bonds in CO₂ and H₂O releases even more" }
    - { id: b, text: "The products have more bonds than the reactants, and every bond stores energy" }
    - { id: c, text: "Forming the bonds in CO₂ and H₂O releases more energy than breaking the bonds in CH₄ and O₂ absorbs" }
    - { id: d, text: "The C–H bonds are weak, so breaking them releases the energy that leaves as heat" }
  answer: c
  explanation: |
    Breaking bonds always **absorbs** energy and forming bonds always **releases** it. A reaction is exothermic when the bonds formed are stronger in total than the bonds broken. (A) and (D) say breaking a bond releases energy, which is never true. (B) is wrong on both counts: the reactants and products of methane combustion both have 6 bonds, and bonds don't store energy that is released when they break.

