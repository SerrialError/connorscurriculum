    - { id: b, text: '$\ce{BCl3}$' }
    - { id: c, text: '$\ce{NCl3}$' }
    - { id: d, text: '$\ce{PCl5}$' }
  answer: b
  explanation: |
    Boron has 3 valence electrons and forms three B–Cl bonds, leaving it with 6. C in $\ce{CCl4}$ and N in $\ce{NCl3}$ have octets. P in $\ce{PCl5}$ has **more** than an octet (10).

- id: apchem-08-no-expanded-n
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.7"]
  cedTopics: ["2.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which of these molecules does **not** exist?
  choices:
