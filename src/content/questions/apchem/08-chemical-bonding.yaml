- id: apchem-08-no-unpaired-atom
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.7"]
  cedTopics: ["2.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Nitrogen monoxide, $\ce{NO}$, has 11 valence electrons. In its best Lewis structure (an N=O double bond, with every formal charge 0), where is the unpaired electron?
  choices:
    - { id: a, text: "On the O atom" }
    - { id: b, text: "On the N atom" }
    - { id: c, text: "Shared in the N=O bond" }
    - { id: d, text: "There is no unpaired electron; NO has an octet on both atoms" }
  answer: b
  explanation: |
    With N=O, two lone pairs on O, and one lone pair plus one single electron on N, the formal charges are N: $5 - (3 + 2) = 0$ and O: $6 - (4 + 2) = 0$. Putting the odd electron on O instead would give O nine electrons, more than a period-2 atom can hold. The less electronegative atom ends up "one electron short" of an octet, as the lab handout puts it. (D) can't be right: an odd total can never be all pairs.

- id: apchem-08-ionic-cutoff
  type: mcq
