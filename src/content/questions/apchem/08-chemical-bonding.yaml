  sections: ["8.2"]
  cedTopics: ["2.2", "2.3"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Adding a second electron to $\ce{O-(g)}$ to make $\ce{O^2-(g)}$ **absorbs** about 800 kJ/mol, and removing two electrons from Mg costs about 2200 kJ/mol. Why does MgO still form, with a very negative $\Delta H^\circ_f$?
  choices:
    - { id: a, text: "The two electrons added to O come from Mg, so the energies of the two steps cancel" }
    - { id: b, text: "The +2 and −2 ions attract so strongly that the lattice energy (about 3800 kJ/mol) pays for every uphill step" }
    - { id: c, text: "Breaking the O=O bond in O₂ releases enough energy to cover the ionization of Mg" }
    - { id: d, text: "O²⁻ has a noble-gas configuration, and reaching it releases the energy needed" }
  answer: b
  explanation: |
    By Coulomb's law, doubling both charges makes the attraction about four times as large, so MgO's lattice energy is huge. That release outweighs the endothermic steps. (A) is false: the steps don't cancel; ionizing Mg and forming $\ce{O^2-}$ both cost energy. (C) is backward: breaking a bond absorbs energy. (D) is the octet misconception; making $\ce{O^2-}$ from $\ce{O-}$ costs energy.

