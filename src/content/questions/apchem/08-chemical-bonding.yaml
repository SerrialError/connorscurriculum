  answer: b
  explanation: |
    In ozone the O=O double bond can be drawn to either end oxygen, giving two equivalent structures; both O–O bonds are really the same length. The other three have only single bonds, and there is nowhere for a double bond to move.

- id: apchem-08-nitrate-bond-order
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.6"]
  cedTopics: ["2.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    The nitrate ion, $\ce{NO3-}$, has three resonance structures, each with one N=O and two N–O bonds. What is the bond order of each N–O bond in the real ion?
  choices:
    - { id: a, text: "1" }
    - { id: b, text: "3/2" }
    - { id: c, text: "2" }
    - { id: d, text: "4/3" }
  answer: d
  explanation: |
    Each N–O bond is double in one structure and single in two: $(2 + 1 + 1)/3 = 4/3$. All three bonds are identical. (B) is the bond order for a species with **two** resonance structures, like $\ce{NO2-}$ or $\ce{O3}$.

- id: apchem-08-resonance-true
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.6"]
  cedTopics: ["2.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    The nitrite ion, $\ce{NO2-}$, is drawn with two resonance structures. Which statement about the real ion is true?
  choices:
    - { id: a, text: "It has a negative charge on one O and none on the other, so its two N–O bonds differ" }
    - { id: b, text: "One N–O bond is a double bond and the other is a single bond, but the two bonds keep trading places" }
    - { id: c, text: "Both N–O bonds are identical, with a length between an N–O single and an N=O double bond" }
    - { id: d, text: "The oxygen atoms move between the two structures, so the ion's shape changes" }
  answer: c
  explanation: |
    The real ion is a **resonance hybrid**: a single structure with the extra bonding spread over both N–O bonds, each of bond order 3/2. It doesn't flip between the drawn structures, as (B) suggests, and the negative charge is shared equally by both O atoms, not stuck on one (A). In resonance structures only electrons move; atoms stay put, so (D) is wrong.

- id: apchem-08-co-bond-length-order
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.6", "8.8"]
  cedTopics: ["2.2", "2.6"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Rank the carbon–oxygen bonds in CO, $\ce{CO2}$, and $\ce{CO3^2-}$ from **shortest to longest**.
  choices:
    - { id: a, text: '$\ce{CO} < \ce{CO2} < \ce{CO3^2-}$' }
    - { id: b, text: '$\ce{CO3^2-} < \ce{CO2} < \ce{CO}$' }
    - { id: c, text: '$\ce{CO2} < \ce{CO} < \ce{CO3^2-}$' }
    - { id: d, text: '$\ce{CO} < \ce{CO3^2-} < \ce{CO2}$' }
  answer: a
  explanation: |
    Bond orders: CO has a triple bond (3), $\ce{CO2}$ two double bonds (2), and $\ce{CO3^2-}$ three resonance structures, so each bond has order 4/3. Higher bond order means a shorter bond, so CO < $\ce{CO2}$ < $\ce{CO3^2-}$. (B) is the reverse.

- id: apchem-08-resonance-rule
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.6"]
  cedTopics: ["2.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which change turns one valid resonance structure into another?
  choices:
    - { id: a, text: "Moving a hydrogen atom from one oxygen to another" }
    - { id: b, text: "Adding a pair of electrons to the central atom" }
    - { id: c, text: "Changing which atom is in the center of the molecule" }
    - { id: d, text: "Moving a lone pair into a bond and a bond pair out to a lone pair" }
  answer: d
  explanation: |
    Resonance structures differ only in where the **electrons** are. The atoms stay in the same places and the total number of electrons stays the same. (A) and (C) move atoms, which gives a different compound (an isomer), not a resonance structure. (B) changes the electron count.

- id: apchem-08-formate-resonance
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.6"]
  cedTopics: ["2.6"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    The formate ion, $\ce{HCO2-}$, has C as the central atom bonded to H and to both O atoms. How many equivalent resonance structures does it have, and what is the bond order of each C–O bond?
  choices:
    - { id: a, text: "One structure; one C–O bond order 1 and one bond order 2" }
    - { id: b, text: "Two structures; each C–O bond has bond order 3/2" }
    - { id: c, text: "Three structures; each C–O bond has bond order 4/3" }
    - { id: d, text: "Two structures; one C–O bond has order 2 and the other has order 1" }
  answer: b
  explanation: |
    18 valence electrons. C makes one C–H bond, one C=O, and one C–O⁻, and the double bond can go to either O: two equivalent structures. Each C–O bond is double in one and single in the other, so the bond order is $(2 + 1)/2 = 3/2$, and both bonds are the same length. (D) describes a single resonance structure, not the real ion. (C) is carbonate's pattern, which has three O atoms.

- id: apchem-08-no-bond-length-rank
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.6", "8.8"]
  cedTopics: ["2.2", "2.6"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Rank the N–O bond length in $\ce{NO+}$, $\ce{NO2-}$, and $\ce{NO3-}$ from **shortest to longest**.
  choices:
    - { id: a, text: '$\ce{NO3-} < \ce{NO2-} < \ce{NO+}$' }
    - { id: b, text: '$\ce{NO2-} < \ce{NO+} < \ce{NO3-}$' }
    - { id: c, text: '$\ce{NO+} < \ce{NO2-} < \ce{NO3-}$' }
    - { id: d, text: '$\ce{NO+} < \ce{NO3-} < \ce{NO2-}$' }
  answer: c
  explanation: |
    $\ce{NO+}$ has 10 valence electrons and a triple bond (bond order 3). $\ce{NO2-}$ has two resonance structures (bond order 3/2). $\ce{NO3-}$ has three (bond order 4/3). Higher bond order means a shorter bond, so $\ce{NO+} < \ce{NO2-} < \ce{NO3-}$. (D) ranks 4/3 above 3/2.

- id: apchem-08-ozone-vs-o2
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.6", "8.8"]
  cedTopics: ["2.2", "2.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    How does each O–O bond in ozone, $\ce{O3}$, compare with the bond in $\ce{O2}$?
  choices:
    - { id: a, text: "Shorter and stronger, because ozone has more oxygen atoms sharing electrons" }
    - { id: b, text: "The same, because both molecules contain an O=O double bond" }
    - { id: c, text: "One O–O bond in ozone matches O₂ and the other is a longer single bond" }
    - { id: d, text: "Longer and weaker, because each bond in ozone has a bond order of 3/2" }
  answer: d
  explanation: |
    $\ce{O2}$ has a double bond (bond order 2). Ozone has two resonance structures, so both of its O–O bonds have bond order 3/2: between a single and a double bond. A lower bond order means a longer, weaker bond. (B) and (C) treat one resonance structure as the real molecule.

- id: apchem-08-sulfate-formal-charge
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.5", "8.7"]
  cedTopics: ["2.6"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Sulfate, $\ce{SO4^2-}$, is often drawn two ways: with four S–O single bonds (an octet on S), or with two S=O double bonds and two S–O single bonds (12 electrons around S). What is the formal charge on S in each?
  choices:
    - { id: a, text: "+2 with all single bonds; 0 with two double bonds" }
    - { id: b, text: "0 with all single bonds; +2 with two double bonds" }
    - { id: c, text: "−2 with all single bonds; 0 with two double bonds" }
    - { id: d, text: "+2 with all single bonds; +2 with two double bonds" }
  answer: a
  explanation: |
    All single bonds: S has 4 bonds and no lone pairs, $6 - 0 - 4 = +2$, and each O is $6 - 6 - 1 = -1$ (sum −2). Two double bonds: S has 6 bonds, $6 - 0 - 6 = 0$; the two double-bonded O atoms are 0 and the two single-bonded O atoms are −1 (sum −2). The expanded structure has smaller formal charges, which is why some books draw it, while the octet structure keeps the octet rule. (C) puts the ion's overall charge on S.

- id: apchem-08-so3-resonance
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.6"]
  cedTopics: ["2.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Drawn with an octet on sulfur (one S=O double bond and two S–O single bonds), how many equivalent resonance structures does sulfur trioxide, $\ce{SO3}$, have?
  choices:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "4" }
  answer: c
  explanation: |
    The double bond can go to any of the three O atoms, giving three equivalent structures, the same pattern as nitrate and carbonate. All three S–O bonds in the real molecule are identical.

# --- 8.7 Exceptions to the octet rule ---

- id: apchem-08-odd-electron
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.7"]
  cedTopics: ["2.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which molecule **must** have an unpaired electron?
  choices:
    - { id: a, text: '$\ce{NO2}$' }
    - { id: b, text: '$\ce{CO2}$' }
    - { id: c, text: '$\ce{SO2}$' }
    - { id: d, text: '$\ce{O3}$' }
  answer: a
  explanation: |
    $\ce{NO2}$ has $5 + 2(6) = 17$ valence electrons. An odd total can't all be paired. The others have even totals: $\ce{CO2}$ 16, $\ce{SO2}$ 18, $\ce{O3}$ 18.

- id: apchem-08-incomplete-octet
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.7"]
  cedTopics: ["2.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
