    N has 4 bonds and no lone pairs: $5 - 0 - 4 = +1$. The single-bonded O without H has 3 lone pairs and 1 bond: $6 - 6 - 1 = -1$. The double-bonded O ($6 - 4 - 2 = 0$) and the O–H oxygen ($6 - 4 - 2 = 0$) are neutral, so the total is 0 for the neutral molecule.

- id: apchem-08-thiocyanate-best
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.5"]
  cedTopics: ["2.6"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    The thiocyanate ion, $\ce{SCN-}$, has C in the center. Which Lewis structure is best? (Electronegativities: S 2.5, C 2.5, N 3.0)
  choices:
    - { id: a, text: "S≡C–N, with −2 on N and +1 on S" }
    - { id: b, text: "S–C≡N, with −1 on S and no other formal charges" }
