- id: apchem-08-covalent-what-holds
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.3"]
  cedTopics: ["2.1", "2.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What holds the two atoms together in a covalent bond?
  choices:
    - { id: a, text: "The attraction between a positive ion and a negative ion formed by electron transfer" }
    - { id: b, text: "The attraction of both nuclei for the pair of electrons shared between them" }
    - { id: c, text: "The repulsion between the two nuclei, which is balanced by the electrons' repulsion" }
    - { id: d, text: "The attraction between the δ+ end of one molecule and the δ− end of another" }
  answer: b
  explanation: |
    In a covalent bond the shared electrons sit between the nuclei, and **both** positive nuclei attract them. (A) describes an ionic bond. (D) describes an intermolecular attraction between separate molecules, not a bond within one. (C) names only repulsions, which can't hold anything together.

- id: apchem-08-triple-bond-electrons
  type: mcq
