  cedTopics: ["2.6"]
  difficulty: 3
  group: oxyanion-fc
  authors: ["Claude"]
  prompt: |
    Sulfate, $\ce{SO4^2-}$, is often drawn two ways: with four S–O single bonds (an octet on S), or with two S=O double bonds and two S–O single bonds (12 electrons around S). What is the formal charge on S in each?
  choices:
    - { id: a, text: "+2 with all single bonds; 0 with two double bonds" }
    - { id: b, text: "0 with all single bonds; +2 with two double bonds" }
    - { id: c, text: "−2 with all single bonds; 0 with two double bonds" }
    - { id: d, text: "+2 with all single bonds; +2 with two double bonds" }
  answer: a
  explanation: |
    All single bonds: S has 4 bonds and no lone pairs, $6 - 0 - 4 = +2$, and each O is $6 - 6 - 1 = -1$ (sum −2). Two double bonds: S has 6 bonds, $6 - 0 - 6 = 0$; the two double-bonded O atoms are 0 and the two single-bonded O atoms are −1 (sum −2). The expanded structure has smaller formal charges, which is why some books draw it, while the octet structure keeps the octet rule. (C) puts the ion's overall charge on S.

