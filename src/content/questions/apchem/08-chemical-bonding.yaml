    - { id: b, text: "−1" }
    - { id: c, text: "+1" }
    - { id: d, text: "+4" }
  answer: c
  explanation: |
    N has 5 valence electrons. In $\ce{NH4+}$ it has no lone pairs and four bonds: $5 - 0 - \tfrac{1}{2}(8) = +1$. Each H has $1 - 0 - 1 = 0$, so the formal charges add up to +1, the charge of the ion.

- id: apchem-08-fc-carbon-monoxide
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.5"]
  cedTopics: ["2.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
