        - "Both bonds are the same length, between a single and a double bond (shorter than S–O, longer than S=O), because each has bond order 3/2 in the resonance hybrid."
  explanation: |
    **(a)** $3 \times 6 = 18$ electrons. Two S–O bonds and octets on both O use 16; the last 2 go on S as a lone pair. S then has only 6, so one O lone pair becomes a second bond. S: $6 - 2 - 3 = +1$. Single-bonded O: $6 - 6 - 1 = -1$. Double-bonded O: $6 - 4 - 2 = 0$.

    **(b)** Isoelectronic species have the same number of electrons. Ozone is $\ce{O3}$, three group 16 atoms, 18 valence electrons. ($\ce{O2}$, the other allotrope, has 12.)

    **(c)** The double bond can be drawn to either O, and the two drawings are mirror images, so they're equivalent.

    **(d)** The real molecule is the average of the two structures. Each S–O bond is double in one and single in the other, so its bond order is $(2 + 1)/2 = 3/2$.

