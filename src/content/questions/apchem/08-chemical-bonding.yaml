    Which molecule has the **shortest and strongest** carbon–carbon bond?
  choices:
    - { id: a, text: '$\ce{C2H6}$' }
    - { id: b, text: '$\ce{C2H4}$' }
    - { id: c, text: '$\ce{C6H6}$ (benzene)' }
    - { id: d, text: '$\ce{C2H2}$' }
  answer: d
  explanation: |
    $\ce{C2H2}$ has a C≡C triple bond (bond order 3). $\ce{C2H4}$ has a double bond (2), benzene's C–C bonds are 1.5 on average, and $\ce{C2H6}$ has a single bond (1). Higher bond order means shorter and stronger.

- id: apchem-08-why-exothermic
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.8"]
  cedTopics: ["6.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Burning methane is exothermic. In terms of bonds, why?
  choices:
    - { id: a, text: "Breaking the bonds in CH₄ and O₂ releases energy, and forming the new bonds in CO₂ and H₂O releases even more" }
    - { id: b, text: "The products have more bonds than the reactants, and every bond stores energy" }
    - { id: c, text: "Forming the bonds in CO₂ and H₂O releases more energy than breaking the bonds in CH₄ and O₂ absorbs" }
    - { id: d, text: "The C–H bonds are weak, so breaking them releases the energy that leaves as heat" }
  answer: c
  explanation: |
    Breaking bonds always **absorbs** energy and forming bonds always **releases** it. A reaction is exothermic when the bonds formed are stronger in total than the bonds broken. (A) and (D) say breaking a bond releases energy, which is never true. (B) is wrong on both counts: the reactants and products of methane combustion both have 6 bonds, and bonds don't store energy that is released when they break.

- id: apchem-08-double-not-twice
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.8"]
  cedTopics: ["2.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    The average C–C bond enthalpy is 348 kJ/mol. Which value is closest to the average C=C bond enthalpy?
  choices:
    - { id: a, text: "174 kJ/mol" }
    - { id: b, text: "348 kJ/mol" }
    - { id: c, text: "696 kJ/mol" }
    - { id: d, text: "614 kJ/mol" }
  answer: d
  explanation: |
    A double bond is stronger than a single bond but **less than twice** as strong, because the second shared pair doesn't overlap as well as the first. The table value is 614 kJ/mol, less than $2 \times 348 = 696$.

