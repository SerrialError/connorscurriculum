    - { id: b, text: "9" }
    - { id: c, text: "10" }
    - { id: d, text: "7" }
  answer: a
  explanation: |
    $5 + 4(1) = 9$, and a **positive** charge means one electron has been removed: $9 - 1 = 8$. That's exactly four N–H bonds with no lone pairs. (C) adds the electron instead of subtracting it.

- id: apchem-08-hocl-skeleton
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.5"]
  cedTopics: ["2.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Hypochlorous acid has the formula HOCl. Which skeleton is correct?
  choices:
    - { id: a, text: "H–Cl–O, with Cl in the center because it is the least electronegative atom" }
    - { id: b, text: "H–O–Cl, with O in the center because then every atom has a formal charge of zero" }
    - { id: c, text: "O–H–Cl, with H in the center because it is written first" }
    - { id: d, text: "H–O–Cl and H–Cl–O are equally good, because both give every atom an octet" }
  answer: b
  explanation: |
    H can form only one bond, so it can't be central, which rules out (C). Cl is less electronegative than O, so the "least electronegative atom in the middle" rule points to (A), but two other rules win here: in an oxyacid the acidic H is bonded to an O, and formal charge breaks the tie. H–O–Cl has all formal charges zero. In H–Cl–O, Cl has two bonds and two lone pairs (+1) and O has one bond and three lone pairs (−1). Both skeletons give octets, so octets alone can't decide, which is why (D) is wrong.

- id: apchem-08-fc-ammonium
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.5"]
  cedTopics: ["2.6"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the formal charge on the nitrogen atom in $\ce{NH4+}$?
  choices:
    - { id: a, text: "0" }
    - { id: b, text: "−1" }
    - { id: c, text: "+1" }
    - { id: d, text: "+4" }
  answer: c
  explanation: |
    N has 5 valence electrons. In $\ce{NH4+}$ it has no lone pairs and four bonds: $5 - 0 - \tfrac{1}{2}(8) = +1$. Each H has $1 - 0 - 1 = 0$, so the formal charges add up to +1, the charge of the ion.

- id: apchem-08-fc-carbon-monoxide
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.5"]
  cedTopics: ["2.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    The Lewis structure of carbon monoxide has a C≡O triple bond and one lone pair on each atom. What are the formal charges?
  choices:
    - { id: a, text: "C 0, O 0" }
    - { id: b, text: "C −1, O +1" }
    - { id: c, text: "C +1, O −1" }
    - { id: d, text: "C −2, O +2" }
  answer: b
  explanation: |
    C: $4 - 2 - 3 = -1$. O: $6 - 2 - 3 = +1$. The positive formal charge lands on the **more** electronegative atom, which is unusual, but it's the only structure that gives both atoms an octet. Formal charge is bookkeeping, not the real charge; the actual molecule is only slightly polar.

- id: apchem-08-n2o-best
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.5"]
  cedTopics: ["2.6"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Nitrous oxide, $\ce{N2O}$, has the skeleton N–N–O. Three Lewis structures give every atom an octet. Which one contributes the **most** to the real molecule?
  choices:
    - { id: a, text: "N=N=O, with formal charges −1, +1, 0 from left to right" }
    - { id: b, text: "N–N≡O, with formal charges −2, +1, +1 from left to right" }
    - { id: c, text: "All three contribute equally, because they all follow the octet rule" }
    - { id: d, text: "N≡N–O, with formal charges 0, +1, −1 from left to right" }
  answer: d
  explanation: |
    Both (A) and (D) have small formal charges (one +1 and one −1), but in (D) the negative formal charge is on oxygen, the more electronegative atom, so it's the best structure. (A) still contributes, because its formal charges are just as small. (B) has a −2 and a positive charge on oxygen, so it hardly contributes. Following the octet rule doesn't make structures equally good (C).

- id: apchem-08-fc-sum
  type: mcq
