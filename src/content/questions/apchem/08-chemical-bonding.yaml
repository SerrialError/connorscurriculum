    - { id: d, text: "−2346 kJ" }
  answer: b
  explanation: |
    Broken: one N≡N and three H–H, $941 + 3(436) = 2249$ kJ. Formed: **six** N–H (two $\ce{NH3}$ with three each), $6(391) = 2346$ kJ.

    $$
    \Delta H \approx 2249 - 2346 = -97\ \text{kJ}
    $$

    (A) subtracts in the wrong order (formed − broken). (C) counts only three N–H bonds. (D) leaves out the bonds broken.

