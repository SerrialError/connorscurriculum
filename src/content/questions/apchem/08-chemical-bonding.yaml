  answer: c
  explanation: |
    The differences are Li–F 3.0, C–O 1.0, P–Cl 0.9, and C–Cl 0.5. Only Li–F is above 2, and it's a metal bonded to a nonmetal. The other three are polar covalent bonds between nonmetals.

- id: apchem-08-co2-fc-triple
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.5"]
  cedTopics: ["2.6"]
  difficulty: 2
  authors: ["Claude"]
  group: co2-formal-charge
  prompt: |
    In the Lewis structure of $\ce{CO2}$ drawn as $\ce{O-C#O}$ (three lone pairs on the single-bonded O, one lone pair on the triple-bonded O), what are the formal charges on the single-bonded O, the C, and the triple-bonded O?
  choices:
    - { id: a, text: "0, 0, 0" }
    - { id: b, text: "+1, 0, −1" }
    - { id: c, text: "−1, +1, 0" }
    - { id: d, text: "−1, 0, +1" }
  answer: d
  explanation: |
    Single-bonded O: $6 - (6 + 1) = -1$. C: $4 - (0 + 4) = 0$. Triple-bonded O: $6 - (2 + 3) = +1$. Because O=C=O has all zeros, it's the better structure. (B) has the signs swapped: the atom with more lone pairs gets the negative charge.

- id: apchem-08-be-four-electrons
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.7"]
  cedTopics: ["2.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    In a gas-phase $\ce{BeCl2}$ molecule, Cl–Be–Cl with two single bonds, how many valence electrons surround the Be atom?
  choices:
    - { id: a, text: "2" }
    - { id: b, text: "4" }
    - { id: c, text: "6" }
    - { id: d, text: "8" }
  answer: b
  explanation: |
    Be has 2 valence electrons and forms two single bonds, so it's surrounded by 2 shared pairs = 4 electrons. Be is stable with 4 and B with 6, the two common "fewer than an octet" exceptions. Drawing Be=Cl double bonds to reach 8 would put a positive formal charge on the very electronegative Cl.

- id: apchem-08-hypervalent-period
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.7"]
  cedTopics: ["2.5"]
  difficulty: 2
  group: hypervalent-n
  authors: ["Claude"]
  prompt: |
    Which of these could **not** exist, because its central atom can't hold more than an octet?
  choices:
    - { id: a, text: "$\\ce{PCl5}$" }
    - { id: b, text: "$\\ce{SF4}$" }
    - { id: c, text: "$\\ce{NCl5}$" }
    - { id: d, text: "$\\ce{XeF2}$" }
  answer: c
  explanation: |
    Five bonds need 10 electrons around the central atom. Only central atoms from period 3 and below can be hypervalent; N is in period 2, with no 2d subshell and too little room for five atoms. P (period 3) forms $\ce{PCl5}$, and S and Xe expand their octets in $\ce{SF4}$ and $\ce{XeF2}$.

