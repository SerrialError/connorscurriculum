    $7 + 5(7) = 42$ electrons. Five I–F bonds use 10, and three lone pairs on each F use 30, for 40. The last 2 go on I as **one** lone pair, so I has 12 electrons around it. (B) forgets to place the leftover electrons on the central atom.

- id: apchem-08-bond-enthalpy-ethylene
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.8"]
  cedTopics: ["6.7"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Estimate $\Delta H$ for $\ce{H2C=CH2(g) + H2(g) -> H3C-CH3(g)}$.

    | Bond | C=C | H–H | C–C | C–H |
    |---|---|---|---|---|
    | kJ/mol | 614 | 436 | 348 | 413 |
  choices:
    - { id: a, text: "+124 kJ" }
    - { id: b, text: "+702 kJ" }
    - { id: c, text: "−124 kJ" }
    - { id: d, text: "−1174 kJ" }
  answer: c
  explanation: |
    Only the bonds that change count; the four original C–H bonds survive. Broken: C=C and H–H, $614 + 436 = 1050$ kJ. Formed: one C–C and two new C–H, $348 + 2(413) = 1174$ kJ. $\Delta H \approx 1050 - 1174 = -124$ kJ. (B) forgets the two new C–H bonds. (A) subtracts in the wrong order. (D) leaves out the bonds broken.

- id: apchem-08-find-hbr-bond
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.8"]
  cedTopics: ["6.7"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    For $\ce{H2(g) + Br2(g) -> 2HBr(g)}$, $\Delta H = -103$ kJ. The H–H bond enthalpy is 436 kJ/mol and the Br–Br bond enthalpy is 193 kJ/mol. What is the H–Br bond enthalpy?
  choices:
    - { id: a, text: "263 kJ/mol" }
    - { id: b, text: "366 kJ/mol" }
    - { id: c, text: "732 kJ/mol" }
    - { id: d, text: "314 kJ/mol" }
  answer: b
  explanation: |
    $\Delta H = (436 + 193) - 2D(\ce{H-Br})$, so $-103 = 629 - 2D$ and $2D = 732$, giving $D = 366$ kJ/mol. (C) forgets that two H–Br bonds form. (D) uses +103 for $\Delta H$. (A) comes from $(629 - 103)/2$, which also has the sign of $\Delta H$ wrong.

- id: apchem-08-why-estimate
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.8"]
  cedTopics: ["6.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A $\Delta H$ calculated from a table of bond enthalpies usually differs a little from the measured value. What's the main reason?
  choices:
    - { id: a, text: "Table values are averages over many compounds, not the exact bond strengths in these molecules" }
    - { id: b, text: "Bond enthalpies are measured in the solid state, but reactions happen in the gas phase" }
    - { id: c, text: "Breaking a bond releases a slightly different amount of energy than forming it absorbs" }
    - { id: d, text: "Bond enthalpies ignore the energy of the lone pairs, which change during every reaction" }
  answer: a
  explanation: |
    A C–H bond in methane isn't exactly as strong as a C–H bond in ethanol. The table lists averages, so the estimate is close but not exact. (B) is backward: bond enthalpies are defined for gases. (C) is false: breaking and forming the same bond involve the same energy with opposite signs. (D) isn't how the method works.

- id: apchem-08-delta-minus-first
  type: mcq
  subject: apchem
