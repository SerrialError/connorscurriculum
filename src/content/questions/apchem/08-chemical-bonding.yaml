    - { id: b, text: '$\ce{PF5}$' }
    - { id: c, text: '$\ce{NF5}$' }
    - { id: d, text: '$\ce{XeF4}$' }
  answer: c
  explanation: |
    $\ce{NF5}$ would need 10 electrons around nitrogen. Period 2 atoms are too small to hold more than an octet. S, P, and Xe are in period 3 or below, and they're large enough to bond to five or six atoms.

- id: apchem-08-lone-pairs-xef2
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.7"]
