    The nitrate ion, $\ce{NO3-}$, has three resonance structures, each with one N=O and two N–O bonds. What is the bond order of each N–O bond in the real ion?
  choices:
    - { id: a, text: "1" }
    - { id: b, text: "3/2" }
    - { id: c, text: "2" }
    - { id: d, text: "4/3" }
  answer: d
  explanation: |
    Each N–O bond is double in one structure and single in two: $(2 + 1 + 1)/3 = 4/3$. All three bonds are identical. (B) is the bond order for a species with **two** resonance structures, like $\ce{NO2-}$ or $\ce{O3}$.

- id: apchem-08-resonance-true
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.6"]
  cedTopics: ["2.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    The nitrite ion, $\ce{NO2-}$, is drawn with two resonance structures. Which statement about the real ion is true?
  choices:
    - { id: a, text: "It has a negative charge on one O and none on the other, so its two N–O bonds differ" }
    - { id: b, text: "One N–O bond is a double bond and the other is a single bond, but the two bonds keep trading places" }
    - { id: c, text: "Both N–O bonds are identical, with a length between an N–O single and an N=O double bond" }
    - { id: d, text: "The oxygen atoms move between the two structures, so the ion's shape changes" }
  answer: c
  explanation: |
    The real ion is a **resonance hybrid**: a single structure with the extra bonding spread over both N–O bonds, each of bond order 3/2. It doesn't flip between the drawn structures, as (B) suggests, and the negative charge is shared equally by both O atoms, not stuck on one (A). In resonance structures only electrons move; atoms stay put, so (D) is wrong.

- id: apchem-08-co-bond-length-order
