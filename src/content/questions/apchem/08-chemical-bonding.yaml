  authors: ["Claude"]
  prompt: |
    A $\Delta H$ calculated from a table of bond enthalpies usually differs a little from the measured value. What's the main reason?
  choices:
    - { id: a, text: "Table values are averages over many compounds, not the exact bond strengths in these molecules" }
    - { id: b, text: "Bond enthalpies are measured in the solid state, but reactions happen in the gas phase" }
    - { id: c, text: "Breaking a bond releases a slightly different amount of energy than forming it absorbs" }
    - { id: d, text: "Bond enthalpies ignore the energy of the lone pairs, which change during every reaction" }
  answer: a
  explanation: |
    A C–H bond in methane isn't exactly as strong as a C–H bond in ethanol. The table lists averages, so the estimate is close but not exact. (B) is backward: bond enthalpies are defined for gases. (C) is false: breaking and forming the same bond involve the same energy with opposite signs. (D) isn't how the method works.

- id: apchem-08-delta-minus-first
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.4"]
  cedTopics: ["2.1"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    In which bond is the partial negative charge (δ−) on the atom written **first**? (Electronegativities: H 2.1, C 2.5, P 2.1, O 3.5, S 2.5, Cl 3.0)
  choices:
    - { id: a, text: "C–H" }
    - { id: b, text: "H–O" }
    - { id: c, text: "S–O" }
    - { id: d, text: "P–Cl" }
  answer: a
  explanation: |
    The more electronegative atom is δ−. C (2.5) beats H (2.1), so in C–H the δ− is on C, the first atom. In the other three, the second atom is more electronegative: O in H–O and S–O, and Cl in P–Cl.

- id: apchem-08-cl-vs-n-polar
  type: mcq
  subject: apchem
  chapter: 8
  sections: ["8.4"]
  cedTopics: ["2.1"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    On the Pauling scale used in the textbook, N and Cl both have an electronegativity of 3.0. What does that predict about the N–Cl bond in $\ce{NCl3}$?
  choices:
    - { id: a, text: "It is ionic, because both atoms are very electronegative" }
    - { id: b, text: "It is essentially nonpolar, because the electrons are shared about equally" }
    - { id: c, text: "It is polar, with N δ− because N is in period 2" }
    - { id: d, text: "It can't form, because two atoms with high electronegativity both keep their electrons" }
  answer: b
  explanation: |
    Polarity depends on the **difference** in electronegativity, not on how high the values are. ΔEN = 0, so the electrons are shared about equally. (A) confuses high electronegativity with a large difference. (D) is false: $\ce{NCl3}$ exists, and two electronegative atoms can share a pair.

- id: apchem-08-hydrazine-frq
  type: frq
  subject: apchem
  chapter: 8
  sections: ["8.3", "8.5", "8.8"]
  cedTopics: ["2.2", "2.5", "6.7"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Hydrazine burns in oxygen: $\ce{N2H4(g) + O2(g) -> N2(g) + 2H2O(g)}$.

    | Bond | N–N | N–H | O=O | N≡N | O–H |
    |---|---|---|---|---|---|
    | kJ/mol | 163 | 391 | 495 | 941 | 463 |
  parts:
    - label: a
      points: 1
      prompt: Draw the complete Lewis structure of $\ce{N2H4}$ (the two N atoms are bonded to each other).
      scoring:
        - "H₂N–NH₂: an N–N single bond, two N–H bonds on each N, and one lone pair on each N (14 electrons)."
    - label: b
      points: 1
      prompt: Use the bond enthalpies to estimate $\Delta H$ for the reaction.
      scoring:
        - "Broken: $163 + 4(391) + 495 = 2222$ kJ; formed: $941 + 4(463) = 2793$ kJ; $\\Delta H \\approx -571$ kJ."
    - label: c
      points: 1
      prompt: Is the N-to-N distance longer in $\ce{N2H4}$ or in $\ce{N2}$? Explain.
      scoring:
        - "Longer in N₂H₄: it has a single bond (bond order 1), while N₂ has a triple bond (bond order 3); more shared pairs pull the nuclei closer."
    - label: d
      points: 1
      prompt: Explain in terms of bonds why the reaction is exothermic.
      scoring:
        - "More energy is released forming the bonds in the products (especially the very strong N≡N) than is absorbed breaking the bonds in the reactants."
  explanation: |
    **(a)** $2(5) + 4(1) = 14$ electrons. N–N plus four N–H bonds use 10; the last 4 go as one lone pair on each N, giving both N atoms an octet.

    **(b)** Broken: one N–N (163), four N–H ($4 \times 391 = 1564$), one O=O (495), total 2222 kJ. Formed: one N≡N (941) and four O–H, two in each water ($4 \times 463 = 1852$), total 2793 kJ. $\Delta H \approx 2222 - 2793 = -571$ kJ.

    **(c)** $\ce{N2H4}$ has an N–N single bond and $\ce{N2}$ has a triple bond. A higher bond order means a shorter, stronger bond, so the N–N distance is longer in hydrazine.

    **(d)** Forming bonds releases energy, and breaking them absorbs it. The products' bonds total 2793 kJ, more than the 2222 kJ needed to break the reactants' bonds, so energy is released overall.
