  choices:
    - { id: a, text: '$\ce{CH3OH}$' }
    - { id: b, text: '$\ce{HCO2-}$' }
    - { id: c, text: '$\ce{CO3^2-}$' }
    - { id: d, text: '$\ce{CO2}$' }
  answer: a
  explanation: |
    Bond orders: methanol has a C–O single bond (1), formate has two resonance structures (3/2), carbonate has three (4/3), and $\ce{CO2}$ has double bonds (2). The lowest bond order gives the longest bond, so $\ce{CH3OH}$. Carbonate (C) is the longest of the resonance species, but still shorter than a true single bond.

- id: apchem-08-lone-pairs-if5
  type: mcq
