  answer: d
  explanation: |
    $8 + 2(7) = 22$ electrons. Two Xe–F bonds use 4, and three lone pairs on each F use 12, for 16. The remaining 6 go on Xe as **three lone pairs**, so Xe has 2 bonds + 3 lone pairs = 10 electrons.

