  prompt: |
    Which pair has the **same molecular geometry**?
  choices:
    - { id: a, text: "$\\ce{SO3}$ and $\\ce{SO3^2-}$" }
    - { id: b, text: "$\\ce{NO3-}$ and $\\ce{ClO3-}$" }
