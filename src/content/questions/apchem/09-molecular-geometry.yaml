- id: apchem-09-quiz-xeo3
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Xenon forms an oxide, xenon trioxide ($\ce{XeO3}$), with three O atoms on Xe. What is its molecular geometry?
  choices:
    - { id: a, text: "Trigonal planar" }
    - { id: b, text: "T-shaped" }
    - { id: c, text: "Trigonal pyramidal" }
    - { id: d, text: "Tetrahedral" }
  answer: c
  explanation: |
    Xe has 8 valence electrons: $8 + 3(6) = 26$. Three Xe–O bonds and the O lone pairs use 24, leaving one lone pair on Xe (drawing Xe=O double bonds to lower formal charges doesn't change that). 3 bonds + 1 lone pair = 4 domains, so the molecule is **trigonal pyramidal**, like NH₃. (A) is what SO₃ looks like, but Xe has two more valence electrons than S, and they stay on Xe as a lone pair. (D) is the electron-domain geometry.

- id: apchem-09-quiz-same-shape
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 2
  group: same-shape
