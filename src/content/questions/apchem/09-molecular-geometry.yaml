    Carbonate (3 bonding domains on C, no lone pair) and BF₃ (3 bonds on B) are both trigonal planar. In (A) and (B) the second ion has a lone pair on the central atom, so it's trigonal pyramidal while the first is planar. In (C) XeF₂ is linear (5 domains, 3 lone pairs) and H₂O is bent.

- id: apchem-09-quiz-acetonitrile-angles
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 2
  group: acetonitrile
  authors: ["Claude"]
  prompt: |
    In acetonitrile, $\ce{CH3CN}$ (H₃C–C≡N), what are the H–C–H angle at the first carbon and the C–C≡N angle at the second carbon?
  choices:
    - { id: a, text: "About 120° and 180°" }
    - { id: b, text: "About 109.5° and 180°" }
    - { id: c, text: "About 109.5° and 120°" }
    - { id: d, text: "About 120° and 120°" }
  answer: b
  explanation: |
    The CH₃ carbon has four single bonds: tetrahedral, about 109.5°. The nitrile carbon has a single bond to C and a triple bond to N: two domains, linear, 180°. (A) treats the CH₃ carbon as trigonal planar; (C) counts the triple bond as two domains on the nitrile carbon.

- id: apchem-09-quiz-exact-90
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 3
  group: xef4
  authors: ["Claude"]
  prompt: |
    In which molecule are **all** the F–X–F bond angles exactly 90° or 180°?
  choices:
    - { id: a, text: "$\\ce{SF4}$" }
    - { id: b, text: "$\\ce{XeF4}$" }
    - { id: c, text: "$\\ce{BrF5}$" }
    - { id: d, text: "$\\ce{PF5}$" }
  answer: b
  explanation: |
    XeF₄ is square planar: its two lone pairs sit opposite each other and push equally on every bond, so neighboring F atoms stay at exactly 90° and opposite ones at 180°. SF₄ (seesaw) and BrF₅ (square pyramidal) have a lone pair with nothing opposite it, which squeezes their angles below 90°. PF₅ has no lone pairs, but its equatorial F atoms are 120° apart.

- id: apchem-09-quiz-nitrogen-series
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.5"]
  cedTopics: ["2.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    What is the hybridization of each N atom in hydrazine ($\ce{H2N-NH2}$), diazene ($\ce{HN=NH}$), and nitrogen ($\ce{N#N}$), in that order?
  choices:
    - { id: a, text: "sp³, sp², sp" }
    - { id: b, text: "sp³, sp³, sp³" }
    - { id: c, text: "sp, sp², sp³" }
    - { id: d, text: "sp², sp², sp" }
  answer: a
  explanation: |
    Count domains on each N, lone pairs included. Hydrazine: 3 single bonds + 1 lone pair = 4, sp³. Diazene: N–H, N=N, and 1 lone pair = 3, sp². N₂: the triple bond + 1 lone pair = 2, sp. (B) counts electron pairs instead of domains; a multiple bond is one domain.

- id: apchem-09-quiz-formic-acid
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.6"]
  cedTopics: ["2.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    How many σ bonds and π bonds are in formic acid, $\ce{HCOOH}$ (H–C(=O)–O–H)?
  choices:
    - { id: a, text: "5 σ and 0 π" }
    - { id: b, text: "4 σ and 2 π" }
    - { id: c, text: "5 σ and 1 π" }
    - { id: d, text: "4 σ and 1 π" }
  answer: d
  explanation: |
    The bonds are C–H, C=O, C–O, and O–H. Each bond between two atoms has one σ bond (4 σ), and the double bond adds one π. (C) counts the C=O's π bond as a σ bond as well; (A) counts all five shared pairs as σ bonds; (B) treats the C–OH bond as double too.

- id: apchem-09-quiz-ketene
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.5"]
  cedTopics: ["2.7"]
  difficulty: 3
  group: cumulene
  authors: ["Claude"]
  prompt: |
    Ketene is $\ce{H2C=C=O}$. What are the hybridizations of the CH₂ carbon and the middle carbon?
  choices:
