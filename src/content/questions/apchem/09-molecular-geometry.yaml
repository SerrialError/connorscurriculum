# --- 9.1–9.2 Molecular shapes and VSEPR ---

- id: apchem-09-domains-so2
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    How many electron domains are around the sulfur atom in $\ce{SO2}$?
  choices:
    - { id: a, text: "2" }
    - { id: b, text: "3" }
    - { id: c, text: "4" }
    - { id: d, text: "5" }
  answer: b
  explanation: |
    S is bonded to two O atoms and has one lone pair. A double bond counts as **one** domain, so S has 2 bonding domains + 1 lone pair = **3**, whether you draw an S=O double bond or not. (C) counts the double bond as two domains.

- id: apchem-09-shape-nh3
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the molecular geometry of $\ce{NH3}$?
  choices:
    - { id: a, text: "Trigonal planar" }
    - { id: b, text: "Tetrahedral" }
    - { id: c, text: "Trigonal pyramidal" }
    - { id: d, text: "T-shaped" }
  answer: c
  explanation: |
    N has three bonds and one lone pair: 4 domains, a tetrahedral electron-domain geometry. The molecular geometry names only the atoms, so with one corner taken by the lone pair the shape is trigonal pyramidal. (B) is the electron-domain geometry, not the molecular geometry. (A) would need no lone pair on N.

- id: apchem-09-of2-geometries
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What are the electron-domain geometry and the molecular geometry of $\ce{OF2}$?
  choices:
    - { id: a, text: "Tetrahedral electron domains; bent molecule" }
    - { id: b, text: "Trigonal planar electron domains; bent molecule" }
    - { id: c, text: "Linear electron domains; linear molecule" }
    - { id: d, text: "Tetrahedral electron domains; trigonal pyramidal molecule" }
  answer: a
  explanation: |
    $6 + 2(7) = 20$ electrons. O has two bonds and two lone pairs: 4 domains (tetrahedral), with two of them bonds, so the molecule is bent, like water. (B) is the bent shape that comes from 3 domains, as in $\ce{SO2}$. (C) ignores the lone pairs. (D) is the shape for three bonds and one lone pair, as in $\ce{NH3}$.

- id: apchem-09-shape-sf4
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the molecular geometry of $\ce{SF4}$?
  choices:
    - { id: a, text: "Tetrahedral" }
    - { id: b, text: "Square planar" }
    - { id: c, text: "Trigonal pyramidal" }
    - { id: d, text: "Seesaw" }
  answer: d
  explanation: |
    S has 4 bonds and 1 lone pair: 5 domains, trigonal bipyramidal. The lone pair takes an equatorial position, leaving a seesaw. (A) would be right only without the lone pair. (B) needs 6 domains with 2 lone pairs, as in $\ce{XeF4}$.

- id: apchem-09-shape-clf3
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    What is the molecular geometry of $\ce{ClF3}$?
  choices:
    - { id: a, text: "Trigonal planar" }
    - { id: b, text: "T-shaped" }
    - { id: c, text: "Trigonal pyramidal" }
    - { id: d, text: "Seesaw" }
  answer: b
  explanation: |
    $7 + 3(7) = 28$ electrons. Cl has 3 bonds and 2 lone pairs: 5 domains. Both lone pairs go equatorial, leaving the three F atoms in a T shape. (A) and (C) both assume fewer domains around Cl. A seesaw (D) has four atoms bonded to the center.

- id: apchem-09-shape-xef4
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 1
  group: xef4
  authors: ["Claude"]
  prompt: |
    What is the molecular geometry of $\ce{XeF4}$?
  choices:
    - { id: a, text: "Square planar" }
    - { id: b, text: "Tetrahedral" }
    - { id: c, text: "Seesaw" }
    - { id: d, text: "Square pyramidal" }
  answer: a
  explanation: |
    Xe has 4 bonds and 2 lone pairs: 6 domains, octahedral. The two lone pairs sit opposite each other, so the four F atoms lie in a square plane. (B) treats the molecule as if Xe had no lone pairs. (C) has one lone pair in 5 domains. (D) has one lone pair in 6 domains.

- id: apchem-09-shape-i3
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    The triiodide ion, $\ce{I3-}$, has one I atom bonded to the other two. What are the electron-domain geometry and molecular geometry around the central I?
  choices:
    - { id: a, text: "Tetrahedral electron domains; bent ion, like water" }
    - { id: b, text: "Trigonal planar electron domains; bent ion" }
    - { id: c, text: "Trigonal bipyramidal electron domains; linear ion" }
    - { id: d, text: "Linear electron domains; linear ion" }
  answer: c
  explanation: |
    $3(7) + 1 = 22$ electrons. Two I–I bonds and three lone pairs on each outer I use 16, leaving 6 for the central I as three lone pairs. That's 2 bonds + 3 lone pairs = 5 domains, trigonal bipyramidal. The three lone pairs take all three equatorial spots, leaving the outer atoms 180° apart: linear. (D) gets the right shape but the wrong electron-domain geometry.

- id: apchem-09-shape-brf5
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    $\ce{BrF5}$ has five Br–F bonds and one lone pair on Br. What is its molecular geometry?
  choices:
    - { id: a, text: "Trigonal bipyramidal" }
    - { id: b, text: "Octahedral" }
    - { id: c, text: "Seesaw" }
    - { id: d, text: "Square pyramidal" }
  answer: d
  explanation: |
    Six domains are octahedral. With one corner taken by the lone pair, the five F atoms form a square base with one more F on top: square pyramidal. (A) is five domains with no lone pairs. (B) names the electron-domain geometry.

- id: apchem-09-angle-order
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Rank the H–X–H bond angles in $\ce{CH4}$, $\ce{NH3}$, and $\ce{H2O}$ from **largest to smallest**.
  choices:
    - { id: a, text: '$\ce{H2O} > \ce{NH3} > \ce{CH4}$' }
    - { id: b, text: '$\ce{CH4} > \ce{NH3} > \ce{H2O}$' }
    - { id: c, text: "All three are 109.5°, because each has four electron domains" }
    - { id: d, text: '$\ce{NH3} > \ce{CH4} > \ce{H2O}$' }
  answer: b
  explanation: |
    All three have four electron domains, but lone pairs repel more strongly than bonding pairs and squeeze the bonds together. $\ce{CH4}$ has none (109.5°), $\ce{NH3}$ has one (107°), and $\ce{H2O}$ has two (104.5°). (C) ignores the difference between lone pairs and bonds.

- id: apchem-09-why-lone-pairs-squeeze
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Why is the H–O–H angle in water smaller than the 109.5° angle of a perfect tetrahedron?
  choices:
    - { id: a, text: "Its lone pairs take up more room than bonding pairs and push the O–H bonds together" }
    - { id: b, text: "The two hydrogen atoms attract each other, which pulls the O–H bonds toward each other" }
    - { id: c, text: "Oxygen is more electronegative than carbon, so it pulls the hydrogen atoms in closer" }
    - { id: d, text: "Water has only two electron domains, so the angle must be less than in methane" }
  answer: a
  explanation: |
    A lone pair isn't shared with a second nucleus, so its electron cloud spreads out and takes more room around O than a bonding pair does. The two lone pairs push the O–H bonds together. (B) is wrong: the δ+ H atoms repel each other. (D) is wrong: water has four domains. (C) describes bond polarity, not bond angle.

- id: apchem-09-trigonal-planar-which
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which species is **trigonal planar**?
  choices:
    - { id: a, text: '$\ce{ClO3-}$' }
    - { id: b, text: '$\ce{SO3^2-}$' }
    - { id: c, text: '$\ce{NO3-}$' }
    - { id: d, text: '$\ce{PF3}$' }
  answer: c
  explanation: |
    In $\ce{NO3-}$, N has three bonding domains and no lone pair, so it's trigonal planar. $\ce{ClO3-}$, $\ce{SO3^2-}$, and $\ce{PF3}$ each have a lone pair on the central atom (count the electrons: 26 in each), which makes them trigonal pyramidal.

- id: apchem-09-equatorial-lone-pairs
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    In a molecule with five electron domains, why do lone pairs go in **equatorial** positions instead of axial ones?
  choices:
    - { id: a, text: "Equatorial positions are farther from the nucleus, so lone pairs are held more weakly there" }
    - { id: b, text: "An equatorial position has only two neighbors at 90°, while an axial position has three" }
    - { id: c, text: "Axial positions are reserved for the most electronegative atoms in the molecule" }
    - { id: d, text: "Lone pairs are smaller than bonding pairs, so they fit in the tighter equatorial spaces" }
  answer: b
  explanation: |
    90° repulsions are the strongest ones in a trigonal bipyramid. An axial position has three equatorial neighbors at 90°; an equatorial position has only the two axial ones. Lone pairs take up more room, so they go where they have the fewest close neighbors. (D) is backward: lone pairs are larger. (A) and (C) aren't how VSEPR works.

- id: apchem-09-same-shape-pair
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 3
  group: same-shape
  authors: ["Claude"]
  prompt: |
    Which pair of molecules has the **same** molecular geometry?
  choices:
    - { id: a, text: '$\ce{H2O}$ and $\ce{BeCl2}$' }
    - { id: b, text: '$\ce{BF3}$ and $\ce{NF3}$' }
    - { id: c, text: '$\ce{CH4}$ and $\ce{XeF4}$' }
    - { id: d, text: '$\ce{CO2}$ and $\ce{XeF2}$' }
  answer: d
  explanation: |
    $\ce{CO2}$ has 2 domains (linear). $\ce{XeF2}$ has 5 domains, but its three lone pairs are all equatorial, so its two F atoms are 180° apart: also linear. In (A), water is bent while $\ce{BeCl2}$ is linear. In (B), $\ce{BF3}$ is trigonal planar and $\ce{NF3}$ is trigonal pyramidal. In (C), $\ce{CH4}$ is tetrahedral and $\ce{XeF4}$ square planar.

- id: apchem-09-acetic-acid-carbon
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    In acetic acid, $\ce{CH3COOH}$, what is the geometry around the carbon atom that is double-bonded to oxygen?
  choices:
    - { id: a, text: "Tetrahedral, with angles near 109.5°" }
    - { id: b, text: "Linear, with an angle of 180°" }
    - { id: c, text: "Trigonal planar, with angles near 120°" }
    - { id: d, text: "Bent, with an angle near 104.5°" }
  answer: c
  explanation: |
    That carbon is bonded to three atoms (the CH₃ carbon, the =O, and the –OH oxygen) with no lone pairs. The double bond counts as one domain, so there are 3 domains: trigonal planar. (A) describes the CH₃ carbon. (D) describes the O in the O–H group.

- id: apchem-09-h2co-angle
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Formaldehyde, $\ce{H2C=O}$, is trigonal planar around carbon. What is the best prediction for its H–C–H bond angle?
  choices:
    - { id: a, text: "Exactly 120°, since all three domains are bonds to atoms" }
    - { id: b, text: "Slightly less than 120°, because the C=O double bond takes up more room" }
    - { id: c, text: "Slightly more than 120°, because the H atoms are small and need less room" }
    - { id: d, text: "About 109.5°, because carbon makes four bonds" }
  answer: b
  explanation: |
    A double bond holds four electrons, so it takes up more room than a single bond. It pushes the two C–H bonds together, making H–C–H a little under 120° and each H–C=O a little over. (D) counts the double bond as two domains. (A) ignores the difference between the domains.

- id: apchem-09-shape-pcl5
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.1", "9.2"]
  cedTopics: ["2.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which set of bond angles is found in $\ce{PCl5}$?
  choices:
    - { id: a, text: "90° and 180° only" }
    - { id: b, text: "109.5° only" }
    - { id: c, text: "120° only" }
    - { id: d, text: "90°, 120°, and 180°" }
  answer: d
  explanation: |
    $\ce{PCl5}$ is trigonal bipyramidal. The three equatorial Cl atoms are 120° apart, each axial Cl is 90° from the equatorial ones, and the two axial Cl atoms are 180° apart. (A) is an octahedron, (B) a tetrahedron, and (C) a trigonal plane.

# --- 9.3 Molecular shape and polarity ---

- id: apchem-09-nonpolar-which
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.3"]
  cedTopics: ["2.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which molecule is **nonpolar**?
  choices:
    - { id: a, text: '$\ce{SO2}$' }
    - { id: b, text: '$\ce{CO2}$' }
    - { id: c, text: '$\ce{H2O}$' }
    - { id: d, text: '$\ce{NH3}$' }
  answer: b
  explanation: |
    $\ce{CO2}$ is linear, so its two equal C=O bond dipoles point in opposite directions and cancel. $\ce{SO2}$ and $\ce{H2O}$ are bent and $\ce{NH3}$ is trigonal pyramidal; in each, a lone pair on the central atom keeps the bond dipoles from cancelling.

- id: apchem-09-polar-which
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.3"]
  cedTopics: ["2.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which molecule is **polar**?
  choices:
    - { id: a, text: '$\ce{CCl4}$' }
    - { id: b, text: '$\ce{BF3}$' }
    - { id: c, text: '$\ce{SF6}$' }
    - { id: d, text: '$\ce{CH2Cl2}$' }
  answer: d
  explanation: |
    $\ce{CH2Cl2}$ is tetrahedral, but it has two different kinds of outer atoms. The C–Cl and C–H bond dipoles are different, so they don't cancel. $\ce{CCl4}$, $\ce{BF3}$, and $\ce{SF6}$ each have identical outer atoms in a symmetric shape with no lone pairs on the center, so their bond dipoles cancel.

- id: apchem-09-xef4-nonpolar
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.3"]
  cedTopics: ["2.7"]
  difficulty: 3
  group: xef4
  authors: ["Claude"]
  prompt: |
    $\ce{XeF4}$ has two lone pairs on xenon and four polar Xe–F bonds. Is it polar?
  choices:
    - { id: a, text: "Yes, because any molecule with lone pairs on its central atom has a dipole that can't cancel out" }
    - { id: b, text: "Yes, because the Xe–F bonds are polar, and a molecule with polar bonds is always polar" }
    - { id: c, text: "No, because in its square planar shape the bond dipoles cancel and the lone pairs are opposite" }
    - { id: d, text: "No, because xenon is a noble gas and noble gases don't form polar bonds" }
  answer: c
  explanation: |
    In a square planar molecule each Xe–F bond has a partner pointing the opposite way, so the bond dipoles cancel, and the two lone pairs sit on opposite sides of the plane. The molecule is nonpolar. (A) is a common shortcut that fails for $\ce{XeF2}$ and $\ce{XeF4}$. (B) ignores shape. (D) is false: the Xe–F bonds are polar.

- id: apchem-09-sf4-polar
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.3"]
  cedTopics: ["2.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which statement about $\ce{SF4}$ is correct?
  choices:
    - { id: a, text: "It is nonpolar, because it has four identical S–F bonds arranged around S" }
    - { id: b, text: "It is polar, because its seesaw shape keeps the S–F bond dipoles from cancelling" }
    - { id: c, text: "It is nonpolar, because S and F have the same electronegativity" }
    - { id: d, text: "It is polar, because it is tetrahedral with one bond longer than the others" }
  answer: b
  explanation: |
    S has 4 bonds and 1 lone pair (5 domains), so $\ce{SF4}$ is a seesaw. The lone pair breaks the symmetry, and the bond dipoles add up to a net dipole. (A) would be true only for a symmetric shape like tetrahedral. (C) is false: F (4.0) is much more electronegative than S (2.5). (D) has the wrong shape.

- id: apchem-09-h2o-vs-co2
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.3"]
  cedTopics: ["2.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Both $\ce{H2O}$ and $\ce{CO2}$ have two polar bonds. Why is water polar while carbon dioxide is not?
  choices:
    - { id: a, text: "O–H bonds are polar, but C=O bonds are nonpolar" }
    - { id: b, text: "Water is a liquid at room temperature, and carbon dioxide is a gas" }
    - { id: c, text: "Carbon dioxide has double bonds, and double bonds can't have bond dipoles" }
    - { id: d, text: "Water is bent, so its dipoles add; CO₂ is linear, so its dipoles cancel" }
  answer: d
  explanation: |
    Polarity depends on shape. Water's two lone pairs make it bent, so both O–H dipoles point partly toward O and add up. CO₂ is linear, so its two equal C=O dipoles point opposite ways. (A) and (C) are false: C=O bonds are polar (ΔEN = 1.0). (B) is a result of polarity (stronger attractions between water molecules), not the cause.

- id: apchem-09-polar-bonds-nonpolar
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.3"]
  cedTopics: ["2.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which molecule has polar bonds but is a **nonpolar** molecule?
  choices:
    - { id: a, text: '$\ce{BCl3}$' }
    - { id: b, text: '$\ce{Cl2}$' }
    - { id: c, text: '$\ce{PCl3}$' }
    - { id: d, text: '$\ce{HCl}$' }
  answer: a
  explanation: |
    $\ce{BCl3}$ has three polar B–Cl bonds, but it's trigonal planar with no lone pair on B, so the dipoles cancel. $\ce{Cl2}$ has a nonpolar bond. $\ce{PCl3}$ is trigonal pyramidal and polar. $\ce{HCl}$ has one polar bond and nothing to cancel it.

- id: apchem-09-pf3-pf5
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.3"]
  cedTopics: ["2.7"]
  difficulty: 3
  group: pf3
  authors: ["Claude"]
  prompt: |
    Which statement about $\ce{PF3}$ and $\ce{PF5}$ is correct?
  choices:
    - { id: a, text: "Both are polar, because P–F bonds are polar" }
    - { id: b, text: "Both are nonpolar, because each has only one kind of outer atom" }
    - { id: c, text: "PF₃ is polar and PF₅ is nonpolar" }
    - { id: d, text: "PF₃ is nonpolar and PF₅ is polar" }
  answer: c
  explanation: |
    $\ce{PF3}$ has a lone pair on P, which makes it trigonal pyramidal: the three P–F dipoles all tilt the same way and add. $\ce{PF5}$ has no lone pair and is trigonal bipyramidal, a symmetric shape, so its dipoles cancel. Identical outer atoms (B) aren't enough when there's a lone pair.

- id: apchem-09-chcl3-polar
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.3"]
  cedTopics: ["2.7"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Chloroform, $\ce{CHCl3}$, is tetrahedral. Is it polar?
  choices:
    - { id: a, text: "No, because every molecule with a tetrahedral shape is nonpolar" }
    - { id: b, text: "No, because C–Cl and C–H bonds are both nonpolar" }
    - { id: c, text: "Yes, because it has a lone pair on carbon" }
    - { id: d, text: "Yes, because its four outer atoms aren't all the same" }
  answer: d
  explanation: |
    A tetrahedron is symmetric only when all four outer atoms are the same, as in $\ce{CCl4}$. In $\ce{CHCl3}$, the three C–Cl dipoles don't cancel against the much weaker C–H dipole. (B) is false for C–Cl (ΔEN = 0.5). (C) is false: carbon has no lone pairs here.

# --- 9.4 Covalent bonding and orbital overlap ---

- id: apchem-09-pe-curve-minimum
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.4"]
  cedTopics: ["2.2"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    On a graph of potential energy vs. distance between two bonded nuclei, what does the distance at the **lowest point** of the curve represent?
  choices:
    - { id: a, text: "The bond length" }
    - { id: b, text: "The bond energy" }
    - { id: c, text: "The radius of one atom" }
    - { id: d, text: "The distance where the atoms stop attracting each other" }
  answer: a
  explanation: |
    The minimum is the most stable separation, which is the bond length. The **depth** of the minimum below zero is the bond energy (B). Half the bond length between two identical atoms would be one atom's bonding radius (C). Attraction fades only at large distances, where the curve flattens toward zero (D).

- id: apchem-09-pe-curve-repel
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.4"]
  cedTopics: ["2.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    On the potential-energy curve for $\ce{H2}$, why does the energy rise steeply when the nuclei are pushed closer than the bond length?
  choices:
    - { id: a, text: "The orbitals stop overlapping, so the shared electrons leave" }
    - { id: b, text: "The electrons are attracted too strongly and fall into the nuclei" }
    - { id: c, text: "The two positively charged nuclei repel each other more and more strongly" }
    - { id: d, text: "The bond becomes ionic, and ionic bonds have higher energy" }
  answer: c
  explanation: |
    At short distances the repulsion between the two nuclei (and between the electrons) grows faster than the attraction, so the energy shoots up. (A) is backward: the orbitals overlap **more** at short distances. (B) and (D) don't happen.

- id: apchem-09-pe-curve-compare
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.4"]
  cedTopics: ["2.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Potential-energy curves are drawn for $\ce{O2}$ (bond order 2) and $\ce{N2}$ (bond order 3). Compared with the curve for $\ce{O2}$, the curve for $\ce{N2}$ has its minimum
  choices:
    - { id: a, text: "deeper and at a longer distance" }
    - { id: b, text: "deeper and at a shorter distance" }
    - { id: c, text: "shallower and at a shorter distance" }
    - { id: d, text: "shallower and at a longer distance" }
  answer: b
  explanation: |
    A higher bond order means a stronger bond (a **deeper** well, 941 vs. 495 kJ/mol) and a shorter bond (the minimum at a **shorter** distance, about 1.10 Å vs. 1.21 Å). N and O atoms are also close in size, so bond order controls the difference.

- id: apchem-09-valence-bond-overlap
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.4"]
  cedTopics: ["2.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    According to valence-bond theory, how does the H–Cl bond in HCl form?
  choices:
    - { id: a, text: "A half-filled Cl 3p orbital overlaps the H 1s orbital, and the two electrons pair up" }
    - { id: b, text: "The H atom transfers its electron to Cl, and the ions attract" }
    - { id: c, text: "The H 1s orbital overlaps a filled Cl 3s orbital, sharing four electrons" }
    - { id: d, text: "The electrons of both atoms move into new orbitals that spread over the whole molecule at once" }
  answer: a
  explanation: |
    In valence-bond theory a bond forms when two orbitals, each holding one electron, overlap and share the pair. Cl ($[\ce{Ne}]\,3s^2 3p^5$) has one half-filled 3p orbital, which overlaps H's 1s. (B) is ionic bonding. (C) is impossible: an overlap region holds at most two electrons. (D) describes molecular orbital theory.

