  answer: a
  explanation: |
    Three C–H (3 σ), one C–C (1 σ), and C≡N (1 σ + 2 π): 5 σ and 2 π. (D) counts all seven shared pairs as σ bonds.

- id: apchem-09-no-rotation
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.6"]
  cedTopics: ["2.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Why can't the two ends of a C=C double bond rotate freely relative to each other, while the ends of a C–C single bond can?
  choices:
    - { id: a, text: "The double bond is shorter, so the hydrogen atoms on the two carbons would bump into each other" }
    - { id: b, text: "Twisting would turn the p orbitals of the π bond away from each other and break the π bond" }
    - { id: c, text: "Rotation would break the σ bond, which lies above and below the bond axis" }
    - { id: d, text: "The sp³ orbitals on each carbon lock the molecule into a tetrahedral shape" }
  answer: b
  explanation: |
    The π bond comes from side-by-side overlap of two parallel p orbitals. Rotating one carbon turns its p orbital out of line, so the overlap is lost. A σ bond lies **along** the axis and doesn't care about rotation, which is why (C) is wrong. Each carbon in C=C is sp², not sp³ (D).

- id: apchem-09-pi-location
