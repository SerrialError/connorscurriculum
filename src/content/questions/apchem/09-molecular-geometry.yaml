    - { id: c, text: '$\ce{CH4}$' }
    - { id: d, text: '$\ce{NO3-}$' }
  answer: d
  explanation: |
    Nitrate has three resonance structures with the N=O double bond in different places. In the orbital picture, the p orbitals on N and all three O atoms overlap, and the π electrons spread over the whole ion. $\ce{C2H4}$ and $\ce{N2}$ have π bonds fixed between two atoms. $\ce{CH4}$ has no π bonds.

- id: apchem-09-triple-composition
