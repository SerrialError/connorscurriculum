- id: apchem-09-hybrid-xef4
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.5"]
  cedTopics: []
  difficulty: 1
  group: xef4
  authors: ["Claude"]
  prompt: |
    $\ce{XeF4}$ is square planar. What is the hybridization of Xe?
  choices:
