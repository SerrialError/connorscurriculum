    Six C–H bonds and six C–C bonds give 12 σ. Each resonance structure has three C=C double bonds, so there are 3 π bonds' worth of electrons (6 π electrons), spread around the ring. (D) counts all 15 shared pairs as σ bonds. (B) leaves out the C–H bonds.

