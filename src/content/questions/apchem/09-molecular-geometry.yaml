- id: apchem-09-no2-angles
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 3
  group: nitrogen-dioxide-ions
  authors: ["Claude"]
  prompt: |
    Rank the O–N–O bond angle in $\ce{NO2+}$, $\ce{NO2}$, and $\ce{NO2-}$ from **largest to smallest**.
  choices:
    - { id: a, text: '$\ce{NO2-} > \ce{NO2} > \ce{NO2+}$' }
    - { id: b, text: '$\ce{NO2} > \ce{NO2+} > \ce{NO2-}$' }
    - { id: c, text: '$\ce{NO2+} > \ce{NO2} > \ce{NO2-}$' }
    - { id: d, text: "All three are 120°, because N has three domains in each" }
  answer: c
  explanation: |
    $\ce{NO2+}$ (16 electrons) has no nonbonding electrons on N, so it's linear (180°). $\ce{NO2}$ (17) has one unpaired electron on N, which pushes the bonds less than a full pair does (about 134°). $\ce{NO2-}$ (18) has a lone pair on N (about 115°). (D) is wrong because $\ce{NO2+}$ has only two domains.

- id: apchem-09-dichloroethene
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.3", "9.6"]
  cedTopics: ["2.7"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    $\ce{C2H2Cl2}$ has three forms: 1,1-dichloroethene (both Cl on one carbon), *cis*-1,2-dichloroethene (one Cl on each carbon, same side), and *trans*-1,2-dichloroethene (one Cl on each carbon, opposite sides). The molecule is flat. Which form is **nonpolar**?
  choices:
    - { id: a, text: "1,1-dichloroethene" }
    - { id: b, text: "*trans*-1,2-dichloroethene" }
    - { id: c, text: "*cis*-1,2-dichloroethene" }
    - { id: d, text: "None of them, because C–Cl bonds are polar" }
  answer: b
  explanation: |
    In the *trans* form, the two C–Cl dipoles point in opposite directions and cancel, and so do the two C–H dipoles. In the *cis* and 1,1 forms, both Cl atoms are on the same side, so the dipoles add. The C=C bond can't rotate (the π bond would break), so the *cis* and *trans* forms are different molecules. (D) forgets that polar bonds can cancel.

- id: apchem-09-sf5cl-polar
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.3"]
  cedTopics: ["2.7"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    $\ce{SF6}$ is nonpolar. If one F is replaced with Cl to make $\ce{SF5Cl}$, the molecule
  choices:
    - { id: a, text: "becomes polar, because the S–Cl dipole no longer matches the S–F dipole opposite it" }
    - { id: b, text: "stays nonpolar, because it is still octahedral" }
    - { id: c, text: "stays nonpolar, because S–Cl and S–F bonds have the same polarity" }
    - { id: d, text: "becomes polar, because S gains a lone pair when Cl replaces F" }
  answer: a
  explanation: |
    The shape is still octahedral, but the S–Cl dipole (ΔEN 0.5) is much smaller than the S–F dipole (ΔEN 1.5) opposite it, so they don't cancel. A symmetric shape alone isn't enough (B); the outer atoms must be identical too. (D) is false: S still has six bonds and no lone pairs.

