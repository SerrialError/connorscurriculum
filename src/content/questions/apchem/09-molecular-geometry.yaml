  cedTopics: ["2.2"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    $\ce{F2}$ has a bond length of 1.42 Å and a bond enthalpy of 155 kJ/mol. $\ce{Cl2}$ has 1.99 Å and 242 kJ/mol. Compared with the potential-energy curve for $\ce{F2}$, the curve for $\ce{Cl2}$ has its minimum
  choices:
    - { id: a, text: "at a shorter distance and deeper" }
    - { id: b, text: "at a longer distance and deeper" }
    - { id: c, text: "at a longer distance and shallower" }
    - { id: d, text: "at the same distance, but deeper" }
  answer: b
  explanation: |
    Read it from the data: the minimum sits at the bond length (longer for Cl₂, since Cl is a larger atom) and its depth is the bond energy (larger for Cl₂). F₂ is an unusual case: its small atoms put their lone pairs close together, and their repulsion weakens the bond. (C) assumes a longer bond must be weaker, which is usually true but not here.

- id: apchem-09-mo-paramagnetic-ion
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.8"]
  cedTopics: []
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Which species is **paramagnetic**?
  choices:
    - { id: a, text: '$\ce{O2^2-}$' }
    - { id: b, text: '$\ce{N2}$' }
    - { id: c, text: '$\ce{O2-}$' }
    - { id: d, text: '$\ce{C2^2-}$' }
  answer: c
  explanation: |
    $\ce{O2-}$ has 13 valence electrons, an odd number, so one is unpaired (three electrons in the two π\*₂ₚ orbitals). $\ce{O2^2-}$ (14) fills both π\*₂ₚ orbitals. $\ce{N2}$ and $\ce{C2^2-}$ (10 each) have every orbital through σ₂ₚ full.

- id: apchem-09-mo-c2-2minus
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.8"]
  cedTopics: []
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    What is the bond order of the acetylide ion, $\ce{C2^2-}$?
  choices:
    - { id: a, text: "2" }
    - { id: b, text: "2.5" }
    - { id: c, text: "1" }
    - { id: d, text: "3" }
  answer: d
  explanation: |
    $\ce{C2^2-}$ has $2(4) + 2 = 10$ valence electrons, the same as $\ce{N2}$. The two extra electrons go into the bonding σ₂ₚ orbital: 8 bonding, 2 antibonding, bond order $\tfrac12(8 - 2) = 3$. (A) is neutral $\ce{C2}$.

- id: apchem-09-mo-b2plus
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.8"]
  cedTopics: []
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Removing one electron from $\ce{B2}$ gives $\ce{B2+}$. What happens to the bond?
  choices:
    - { id: a, text: "Bond order drops from 1 to ½, so the bond gets weaker and longer" }
    - { id: b, text: "Bond order rises from 1 to 1½, because an antibonding electron was removed" }
    - { id: c, text: "Bond order stays at 1, because the electron came from a nonbonding orbital" }
    - { id: d, text: "Bond order drops from 1 to 0, so B₂⁺ falls apart" }
  answer: a
  explanation: |
    $\ce{B2}$ has 6 valence electrons, with the last two in the bonding π₂ₚ orbitals (bond order 1). $\ce{B2+}$ loses one of those **bonding** electrons: 3 bonding and 2 antibonding, bond order $\tfrac12(3 - 2) = \tfrac12$. (B) would be right only if the electron came from an antibonding orbital, as when $\ce{O2}$ becomes $\ce{O2+}$.

- id: apchem-09-valence-bond-he2
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.4"]
  cedTopics: ["2.2"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Using the valence-bond (orbital overlap) model, why don't two He atoms form a bond?
  choices:
    - { id: a, text: "He atoms are too small for their orbitals to overlap" }
    - { id: b, text: "He's 1s orbital is already full, so there is no half-filled orbital to share a pair" }
    - { id: c, text: "He has too high an electronegativity to share electrons" }
    - { id: d, text: "The two He nuclei have no charge, so nothing attracts the electrons" }
  answer: b
  explanation: |
    In valence-bond theory a bond forms when two half-filled orbitals overlap and their two electrons pair up. He's only orbital, 1s, already holds two electrons, so there's nothing to pair. (The MO picture gives the same answer: bond order 0.) (D) is false: each He nucleus has a +2 charge.

- id: apchem-09-xenon-fluorides-frq
  type: frq
  subject: apchem
  chapter: 9
  sections: ["9.2", "9.3"]
  cedTopics: ["2.5", "2.7"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Xenon forms the fluorides $\ce{XeF2}$ and $\ce{XeF4}$.
  parts:
    - label: a
      points: 1
      prompt: How many lone pairs are on the Xe atom in each molecule?
      scoring:
        - "Three in XeF₂ and two in XeF₄ (both needed)."
    - label: b
      points: 1
      prompt: Give the electron-domain geometry and molecular geometry of each molecule.
      scoring:
        - "XeF₂: trigonal bipyramidal domains, linear molecule; XeF₄: octahedral domains, square planar molecule."
    - label: c
      points: 1
      prompt: Explain why the lone pairs in $\ce{XeF2}$ are placed where they are.
      scoring:
        - "They occupy the three equatorial positions, which have only two neighbors at 90° (axial positions have three), so the larger lone pairs have the most room."
    - label: d
      points: 1
      prompt: Xe–F bonds are polar. Are the molecules polar or nonpolar? Justify your answer.
      scoring:
        - "Both are nonpolar: in each, every Xe–F dipole has an equal one pointing the opposite way, and the lone pairs are arranged symmetrically, so the dipoles cancel."
  explanation: |
    **(a)** $\ce{XeF2}$: $8 + 14 = 22$ electrons; 16 go into the bonds and F lone pairs, leaving 6 on Xe (3 pairs). $\ce{XeF4}$: $8 + 28 = 36$; 32 go to bonds and F lone pairs, leaving 4 on Xe (2 pairs).

    **(b)** $\ce{XeF2}$ has 5 domains (trigonal bipyramidal); with three lone pairs it's linear. $\ce{XeF4}$ has 6 domains (octahedral); with two lone pairs opposite each other it's square planar.

    **(c)** In a trigonal bipyramid, an equatorial position has two 90° neighbors and an axial one has three. Lone pairs take up more room, so all three go equatorial, which puts the two F atoms on the axis, 180° apart.

    **(d)** In both, the F atoms are arranged in opposite pairs (180° apart), so the bond dipoles cancel, and the lone pairs are symmetric too. Both molecules are nonpolar.
