  authors: ["Claude"]
  prompt: |
    Boron trifluoride, $\ce{BF3}$, and phosphorus trifluoride, $\ce{PF3}$, both have three F atoms bonded to a central atom.
  parts:
    - label: a
      points: 1
      prompt: Draw the complete Lewis structure of $\ce{PF3}$.
      scoring:
        - "Three P–F single bonds, three lone pairs on each F, and one lone pair on P (26 electrons)."
    - label: b
      points: 1
      prompt: Name the molecular geometry of each molecule.
      scoring:
        - "$\\ce{BF3}$ is trigonal planar; $\\ce{PF3}$ is trigonal pyramidal (both needed)."
    - label: c
      points: 1
      prompt: Which molecule has the smaller F–X–F bond angle? Justify your answer.
      scoring:
        - "$\\ce{PF3}$: it has four electron domains (tetrahedral, under 109.5°, squeezed further by the lone pair), while $\\ce{BF3}$ has three domains at 120°."
    - label: d
      points: 1
      prompt: One of the molecules is polar and one is nonpolar. Identify the polar one and explain.
      scoring:
        - "$\\ce{PF3}$ is polar: its lone pair makes it pyramidal, so the polar P–F bond dipoles don't cancel; $\\ce{BF3}$ is symmetric (trigonal planar), so its B–F dipoles cancel."
    - label: e
      points: 1
      prompt: Give the hybridization of the central atom in each molecule.
      scoring:
        - "B in $\\ce{BF3}$ is sp²; P in $\\ce{PF3}$ is sp³ (both needed)."
  explanation: |
    **(a)** $5 + 3(7) = 26$ electrons. Three P–F bonds (6) and three lone pairs on each F (18) make 24; the last 2 go on P as a lone pair. P has an octet.

    **(b)** B has three bonding domains and no lone pairs: trigonal planar. P has three bonds and a lone pair (4 domains), so it's trigonal pyramidal.

    **(c)** In $\ce{BF3}$ the angles are 120°. $\ce{PF3}$ has a tetrahedral arrangement of domains, whose ideal angle is already only 109.5°, and its lone pair pushes the bonds even closer (the real angle is about 97°). So $\ce{PF3}$ has the smaller angle.

    **(d)** Both have polar bonds (F is far more electronegative than B or P). In trigonal planar $\ce{BF3}$, three equal dipoles 120° apart cancel. In pyramidal $\ce{PF3}$, all three dipoles tilt the same way, so the molecule is polar.

    **(e)** Three domains: sp². Four domains: sp³.

- id: apchem-09-oxygen-mo-frq
  type: frq
  subject: apchem
  chapter: 9
  sections: ["9.7", "9.8"]
  cedTopics: []
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Use molecular orbital theory for the period 2 diatomic molecules to answer the following about oxygen. For O₂, the order of the valence MOs from lowest to highest energy is σ₂ₛ, σ\*₂ₛ, σ₂ₚ, π₂ₚ, π\*₂ₚ, σ\*₂ₚ.
  parts:
    - label: a
      points: 1
      prompt: Write the valence MO electron configuration of $\ce{O2}$.
      scoring:
        - "$(\\sigma_{2s})^2(\\sigma^*_{2s})^2(\\sigma_{2p})^2(\\pi_{2p})^4(\\pi^*_{2p})^2$ (12 valence electrons)."
    - label: b
      points: 1
      prompt: Calculate the bond order of $\ce{O2}$.
      scoring:
        - "$\\tfrac12(8 - 4) = 2$."
    - label: c
      points: 1
      prompt: The Lewis structure of $\ce{O2}$ shows all electrons paired. Explain how the MO description accounts for the fact that $\ce{O2}$ is paramagnetic.
      scoring:
        - "The last two electrons occupy the two π*₂ₚ orbitals singly (Hund's rule), so O₂ has two unpaired electrons, which makes it paramagnetic."
    - label: d
      points: 1
      prompt: Calculate the bond order of the peroxide ion, $\ce{O2^2-}$, and predict whether its O–O bond is longer or shorter than the bond in $\ce{O2}$.
      scoring:
        - "14 valence electrons with 4 in π*₂ₚ: bond order $\\tfrac12(8 - 6) = 1$; lower bond order than O₂, so the bond is longer."
  explanation: |
    **(a)** Each O brings 6 valence electrons, 12 in all. Filling from the bottom: σ₂ₛ², σ\*₂ₛ², σ₂ₚ², π₂ₚ⁴, then 2 left for π\*₂ₚ.

    **(b)** Bonding: σ₂ₛ (2) + σ₂ₚ (2) + π₂ₚ (4) = 8. Antibonding: σ\*₂ₛ (2) + π\*₂ₚ (2) = 4. Bond order $= \tfrac12(8 - 4) = 2$, matching the double bond in the Lewis structure.

    **(c)** The two π\*₂ₚ orbitals have the same energy. By Hund's rule, the two electrons go into separate orbitals with parallel spins, so O₂ has two unpaired electrons and is attracted to a magnetic field. The Lewis structure can't show this.

    **(d)** $\ce{O2^2-}$ has 14 valence electrons; the two extra ones fill the π\*₂ₚ orbitals. Antibonding becomes 6: bond order $= \tfrac12(8 - 6) = 1$. A single bond is longer than the double bond in O₂.

