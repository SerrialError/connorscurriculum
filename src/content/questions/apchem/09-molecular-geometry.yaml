  answer: c
  explanation: |
    $7 + 3(7) = 28$ electrons. Three Br–F bonds and the F lone pairs use 24, leaving two lone pairs on Br. That's 3 + 2 = 5 domains: **sp³d**. (A) counts only the three bonds, as if BrF₃ were trigonal planar like BF₃.

- id: apchem-09-hybrid-icl4
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.5"]
