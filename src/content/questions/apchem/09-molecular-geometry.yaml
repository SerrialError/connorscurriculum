- id: apchem-09-shape-icl2
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.2"]
  cedTopics: ["2.7"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    What is the molecular geometry of $\ce{ICl2-}$?
  choices:
    - { id: a, text: "Linear" }
    - { id: b, text: "Bent, with an angle near 109.5°" }
    - { id: c, text: "Bent, with an angle near 120°" }
    - { id: d, text: "T-shaped" }
  answer: a
  explanation: |
    $7 + 2(7) + 1 = 22$ electrons. Two I–Cl bonds and the Cl lone pairs use 16, leaving 6 on I: three lone pairs. Five domains with all three lone pairs equatorial leave the two Cl atoms 180° apart, the same shape as $\ce{XeF2}$. (B) and (C) assume too few domains on I.

- id: apchem-09-shape-if4plus
