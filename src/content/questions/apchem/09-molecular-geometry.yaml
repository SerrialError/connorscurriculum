- id: apchem-09-sigma-pi-acetic-acid
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.6"]
  cedTopics: ["2.7"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    How many σ and π bonds are in acetic acid, $\ce{CH3C(=O)OH}$?
  choices:
    - { id: a, text: "8 σ and 0 π" }
    - { id: b, text: "6 σ and 2 π" }
    - { id: c, text: "7 σ and 2 π" }
    - { id: d, text: "7 σ and 1 π" }
  answer: d
  explanation: |
    Bonds: three C–H, one C–C, one C=O, one C–O, one O–H. Every bond has one σ: 7 σ. Only the C=O has a π bond: 1 π. (A) counts 8 shared pairs as σ bonds. (C) gives the C–O single bond a π bond too.

- id: apchem-09-sigma-pi-benzene
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.6"]
  cedTopics: ["2.7"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    How many σ bonds and π bonds does benzene, $\ce{C6H6}$, have?
  choices:
