    - { id: d, text: "4 σ and 1 π" }
  answer: b
  explanation: |
    Four C–H single bonds are 4 σ. The C=C double bond is 1 σ + 1 π. Total: 5 σ and 1 π. (D) forgets the σ part of the double bond.

