    - { id: c, text: "has the same energy as the atomic orbitals and no effect on bonding" }
    - { id: d, text: "is higher in energy and has a node between the nuclei" }
  answer: d
  explanation: |
    An antibonding orbital is higher in energy than the atomic orbitals, and its electron density is pushed away from the region between the nuclei (a node). Electrons in it weaken the bond. (A) describes a bonding orbital.

- id: apchem-09-mo-o2-paramagnetic
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.8"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Liquid oxygen is attracted to a magnet. How does molecular orbital theory explain this?
  choices:
    - { id: a, text: "O₂ has a double bond, and the π electrons of any double bond are attracted to a magnet" }
    - { id: b, text: "The two π*₂ₚ orbitals each hold one electron, so O₂ has two unpaired electrons" }
    - { id: c, text: "O₂ has an odd number of valence electrons, so one is unpaired" }
    - { id: d, text: "Every electron in O₂ is paired, and paired electrons are attracted to a magnet" }
  answer: b
  explanation: |
    O₂ has 12 valence electrons. After σ₂ₛ, σ\*₂ₛ, σ₂ₚ, and π₂ₚ fill, two electrons remain for the two π\*₂ₚ orbitals, and by Hund's rule they go in separately with parallel spins. Unpaired electrons make O₂ **paramagnetic**. (C) is false: 12 is even. (A) is false: $\ce{N2}$ and $\ce{C2H4}$ have π electrons too, but all paired, and they are not attracted to a magnet. (D) describes a diamagnetic substance, which is weakly repelled.

- id: apchem-09-mo-n2plus
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.8"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    What is the bond order of $\ce{N2+}$?
  choices:
    - { id: a, text: "2" }
    - { id: b, text: "3" }
    - { id: c, text: "5/2" }
    - { id: d, text: "7/2" }
  answer: c
  explanation: |
    $\ce{N2}$ has 10 valence electrons: 8 bonding and 2 antibonding (σ\*₂ₛ), bond order 3. $\ce{N2+}$ loses one electron from the highest filled orbital, σ₂ₚ, which is **bonding**: $\tfrac12(7 - 2) = 5/2$. (B) is neutral N₂.

- id: apchem-09-mo-paramagnetic-which
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.8"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which molecule is **paramagnetic**?
  choices:
    - { id: a, text: '$\ce{B2}$' }
    - { id: b, text: '$\ce{C2}$' }
    - { id: c, text: '$\ce{N2}$' }
    - { id: d, text: '$\ce{F2}$' }
  answer: a
  explanation: |
    $\ce{B2}$ has 6 valence electrons. For B₂ through N₂ the π₂ₚ orbitals are below σ₂ₚ, so after σ₂ₛ and σ\*₂ₛ fill, the last two electrons go one each into the two π₂ₚ orbitals: two unpaired electrons. $\ce{C2}$ fills both π₂ₚ orbitals, $\ce{N2}$ fills σ₂ₚ too, and $\ce{F2}$ fills both π\*₂ₚ orbitals, so all three are diamagnetic.

- id: apchem-09-mo-o2-minus
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.8"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    What is the bond order of the superoxide ion, $\ce{O2-}$?
  choices:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "5/2" }
    - { id: d, text: "3/2" }
  answer: d
  explanation: |
    $\ce{O2-}$ has 13 valence electrons: 8 bonding and 5 antibonding (2 in σ\*₂ₛ, 3 in π\*₂ₚ). Bond order $= \tfrac12(8 - 5) = 3/2$. (B) is O₂, and (C) is O₂⁺.

- id: apchem-09-mo-o2-lengths
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.8"]
  cedTopics: []
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Rank the O–O bond length in $\ce{O2+}$, $\ce{O2}$, and $\ce{O2^2-}$ from **shortest to longest**.
  choices:
    - { id: a, text: '$\ce{O2^2-} < \ce{O2} < \ce{O2+}$' }
    - { id: b, text: '$\ce{O2} < \ce{O2+} < \ce{O2^2-}$' }
    - { id: c, text: '$\ce{O2+} < \ce{O2} < \ce{O2^2-}$' }
    - { id: d, text: '$\ce{O2} < \ce{O2^2-} < \ce{O2+}$' }
  answer: c
  explanation: |
    Each extra electron goes into a π\*₂ₚ (antibonding) orbital. Bond orders: $\ce{O2+}$ 5/2, $\ce{O2}$ 2, $\ce{O2^2-}$ 1. Higher bond order means a shorter bond, so $\ce{O2+}$ is shortest and $\ce{O2^2-}$ is longest. (A) is the reverse.

- id: apchem-09-mo-be2
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.8"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Molecular orbital theory predicts that $\ce{Be2}$ is not a stable molecule. Why?
  choices:
    - { id: a, text: "It has two electrons in σ₂ₛ and two in σ*₂ₛ, so its bond order is 0" }
    - { id: b, text: "Be has no valence electrons, so there is nothing to share" }
    - { id: c, text: "Its electrons would all go into π₂ₚ orbitals, which can't form bonds" }
    - { id: d, text: "It would have unpaired electrons, and molecules with unpaired electrons can't exist" }
  answer: a
  explanation: |
    Each Be brings 2 valence electrons (4 total). They fill σ₂ₛ (bonding) and σ\*₂ₛ (antibonding), so bond order $= \tfrac12(2 - 2) = 0$. (B) is false: Be has two valence electrons. (C) is false: the four electrons fill the two 2s-based orbitals before any π₂ₚ orbital. (D) is false: O₂ and B₂ have unpaired electrons and exist.

- id: apchem-09-mo-c2
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.8"]
  cedTopics: []
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Using the MO energy order for B₂ through N₂ (π₂ₚ below σ₂ₚ), what are the bond order and magnetic behavior of $\ce{C2}$?
  choices:
    - { id: a, text: "Bond order 1, paramagnetic" }
    - { id: b, text: "Bond order 3, diamagnetic" }
    - { id: c, text: "Bond order 2, paramagnetic" }
    - { id: d, text: "Bond order 2, diamagnetic" }
  answer: d
  explanation: |
    $\ce{C2}$ has 8 valence electrons: $(\sigma_{2s})^2(\sigma^*_{2s})^2(\pi_{2p})^4$. All are paired, and bond order $= \tfrac12(6 - 2) = 2$. (C) is what you get if you wrongly use the O₂ ordering, where σ₂ₚ fills before the π₂ₚ pair: then the last two electrons would be split between the two π₂ₚ orbitals.

- id: apchem-09-mo-no
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.8"]
  cedTopics: []
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Nitric oxide, NO, is described with the same kind of MO diagram as $\ce{N2}$ and $\ce{O2}$. What are its bond order and magnetic behavior?
  choices:
    - { id: a, text: "Bond order 2.5, paramagnetic" }
    - { id: b, text: "Bond order 2, diamagnetic" }
    - { id: c, text: "Bond order 3, diamagnetic" }
    - { id: d, text: "Bond order 2.5, diamagnetic" }
  answer: a
  explanation: |
    NO has $5 + 6 = 11$ valence electrons, one more than $\ce{N2}$. The extra electron goes alone into a π\*₂ₚ orbital: 8 bonding and 3 antibonding, so bond order $= \tfrac12(8 - 3) = 2.5$. An odd number of electrons always leaves one unpaired, so NO is paramagnetic, which rules out (D).

- id: apchem-09-mo-cn-minus
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.8"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Which **pair** of species has the same number of valence electrons as $\ce{N2}$, and therefore the same bond order of 3?
  choices:
    - { id: a, text: '$\ce{O2^2+}$ and $\ce{NO}$' }
    - { id: b, text: '$\ce{CN}$ and $\ce{N2+}$' }
    - { id: c, text: '$\ce{CN-}$ and $\ce{CO}$' }
    - { id: d, text: '$\ce{C2}$ and $\ce{BN}$' }
  answer: c
  explanation: |
    $\ce{N2}$ has 10 valence electrons. $\ce{CN-}$ has $4 + 5 + 1 = 10$ and CO has $4 + 6 = 10$, so they fill the same orbitals and have bond order 3. In (A), $\ce{O2^2+}$ also has 10, but NO has 11. In (B), both have 9 (bond order 2.5). In (D), both have 8 (bond order 2).

