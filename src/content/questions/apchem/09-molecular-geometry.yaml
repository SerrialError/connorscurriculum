- id: apchem-09-mo-he2plus
  type: mcq
  subject: apchem
  chapter: 9
  sections: ["9.7"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    What is the bond order of $\ce{He2+}$?
  choices:
