    - { id: c, text: "Spread evenly in a sphere around one of the two atoms" }
    - { id: d, text: "On the far side of each atom, pointing away from the other atom" }
  answer: b
  explanation: |
    A π bond forms from side-by-side overlap of two parallel p orbitals, so its density is in two lobes above and below the internuclear axis, with a node on the axis. (A) describes a σ bond.

- id: apchem-09-delocalized
  type: mcq
