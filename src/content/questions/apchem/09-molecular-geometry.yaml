    - { id: b, text: "1/2" }
    - { id: c, text: "1" }
    - { id: d, text: "3/2" }
  answer: b
  explanation: |
    $\ce{He2+}$ has 3 electrons: $(\sigma_{1s})^2(\sigma^*_{1s})^1$. Bond order $= \tfrac12(2 - 1) = \tfrac12$, so it can exist with a weak bond. (A) is neutral $\ce{He2}$, with 2 bonding and 2 antibonding electrons.

- id: apchem-09-mo-antibonding
