    Fill the molecular orbital diagram for $\ce{B2}$. What are its bond order and magnetism?
  choices:
    - { id: a, text: "Bond order 1; paramagnetic, with two unpaired electrons" }
    - { id: b, text: "Bond order 1; diamagnetic, with all of its electrons paired" }
    - { id: c, text: "Bond order 2; diamagnetic, with all of its electrons paired" }
    - { id: d, text: "Bond order 0; B₂ is not expected to exist as a molecule" }
  answer: a
  explanation: |
    $\ce{B2}$ has 6 valence electrons (3 from each B). For B₂, C₂, and N₂, the π₂ₚ orbitals are **below** σ₂ₚ, so the order is σ₂ₛ² σ\*₂ₛ² π₂ₚ². The two π₂ₚ orbitals have equal energy, so by Hund's rule the last two electrons go one in each, with parallel spins: **paramagnetic**.
    Bond order $= \tfrac{1}{2}(4 - 2) = 1$. It's greater than 0, so $\ce{B2}$ is stable enough to exist.
    (B) fills σ₂ₚ first, the order for O₂ and F₂, which would pair the last two electrons.
