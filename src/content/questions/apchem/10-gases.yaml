    Speed distributions for He, $\ce{N2}$, and $\ce{Cl2}$, all at the same temperature, are labeled X, Y, and Z. Curve X peaks at the lowest speed and is the tallest and narrowest. Curve Z peaks at the highest speed and is the lowest and widest. Which gas is curve Z?
  choices:
    - { id: a, text: "$\\ce{Cl2}$" }
    - { id: b, text: "He" }
    - { id: c, text: "$\\ce{N2}$" }
