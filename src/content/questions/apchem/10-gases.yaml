- id: apchem-10-kmt-not-assumption
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.6"]
  cedTopics: ["3.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Which statement is **not** an assumption of the kinetic-molecular theory of gases?
  choices:
    - { id: a, text: "Gas particles are in continuous, random motion" }
    - { id: b, text: "The particles' own volume is negligible compared with the container" }
    - { id: c, text: "The particles attract each other weakly, which holds the gas together" }
    - { id: d, text: "The average kinetic energy is proportional to the kelvin temperature" }
  answer: c
  explanation: |
    The model assumes the particles **don't** attract or repel each other at all. Real gases do have attractions, which is one reason they deviate from ideal behavior. (A), (B), and (D) are all assumptions of the theory.

- id: apchem-10-same-temperature-same-ke
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.6"]
  cedTopics: ["3.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    A sample of He and a sample of Xe are at the same temperature. Which quantity is the same for both?
  choices:
    - { id: a, text: "The average speed of the atoms" }
    - { id: b, text: "The rate at which they effuse through a pinhole" }
    - { id: c, text: "The fraction of atoms moving faster than 500 m/s" }
    - { id: d, text: "The average kinetic energy of the atoms" }
  answer: d
  explanation: |
    Temperature measures average kinetic energy, so equal temperatures mean equal average $KE$. Since $KE = \tfrac{1}{2}mv^2$, the lighter He atoms move much faster on average, so their average speed (A), effusion rate (B), and fraction of fast atoms (C) are all larger.

- id: apchem-10-fastest-molecules
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.6"]
  cedTopics: ["3.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Four gases are all at 300 K. Which one has the greatest average molecular speed?
  choices:
    - { id: a, text: "$\\ce{SO2}$" }
    - { id: b, text: "Ne" }
    - { id: c, text: "$\\ce{NH3}$" }
    - { id: d, text: "$\\ce{N2}$" }
  answer: c
  explanation: |
    At the same temperature every gas has the same average kinetic energy, so the gas with the smallest molar mass moves fastest. $\ce{NH3}$ is 17.03 g/mol, just under Ne at 20.18 g/mol. $\ce{N2}$ is 28.02 and $\ce{SO2}$ 64.07.

- id: apchem-10-double-temperature-speed
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.6"]
  cedTopics: ["3.5"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    The kelvin temperature of a gas is doubled. What happens to the average kinetic energy of its molecules and to their average speed?
  choices:
    - { id: a, text: "Both the average kinetic energy and the average speed double" }
    - { id: b, text: "The kinetic energy doubles, and the speed rises by a factor of √2" }
    - { id: c, text: "The kinetic energy rises by a factor of √2, and the speed doubles" }
    - { id: d, text: "The kinetic energy quadruples, and the average speed doubles" }
  answer: b
  explanation: |
    Average kinetic energy is proportional to kelvin temperature, so it doubles. Since $KE = \tfrac{1}{2}mv^2$, the speed depends on the square root of $KE$: doubling $KE$ multiplies the speed by $\sqrt{2} \approx 1.41$.

- id: apchem-10-mb-higher-temperature
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.6"]
  cedTopics: ["3.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A Maxwell–Boltzmann distribution of molecular speeds is drawn for a sample of $\ce{O2}$ at 300 K. The same sample is then heated to 500 K. How does its distribution compare with the one at 300 K?
  choices:
    - { id: a, text: "The peak moves to a higher speed and gets lower; the curve is wider" }
    - { id: b, text: "The peak moves to a higher speed and gets taller; the curve is narrower" }
    - { id: c, text: "The peak stays at the same speed, but the whole curve is taller" }
    - { id: d, text: "The peak moves to a lower speed and gets lower; the curve is wider" }
  answer: a
  explanation: |
    At higher temperature the molecules move faster on average, so the peak shifts right. The area under the curve is the number of molecules, which hasn't changed, so a curve that spreads over a wider range of speeds must be lower.

- id: apchem-10-mb-identify-curve
