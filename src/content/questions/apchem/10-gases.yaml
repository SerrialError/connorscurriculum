- id: apchem-10-gas-compressible
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.1"]
  cedTopics: ["3.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    Why can a gas be compressed into a much smaller volume, while a liquid can hardly be compressed at all?
  choices:
    - { id: a, text: "Gas particles are much smaller than the particles of the same substance as a liquid" }
    - { id: b, text: "Gas particles are far apart, so most of the volume of a gas is empty space" }
    - { id: c, text: "Gas particles shrink when they are pushed closer together by a higher pressure" }
    - { id: d, text: "Gas particles attract each other more strongly than liquid particles do" }
  answer: b
  explanation: |
    In a gas the particles are far apart compared with their own size, so pushing them closer just removes empty space. In a liquid the particles already touch.
    The particles are the same size in both states (A), and they don't shrink (C). Gas particles attract each other far less than liquid particles do (D); that's why they stay apart.

- id: apchem-10-pressure-collisions
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.2"]
  cedTopics: ["3.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    At the particle level, what causes the pressure that a gas exerts on the walls of its container?
  choices:
    - { id: a, text: "The weight of the gas particles resting on the bottom of the container" }
    - { id: b, text: "Attractions between the gas particles and the atoms that make up the walls" }
    - { id: c, text: "Collisions of the moving gas particles with the walls of the container" }
    - { id: d, text: "Repulsions between the gas particles that push them apart and outward" }
  answer: c
  explanation: |
    Gas particles move constantly and randomly. Each collision with a wall pushes on it, and the force of all the collisions divided by the wall's area is the pressure.
    Gas pressure acts equally on every wall, including the top, so it isn't the weight of the gas (A). The ideal-gas model assumes no attractions or repulsions at all, (B) and (D).

- id: apchem-10-convert-kpa-mmhg
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.2"]
  cedTopics: ["3.4"]
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    A weather station reports an air pressure of 102.4 kPa. What is this pressure in mm Hg? (1 atm = 101.325 kPa = 760 mm Hg)
  choices:
    - { id: a, text: "768 mm Hg" }
    - { id: b, text: "752 mm Hg" }
    - { id: c, text: "1.01 mm Hg" }
    - { id: d, text: "77,800 mm Hg" }
  answer: a
  explanation: |
    $$
    102.4\ \text{kPa} \times \frac{1\ \text{atm}}{101.325\ \text{kPa}} \times \frac{760\ \text{mm Hg}}{1\ \text{atm}} = 768\ \text{mm Hg}
    $$
    A pressure slightly above 1 atm should be slightly above 760 mm Hg. (B) uses the kPa ratio upside down, (C) stops at atm, and (D) multiplies kPa by 760 without dividing by 101.325.

- id: apchem-10-convert-torr-atm
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.2"]
  cedTopics: ["3.4"]
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    A gas sample has a pressure of 645 torr. What is its pressure in atmospheres?
  choices:
    - { id: a, text: "1.18 atm" }
    - { id: b, text: "6.37 atm" }
    - { id: c, text: "4.90 × 10⁵ atm" }
    - { id: d, text: "0.849 atm" }
  answer: d
  explanation: |
    1 atm = 760 torr, so $645 / 760 = 0.849$ atm. A pressure below 760 torr must be below 1 atm, which rules out (A), the ratio upside down. (B) divides by 101.325, the kPa value, and (C) multiplies by 760.

- id: apchem-10-barometer-altitude
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.2"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A mercury barometer reads 760 mm at sea level. Carried to the top of a mountain, it reads 620 mm. Which statement best explains the change?
  choices:
    - { id: a, text: "Mercury is less dense at high altitude, so a shorter column of it has the same weight" }
    - { id: b, text: "There is less air above the mountain, so less force pushes down on the mercury in the dish" }
    - { id: c, text: "The vacuum at the top of the tube pulls on the mercury less strongly at high altitude" }
    - { id: d, text: "Gravity on the mountain is about 18% weaker, so the mercury column weighs less" }
  answer: b
  explanation: |
    The column is held up by the atmosphere pressing on the mercury in the dish. Higher up there is less air above, so the atmospheric pressure is lower and it supports a shorter column.
    A vacuum doesn't pull on anything (C); the space above the column simply exerts no pressure. Mercury's density (A) and gravity (D) change by far too little on a mountain to explain an 18% drop.

- id: apchem-10-other-liquid-barometer
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.2"]
  cedTopics: []
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A barometer is built with a liquid whose density is 3.40 g/mL instead of mercury (13.6 g/mL). How tall is the column of this liquid at 1.00 atm?
  choices:
    - { id: a, text: "190 mm" }
    - { id: b, text: "760 mm" }
    - { id: c, text: "3040 mm" }
    - { id: d, text: "10,300 mm" }
  answer: c
  explanation: |
    The liquid is $13.6 / 3.40 = 4.00$ times less dense than mercury, so it takes a column 4.00 times as tall to exert the same pressure: $760 \times 4.00 = 3040$ mm.
    (A) divides instead of multiplying: a less dense liquid needs a **taller** column. (D) is the height for water, 1.00 g/mL.

- id: apchem-10-manometer-open-higher
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.2"]
  cedTopics: []
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  group: open-manometer
  prompt: |
    A flask of gas is connected to an open-end mercury manometer. The atmospheric pressure is 745 torr. The mercury level in the arm open to the air is 52 mm higher than the level in the arm connected to the flask. What is the pressure of the gas?
  choices:
    - { id: a, text: "797 torr" }
    - { id: b, text: "693 torr" }
    - { id: c, text: "745 torr" }
    - { id: d, text: "52 torr" }
  answer: a
  explanation: |
    The mercury has been pushed down on the gas side and up on the open side, so the gas pushes harder than the atmosphere:
    $P_\text{gas} = P_\text{atm} + h = 745 + 52 = 797$ torr.
    (B) subtracts, which would be right if the mercury were higher on the gas side.

- id: apchem-10-manometer-gas-higher
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.2"]
  cedTopics: []
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  group: open-manometer
  prompt: |
    In an open-end mercury manometer, the mercury in the arm connected to a gas bulb stands 18 mm **higher** than the mercury in the arm open to the air. The atmospheric pressure is 0.980 atm. What is the pressure of the gas, in torr?
  choices:
    - { id: a, text: "763 torr" }
    - { id: b, text: "745 torr" }
    - { id: c, text: "18 torr" }
    - { id: d, text: "727 torr" }
  answer: d
  explanation: |
    First, $P_\text{atm} = 0.980 \times 760 = 744.8$ torr. The atmosphere has pushed the mercury toward the gas, so the gas pressure is lower:
    $P_\text{gas} = 744.8 - 18 = 727$ torr.
    (A) adds the height instead of subtracting it, and (B) is just the atmospheric pressure.

