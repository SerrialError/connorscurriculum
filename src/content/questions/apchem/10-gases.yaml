  choices:
    - { id: a, text: "Closer to the NH₃ end, because the heavier HCl molecules push through the air more easily" }
    - { id: b, text: "In the middle, because both gases are at the same temperature and so move equally fast" }
    - { id: c, text: "Closer to the HCl end, because NH₃ molecules are lighter and move faster on average" }
