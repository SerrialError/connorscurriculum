  authors: ["Claude"]
  prompt: |
    A gas mixture contains $\ce{N2}$ at 0.40 atm, $\ce{O2}$ at 0.30 atm, and Ar at 0.10 atm. What is the mole fraction of $\ce{O2}$?
  choices:
    - { id: a, text: "0.30" }
    - { id: b, text: "0.375" }
    - { id: c, text: "0.80" }
    - { id: d, text: "0.50" }
  answer: b
  explanation: |
    The total pressure is $0.40 + 0.30 + 0.10 = 0.80$ atm, and $X_{\ce{O2}} = P_{\ce{O2}}/P_\text{total} = 0.30/0.80 = 0.375$. (A) is the partial pressure itself, and (C) is the total pressure.

- id: apchem-10-partial-from-masses
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.5"]
  cedTopics: ["3.4"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A container holds 2.00 g of $\ce{H2}$ and 8.00 g of He at a total pressure of 3.00 atm. What is the partial pressure of $\ce{H2}$?
  choices:
    - { id: a, text: "0.600 atm" }
    - { id: b, text: "1.50 atm" }
    - { id: c, text: "0.995 atm" }
    - { id: d, text: "2.00 atm" }
  answer: c
  explanation: |
    Convert to moles: $2.00/2.016 = 0.992$ mol $\ce{H2}$ and $8.00/4.003 = 1.999$ mol He, 2.991 mol in all.
    $$
    P_{\ce{H2}} = \frac{0.992}{2.991} \times 3.00 = 0.995\ \text{atm}
    $$
    (A) uses the mass fraction (2.00 g of 10.00 g). Partial pressures follow mole fractions, not mass fractions.

- id: apchem-10-equal-masses-partial
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.5"]
  cedTopics: ["3.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A container holds equal masses of $\ce{CH4}$ (16.04 g/mol) and $\ce{O2}$ (32.00 g/mol). How do their partial pressures compare?
  choices:
    - { id: a, text: "The partial pressure of CH₄ is about twice that of O₂" }
    - { id: b, text: "The two partial pressures are equal, since the masses are equal" }
    - { id: c, text: "The partial pressure of O₂ is about twice that of CH₄" }
    - { id: d, text: "It can't be decided without knowing the container's volume" }
  answer: a
  explanation: |
    Equal masses of a gas with half the molar mass means twice as many moles. Partial pressure is proportional to moles, so $\ce{CH4}$ has about twice the partial pressure. The ratio is the same whatever the volume (D).

- id: apchem-10-add-gas-rigid
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.5"]
  cedTopics: ["3.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A rigid container holds $\ce{N2}$ at 0.80 atm. Helium is added at constant temperature until the total pressure is 1.50 atm. What is the partial pressure of $\ce{N2}$ now?
  choices:
    - { id: a, text: "0.70 atm" }
    - { id: b, text: "1.50 atm" }
    - { id: c, text: "0.43 atm" }
    - { id: d, text: "0.80 atm" }
  answer: d
  explanation: |
    The moles of $\ce{N2}$, the volume, and the temperature haven't changed, so $P_{\ce{N2}} = n_{\ce{N2}}RT/V$ is still 0.80 atm. The helium adds its own 0.70 atm (A) to the total. The mole fraction of $\ce{N2}$ drops, but the nitrogen molecules hit the walls just as often and as hard as before.

- id: apchem-10-two-flasks-valve
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.5"]
  cedTopics: ["3.4"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A 1.00 L flask of $\ce{CO2}$ at 2.40 atm is connected through a closed valve to a 4.00 L flask of $\ce{N2}$ at 0.600 atm. The valve is opened and the gases mix at constant temperature. What is the final total pressure?
  choices:
    - { id: a, text: "3.00 atm" }
    - { id: b, text: "0.960 atm" }
    - { id: c, text: "1.50 atm" }
    - { id: d, text: "0.600 atm" }
  answer: b
  explanation: |
    Each gas spreads into the total 5.00 L. By Boyle's law:
    $$
    P_{\ce{CO2}} = \frac{(2.40)(1.00)}{5.00} = 0.480\ \text{atm} \qquad P_{\ce{N2}} = \frac{(0.600)(4.00)}{5.00} = 0.480\ \text{atm}
    $$
    Total: 0.960 atm. (A) adds the starting pressures, and (C) averages them without weighting by volume.

- id: apchem-10-over-water-pressure
