    A molecule travels only a tiny distance (the mean free path) before hitting another molecule and heading off in a new direction. Its path is a random zigzag, so the net distance covered is far smaller than its speed suggests.

- id: apchem-10-graham-hydrogen-oxygen
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.7"]
  cedTopics: []
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    How many times faster does $\ce{H2}$ effuse than $\ce{O2}$ at the same temperature and pressure?
  choices:
    - { id: a, text: "15.9 times" }
    - { id: b, text: "3.98 times" }
    - { id: c, text: "0.251 times" }
    - { id: d, text: "1.41 times" }
  answer: b
  explanation: |
    $$
    \frac{r_{\ce{H2}}}{r_{\ce{O2}}} = \sqrt{\frac{\mathcal{M}_{\ce{O2}}}{\mathcal{M}_{\ce{H2}}}} = \sqrt{\frac{32.00}{2.016}} = 3.98
    $$
    (A) leaves out the square root, and (C) inverts the ratio.

- id: apchem-10-graham-unknown
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.7"]
  cedTopics: []
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    An unknown gas effuses 0.354 times as fast as helium (4.003 g/mol) at the same conditions. What is the molar mass of the unknown gas?
  choices:
    - { id: a, text: "11.3 g/mol" }
    - { id: b, text: "1.42 g/mol" }
    - { id: c, text: "31.9 g/mol" }
    - { id: d, text: "0.502 g/mol" }
  answer: c
  explanation: |
    $$
    \frac{r_x}{r_\text{He}} = 0.354 = \sqrt{\frac{4.003}{\mathcal{M}_x}} \qquad \mathcal{M}_x = \frac{4.003}{0.354^2} = 31.9\ \text{g/mol}
    $$
    That's consistent with $\ce{O2}$. A gas that effuses more slowly than He must be heavier, which rules out (B) and (D). (A) forgets to square 0.354.

- id: apchem-10-rms-speed
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.6"]
  cedTopics: []
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    Using $u_\text{rms} = \sqrt{\dfrac{3RT}{\mathcal{M}}}$, what is the root-mean-square speed of $\ce{O2}$ molecules at 300. K? ($R = 8.314$ J/(mol·K))
  choices:
    - { id: a, text: "484 m/s" }
    - { id: b, text: "15.3 m/s" }
    - { id: c, text: "395 m/s" }
    - { id: d, text: "2.34 × 10⁵ m/s" }
  answer: a
  explanation: |
    $\mathcal{M}$ must be in kg/mol, 0.03200 kg/mol, so that J/kg = m²/s².
    $$
    u_\text{rms} = \sqrt{\frac{3(8.314)(300.)}{0.03200}} = \sqrt{2.34 \times 10^5} = 484\ \text{m/s}
    $$
    (B) uses 32.00 g/mol, (C) uses 2 instead of 3, and (D) forgets the square root.

