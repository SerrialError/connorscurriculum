  answer: b
  explanation: |
    At the same temperature, the lightest particles move fastest and have the widest spread of speeds, so Z is He (4.00 g/mol). X, the slowest, is $\ce{Cl2}$ (70.90 g/mol), and Y is $\ce{N2}$. Equal temperatures mean equal average kinetic energies, not equal speeds (D).

- id: apchem-10-mb-kinetic-energy-axis
