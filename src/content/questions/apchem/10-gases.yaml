  choices:
    - { id: a, text: "Adding more N₂ to the container at the same temperature" }
    - { id: b, text: "Compressing the gas into a smaller volume at constant temperature" }
    - { id: c, text: "Cooling the gas while keeping the volume constant" }
    - { id: d, text: "Heating the gas while keeping the volume constant" }
  answer: d
  explanation: |
    The shape of the speed distribution depends on the temperature (and the molar mass), not on the amount of gas or the volume. Heating shifts the distribution to higher speeds, so a larger fraction of molecules is above 1000 m/s. (A) increases the **number** of fast molecules but not the fraction.

- id: apchem-10-pump-tire
