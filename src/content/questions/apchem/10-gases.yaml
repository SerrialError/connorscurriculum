  choices:
    - { id: a, text: "4.48 L" }
    - { id: b, text: "5.30 L" }
    - { id: c, text: "0.864 L" }
    - { id: d, text: "5.58 L" }
  answer: d
  explanation: |
    $n = 8.80/44.01 = 0.200$ mol, and $T = 323.15$ K.
    $$
    V = \frac{nRT}{P} = \frac{(0.200)(0.08206)(323.15)}{0.950} = 5.58\ \text{L}
    $$
    (A) uses 22.4 L/mol, which applies only at STP. (B) leaves out the pressure, and (C) uses 50 instead of 323.15 K.

- id: apchem-10-which-r
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.4"]
  cedTopics: ["3.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A problem gives a gas's pressure in kilopascals and its volume in liters. Which value of $R$ from the equation sheet can be used without converting either unit?
  choices:
    - { id: a, text: "0.08206 L·atm/(mol·K), because liters are already the right unit" }
    - { id: b, text: "8.314 J/(mol·K), but only after converting the volume to milliliters" }
    - { id: c, text: "8.314 J/(mol·K), because a kilopascal times a liter equals a joule" }
    - { id: d, text: "Either value, because R is the same number whatever units are used" }
  answer: c
  explanation: |
    1 kPa × 1 L = 1000 N/m² × 0.001 m³ = 1 N·m = 1 J. So $R = 8.314$ J/(mol·K) is the same as 8.314 L·kPa/(mol·K).
    0.08206 (A) needs the pressure in atm. The numerical value of $R$ depends on its units (D).

- id: apchem-10-stp-volume
  type: mcq
