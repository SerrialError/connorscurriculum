    Air is pumped into a rigid tank at constant temperature, and the pressure rises. Which statement best explains why?
  choices:
    - { id: a, text: "Each particle moves faster, because it is squeezed into less space" }
    - { id: b, text: "Each particle hits the walls harder, because it has more mass" }
    - { id: c, text: "More particles strike the walls each second, with the same average force" }
    - { id: d, text: "The particles attract each other more, so they pull harder on the walls" }
  answer: c
  explanation: |
    At constant temperature the average kinetic energy, and so the force of each collision on average, stays the same. More particles in the same volume means more collisions with the walls per second, so the pressure rises.

- id: apchem-10-effusion-order
  type: mcq
