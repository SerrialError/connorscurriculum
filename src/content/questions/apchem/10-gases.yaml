- id: apchem-10-ideal-moles
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.4"]
  cedTopics: ["3.4"]
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    A 5.00 L tank holds nitrogen at 3.20 atm and 27 °C. How many moles of nitrogen are in the tank?
  choices:
    - { id: a, text: "7.22 mol" }
    - { id: b, text: "0.650 mol" }
    - { id: c, text: "1.54 mol" }
    - { id: d, text: "0.0650 mol" }
  answer: b
  explanation: |
    $$
    n = \frac{PV}{RT} = \frac{(3.20)(5.00)}{(0.08206)(300.15)} = 0.650\ \text{mol}
    $$
    (A) uses 27 instead of 300.15 K, and (C) is the expression upside down.

