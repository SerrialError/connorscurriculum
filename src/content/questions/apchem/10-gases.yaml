    - { id: c, text: "6.25 g/L" }
    - { id: d, text: "0.598 g/L" }
  answer: b
  explanation: |
    $$
    d = \frac{P\mathcal{M}}{RT} = \frac{(0.800)(64.07)}{(0.08206)(373.15)} = 1.67\ \text{g/L}
    $$
    (A) is the density at STP ($64.07/22.4$). (C) uses 100 instead of 373.15 K, and (D) is the expression upside down.

- id: apchem-10-identify-gas-molar-mass
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.4"]
  cedTopics: ["3.4"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A 1.00 L flask contains 2.84 g of a gaseous element at 0.987 atm and 27 °C. Which element could it be?
  choices:
    - { id: a, text: "Kr" }
    - { id: b, text: "Ar" }
    - { id: c, text: "$\\ce{Cl2}$" }
    - { id: d, text: "$\\ce{F2}$" }
  answer: c
  explanation: |
    $$
    n = \frac{PV}{RT} = \frac{(0.987)(1.00)}{(0.08206)(300.15)} = 0.0401\ \text{mol} \qquad \mathcal{M} = \frac{2.84\ \text{g}}{0.0401\ \text{mol}} = 70.9\ \text{g/mol}
    $$
    That is $\ce{Cl2}$ (70.90 g/mol). Kr is 83.80 g/mol, Ar 39.95, and $\ce{F2}$ 38.00.

- id: apchem-10-density-rank
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.4"]
  cedTopics: ["3.4"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    At the same temperature and pressure, which gas has the greatest density?
  choices:
    - { id: a, text: "$\\ce{CH4}$" }
    - { id: b, text: "Ne" }
    - { id: c, text: "$\\ce{NH3}$" }
    - { id: d, text: "$\\ce{F2}$" }
  answer: d
  explanation: |
    At the same $T$ and $P$, $d = P\mathcal{M}/RT$ is proportional to molar mass. $\ce{F2}$ is 38.00 g/mol, compared with 16.04 for $\ce{CH4}$, 20.18 for Ne, and 17.03 for $\ce{NH3}$.

- id: apchem-10-hot-air-balloon
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.4"]
  cedTopics: ["3.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Heating the air inside a hot-air balloon, which is open at the bottom, makes the balloon rise. Which statement best explains why?
  choices:
    - { id: a, text: "At constant pressure, hotter air has a lower density than the cooler air around it" }
    - { id: b, text: "Heating breaks N₂ and O₂ into lighter atoms, which lowers the air's molar mass" }
    - { id: c, text: "Heating raises the pressure inside the balloon, and that pressure pushes it up" }
    - { id: d, text: "Hot air particles move faster, and faster particles weigh less than slow ones" }
  answer: a
  explanation: |
    The balloon is open, so the air inside stays at atmospheric pressure. From $d = P\mathcal{M}/RT$, raising $T$ at constant $P$ lowers the density: some air leaves the balloon, and what's left weighs less than the same volume of outside air.
    The molecules don't break apart (B), the open balloon can't hold a higher pressure (C), and speed doesn't change mass (D).

- id: apchem-10-dumas-temperature-error
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.4"]
  cedTopics: ["3.4"]
  difficulty: 3
  authors: ["Claude"]
  group: dumas-method
  prompt: |
    A student finds the molar mass of a volatile liquid by vaporizing it in a flask in boiling water, then using $\mathcal{M} = \dfrac{mRT}{PV}$ with the mass of the vapor. The water was at 100 °C, but the student records 90 °C. How does this error affect the calculated molar mass?
  choices:
    - { id: a, text: "Too high, because the calculated number of moles of vapor is too small" }
    - { id: b, text: "Too low, because the calculated number of moles of vapor is too small" }
    - { id: c, text: "Too low, because the value of T used in the calculation is too small" }
    - { id: d, text: "No effect, because the mass of the vapor doesn't depend on temperature" }
  answer: c
  explanation: |
    $T$ is in the numerator of $\mathcal{M} = mRT/PV$, so a temperature that is too low gives a molar mass that is too low.
    Put another way: $n = PV/RT$ comes out too **large** when $T$ is too small, so $\mathcal{M} = m/n$ is too small. That rules out (A) and (B), which both say the moles are too small.

- id: apchem-10-kclo3-oxygen-volume
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.4"]
  cedTopics: ["3.4", "4.5"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    Potassium chlorate decomposes when heated:

    $$
    \ce{2KClO3(s) -> 2KCl(s) + 3O2(g)}
    $$

    What volume of $\ce{O2}$, measured at 25 °C and 1.00 atm, is produced by 4.90 g of $\ce{KClO3}$ (122.55 g/mol)?
  choices:
    - { id: a, text: "1.47 L" }
    - { id: b, text: "0.978 L" }
    - { id: c, text: "2.20 L" }
    - { id: d, text: "1.34 L" }
  answer: a
  explanation: |
    $4.90/122.55 = 0.0400$ mol $\ce{KClO3}$, which gives $0.0400 \times 3/2 = 0.0600$ mol $\ce{O2}$.
    $$
    V = \frac{nRT}{P} = \frac{(0.0600)(0.08206)(298.15)}{1.00} = 1.47\ \text{L}
    $$
    (B) skips the 3 : 2 mole ratio, and (D) uses 22.4 L/mol even though the gas isn't at STP.

- id: apchem-10-propane-volumes
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.4"]
  cedTopics: ["3.4", "4.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Propane burns according to

    $$
    \ce{C3H8(g) + 5O2(g) -> 3CO2(g) + 4H2O(g)}
    $$

    2.0 L of propane burns completely in excess oxygen. All volumes are measured at the same temperature and pressure, high enough that the water stays a gas. What is the total volume of the **products**?
  choices:
    - { id: a, text: "7.0 L" }
    - { id: b, text: "10 L" }
    - { id: c, text: "14 L" }
    - { id: d, text: "6.0 L" }
  answer: c
  explanation: |
    For gases at the same $T$ and $P$, volume ratios equal mole ratios. 2.0 L of propane gives $3 \times 2.0 = 6.0$ L of $\ce{CO2}$ and $4 \times 2.0 = 8.0$ L of $\ce{H2O}$, 14 L in all.
    (D) counts only the $\ce{CO2}$, and (B) is the oxygen used.

- id: apchem-10-hydrogen-oxygen-limiting
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.4"]
  cedTopics: ["3.4", "4.5"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    6.0 L of $\ce{H2}$ and 4.0 L of $\ce{O2}$, at the same temperature and pressure, react completely:

    $$
    \ce{2H2(g) + O2(g) -> 2H2O(g)}
    $$

    The products are returned to the same temperature and pressure, where water is a gas. What is the total volume of gas afterward?
  choices:
    - { id: a, text: "6.0 L" }
    - { id: b, text: "10.0 L" }
    - { id: c, text: "8.0 L" }
    - { id: d, text: "7.0 L" }
  answer: d
  explanation: |
    6.0 L of $\ce{H2}$ needs only 3.0 L of $\ce{O2}$, so $\ce{H2}$ is limiting and 1.0 L of $\ce{O2}$ is left over. The reaction makes 6.0 L of $\ce{H2O}$ gas. Total: $6.0 + 1.0 = 7.0$ L.
    (A) forgets the leftover oxygen, and (B) assumes the volume doesn't change. Gas volume isn't conserved in a reaction.

- id: apchem-10-magnesium-for-hydrogen
  type: mcq
