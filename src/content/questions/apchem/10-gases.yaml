    - { id: b, text: "The He curve peaks at a higher kinetic energy, because He atoms move faster" }
    - { id: c, text: "The Ar curve peaks at a higher kinetic energy, because Ar atoms are heavier" }
    - { id: d, text: "The He curve is taller and narrower, because He has the smaller molar mass" }
  answer: a
  explanation: |
    The distribution of kinetic energies depends only on temperature. He atoms move faster, but they are lighter, and $\tfrac{1}{2}mv^2$ comes out the same on average and in its spread. Only the **speed** distributions differ between the two gases.

- id: apchem-10-mb-fraction-fast
  type: mcq
