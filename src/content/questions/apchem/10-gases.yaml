    - { id: c, text: "314 L" }
    - { id: d, text: "0.625 L" }
  answer: a
  explanation: |
    $14.0\ \text{g} / 28.02\ \text{g/mol} = 0.500$ mol, and at STP $0.500 \times 22.4 = 11.2$ L.
    (B) is the volume of a whole mole, (C) multiplies the mass by 22.4, and (D) divides it.

- id: apchem-10-density-so2
  type: mcq
