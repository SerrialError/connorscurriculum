  choices:
    - { id: a, text: "Low temperature and low pressure" }
    - { id: b, text: "High temperature and low pressure" }
    - { id: c, text: "Low temperature and high pressure" }
    - { id: d, text: "High temperature and high pressure" }
  answer: b
  explanation: |
    At low pressure the particles are far apart, so their own volume is negligible and they rarely get close enough to attract. At high temperature they move fast enough that attractions barely affect them. Low temperature and high pressure (C) give the largest deviations.

- id: apchem-10-most-ideal-gas
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.8"]
  cedTopics: ["3.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    At 300 K and 10 atm, which gas would behave most nearly like an ideal gas?
  choices:
    - { id: a, text: "$\\ce{NH3}$" }
    - { id: b, text: "$\\ce{SO2}$" }
    - { id: c, text: "$\\ce{CO2}$" }
    - { id: d, text: "He" }
  answer: d
  explanation: |
    He atoms are tiny, nonpolar, and have only two electrons, so they barely attract each other and take up little space. $\ce{NH3}$ and $\ce{SO2}$ are polar, and $\ce{CO2}$ is a larger molecule with many more electrons, so all three attract each other much more strongly.

- id: apchem-10-z-below-one
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.8"]
  cedTopics: ["3.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    At 250 K and 50 atm, the measured value of $\dfrac{PV}{nRT}$ for methane is 0.88. Which statement best explains why it is less than 1?
  choices:
    - { id: a, text: "The volume of the CH₄ molecules leaves less free space than the volume V" }
    - { id: b, text: "CH₄ molecules move faster than the ideal gas law predicts at 250 K" }
    - { id: c, text: "Attractions between CH₄ molecules weaken their collisions with the walls" }
    - { id: d, text: "Some CH₄ molecules break apart at 50 atm, adding to the number of particles" }
  answer: c
  explanation: |
    Attractions pull molecules back as they approach the wall, so they hit with less force and the measured pressure is lower than $nRT/V$. That makes $PV/nRT$ less than 1.
    The particles' volume (A) makes the ratio **greater** than 1, and becomes the bigger effect only at much higher pressures.

- id: apchem-10-z-above-one
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.8"]
  cedTopics: ["3.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    At 1000 atm, $\dfrac{PV}{nRT}$ for $\ce{N2}$ is well above 1. Which statement best explains this?
  choices:
    - { id: a, text: "Attractions between N₂ molecules become stronger at very high pressure" }
    - { id: b, text: "The molecules' own volume takes up a real share of the container" }
    - { id: c, text: "The molecules move faster at high pressure, so each collision is harder" }
    - { id: d, text: "Some N₂ molecules split into atoms, increasing the number of particles" }
  answer: b
  explanation: |
    When the molecules are packed this closely, their own volume is a significant part of the container. The space they can actually move in is less than $V$, so they hit the walls more often than the ideal model predicts and the pressure is higher.
    Attractions (A) would push the ratio **below** 1. Speed depends on temperature, not pressure (C).

- id: apchem-10-nh3-vs-ch4
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.8"]
  cedTopics: ["3.6"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    $\ce{NH3}$ (17.03 g/mol) and $\ce{CH4}$ (16.04 g/mol) have nearly the same molar mass. At the same temperature and pressure, $\ce{NH3}$ deviates more from ideal behavior. Why?
  choices:
    - { id: a, text: "NH₃ molecules are polar, so they attract each other more strongly than CH₄ molecules do" }
    - { id: b, text: "NH₃ has the larger molar mass, so its molecules move much more slowly than CH₄'s do" }
    - { id: c, text: "NH₃ molecules are much bigger, so their own volume is a larger share of the container" }
    - { id: d, text: "CH₄ molecules are polar, so they repel each other and stay farther apart than NH₃'s" }
  answer: a
  explanation: |
    $\ce{NH3}$ is a polar molecule (trigonal pyramidal, with polar N–H bonds), while $\ce{CH4}$ is nonpolar. The stronger attractions between $\ce{NH3}$ molecules make its behavior less ideal. The molar masses (B) differ by only 6%, and the molecules are similar in size (C).

- id: apchem-10-so2-measured-pressure
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.8"]
  cedTopics: ["3.6"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    1.00 mol of $\ce{SO2}$ is placed in a 2.00 L container at 300 K. The ideal gas law predicts a pressure of 12.3 atm. What is the measured pressure most likely to be?
  choices:
    - { id: a, text: "More than 12.3 atm, because attractions pull the SO₂ molecules toward the walls" }
    - { id: b, text: "More than 12.3 atm, because the volume of the SO₂ molecules is the main effect" }
    - { id: c, text: "Exactly 12.3 atm, because SO₂ is a gas at 300 K and so it behaves ideally" }
    - { id: d, text: "Less than 12.3 atm, because attractions between SO₂ molecules soften wall hits" }
  answer: d
  explanation: |
    $\ce{SO2}$ is polar, and 12 atm is a moderate pressure, so attractions are the main effect: molecules are pulled back from the walls and hit them with less force. The measured pressure is lower than the ideal value.
    Attractions pull molecules **away** from the walls, toward other molecules (A). The volume effect (B) wins only at much higher pressures. Being a gas doesn't make a substance ideal (C).

- id: apchem-10-z-curve-temperature
  type: mcq
  subject: apchem
