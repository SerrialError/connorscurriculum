  sections: ["10.3"]
  cedTopics: ["3.4"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A gas in a rigid, sealed container is at 1.0 atm and 27 °C. To what temperature must it be heated to double its pressure?
  choices:
    - { id: a, text: "54 °C" }
    - { id: b, text: "327 °C" }
    - { id: c, text: "600 °C" }
    - { id: d, text: "573 °C" }
  answer: b
  explanation: |
    Pressure is proportional to kelvin temperature, so the kelvin temperature must double: 300 K → 600 K. In Celsius, $600 - 273 = 327$ °C.
    (A) doubles the Celsius temperature, and (C) is the right number in the wrong unit.

- id: apchem-10-two-changes-pressure
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3"]
  cedTopics: ["3.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    The kelvin temperature of a fixed amount of gas is doubled and, at the same time, its volume is tripled. By what factor does its pressure change?
  choices:
    - { id: a, text: "It becomes 6 times as large" }
    - { id: b, text: "It becomes 3/2 as large" }
    - { id: c, text: "It becomes 2/3 as large" }
    - { id: d, text: "It becomes 1/6 as large" }
  answer: c
  explanation: |
    $P \propto T/V$ for fixed $n$. Doubling $T$ multiplies $P$ by 2, and tripling $V$ divides it by 3: $2/3$.
    (B) has the factors reversed. (A) and (D) treat both changes as pushing the pressure the same way.

- id: apchem-10-piston-add-and-heat
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3"]
  cedTopics: ["3.4"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A cylinder with a movable piston holds 0.40 mol of gas at 300 K, and its volume is 10.0 L. Another 0.20 mol of the same gas is added, and the temperature is raised to 450 K. The pressure stays the same. What is the new volume?
  choices:
    - { id: a, text: "15.0 L" }
    - { id: b, text: "6.67 L" }
    - { id: c, text: "30.0 L" }
    - { id: d, text: "22.5 L" }
  answer: d
  explanation: |
    At constant pressure, $V \propto nT$.
    $$
    V_2 = 10.0 \times \frac{0.60}{0.40} \times \frac{450}{300} = 10.0 \times 1.5 \times 1.5 = 22.5\ \text{L}
    $$
    (A) applies only one of the two factors of 1.5. (B) divides by one factor instead of multiplying, and (C) adds the two factors instead of multiplying them.

- id: apchem-10-celsius-mistake
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3"]
  cedTopics: ["3.4"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A student says: "A 1.00 L sample of gas at 10 °C is warmed to 20 °C at constant pressure. The temperature doubled, so the volume doubles to 2.00 L." What should the volume be, and what is wrong with the reasoning?
  choices:
    - { id: a, text: "1.04 L. Volume is proportional to kelvin temperature, which rose by only about 3.5%." }
    - { id: b, text: "2.00 L. Doubling the Celsius temperature doubles the particles' average kinetic energy." }
    - { id: c, text: "0.50 L. The student set up the temperature ratio upside down, so the volume halves." }
    - { id: d, text: "1.00 L. At constant pressure, the volume of a gas doesn't depend on its temperature." }
  answer: a
  explanation: |
    In kelvins the temperature goes from 283.15 K to 293.15 K, a factor of 1.035:
    $$
    V_2 = 1.00 \times \frac{293.15}{283.15} = 1.04\ \text{L}
    $$
    Average kinetic energy is proportional to kelvin temperature, not Celsius (B). Warming at constant pressure always increases the volume, ruling out (C) and (D).

