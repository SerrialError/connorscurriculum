    (A) and (D) use a 2 : 1 ratio from the HCl coefficient, and (C) uses 22.4 L/mol at conditions that aren't STP.

- id: apchem-10-molar-volume-when
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.4"]
  cedTopics: ["3.4"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    When does one mole of gas occupy 22.4 L?
  choices:
    - { id: a, text: "For any gas at room temperature and a pressure of 1 atm" }
    - { id: b, text: "For any gas at a pressure of 1 atm, whatever the temperature" }
    - { id: c, text: "Only for gases of low molar mass, such as hydrogen and helium" }
    - { id: d, text: "For an ideal gas at 273.15 K and a pressure of 1 atm" }
  answer: d
  explanation: |
    $V = nRT/P = (1)(0.08206)(273.15)/1 = 22.4$ L only at STP. At room temperature (A), one mole takes up about 24.5 L. The molar volume of an ideal gas doesn't depend on its molar mass (C).

- id: apchem-10-equal-volumes
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.4"]
  cedTopics: ["3.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Two identical flasks are at the same temperature and pressure. One holds $\ce{CH4}$ (16.04 g/mol) and the other holds $\ce{SO2}$ (64.07 g/mol). Which statement is correct?
  choices:
    - { id: a, text: "They hold equal numbers of molecules, and the SO₂ has about four times the mass" }
    - { id: b, text: "They hold equal masses of gas, and the CH₄ has about four times as many molecules" }
    - { id: c, text: "The SO₂ flask holds more molecules, because SO₂ molecules have more atoms" }
    - { id: d, text: "The CH₄ flask holds more molecules, because its lighter molecules hit more softly" }
  answer: a
  explanation: |
    Same $P$, $V$, and $T$ means the same $n$ (Avogadro's law), whatever the gas. With equal moles, the mass is proportional to molar mass: $64.07/16.04 = 3.99$.

- id: apchem-10-density-ratio
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.4"]
  cedTopics: ["3.4"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    At a certain temperature and pressure, $\ce{O2}$ has a density of 1.31 g/L and an unknown gas has a density of 2.53 g/L. What is the molar mass of the unknown gas?
  choices:
    - { id: a, text: "16.6 g/mol" }
    - { id: b, text: "81.0 g/mol" }
    - { id: c, text: "61.8 g/mol" }
    - { id: d, text: "44.0 g/mol" }
  answer: c
  explanation: |
    At the same $T$ and $P$, density is proportional to molar mass:
    $$
    \mathcal{M} = 32.00 \times \frac{2.53}{1.31} = 61.8\ \text{g/mol}
    $$
    (A) inverts the ratio. A denser gas must have a larger molar mass than $\ce{O2}$.

