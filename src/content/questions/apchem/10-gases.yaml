  answer: d
  explanation: |
    $X_\text{Ne} = 6/12 = 0.50$, so $P_\text{Ne} = 0.50 \times 1.80 = 0.90$ atm. (A) is the partial pressure of Ar (4/12), and (B) is Kr's (2/12).

- id: apchem-10-altitude-oxygen
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.5"]
  cedTopics: ["3.4"]
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    Air has a mole fraction of $\ce{O2}$ of 0.209. At an altitude where the air pressure is 0.700 atm, what is the partial pressure of $\ce{O2}$?
  choices:
    - { id: a, text: "0.209 atm" }
    - { id: b, text: "3.35 atm" }
    - { id: c, text: "0.146 atm" }
    - { id: d, text: "0.491 atm" }
  answer: c
  explanation: |
    $P_{\ce{O2}} = X_{\ce{O2}} P_\text{total} = (0.209)(0.700) = 0.146$ atm. The fraction of oxygen is the same as at sea level, but the partial pressure is lower because the total pressure is lower. (A) is the sea-level value.

- id: apchem-10-why-partial-pressures-add
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.5", "10.6"]
  cedTopics: ["3.4", "3.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    Why is the total pressure of a mixture of ideal gases equal to the sum of the pressures each gas would exert alone in the same container?
  choices:
    - { id: a, text: "Lighter particles move faster and carry the heavier particles along to the walls" }
    - { id: b, text: "The particles don't attract or repel, so each gas hits the walls as if it were alone" }
    - { id: c, text: "The gases react to form a new gas whose pressure is the sum of the originals" }
    - { id: d, text: "Every gas in a mixture moves at one shared average speed, so each pushes equally" }
  answer: b
  explanation: |
    In the ideal model the particles are far apart and don't interact, so the collisions of one gas with the walls don't depend on the other gases. Each gas's pressure is $n_ART/V$, and they add.
    At the same temperature, different gases have the same average kinetic energy, not the same speed (D).

- id: apchem-10-mixture-total-pressure
  type: mcq
