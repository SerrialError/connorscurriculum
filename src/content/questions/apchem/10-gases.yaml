- id: apchem-10-boyle-calc
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3"]
  cedTopics: ["3.4"]
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    A gas occupies 4.00 L at 0.950 atm. At constant temperature, the pressure is raised to 1.50 atm. What is the new volume?
  choices:
    - { id: a, text: "6.32 L" }
    - { id: b, text: "2.53 L" }
    - { id: c, text: "1.43 L" }
    - { id: d, text: "0.356 L" }
  answer: b
  explanation: |
    $$
    V_2 = \frac{P_1V_1}{P_2} = \frac{(0.950)(4.00)}{1.50} = 2.53\ \text{L}
    $$
    Higher pressure at constant temperature means a smaller volume, which rules out (A), the ratio upside down.

- id: apchem-10-charles-kelvin
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3"]
  cedTopics: ["3.4"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A gas in a cylinder with a movable piston occupies 3.00 L at 27 °C. It is heated to 127 °C at constant pressure. What is its new volume?
  choices:
    - { id: a, text: "2.25 L" }
    - { id: b, text: "14.1 L" }
    - { id: c, text: "4.00 L" }
    - { id: d, text: "3.03 L" }
  answer: c
  explanation: |
    Convert to kelvins: 300.15 K and 400.15 K.
    $$
    V_2 = V_1 \times \frac{T_2}{T_1} = 3.00 \times \frac{400.15}{300.15} = 4.00\ \text{L}
    $$
    (B) uses Celsius temperatures ($3.00 \times 127/27$), and (A) inverts the ratio.

- id: apchem-10-rigid-tank-cooled
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3"]
  cedTopics: ["3.4"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A rigid steel tank holds a gas at 5.00 atm and 25 °C. The tank is cooled to −25 °C. What is the pressure in the tank now?
  choices:
    - { id: a, text: "4.16 atm" }
    - { id: b, text: "−5.00 atm" }
    - { id: c, text: "6.01 atm" }
    - { id: d, text: "5.00 atm, since the volume can't change" }
  answer: a
  explanation: |
    At constant volume, pressure is proportional to kelvin temperature: 298.15 K → 248.15 K.
    $$
    P_2 = 5.00 \times \frac{248.15}{298.15} = 4.16\ \text{atm}
    $$
    Using Celsius gives the impossible negative pressure in (B). (C) inverts the ratio; a cooler gas must have a lower pressure.

- id: apchem-10-weather-balloon
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3"]
  cedTopics: ["3.4"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A weather balloon holds 5.00 L of helium at 25 °C and 1.00 atm. It rises to an altitude where the pressure is 0.500 atm and the temperature is −23 °C. What is its volume there? (Assume the amount of helium doesn't change.)
  choices:
    - { id: a, text: "10.0 L" }
    - { id: b, text: "11.9 L" }
    - { id: c, text: "2.10 L" }
    - { id: d, text: "8.39 L" }
  answer: d
  explanation: |
    $$
    V_2 = V_1 \times \frac{P_1}{P_2} \times \frac{T_2}{T_1} = 5.00 \times \frac{1.00}{0.500} \times \frac{250.15}{298.15} = 8.39\ \text{L}
    $$
    The pressure drop doubles the volume, and the cooling shrinks it a little. (A) ignores the temperature change, and (B) has the temperature ratio upside down.

- id: apchem-10-avogadro-calc
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3"]
  cedTopics: ["3.4"]
  difficulty: 1
  calculation: true
  authors: ["Claude"]
  prompt: |
    A balloon contains 0.100 mol of helium and has a volume of 2.40 L. More helium is added at the same temperature and pressure until the volume is 3.60 L. How many moles of helium were **added**?
  choices:
    - { id: a, text: "0.150 mol" }
    - { id: b, text: "0.0500 mol" }
    - { id: c, text: "0.0667 mol" }
    - { id: d, text: "0.250 mol" }
  answer: b
  explanation: |
    At constant $T$ and $P$, volume is proportional to moles: $n_2 = 0.100 \times 3.60/2.40 = 0.150$ mol. That's the total, so $0.150 - 0.100 = 0.0500$ mol was added. (A) is the total, not the amount added.

- id: apchem-10-graph-boyle-line
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3"]
  cedTopics: ["3.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    For a fixed amount of gas at constant temperature, which plot gives a straight line that passes through the origin?
  choices:
    - { id: a, text: "P on the y-axis against V on the x-axis" }
    - { id: b, text: "PV on the y-axis against V on the x-axis" }
    - { id: c, text: "P on the y-axis against 1/V on the x-axis" }
    - { id: d, text: "1/P on the y-axis against 1/V on the x-axis" }
  answer: c
  explanation: |
    Boyle's law says $P = k/V$, so $P = k \times (1/V)$: a line through the origin with slope $k$.
    $P$ against $V$ (A) is a curve that falls steeply and levels off. $PV$ is constant (B), a flat line that doesn't pass through the origin. (D) gives $1/P = (1/k) \times V$, which is a curve when plotted against $1/V$.

- id: apchem-10-graph-absolute-zero
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3"]
  cedTopics: ["3.4"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    A student measures the volume of a gas at several temperatures at constant pressure and plots volume against temperature in °C. The points fall on a straight line. If the line is extended, at what temperature does it reach zero volume?
  choices:
    - { id: a, text: "About −273 °C" }
    - { id: b, text: "0 °C" }
    - { id: c, text: "About 273 °C" }
    - { id: d, text: "It depends on which gas and which pressure were used" }
  answer: a
  explanation: |
    Every gas, at any constant pressure, gives a line that extends to zero volume at −273.15 °C, absolute zero (0 K). Volume is proportional to kelvin temperature, not Celsius, so 0 °C (B) is not special. That all lines meet at the same point is what makes (D) wrong.

- id: apchem-10-graph-not-through-origin
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3"]
  cedTopics: ["3.4"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    For an ideal gas, which pair of variables gives a straight line with a positive slope that does **not** pass through the origin? The other two variables are held constant in each case.
  choices:
    - { id: a, text: "V against n, at constant P and T" }
    - { id: b, text: "P against T in kelvins, at constant n and V" }
    - { id: c, text: "V against T in kelvins, at constant n and P" }
    - { id: d, text: "V against T in °C, at constant n and P" }
  answer: d
  explanation: |
    Volume is proportional to kelvin temperature. On a Celsius axis the line is shifted: at 0 °C the volume is not zero, and the line reaches zero volume only at −273 °C. (A), (B), and (C) are direct proportions, so their lines pass through the origin.

- id: apchem-10-boyle-particles
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3", "10.6"]
  cedTopics: ["3.4", "3.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A gas is compressed to half its volume at constant temperature, and its pressure doubles. Which statement best explains why, in terms of the particles?
  choices:
    - { id: a, text: "The particles move twice as fast, so each collision with the walls is twice as forceful" }
    - { id: b, text: "The particles are closer together, so they attract each other and pull inward on the walls" }
    - { id: c, text: "The particles move at the same speeds, but they hit each area of the wall twice as often" }
    - { id: d, text: "Each particle takes up twice as much of the space, so it reaches the walls twice as often" }
  answer: c
  explanation: |
    Constant temperature means the same average kinetic energy, so the speeds don't change (ruling out A). With half the space, the particles reach the walls twice as often, and the pressure doubles.
    Attractions would **lower** the pressure (B), and the particles' own size doesn't change (D).

- id: apchem-10-balloon-freezer
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3", "10.6"]
  cedTopics: ["3.4", "3.5"]
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    A sealed balloon is put in a freezer and shrinks. Which statement best explains this at the particle level?
  choices:
    - { id: a, text: "The gas particles lose mass as they cool, so they push less on the inside of the balloon" }
    - { id: b, text: "The particles slow down, so they strike the balloon wall less often and with less force" }
    - { id: c, text: "The particles slow down and stick together in clusters that take up less total space" }
    - { id: d, text: "The particles get smaller when they cool, so the gas as a whole takes up less space" }
  answer: b
  explanation: |
    Lower temperature means lower average kinetic energy, so the particles move more slowly. They hit the inside of the balloon less often and less forcefully, and the outside air pressure pushes the balloon smaller until the pressures match again.
    Particles don't change mass (A) or size (D) when cooled, and the gas hasn't condensed (C).

- id: apchem-10-rigid-heated
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.3", "10.6"]
  cedTopics: ["3.4", "3.5"]
  difficulty: 1
  authors: ["Claude"]
  prompt: |
    A sealed, rigid container of gas is heated. Which statement describes what happens?
  choices:
    - { id: a, text: "The particles' average speed increases, and the pressure increases" }
    - { id: b, text: "The particles' average speed stays the same, but they expand and press harder" }
    - { id: c, text: "The volume of the gas increases because the particles are moving faster" }
    - { id: d, text: "The number of particles increases, so the pressure in the container rises" }
  answer: a
  explanation: |
    Higher temperature means higher average kinetic energy, so the particles move faster and hit the walls more often and harder: the pressure rises. A rigid container can't expand (C), the particles themselves don't expand (B), and in a sealed container the number of particles stays the same (D).

- id: apchem-10-double-pressure-temp
  type: mcq
  subject: apchem
