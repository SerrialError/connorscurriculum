- id: apchem-10-frq-magnesium-over-water
  type: frq
  subject: apchem
  chapter: 10
  sections: ["10.4", "10.5"]
  cedTopics: ["3.4", "4.5"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  prompt: |
    A student reacts 0.250 g of magnesium ribbon with excess hydrochloric acid:

    $$
    \ce{Mg(s) + 2HCl(aq) -> MgCl2(aq) + H2(g)}
    $$

    The $\ce{H2}$ is collected over water at 24.0 °C. When the water levels inside and outside the collection tube are equal, the volume of gas is 250. mL. The atmospheric pressure is 755.0 torr, and the vapor pressure of water at 24.0 °C is 22.4 torr.
  parts:
    - label: a
      points: 1
      prompt: Calculate the partial pressure of $\ce{H2}$ in the tube, in atm.
      scoring:
        - "P(H₂) = 755.0 − 22.4 = 732.6 torr, and 732.6/760 = 0.9639 atm."
    - label: b
      points: 1
      prompt: Calculate the number of moles of $\ce{H2}$ collected.
      scoring:
        - "n = PV/RT = (0.9639)(0.250)/((0.08206)(297.15)) = 9.88 × 10⁻³ mol, consistent with (a)."
    - label: c
      points: 1
      prompt: Calculate the theoretical yield of $\ce{H2}$, in moles, and the percent yield.
      scoring:
        - "0.250 g / 24.31 g/mol = 0.01028 mol Mg → 0.01028 mol H₂; percent yield = 9.88 × 10⁻³ / 0.01028 × 100 = 96.1%, consistent with (b)."
    - label: d
      points: 1
      prompt: Another student forgets to subtract the vapor pressure of water. Would that student's calculated percent yield be higher, lower, or the same? Justify your answer.
      scoring:
        - "Higher: the pressure used for H₂ (755.0 torr) is too high, so the calculated moles of H₂ (n = PV/RT) are too high."
    - label: e
      points: 1
      prompt: The experiment is repeated with the same mass of magnesium at the same atmospheric pressure, but at 30.0 °C. Would the volume of gas collected be greater, smaller, or the same? Justify your answer.
      scoring:
        - "Greater: the same moles of H₂ at a higher temperature (and constant pressure) occupy a larger volume, because V is proportional to T (and the higher vapor pressure of water at 30 °C also adds water vapor to the gas)."
  explanation: |
    **(a)** The gas in the tube is $\ce{H2}$ plus water vapor at a total of 755.0 torr. $P_{\ce{H2}} = 755.0 - 22.4 = 732.6$ torr $= 0.9639$ atm.

    **(b)** $T = 297.15$ K and $V = 0.250$ L.
    $$
    n = \frac{(0.9639)(0.250)}{(0.08206)(297.15)} = 9.88 \times 10^{-3}\ \text{mol}
    $$

    **(c)** $0.250/24.31 = 0.01028$ mol Mg, and the 1 : 1 ratio gives 0.01028 mol $\ce{H2}$ in theory. Percent yield $= 0.00988/0.01028 \times 100 = 96.1\%$.

    **(d)** Using 755.0 torr gives $n = 0.01019$ mol and a percent yield of about 99.0%, higher than the true value.

    **(e)** $V = nRT/P$ with the same $n$ and $P$: a higher $T$ gives a larger $V$. At 30.0 °C the dry $\ce{H2}$ alone would take up $250. \times 303.15/297.15 = 255$ mL, and the extra water vapor makes the collected volume larger still.

- id: apchem-10-frq-kmt-flasks
  type: frq
  subject: apchem
  chapter: 10
  sections: ["10.6", "10.7"]
  cedTopics: ["3.4", "3.5"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    Three rigid 10.0 L flasks each hold 1.00 mol of gas.

    | Flask | Gas | Temperature |
    |---|---|---|
    | A | Ne | 300 K |
    | B | Ne | 600 K |
    | C | Ar | 300 K |
  parts:
    - label: a
      points: 1
      prompt: Which flask, A or B, has the higher pressure? Explain in terms of the motion of the particles.
      scoring:
        - "B: at the higher temperature the Ne atoms move faster (greater average kinetic energy), so they collide with the walls more often and with more force."
    - label: b
      points: 1
      prompt: What is the ratio of the average kinetic energy of the atoms in flask B to that in flask A? Justify your answer.
      scoring:
        - "2 : 1, because average kinetic energy is proportional to kelvin temperature, and 600 K is twice 300 K."
    - label: c
      points: 1
      prompt: Describe how the Maxwell–Boltzmann distribution of speeds for flask B differs from the one for flask A.
      scoring:
        - "B's curve peaks at a higher speed and is lower and broader (the same area, since the number of atoms is the same)."
    - label: d
      points: 1
      prompt: How does the pressure in flask C compare with the pressure in flask A? Explain, even though Ar atoms move more slowly than Ne atoms at the same temperature.
      scoring:
        - "The same: same n, V, and T. At the same temperature Ar atoms have the same average kinetic energy as Ne atoms; they move more slowly but are heavier, so they hit the walls less often but with more force on each collision, and the effects balance."
    - label: e
      points: 1
      prompt: A pinhole is opened in flask A and in flask C at the same time. From which flask does gas effuse faster? Explain.
      scoring:
        - "Flask A: Ne atoms are lighter than Ar atoms, so at the same temperature (same average kinetic energy) they move faster and pass through the pinhole more often."
  explanation: |
    **(a)** Higher temperature means faster particles: more frequent and more forceful wall collisions. At constant $n$ and $V$, $P \propto T$, so B's pressure is twice A's.

    **(b)** $KE_\text{avg} \propto T$, so $600/300 = 2$.

    **(c)** The distribution shifts to higher speeds, and since the area (the number of atoms) is fixed, the peak is lower and the curve wider.

    **(d)** $P = nRT/V$ doesn't depend on which gas it is. In particle terms, each Ar atom is about twice as heavy as a Ne atom and moves more slowly, so it hits the walls less often but transfers more momentum per hit. The same average kinetic energy makes these balance.

    **(e)** At the same temperature, lighter particles move faster on average, so Ne effuses faster than Ar.

- id: apchem-10-frq-real-gas-data
  type: frq
  subject: apchem
  chapter: 10
  sections: ["10.8"]
  cedTopics: ["3.6"]
  difficulty: 3
  authors: ["Claude"]
  prompt: |
    A student is given values of $\dfrac{PV}{nRT}$ for a gas, X, at 300 K.

    | Pressure (atm) | $PV/nRT$ |
    |---|---|
    | 1 | 0.998 |
    | 100 | 0.82 |
    | 800 | 1.45 |
  parts:
    - label: a
      points: 1
      prompt: At which of the three pressures does gas X behave most like an ideal gas? Explain in terms of the particles.
      scoring:
        - "1 atm (ratio closest to 1): the particles are far apart, so their volume is negligible compared with the container and attractions between them have little effect."
    - label: b
      points: 1
      prompt: Explain why $PV/nRT$ is less than 1 at 100 atm.
      scoring:
        - "Attractions between the particles pull them back as they approach the walls (or hold them together), reducing the force and frequency of wall collisions, so the measured pressure is lower than ideal."
    - label: c
      points: 1
      prompt: Explain why $PV/nRT$ is greater than 1 at 800 atm.
      scoring:
        - "At very high pressure the particles' own volume is a significant fraction of the container, so the free space is less than V and the measured pressure is higher than ideal."
    - label: d
      points: 1
      prompt: The same measurements are made on helium at 300 K and 100 atm. Would $PV/nRT$ for helium be closer to 1 or farther from 1 than 0.82? Justify your answer.
      scoring:
        - "Closer to 1: He atoms are small, nonpolar, and have few electrons, so the attractions between them are much weaker than between the particles of X (which deviate noticeably at 100 atm)."
  explanation: |
    **(a)** At 1 atm the ratio is 0.998, almost exactly ideal. The particles are so far apart that neither their size nor their attractions matter much.

    **(b)** Below 1 means the pressure is lower than ideal. Attractions between particles reduce how hard and how often they hit the walls.

    **(c)** Above 1 means the pressure is higher than ideal. At 800 atm the particles take up a real share of the container, so they have less room to move in and hit the walls more often.

    **(d)** He behaves more ideally than nearly any other gas. Its tiny, nonpolar atoms barely attract each other, so the dip caused by attractions is much smaller.

- id: apchem-10-frq-mixture-valve
  type: frq
  subject: apchem
  chapter: 10
  sections: ["10.4", "10.5"]
  cedTopics: ["3.4"]
  difficulty: 2
  calculation: true
  authors: ["Claude"]
  prompt: |
    A rigid 3.00 L vessel at 27 °C contains 0.0800 mol of $\ce{N2}$ and 0.0400 mol of $\ce{O2}$.
  parts:
    - label: a
      points: 1
      prompt: Calculate the total pressure in the vessel, in atm.
      scoring:
        - "n = 0.1200 mol; P = (0.1200)(0.08206)(300.15)/3.00 = 0.985 atm."
    - label: b
      points: 1
      prompt: Calculate the partial pressure of $\ce{O2}$.
      scoring:
        - "X(O₂) = 0.0400/0.1200 = 0.333; P(O₂) = 0.333 × 0.985 = 0.328 atm, consistent with (a)."
    - label: c
      points: 1
      prompt: The vessel is connected to an evacuated 2.00 L vessel, and the gas spreads through both at 27 °C. Calculate the new partial pressure of $\ce{O2}$.
      scoring:
        - "P(O₂) = 0.328 × 3.00/5.00 = 0.197 atm (Boyle's law, or nRT/V with V = 5.00 L)."
    - label: d
      points: 1
      prompt: Next, 0.0400 mol of Ar is added to the combined vessels at constant temperature. Does the partial pressure of $\ce{N2}$ increase, decrease, or stay the same? Justify your answer.
      scoring:
        - "It stays the same: the moles of N₂, the volume, and the temperature are unchanged, and ideal gas particles don't interact, so N₂ collides with the walls just as before (P(N₂) = n(N₂)RT/V)."
  explanation: |
    **(a)**
    $$
    P = \frac{nRT}{V} = \frac{(0.1200)(0.08206)(300.15)}{3.00} = 0.985\ \text{atm}
    $$

    **(b)** $X_{\ce{O2}} = 1/3$, so $P_{\ce{O2}} = 0.985/3 = 0.328$ atm.

    **(c)** The volume goes from 3.00 L to 5.00 L, so $P_{\ce{O2}} = 0.328 \times 3.00/5.00 = 0.197$ atm.

    **(d)** The argon raises the total pressure and lowers the mole fraction of $\ce{N2}$, but the partial pressure of $\ce{N2}$ is still $n_{\ce{N2}}RT/V = (0.0800)(0.08206)(300.15)/5.00 = 0.394$ atm, unchanged.

- id: apchem-10-frq-volatile-liquid
  type: frq
  subject: apchem
  chapter: 10
  sections: ["10.4", "10.8"]
  cedTopics: ["3.4", "3.6"]
  difficulty: 3
  calculation: true
  authors: ["Claude"]
  group: dumas-method
  prompt: |
    A student finds the molar mass of a volatile liquid. A few milliliters of the liquid are put in a 256.0 mL flask covered with foil that has a pinhole. The flask is heated in boiling water at 99.0 °C until all the liquid has vaporized and the excess vapor has escaped, leaving the flask full of vapor at the atmospheric pressure of 742 torr. The flask is cooled so the vapor condenses, and the condensed liquid has a mass of 0.475 g.
  parts:
    - label: a
      points: 1
      prompt: Calculate the number of moles of vapor that filled the flask at 99.0 °C.
      scoring:
        - "P = 742/760 = 0.9763 atm, V = 0.2560 L, T = 372.15 K; n = PV/RT = 8.18 × 10⁻³ mol."
    - label: b
      points: 1
      prompt: Calculate the molar mass of the liquid.
      scoring:
        - "M = 0.475 g / 8.18 × 10⁻³ mol = 58.0 g/mol, consistent with (a)."
    - label: c
      points: 1
      prompt: The liquid's empirical formula is $\ce{C3H6O}$. What is its molecular formula? Justify your answer.
      scoring:
        - "C₃H₆O: the empirical formula mass is 58.08 g/mol, which matches the molar mass, so the molecular formula is the same as the empirical formula."
    - label: d
      points: 1
      prompt: The student takes the flask out of the water before all of the liquid has vaporized, so a little liquid is still in the flask. Would the calculated molar mass be too high, too low, or unaffected? Justify your answer.
      scoring:
        - "Too high: the measured mass includes the extra liquid, so m is too large while n (from PV/RT) is unchanged, and M = m/n is too large."
    - label: e
      points: 1
      prompt: Near its boiling point, the vapor deviates from ideal behavior more than $\ce{N2}$ does at the same temperature and pressure. Explain why.
      scoring:
        - "The molecules of the volatile liquid attract each other much more strongly than N₂ molecules do (it is a liquid at room temperature), and at 99.0 °C it is close to the conditions where it condenses, so attractions reduce its pressure noticeably below the ideal value."
  explanation: |
    **(a)**
    $$
    n = \frac{PV}{RT} = \frac{(0.9763)(0.2560)}{(0.08206)(372.15)} = 8.18 \times 10^{-3}\ \text{mol}
    $$

    **(b)** $\mathcal{M} = 0.475/0.00818 = 58.0$ g/mol.

    **(c)** $\ce{C3H6O}$ has a formula mass of $3(12.01) + 6(1.008) + 16.00 = 58.08$ g/mol, equal to the molar mass, so the molecular formula is $\ce{C3H6O}$.

    **(d)** The leftover liquid is weighed as if it were vapor, so $m$ is too large. The moles come from $P$, $V$, and $T$, which don't change, so $\mathcal{M} = m/n$ is too high.

    **(e)** A substance that is a liquid at room temperature has much stronger attractions between its molecules than $\ce{N2}$, which stays a gas down to about −196 °C. Close to its boiling point, those attractions pull the molecules together enough that the gas deviates noticeably from $PV = nRT$.

