    Graphs of $\dfrac{PV}{nRT}$ against pressure are drawn for $\ce{N2}$ at 200 K and at 500 K. At 200 K the curve dips well below 1 before rising. How does the 500 K curve compare?
  choices:
    - { id: a, text: "It dips farther below 1, because faster molecules collide with each other more often" }
    - { id: b, text: "It is identical, because deviations depend only on the pressure, not the temperature" }
    - { id: c, text: "It stays at exactly 1, because N₂ molecules have no attractions above 300 K at all" }
    - { id: d, text: "It stays closer to 1, because fast molecules are less affected by attractions" }
  answer: d
  explanation: |
    At higher temperature the molecules have more kinetic energy, so the brief pull of their neighbors changes their motion less, and the dip below 1 is much smaller. The attractions themselves don't disappear (C); they just matter less compared with the molecules' kinetic energy.

- id: apchem-10-vdw-largest-a
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.8"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    In the van der Waals equation, the constant $a$ corrects for attractions between particles. Which gas would have the **largest** value of $a$?
  choices:
    - { id: a, text: "He" }
    - { id: b, text: "$\\ce{CH4}$" }
    - { id: c, text: "$\\ce{N2}$" }
    - { id: d, text: "$\\ce{H2O}$" }
  answer: d
  explanation: |
    $\ce{H2O}$ is very polar and its molecules attract each other strongly (they form hydrogen bonds, which Chapter 11 covers), so it has the largest $a$ of these. He, with tiny attractions, has the smallest.

- id: apchem-10-vdw-b-meaning
  type: mcq
  subject: apchem
  chapter: 10
  sections: ["10.8"]
  cedTopics: []
  difficulty: 2
  authors: ["Claude"]
  prompt: |
    In the van der Waals equation, $\left(P + \dfrac{an^2}{V^2}\right)(V - nb) = nRT$, what does the term $nb$ account for?
  choices:
    - { id: a, text: "The volume taken up by the gas particles themselves" }
    - { id: b, text: "The attractions that pull the particles toward each other" }
    - { id: c, text: "The spread of molecular speeds at a given temperature" }
    - { id: d, text: "The extra pressure from collisions between particles" }
  answer: a
  explanation: |
    $b$ is roughly the volume one mole of the particles takes up, so $V - nb$ is the free space they actually move through. The attractions are corrected by $an^2/V^2$ (B).

