# Sample questions for Chapter 14 (Chemical Kinetics). Original; not taken from the
# textbook or College Board materials. See CONTRIBUTING.md for the format.

- id: apchem-14-rate-stoich
  type: mcq
  subject: apchem
  chapter: 14
  cedTopics: ["5.1"]
  difficulty: 1
  authors: ["sample"]
  prompt: |
    For the reaction $\ce{2H2 + O2 -> 2H2O}$, water is being formed at a rate of $0.060\ \text{M/s}$.
    At what rate is $\ce{O2}$ being consumed?
  choices:
    - { id: a, text: "$0.015\\ \\text{M/s}$" }
    - { id: b, text: "$0.030\\ \\text{M/s}$" }
    - { id: c, text: "$0.060\\ \\text{M/s}$" }
    - { id: d, text: "$0.120\\ \\text{M/s}$" }
  answer: b
  explanation: |
    Divide each rate of change by its coefficient so they are all equal:

    $$-\frac{\Delta[\ce{O2}]}{\Delta t} = \frac{1}{2}\frac{\Delta[\ce{H2O}]}{\Delta t} = \frac{1}{2}(0.060) = 0.030\ \text{M/s}$$

    One $\ce{O2}$ is used for every two $\ce{H2O}$ formed, so $\ce{O2}$ disappears at half the rate water appears.

- id: apchem-14-initial-rates
  type: mcq
  subject: apchem
  chapter: 14
  cedTopics: ["5.2"]
  difficulty: 2
  authors: ["sample"]
  prompt: |
    The initial rate of the reaction $\mathrm{X} + \mathrm{Z} \rightarrow \text{products}$ was measured in three trials.

    | Trial | [X] (M) | [Z] (M) | Initial rate (M/s) |
    |---|---|---|---|
    | 1 | 0.10 | 0.10 | $2.0 \times 10^{-4}$ |
    | 2 | 0.20 | 0.10 | $8.0 \times 10^{-4}$ |
    | 3 | 0.10 | 0.20 | $2.0 \times 10^{-4}$ |

    Which rate law is consistent with the data?
  choices:
    - { id: a, text: "$\\text{rate} = k[\\mathrm{X}][\\mathrm{Z}]$" }
    - { id: b, text: "$\\text{rate} = k[\\mathrm{X}]^2$" }
    - { id: c, text: "$\\text{rate} = k[\\mathrm{X}]^2[\\mathrm{Z}]$" }
    - { id: d, text: "$\\text{rate} = k[\\mathrm{Z}]$" }
  answer: b
  explanation: |
    - Trials 1 → 2: [X] doubles and the rate goes up by a factor of 4 $= 2^2$, so the reaction is second order in X.
    - Trials 1 → 3: [Z] doubles and the rate does not change, so the reaction is zero order in Z.

    The rate law is $\text{rate} = k[\mathrm{X}]^2$.

- id: apchem-14-half-life
  type: mcq
  subject: apchem
  chapter: 14
  cedTopics: ["5.3"]
  difficulty: 2
  authors: ["sample"]
  prompt: |
    A first-order reaction has a rate constant $k = 0.0231\ \text{min}^{-1}$.
    About what percentage of the reactant is left after 90 minutes?
  choices:
    - { id: a, text: "33%" }
    - { id: b, text: "25%" }
    - { id: c, text: "12.5%" }
    - { id: d, text: "3.1%" }
  answer: c
  explanation: |
    The half-life is

    $$t_{1/2} = \frac{0.693}{k} = \frac{0.693}{0.0231\ \text{min}^{-1}} = 30.0\ \text{min}$$

    90 minutes is three half-lives, so $\left(\tfrac{1}{2}\right)^3 = \tfrac{1}{8} = 12.5\%$ remains.

- id: apchem-14-linear-plot
  type: mcq
  subject: apchem
  chapter: 14
  cedTopics: ["5.3"]
  difficulty: 1
  authors: ["sample"]
  prompt: |
    A reaction is second order in reactant A and has no other reactants. Which plot of the data will be a straight line?
  choices:
    - { id: a, text: "$[\\mathrm{A}]$ vs. time" }
    - { id: b, text: "$\\ln[\\mathrm{A}]$ vs. time" }
    - { id: c, text: "$1/[\\mathrm{A}]$ vs. time" }
    - { id: d, text: "$[\\mathrm{A}]^2$ vs. time" }
  answer: c
  explanation: |
    The second-order integrated rate law is

    $$\frac{1}{[\mathrm{A}]_t} = kt + \frac{1}{[\mathrm{A}]_0}$$

    which has the form $y = mx + b$ with $y = 1/[\mathrm{A}]$. The slope is $+k$.
    A linear $\ln[\mathrm{A}]$ plot would mean first order, and a linear $[\mathrm{A}]$ plot would mean zero order.

- id: apchem-14-frq-first-order
  type: frq
  subject: apchem
  chapter: 14
  cedTopics: ["5.2", "5.3"]
  difficulty: 2
  authors: ["sample"]
  prompt: |
    Compound Q decomposes in solution: $\mathrm{Q}(aq) \rightarrow \text{products}$. The concentration of Q was measured over time at constant temperature.

    | Time (min) | [Q] (M) |
    |---|---|
    | 0 | 0.800 |
    | 20 | 0.400 |
    | 40 | 0.200 |
    | 60 | 0.100 |
  parts:
    - label: a
      points: 2
      prompt: Determine the order of the reaction with respect to Q. Justify your answer using the data.
      scoring:
        - States that the reaction is first order in Q.
        - "Justifies with the data: the concentration halves every 20 min, so the half-life is constant (or a plot of $\\ln[\\mathrm{Q}]$ vs. time is linear)."
    - label: b
      points: 1
      prompt: Calculate the rate constant $k$. Include units.
      scoring:
        - "$k = 0.693 / 20\\ \\text{min} = 0.0347\\ \\text{min}^{-1}$ (units of min⁻¹ or an equivalent time⁻¹ required)."
    - label: c
      points: 1
      prompt: Calculate $[\mathrm{Q}]$ at $t = 50$ minutes.
      scoring:
        - "$\\ln[\\mathrm{Q}] = \\ln(0.800) - (0.0347)(50)$, giving $[\\mathrm{Q}] = 0.141\\ \\text{M}$ (accept 0.14 M)."
    - label: d
      points: 1
      prompt: In a second trial the initial concentration of Q is doubled to $1.600\ \text{M}$. Predict how the initial rate compares with the first trial. Justify your answer.
      scoring:
        - "The initial rate doubles, because $\\text{rate} = k[\\mathrm{Q}]$ is first order, so rate is directly proportional to [Q]."
  explanation: |
    Each 20-minute interval cuts [Q] in half (0.800 → 0.400 → 0.200 → 0.100). A constant half-life is the signature of a first-order reaction.

    $$k = \frac{0.693}{t_{1/2}} = \frac{0.693}{20\ \text{min}} = 0.0347\ \text{min}^{-1}$$

    At 50 min: $\ln[\mathrm{Q}] = \ln(0.800) - (0.0347)(50) = -0.223 - 1.735 = -1.958$, so $[\mathrm{Q}] = e^{-1.958} = 0.141\ \text{M}$.
    Check: 50 min is 2.5 half-lives, and $0.800 \times (1/2)^{2.5} = 0.141\ \text{M}$.

- id: apchem-14-frq-mechanism
  type: frq
  subject: apchem
  chapter: 14
  cedTopics: ["5.7", "5.8", "5.10"]
  difficulty: 3
  authors: ["sample"]
  prompt: |
    A proposed mechanism for a gas-phase reaction has two elementary steps:

    $$\text{Step 1:}\quad \ce{X2 + Y -> X2Y}$$
    $$\text{Step 2:}\quad \ce{X2Y + Y -> 2XY}$$

    The energy profile for the mechanism is shown below.
  image: ./images/two-step-profile.svg
  imageAlt: "Energy profile with two humps. The first transition state is much higher above the reactants than the second transition state is above the intermediate. The products are lower in energy than the reactants."
  parts:
    - label: a
      points: 1
      prompt: Write the balanced equation for the overall reaction.
      scoring:
        - "$\\ce{X2 + 2Y -> 2XY}$ ($\\ce{X2Y}$ cancels when the steps are added)."
    - label: b
      points: 1
      prompt: Identify the reaction intermediate.
      scoring:
        - "$\\ce{X2Y}$: it is made in step 1 and used up in step 2."
    - label: c
      points: 1
      prompt: Using the energy profile, identify the rate-determining step. Justify your answer.
      scoring:
        - Step 1, because it has the larger activation energy (the climb from the reactants to transition state 1 is bigger than the climb from the intermediate to transition state 2), so it is the slower step.
    - label: d
      points: 1
      prompt: Write the rate law that is consistent with this mechanism.
      scoring:
        - "$\\text{rate} = k[\\ce{X2}][\\ce{Y}]$, from the molecularity of the slow first step."
    - label: e
      points: 1
      prompt: Is the overall reaction exothermic or endothermic? Justify your answer using the energy profile.
      scoring:
        - Exothermic, because the products are lower in potential energy than the reactants.
  explanation: |
    Adding the two steps gives $\ce{X2 + 2Y + X2Y -> X2Y + 2XY}$. $\ce{X2Y}$ appears on both sides and cancels, so the overall reaction is $\ce{X2 + 2Y -> 2XY}$ and $\ce{X2Y}$ is an intermediate.

    The slow step limits the overall rate. On an energy profile, the slow step is the one with the larger activation energy. Because step 1 is elementary and rate-limiting, its rate law comes straight from its reactants: $\text{rate} = k[\ce{X2}][\ce{Y}]$.
